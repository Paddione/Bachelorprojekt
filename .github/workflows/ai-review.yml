name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  ai-review:
    name: AI Code Review
    # [T012414] Fork-Guard: self-hosted Runner duerfen keinen Fork-Code
    # ausfuehren (actions/checkout holt bei pull_request den PR-HEAD).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch origin/main for diffing (shallow)
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install review deps
        working-directory: scripts/factory
        run: npm ci

      - name: Filter diff (strip noise)
        run: bash scripts/factory/filter-diff.sh origin/main...HEAD > "${RUNNER_TEMP}/clean.diff"

      - name: Skip if diff is all noise
        id: gate
        run: |
          if [ ! -s "${RUNNER_TEMP}/clean.diff" ]; then
            echo "Filtered diff is empty (noise-only) — skipping AI review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify risk tier
        if: steps.gate.outputs.skip != 'true'
        run: bash scripts/factory/classify-risk.sh origin/main...HEAD > "${RUNNER_TEMP}/tier.json"

      - name: Run AI review
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLEAN_DIFF_PATH: ${{ runner.temp }}/clean.diff
          TIER_JSON_PATH: ${{ runner.temp }}/tier.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/factory/ci-review.mjs
