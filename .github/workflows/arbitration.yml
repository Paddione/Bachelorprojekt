name: Merge Arbitration

# T002423 — kurative Auflösungsstufe für N-Wege-Dateikollisionen. Läuft auf
# dem self-hosted fleet-gpu-Pool (derselbe wie opencode.yml): der llm-proxy
# ist an 127.0.0.1:18235 gebunden und von einem GitHub-hosted Runner nicht
# erreichbar (siehe docs/superpowers/specs/2026-07-28-merge-arbitration-design.md).
#
# Strikt fail-open: kein Required Check, kein Force-Push, keine fremden
# Branches. continue-on-error auf jedem Schritt — ein Ausfall (GPU-Runner
# down, LLM antwortet nicht) darf niemals gegen einen PR zählen.
#
# [T002927] Das obige fail-open galt nur für LAUFENDE Schritte. Startet der
# Job gar nicht — weil kein Runner mit dem Label online ist —, greift kein
# continue-on-error: der Run bleibt unbegrenzt in `queued`. Mit cron */30
# waren das 48 Zombie-Runs pro Tag; am 2026-08-09 mussten 100 hängende Runs
# abgebrochen werden, der älteste knapp zwei Stunden alt. Deshalb ist der
# schedule-Trigger entfernt — Arbitration läuft jetzt ereignisgetrieben am
# PR und auf Zuruf. Ein Ausfall des Runners kostet damit höchstens einen
# übersprungenen PR-Lauf statt einer wachsenden Warteschlange.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch: {}

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  arbitrate:
    # [T002927] Fork-Guard — Pflicht, weil dieser Job auf einem SELF-HOSTED
    # Runner läuft und das Repo PUBLIC ist. `actions/checkout` holt bei einem
    # pull_request-Event den PR-HEAD; die Schritte darunter führen daraus
    # scripts/arbitration/detect.sh und apply.sh aus. Ohne diesen Guard könnte
    # ein beliebiger Fork-PR fremden Code auf dem Runner-Host ausführen.
    # opencode.yml (derselbe fleet-gpu-Pool) trägt den gleichen Guard; hier
    # fehlte er. Folgenlos blieb das nur, solange gar kein Runner online war.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fleet-gpu]
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Auf JOB-Ebene gebunden, nicht am Schritt: `steps.*.if` kann weder den
      # `secrets`-Kontext lesen noch das step-eigene `env`. Nur so laesst sich
      # unten auf "Secret gesetzt?" pruefen. [T002944]
      ARBITRATION_KUBECONFIG: ${{ secrets.ARBITRATION_KUBECONFIG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          # persist-credentials bleibt bewusst true: scripts/arbitration/apply.sh
          # pusht den Arbitrations-Branch (`git push -q origin "$branch"`) und
          # braucht dafür die Credentials im Checkout. Vertretbar ist das erst
          # durch den Fork-Guard oben — der ausgecheckte Code stammt dann
          # ausschließlich aus diesem Repo. [T002927]
          persist-credentials: true

      - name: Fetch all open PR branches
        continue-on-error: true
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet || true

      - name: Detect clusters
        id: detect
        continue-on-error: true
        run: |
          bash scripts/arbitration/detect.sh > /tmp/arbitration-clusters.json 2>/tmp/arbitration-detect.log
          cat /tmp/arbitration-detect.log >&2 || true
          COUNT=$(jq '. | length' /tmp/arbitration-clusters.json 2>/dev/null || echo 0)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Found ${COUNT} cluster(s) at/above threshold"

      # [T002944] Der Runner laeuft als unprivilegierter Dienst-User (ghrunner)
      # ohne Zugriff auf ein Entwickler-Home — vorher lief er als der
      # Desktop-User mit NOPASSWD-root, dessen SSH-Keys fuer die Prod-Nodes und
      # dessen Fleet-Kubeconfig. Damit hat er auch keine Kubeconfig mehr, und
      # apply.sh braucht eine: bei Eskalation ruft es `ticket.sh create`, das
      # ueber `kubectl exec … psql` in den shared-db-Pod geht.
      #
      # Statt der Admin-Kubeconfig eine eng geschnittene ServiceAccount-
      # Credential aus dem Secret ARBITRATION_KUBECONFIG. Sie kann genau zwei
      # Dinge im Namespace workspace des DEV-Clusters: Pods auflisten und
      # `pods --subresource=exec` erzeugen. Kein Secret-Lesezugriff, kein
      # anderer Namespace, nichts cluster-weit, und insbesondere kein Zugang
      # zum prod-Cluster `fleet`.
      #
      # Fehlt das Secret, bleibt KUBECONFIG leer und `ticket.sh` scheitert wie
      # bisher still (apply.sh ruft es mit `|| true`) — der Guard degradiert
      # also, statt den Lauf zu brechen.
      - name: Provide scoped kubeconfig for ticket escalation
        if: steps.detect.outputs.count != '0' && env.ARBITRATION_KUBECONFIG != ''
        continue-on-error: true
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/arbitration.kubeconfig"
          printf '%s' "$ARBITRATION_KUBECONFIG" > "${RUNNER_TEMP}/arbitration.kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/arbitration.kubeconfig" >> "$GITHUB_ENV"
          echo "TICKET_CTX=k3d-mentolder-dev" >> "$GITHUB_ENV"

      - name: Apply arbitration (per Cluster)
        if: steps.detect.outputs.count != '0'
        continue-on-error: true
        run: |
          jq -c '.[]' /tmp/arbitration-clusters.json | while IFS= read -r cluster; do
            echo "$cluster" | bash scripts/arbitration/apply.sh || true
          done

      # Die Credential darf den Lauf nicht ueberleben: _work wird zwischen Jobs
      # nicht zuverlaessig geleert, und RUNNER_TEMP liegt im Home des
      # Dienst-Users. `if: always()`, damit auch ein Abbruch aufraeumt.
      - name: Shred scoped kubeconfig
        if: always()
        continue-on-error: true
        run: |
          shred -u "${RUNNER_TEMP}/arbitration.kubeconfig" 2>/dev/null \
            || rm -f "${RUNNER_TEMP}/arbitration.kubeconfig" \
            || true
