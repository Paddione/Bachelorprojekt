name: Auto-enable Auto-Merge

# Aktiviert Squash-Auto-Merge auf jeder neuen Nicht-Draft-PR gegen main.
# Der Merge selbst passiert erst, wenn alle Required-Checks grün sind und
# Branch-Protection erfüllt ist — diese Action setzt nur das --auto-Flag,
# das bislang manuell via `gh pr merge --auto` gesetzt werden musste.
# Repo-Voraussetzung: allow_auto_merge ist aktiviert.
#
# Hinweis: Bis 2026-11-01 nahm die Bedingung PRs mit `dependencies`-Label
# (Renovate, T002161) aus. Mit der Entfernung von Renovate — ersetzt durch den
# eigenen Version-Watchdog — ist die Ausnahme entfallen.
# E2E PR is intentionally not a required check — see scripts/gh-branch-protection.sh
# and task gh:branch-protection:status. Required checks: Unit + Quality Gates,
# Security Scan, Conventional Commits, Spec + Guards (T901066).
# Emergency: task gh:branch-protection:emergency-add-e2e

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: auto-enable-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    name: Enable Auto-Merge
    # Drafts ausnehmen — "fertig, aber nicht mergen" bleibt über Draft-Status möglich.
    # Trust-Guard: der Job nutzt einen PAT mit PR-Schreibrechten und darf daher
    # nur fuer Branches dieses Repositories laufen. [T012446]
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      # Branch removal follows the verified archive/finalizer receipt.
      - name: Enable squash auto-merge
        # GITHUB_TOKEN darf enablePullRequestAutoMerge nicht ausführen
        # ("Resource not accessible by integration") — daher PAT.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash --repo "$REPO" "$PR_NUMBER"
