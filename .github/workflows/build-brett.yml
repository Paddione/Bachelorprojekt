name: Build Brett

on:
  push:
    branches: [main]
    paths: ['components/brett/**', '.github/workflows/build-brett.yml']

concurrency:
  group: build-brett-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push Brett image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: components/brett/package-lock.json

      - name: Typecheck & test before build
        run: |
          npm ci --prefix components/brett
          npm --prefix components/brett run typecheck --if-present
          npm --prefix components/brett test
        env:
          MOCK_DB: 'true'

      - name: Get short SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: components/brett
          file: components/brett/Dockerfile
          push: true
          tags: |
            ghcr.io/paddione/workspace-brett:sha-${{ steps.version.outputs.sha }}
            ghcr.io/paddione/workspace-brett:latest
            ghcr.io/paddione/workspace-brett:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-artifact:
    name: Re-render fleet artifact (pins brett SHA)
    needs: [build]
    if: vars.FLUX_ENABLED == 'true'
    uses: ./.github/workflows/render-fleet-artifact.yml
    with:
      brett_image_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  # [T900810] deploy-mentolder (pre-Flux kubectl-Pfad) entfernt: Flux ist Steady
  # State, der Job war tot (vars.FLUX_ENABLED != 'true' feuert nie).

  # [T900810] deploy-korczewski entfernt: der Brand ist seit T002479 eingefroren.
  # (Der Job war zusaetzlich tot — vars.FLUX_ENABLED != 'true' feuert nie.)
