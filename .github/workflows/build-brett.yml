name: Build Brett

on:
  push:
    branches: [main]
    paths: ['brett/**']

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  build:
    name: Build & push Brett image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: brett/package-lock.json

      - name: Typecheck & test before build
        run: |
          npm ci --prefix brett
          npm --prefix brett run typecheck --if-present
          npm --prefix brett test
        env:
          MOCK_DB: 'true'

      - name: Get short SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: brett
          file: brett/Dockerfile
          push: true
          tags: |
            ghcr.io/paddione/workspace-brett:sha-${{ steps.version.outputs.sha }}
            ghcr.io/paddione/workspace-brett:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  render-artifact:
    name: Re-render fleet artifact (pins brett SHA)
    needs: [build]
    if: vars.FLUX_ENABLED == 'true'
    uses: ./.github/workflows/render-fleet-artifact.yml
    with:
      brett_image_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit

  deploy-mentolder:
    name: Deploy Brett (mentolder)
    runs-on: ubuntu-latest
    needs: [build]
    if: vars.FLUX_ENABLED != 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Deploy to mentolder
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl rollout restart deployment/brett -n workspace
          kubectl rollout status deployment/brett -n workspace --timeout=120s

  deploy-korczewski:
    name: Deploy Brett (korczewski)
    runs-on: ubuntu-latest
    needs: [build]
    if: vars.FLUX_ENABLED != 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Deploy to korczewski
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl rollout restart deployment/brett -n workspace-korczewski
          kubectl rollout status deployment/brett -n workspace-korczewski --timeout=120s
