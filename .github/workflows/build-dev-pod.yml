name: Build dev-pod images

# Baut die drei Images des dev-pod-Bundles [T900107, T900108]:
#   docker/mcp-node   -> ghcr.io/paddione/mcp-node
#   docker/repo-sync  -> ghcr.io/paddione/repo-sync
#   docker/dev-shell  -> ghcr.io/paddione/dev-shell
#
# Bewusst EIN Workflow mit einer Matrix statt zwei Dateien: die Images gehoeren
# zu einem Deployment, werden zusammen gepinnt und aendern sich zusammen.

on:
  push:
    branches: [main]
    paths:
      - 'docker/mcp-node/**'
      - 'docker/repo-sync/**'
      - 'docker/dev-shell/**'
      - '.github/workflows/build-dev-pod.yml'
  workflow_dispatch:

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp-node
            context: docker/mcp-node
          - image: repo-sync
            context: docker/repo-sync
          - image: dev-shell
            context: docker/dev-shell

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      # Die Startskripte sind POSIX-sh und laufen als PID-1-Pfad der Container.
      # Ein Syntaxfehler faellt sonst erst im CrashLoop auf.
      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in ${{ matrix.context }}/*.sh; do
            [ -e "$f" ] || continue
            sh -n "$f"
            echo "ok: $f"
          done

      - name: Get short SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Build & push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/paddione/${{ matrix.image }}:sha-${{ steps.version.outputs.sha }}
            ghcr.io/paddione/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Mirror image to GitLab registry
        continue-on-error: true
        env:
          GITLAB_REGISTRY_PREFIX: ${{ secrets.GITLAB_REGISTRY_PREFIX }}
          GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
          SOURCE_TAGS: |
            ghcr.io/paddione/${{ matrix.image }}:sha-${{ steps.version.outputs.sha }}
            ghcr.io/paddione/${{ matrix.image }}:latest
        run: bash scripts/mirror-image-to-gitlab.sh
