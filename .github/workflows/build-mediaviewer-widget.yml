name: Build Mediaviewer Widget

on:
  push:
    branches: [main]
    paths:
      - 'components/mediaviewer-widget/**'
      - 'packages/videovault-player/**'
      - '.github/workflows/build-mediaviewer-widget.yml'
  workflow_dispatch:

concurrency:
  group: build-mediaviewer-widget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push Mediaviewer Widget image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.version.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: components/mediaviewer-widget/package-lock.json

      - name: Test gate (player package + widget)
        run: |
          cd packages/videovault-player && npm ci && npm test
          cd ../../components/mediaviewer-widget && npm ci --legacy-peer-deps && npm run typecheck && npm test

      - name: Get short SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Build & push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: components/mediaviewer-widget/Dockerfile
          push: true
          build-args: |
            VITE_ALLOWED_PARENT_ORIGINS=https://web.mentolder.de,https://web.korczewski.de,http://localhost:4321,http://web.localhost
          tags: |
            ghcr.io/paddione/mediaviewer-widget:sha-${{ steps.version.outputs.sha }}
            ghcr.io/paddione/mediaviewer-widget:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
