name: Build & Deploy mentolder-web

on:
  push:
    branches: [main]
    paths:
      - 'mentolder-web/**'
      - '.github/workflows/build-mentolder-web.yml'
  workflow_dispatch:

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  build-and-deploy:
    name: Build & Deploy (react.mentolder.de)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v5.4.0
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: mentolder-web/pnpm-lock.yaml

      - name: Typecheck
        run: |
          cd mentolder-web
          pnpm install --frozen-lockfile
          pnpm run typecheck

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Build & push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        env:
          VITE_FORMSPREE_ENDPOINT: ${{ secrets.MENTOLDER_WEB_FORMSPREE_ENDPOINT }}
          # Astro website origin the SPA reuses for auth + homepage persistence.
          VITE_WEBSITE_ORIGIN: "https://web.mentolder.de"
        with:
          context: .
          file: mentolder-web/Dockerfile
          push: true
          build-args: |
            VITE_FORMSPREE_ENDPOINT=${{ env.VITE_FORMSPREE_ENDPOINT }}
            VITE_WEBSITE_ORIGIN=${{ env.VITE_WEBSITE_ORIGIN }}
          tags: |
            ghcr.io/paddione/mentolder-web:latest
            ghcr.io/paddione/mentolder-web:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to fleet (react.mentolder.de)
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
          SHA_TAG: ${{ steps.version.outputs.sha }}
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          umask 077
          chmod 700 ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Pin to exact SHA — forces rollout of the freshly built image
          kubectl set image deployment/mentolder-web \
            "mentolder-web=ghcr.io/paddione/mentolder-web:${SHA_TAG}" \
            -n workspace
          kubectl rollout status deployment/mentolder-web -n workspace --timeout=120s
