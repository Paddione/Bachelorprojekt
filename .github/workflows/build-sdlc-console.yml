name: Build SDLC Console

on:
  push:
    branches: [main]
    paths:
      - 'website/src/**/sdlc/**'
      - 'website/src/lib/**'
      - 'website/src/components/**'
      - 'website/src/middleware/**'
      - 'website/src/integrations/**'
      - 'website/astro.config.mjs'
      - 'website/package.json'
      - 'website/Dockerfile'
      - '.github/workflows/build-sdlc-console.yml'
  workflow_dispatch:

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  build-image:
    name: Build SDLC Console Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate freshness artifacts before build
        run: |
          bash scripts/ci-dummy-secrets.sh
          task freshness:regenerate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Compute image + tags
        id: compute-tags
        run: |
          IMAGE="ghcr.io/paddione/website-sdlc"
          SHA_TAG="sha-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: website/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.compute-tags.outputs.built_at }}
            BUILD_TARGET=sdlc
          tags: |
            ${{ steps.compute-tags.outputs.image }}:${{ steps.compute-tags.outputs.sha_tag }}
            ${{ steps.compute-tags.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
