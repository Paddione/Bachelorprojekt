name: Build & Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'components/website/**'
      - '!components/website/src/pages/sdlc/**'
      - '!components/website/src/lib/sdlc/**'
      - '!components/website/src/components/sdlc/**'
      # Hier bewusst KEIN '.claude/lib/goals.md' (T002639): der Trigger stammte aus
      # T002158, als /admin/repohealth noch im Prod-Bundle steckte. Seit ADR-006 E1
      # ist der einzige Konsument pages/sdlc/repohealth.astro, und die Daten liegen
      # unter components/website/src/lib/sdlc/ — von den Negationen oben also ausgeschlossen.
      # Gebaut wird das über build-sdlc-console.yml ('components/website/src/lib/**'), das der
      # Bot-Commit aus health-goals.yml mitzieht (goals.md + JSON in EINEM Commit).
      - '.github/workflows/build-website.yml'
  workflow_dispatch:

concurrency:
  group: build-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build Website Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.compute-tags.outputs.image }}
      sha_tag: ${{ steps.compute-tags.outputs.sha_tag }}
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate freshness artifacts before build
        run: |
          bash scripts/ci-dummy-secrets.sh
          task freshness:regenerate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Compute image + tags
        id: compute-tags
        run: |
          IMAGE="ghcr.io/paddione/website"
          SHA_TAG="sha-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Shared, brand-neutral image. Brand config (PROD_DOMAIN, LEGAL_*,
      # CONTACT_*, BRAND) is injected at runtime via each brand's ConfigMap in
      # the deploy jobs below — not baked at build time. One build feeds both
      # the mentolder and korczewski deploy jobs (T001229, T001276).
      #
      # GIT_SHA/BUILT_AT are the exception: they describe the image itself, not
      # a brand, and components/website/Dockerfile declares matching ARG lines in its
      # runtime stage (T002202). Historically this Dockerfile had no ARG line
      # at all, which silently turned build-args into no-ops — keep the ARG
      # declarations and these values in sync.
      # dev-stack tag: k3d/dev-stack/website-dev.yaml pins website:dev (fleet
      # dev node, T007035). Same build, additional tag. NOTE: `workspace-website`
      # als Alias-Name scheiterte am GHCR-Token (permission_denied: read_package
      # auf dem nicht-repo-verknuepften Package) — deshalb direkt :dev auf dem
      # bestehenden `website`-Package. Kommentare duerfen NICHT in die
      # multiline `tags:`-Zeichenkette (build-push-action parst sie als Tags).
      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: components/website/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.compute-tags.outputs.built_at }}
            BUILD_TARGET=prod
          tags: |
            ${{ steps.compute-tags.outputs.image }}:${{ steps.compute-tags.outputs.sha_tag }}
            ${{ steps.compute-tags.outputs.image }}:latest
            ${{ steps.compute-tags.outputs.image }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-artifact:
    name: Re-render fleet artifact (pins website SHA)
    needs: [build-image]
    if: vars.FLUX_ENABLED == 'true'
    uses: ./.github/workflows/render-fleet-artifact.yml
    with:
      website_image_digest: ${{ needs.build-image.outputs.digest }}
    secrets: inherit

  # [T900810] deploy-mentolder (pre-Flux kubectl-Pfad) entfernt: Flux ist Steady
  # State (digest-gepinntes Live-Image, Kustomizations Ready), der Job war tot
  # (vars.FLUX_ENABLED != 'true' feuert nie) und ungetestet im Produktivsinn.
  # [#7234] deploy-korczewski ebenfalls entfernt: derselbe tote kubectl-Pfad —
  # unter Flux-Steady-State feuert `if: vars.FLUX_ENABLED != 'true'` nie. Der
  # frische Website-Digest fliesst stattdessen per render-korczewski-prod
  # (workflow_call mit needs.build-image.outputs.digest) digest-scharf ins
  # korczewski-prod-Artefakt. Guards: test_fe05_korczewski_delivery.py plus
  # test_g_cd01_build_ruft_korczewski_prod_render_mit_digest (test_ci_cd_part1.py).

  render-korczewski-prod:
    name: Re-render korczewski-prod artifact (pins website SHA)
    needs: [build-image]
    uses: ./.github/workflows/render-korczewski-prod-artifact.yml
    with:
      website_image_digest: ${{ needs.build-image.outputs.digest }}
    secrets: inherit
