name: Build & Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'components/website/**'
      - '!components/website/src/pages/sdlc/**'
      - '!components/website/src/lib/sdlc/**'
      - '!components/website/src/components/sdlc/**'
      # Hier bewusst KEIN '.claude/lib/goals.md' (T002639): der Trigger stammte aus
      # T002158, als /admin/repohealth noch im Prod-Bundle steckte. Seit ADR-006 E1
      # ist der einzige Konsument pages/sdlc/repohealth.astro, und die Daten liegen
      # unter components/website/src/lib/sdlc/ — von den Negationen oben also ausgeschlossen.
      # Gebaut wird das über build-sdlc-console.yml ('components/website/src/lib/**'), das der
      # Bot-Commit aus health-goals.yml mitzieht (goals.md + JSON in EINEM Commit).
      - '.github/workflows/build-website.yml'
  workflow_dispatch:

concurrency:
  group: build-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build Website Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.compute-tags.outputs.image }}
      sha_tag: ${{ steps.compute-tags.outputs.sha_tag }}
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate freshness artifacts before build
        run: |
          bash scripts/ci-dummy-secrets.sh
          task freshness:regenerate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v5

      - name: Compute image + tags
        id: compute-tags
        run: |
          IMAGE="ghcr.io/paddione/website"
          SHA_TAG="sha-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Shared, brand-neutral image. Brand config (PROD_DOMAIN, LEGAL_*,
      # CONTACT_*, BRAND) is injected at runtime via each brand's ConfigMap in
      # the deploy jobs below — not baked at build time. One build feeds both
      # the mentolder and korczewski deploy jobs (T001229, T001276).
      #
      # GIT_SHA/BUILT_AT are the exception: they describe the image itself, not
      # a brand, and components/website/Dockerfile declares matching ARG lines in its
      # runtime stage (T002202). Historically this Dockerfile had no ARG line
      # at all, which silently turned build-args into no-ops — keep the ARG
      # declarations and these values in sync.
      # dev-stack tag: k3d/dev-stack/website-dev.yaml pins website:dev (fleet
      # dev node, T007035). Same build, additional tag. NOTE: `workspace-website`
      # als Alias-Name scheiterte am GHCR-Token (permission_denied: read_package
      # auf dem nicht-repo-verknuepften Package) — deshalb direkt :dev auf dem
      # bestehenden `website`-Package. Kommentare duerfen NICHT in die
      # multiline `tags:`-Zeichenkette (build-push-action parst sie als Tags).
      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: components/website/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.compute-tags.outputs.built_at }}
            BUILD_TARGET=prod
          tags: |
            ${{ steps.compute-tags.outputs.image }}:${{ steps.compute-tags.outputs.sha_tag }}
            ${{ steps.compute-tags.outputs.image }}:latest
            ${{ steps.compute-tags.outputs.image }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-artifact:
    name: Re-render fleet artifact (pins website SHA)
    needs: [build-image]
    if: vars.FLUX_ENABLED == 'true'
    uses: ./.github/workflows/render-fleet-artifact.yml
    with:
      website_image_digest: ${{ needs.build-image.outputs.digest }}
    secrets: inherit

  # [T900810] deploy-mentolder (pre-Flux kubectl-Pfad) entfernt: Flux ist Steady
  # State (digest-gepinntes Live-Image, Kustomizations Ready), der Job war tot
  # (vars.FLUX_ENABLED != 'true' feuert nie) und ungetestet im Produktivsinn.
  # deploy-korczewski bleibt vorerst: ci-cd.bats pinnt seine Existenz
  # (Guard-Entscheid T900810 — Entfernen nur zusammen mit Guard-Update).

  deploy-korczewski:
    name: Deploy Website (korczewski)
    runs-on: ubuntu-latest
    needs: [build-image]
    if: vars.FLUX_ENABLED != 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Deploy to korczewski
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
          IMAGE: ${{ needs.build-image.outputs.image }}
          SHA_TAG: ${{ needs.build-image.outputs.sha_tag }}
          BRAND_ID: massage
          BRAND_NAME: Massagepraxis Vögelsen
          PROD_DOMAIN: korczewski.de
          CONTACT_EMAIL: massage@korczewski.de
          CONTACT_PHONE: ${{ secrets.KORCZEWSKI_CONTACT_PHONE }}
          CONTACT_CITY: Lüneburg
          CONTACT_NAME: Patrick Korczewski
          LEGAL_STREET: ${{ secrets.KORCZEWSKI_LEGAL_STREET }}
          LEGAL_ZIP: ${{ secrets.KORCZEWSKI_LEGAL_ZIP }}
          LEGAL_JOBTITLE: Software Engineer, IT-Security-Berater
          LEGAL_UST_ID: ${{ secrets.KORCZEWSKI_LEGAL_UST_ID }}
          LEGAL_WEBSITE: korczewski.de
          SMTP_USER: korczewski@mailbox.org
          SMTP_HOST: smtp.mailbox.org
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_FROM: korczewski@mailbox.org
          AUTH_EXTERNAL_URL: https://auth.korczewski.de
          NEXTCLOUD_EXTERNAL_URL: https://files.korczewski.de
          VAULT_EXTERNAL_URL: https://vault.korczewski.de
          WHITEBOARD_EXTERNAL_URL: https://files.korczewski.de/apps/files
          TRAEFIK_EXTERNAL_URL: https://traefik.korczewski.de
          MAIL_EXTERNAL_URL: https://mail.korczewski.de
          BRETT_DOMAIN: brett.korczewski.de
          CLUSTER_ENV: korczewski
          LLM_ENABLED: "true"
          LLM_RERANK_ENABLED: "false"
          LLM_ROUTER_URL: http://llm-gateway-lmstudio.workspace-korczewski.svc.cluster.local:1234
          LLM_EMBED_URL: http://llm-gateway-lmstudio.workspace-korczewski.svc.cluster.local:1234
          WEBSITE_IMAGE: website
          WEBSITE_NAMESPACE: website-korczewski
          WORKSPACE_NAMESPACE: workspace-korczewski
          # T901440: zentrale DB-Koordinaten (identisch zu environments/fleet-korczewski.yaml)
          WEBSITE_DB_NAMESPACE: workspace
          WEBSITE_DB_NAME: website_massage
          WEBSITE_DB_USER: website_massage
          TLS_SECRET_NAME: korczewski-tls
          SYSTEMTEST_LOOP_ENABLED: "true"
          COMFY_HOST_IP: "10.13.14.10"
          COMFY_PORT: "8189"
          RIGGER_PORT: "8190"
          POCKET_ID_FRONTEND_URL: https://auth.korczewski.de
          POCKET_ID_URL: http://pocket-id.workspace-korczewski.svc.cluster.local:1411
          BRAIN_EXTERNAL_URL: https://brain.mentolder.de
          # Arena is optional (mentolder-only, schema default "") — empty disables it.
          ARENA_WS_URL: ""
          NEXTCLOUD_DB_HOST: nextcloud-db.workspace-korczewski.svc.cluster.local
          PRIMARY_FRONTEND: astro
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          rm -f /usr/local/bin/kustomize
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.3 /usr/local/bin
          mkdir -p ~/.kube
          umask 077
          chmod 700 ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          # Derived vars
          WEBSITE_HOST="web.${PROD_DOMAIN}"
          WEBSITE_SITE_URL="https://web.${PROD_DOMAIN}"
          POCKET_ID_FRONTEND_URL="https://auth.${PROD_DOMAIN}"
          REACT_APP_ORIGIN="https://react.${PROD_DOMAIN}"
          RIGGER_HOST_IP="${COMFY_HOST_IP}"
          case "${PRIMARY_FRONTEND}" in
            react) WEBSITE_PRIMARY_SERVICE="mentolder-web" ;;
            *)     WEBSITE_PRIMARY_SERVICE="website" ;;
          esac
          export WEBSITE_HOST WEBSITE_SITE_URL POCKET_ID_FRONTEND_URL REACT_APP_ORIGIN RIGGER_HOST_IP WEBSITE_PRIMARY_SERVICE

          # Apply full website overlay (ConfigMap + networking + Deployment with :latest).
          # The sed step adds YAML string quotes around unquoted ${VAR} placeholders so
          # server-side apply doesn't reject boolean/integer fields as wrong types.
          # The envsubst variable list is derived from the rendered manifest itself and
          # every referenced variable must be set (fail-closed) — a hardcoded allowlist
          # here drifted from the Taskfile deploy path and shipped literal ${VAR}
          # strings to prod (T001993).
          RENDERED=$(kustomize build prod-fleet/website-korczewski --load-restrictor=LoadRestrictionsNone \
            | sed -E 's/: \$\{([a-zA-Z0-9_]+)\}[[:space:]]*$/: "${\1}"/g')
          # T002154: WEBSITE_CONFIG_SHA ist bewusst KEIN Job-Env — der Wert entsteht
          # erst aus dem substituierten Manifest (siehe unten) und wird deshalb aus
          # dieser Runde ausgenommen. Alle uebrigen Variablen bleiben fail-closed.
          VARS=$(grep -oE '\$\{[A-Za-z0-9_]+\}' <<<"$RENDERED" | tr -d '${}' | sort -u | sed '/^WEBSITE_CONFIG_SHA$/d')
          MISSING=""
          for v in $VARS; do if [[ -z "${!v+x}" ]]; then MISSING="$MISSING $v"; fi; done
          if [[ -n "$MISSING" ]]; then
            echo "::error::manifest placeholders without a set env var:$MISSING — add them to this job's env block"
            exit 1
          fi
          SUBSTITUTED=$(envsubst "$(printf '$%s ' $VARS)" <<<"$RENDERED")
          # T002154/T002156: Hash NACH envsubst ueber den website-config-data-Block.
          # Der gemeinsame Helper stellt sicher, dass dieser Job, der Taskfile-Pfad
          # und der Flux-Renderer denselben Wert berechnen — bei pfadabhaengigen
          # Hashes (z.B. ueber das ganze Manifest inkl. Image-Tag) wuerden sie sich
          # gegenseitig ueberschreiben und bei jedem Reconcile neu ausrollen.
          export WEBSITE_CONFIG_SHA="$(bash scripts/website-config-sha.sh <<<"$SUBSTITUTED")"
          if [[ -z "$WEBSITE_CONFIG_SHA" ]]; then
            echo "::error::website-config-sha.sh returned an empty checksum"
            exit 1
          fi
          SUBSTITUTED=$(envsubst '$WEBSITE_CONFIG_SHA' <<<"$SUBSTITUTED")
          if grep -qE '\$\{[A-Za-z0-9_]+\}' <<<"$SUBSTITUTED"; then
            echo "::error::unexpanded \${VAR} placeholders remain after envsubst:"
            grep -oE '\$\{[A-Za-z0-9_]+\}' <<<"$SUBSTITUTED" | sort -u
            exit 1
          fi
          # T901440: Pre-Rollout Secret-Check VOR apply gegen das effektiv
          # gerenderte Overlay (k3d/website.yaml allein uebersieht den gepatchten
          # WEBSITE_MASSAGE_DB_PASSWORD-Key). Alle nicht-optionalen Secret-Keys
          # aller Container inkl. Initcontainern, je Dokument-Namespace; Werte
          # werden nie ausgegeben.
          echo "$SUBSTITUTED" > /tmp/website-korczewski-rendered.yaml
          MISSING=""
          for NS_KEY in $(python3 -c "
          import yaml
          seen = set()
          with open('/tmp/website-korczewski-rendered.yaml') as f:
              for doc in yaml.safe_load_all(f):
                  if not doc: continue
                  ns = ((doc.get('metadata') or {}).get('namespace')) or 'default'
                  spec = (doc.get('spec') or {})
                  tmpl = ((spec.get('template') or {}).get('spec')) or spec
                  for c in (tmpl.get('containers', []) or []) + (tmpl.get('initContainers', []) or []):
                      for e in (c.get('env', []) or []):
                          v = (e.get('valueFrom') or {}).get('secretKeyRef') or {}
                          if v.get('name') == 'website-secrets' and v.get('key') and not v.get('optional'):
                              seen.add(ns + '/' + v['key'])
          for item in sorted(seen):
              print(item)
          "); do
            NS="${NS_KEY%%/*}"
            KEY="${NS_KEY#*/}"
            if ! kubectl get secret website-secrets -n "$NS" \
                -o jsonpath="{.data.${KEY}}" 2>/dev/null | grep -q .; then
              MISSING="$MISSING $NS/$KEY"
            fi
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::website-secrets missing required keys:$MISSING"
            echo "Fix: task env:seal ENV=fleet-korczewski (Keys WEBSITE_MASSAGE_DB_PASSWORD etc.)"
            exit 1
          fi
          sed -E 's/\$\$([a-zA-Z0-9_\{])/$\1/g' <<<"$SUBSTITUTED" \
            | kubectl apply --server-side --force-conflicts -f -

          # Pin to the exact SHA-tagged image to guarantee the freshly built version rolls out.
          kubectl set image deployment/website website="${IMAGE}:${SHA_TAG}" -n website-korczewski

      - name: Wait for rollout (korczewski)
        env:
          NAMESPACE: website-korczewski
        run: |
          kubectl rollout status deployment/website -n "$NAMESPACE" --timeout=120s
