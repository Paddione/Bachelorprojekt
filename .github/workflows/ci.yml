name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    # No `paths-ignore` here: docs-only PRs (e.g. AGENTS.md/CLAUDE.md edits) must
    # still trigger this workflow so the branch-protection required checks
    # (BATS Unit + Quality Gates, Manifest Validation,
    # Factory + OpenSpec + Guards, Security Scan, Brett TypeScript,
    # Vitest (website), Conventional Commits) report success — otherwise
    # mergeStateStatus stays BLOCKED indefinitely and admin-merge is required.
    # See mishap T001149-M3.
  push:
    branches:
      - main
      # [T002780] Der Zweig 'release-please--branches--main' ist hier entfallen.
      # Er war ein Workaround dagegen, dass GitHub fuer PRs von
      # github-actions[bot] (GITHUB_TOKEN) keine pull_request-Workflows
      # ausloest. Release-Please laeuft inzwischen unter secrets.GH_PAT
      # (.github/workflows/release-please.yml), damit greift die
      # Loop-Prevention nicht mehr und der regulaere pull_request-Trigger
      # feuert. Der push-Zweig erzeugte daneben nur einen zweiten,
      # identischen Lauf pro Release-PR.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/CLAUDE.md'
  # [T002780] Traegt seit dem Merge-Delta-Scoping unten die Vollabdeckung der
  # Spec-Suite: push-auf-main prueft nur noch das Merge-Delta, eine Spec-Datei
  # ohne Diff-Bezug liefe sonst in gar keinem Lauf mehr (T002245). Nachts um
  # 03:17 UTC, versetzt zu den vollen Stunden, an denen Actions-Runner knapp
  # sind.
  schedule:
    - cron: '17 3 * * *'
  # Rettungsanker [T002425-M5]: GitHub loest fuer einen frisch gepushten SHA gelegentlich
  # gar keinen Lauf aus — `gh pr checks` meldet dann minutenlang "no checks reported on the
  # branch" und `.../commits/<sha>/check-runs` liefert total_count: 0, waehrend die letzten
  # Runs noch am vorherigen SHA haengen. Auto-Merge greift in dem Zustand nie. Bisher blieb
  # als einziger Ausweg ein leerer Commit, weil `gh workflow run ci.yml` mangels
  # workflow_dispatch mit HTTP 422 abwies. Der Trigger aendert nichts am Normalbetrieb.
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on the same PR (rapid iteration / stacked Factory pushes);
  # never cancel push-to-main runs, which gate the deployable history.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: 'true'

  OPENSPEC_TELEMETRY: '0'
jobs:
  # ── Scoped test jobs (replaces offline-tests monolith) ─────────────

  test-bats:
    # BATS unit tests (scoped via find-changed-tests.sh) + code-quality
    # gates + API auth regression + freshness check. The core offline job
    # that most PRs hit. Does NOT need Go, kubectl, or pnpm. [T001860]
    name: BATS Unit + Quality Gates
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch origin/main for diffing (shallow)
        run: git fetch --no-tags --prune --depth=1 origin +main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v5.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install node dependencies
        run: npm ci

      - name: Create CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh

      - name: Scoped unit BATS + coverage guard
        run: |
          JOBS=$(nproc 2>/dev/null || echo 2)
          CHANGED_FILES=$(bash scripts/find-changed-tests.sh unit)
          if [ -n "$CHANGED_FILES" ]; then
            echo "→ Running changed unit tests:"
            echo "$CHANGED_FILES"
            ./tests/unit/lib/bats-core/bin/bats -j $JOBS --no-parallelize-within-files $CHANGED_FILES
          else
            echo "→ No matching unit tests for this PR"
          fi
          CHANGED=$(git diff --name-only HEAD origin/main 2>/dev/null || true)
          if echo "$CHANGED" | grep -qE "^(tests/figure-pack-assets|assets/)"; then
            bash tests/figure-pack-assets.test.sh
          fi
          bash scripts/tests/unit-coverage-guard.sh

      - name: Code-quality gates (always)
        run: node --test scripts/code-quality/*.test.mjs scripts/code-quality/gates/*.test.mjs

      # T002336: bis hierher lief diese Suite nirgends - weder in einem
      # Taskfile-Target noch in CI. "always", nicht selektiv: der Proxy ist
      # Infrastruktur fuer Factory und dev-flow, ein Bruch faellt sonst erst
      # zur Laufzeit auf (und dann still, siehe /health-Vorfall 2026-07-27).
      # T002638: dasselbe Muster ein zweites Mal — exclusive-conflict, fixups und
      # strip-markers (zusammen 19 Tests) standen ebenfalls in keiner Zeile. Der
      # Guard tests/spec/local-llm-proxy/proxy-tests-registered.bats haelt diese
      # handgepflegte Liste ab jetzt gegen die vorhandenen Dateien.
      # mcp-bridge.test.mjs uses vitest (vi.mock) — run separately from node:test files.
      - name: llm-proxy routing + readiness (always)
        run: npx vitest run scripts/llm-proxy/mcp-bridge.test.mjs && node --test scripts/llm-proxy/discovery-probe-auth.test.mjs scripts/llm-proxy/exclusive-conflict.test.mjs scripts/llm-proxy/fixups.test.mjs scripts/llm-proxy/gpu-lock.test.mjs scripts/llm-proxy/loadouts.test.mjs scripts/llm-proxy/local-only.test.mjs scripts/llm-proxy/models.test.mjs scripts/llm-proxy/runner.test.mjs scripts/llm-proxy/server.test.mjs scripts/llm-proxy/strip-markers.test.mjs

      - name: API auth regression gate
        run: |
          git show origin/main:docs/generated/api-map.json > /tmp/api-map-main.json 2>/dev/null || echo '{"generatedAt":"","endpoints":[]}' > /tmp/api-map-main.json
          node scripts/api-auth-check.mjs --regression --main-map /tmp/api-map-main.json

      - name: Ensure freshness artifacts are up to date
        if: github.event_name == 'pull_request'
        run: |
          if ! task freshness:check; then
            echo ""
            echo "❌ Freshness / quality gate failed — see above for the specific cause."
            echo ""
            echo "   Stale generated artifacts  →  task freshness:regenerate  (then commit + push)"
            echo "   New code-quality violation →  task quality:check  (then fix or 'task quality:baseline:freeze')"
            exit 1
          fi
          echo "✅ Freshness and quality gates passed"

      - name: OpenSpec spec-drift advisory gate [T001979]
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Advisory Phase 1: drift => exit 0 (warnings only). exit >=2 means the
          # script itself broke and MUST fail CI — so NO continue-on-error here.
          bash scripts/openspec-drift-check.sh

  test-manifests:
    # kustomize manifest validation — the ONLY job that needs kubectl.
    # Very fast setup (~1 min) + ~5s test execution. [T001860]
    name: Manifest Validation
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      # [T002754] Cache the kubectl binary (~50MB download). Keyed on version
      # so it auto-busts when we bump k8s. On cache miss, the next step
      # downloads it. On hit, it's already in /usr/local/bin.
      - name: Cache kubectl binary
        id: cache-kubectl
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubectl
          key: kubectl-v1.31.0-linux-amd64

      - name: Install kubectl (if not cached)
        if: steps.cache-kubectl.outputs.cache-hit != 'true'
        run: |
          curl --fail -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl

      - name: Run manifest tests
        run: |
          ./tests/unit/lib/bats-core/bin/bats \
            tests/unit/manifests.bats tests/unit/changed-manifests.bats \
            tests/unit/dead-node-affinity.bats

  # ── Factory: schneller Gate-Job, dann geshardete Spec-Suite, dann Aggregator ──
  #
  # [T002500] Vorher war das EIN Job mit ~400s, dem kritischen Pfad jedes PRs
  # (zweitlaengster Job: 165s). Zwei Probleme, beide hier behoben:
  #
  #   1. Die billigen Gates (OpenSpec-Validierung: 1s) standen HINTER der
  #      6-Minuten-BATS-Suite und liefen bei deren Fehlschlag gar nicht mehr.
  #      Eine kaputte Spec meldete sich also erst nach sechs Minuten — oder,
  #      wenn vorher ein Test rot wurde, ueberhaupt nicht.
  #   2. Die Suite ist durchsatz-, nicht tail-gebunden (~537s CPU-Arbeit).
  #      Mehr `bats -j` auf EINEM Runner war ausgereizt; der einzige Hebel
  #      sind mehr Runner. Details in scripts/spec-shard.sh.
  #
  # Der Aggregator `test-factory` behaelt den Namen "Factory + OpenSpec + Guards",
  # weil genau dieser String als Required Status Check in der Branch Protection
  # von main haengt. Eine nackte Matrix haette ihn in "… (1)".."… (4)" umbenannt
  # und jeden PR dauerhaft blockiert.

  test-factory-openspec:
    # Die billigen, hochsignalhaften Gates — laufen parallel zu den Shards und
    # melden nach ~30s statt nach ~400s.
    name: Factory OpenSpec + Guards (fast)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch origin/main for diffing (shallow)
        run: git fetch --no-tags --prune --depth=1 origin +main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: OpenSpec validation
        run: npm run test:openspec

      - name: Agent setup replay reminder
        run: |
          changed=$(git diff --name-only origin/main...HEAD || true)
          if echo "$changed" | grep -Eq '^(.opencode/agent-models.jsonc|scripts/factory/review-[^/]+\.prompt\.md|scripts/factory/provider-router\.js|AGENTS.md)$'; then
            echo "::warning::Agenten-Setup geändert — lokal 'task factory:eval:replay' ausführen"
          fi

  test-factory-shard:
    # tests/spec/*.bats + setup-go fuer den mcp-task-runner-Build (von test:spec
    # gebraucht). Alle Spec-Tests ueberspringen Live-DB-Faelle ohne Cluster
    # (CI-safe). [T002182]
    # Auf PRs auf die geaenderten Specs gescopt, volle Suite bei push-to-main. [T002245]
    name: Factory spec shard ${{ matrix.shard }}
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast: false ist Absicht. Bricht ein Shard ab, sollen die anderen
      # zu Ende laufen — sonst sieht man pro Lauf nur die Fehler EINES Shards
      # und braucht fuer eine rote Suite so viele CI-Runden wie Shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SPEC_SHARD: ${{ matrix.shard }}
      SPEC_SHARDS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch origin/main for diffing (shallow)
        run: git fetch --no-tags --prune --depth=1 origin +main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v5.4.0
        with:
          version: 10

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v5.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install node dependencies
        run: npm ci

      - name: Create CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh

      # PyYAML wird VON den G-CD01-Assertions gebraucht (tests/spec/ci-cd.bats
      # macht `import yaml`), muss also vor der Suite stehen. Bis T002500 stand
      # dieser Step dahinter und trug nichts bei — dass die Assertions trotzdem
      # liefen, lag allein daran, dass ubuntu-latest PyYAML vorinstalliert hat.
      - name: Install PyYAML for CI-CD guard assertions
        run: python3 -m pip install --quiet pyyaml

      # Ohne laufenden Daemon skippten 24 der 41 sdlc-cockpit-Tests dauerhaft,
      # darunter alle Route- und Security-Guards aus T002505. Ein bats-skip ist
      # ein `ok`, die Suite war also gruen, ohne je eine Route zu beruehren
      # [T002508]. Der Start gehoert in JEDEN Shard: welcher Shard die
      # Cockpit-Dateien zieht, ist nicht garantiert.
      #
      # Kein `|| true`: schlaegt der Start fehl, muss der Job abbrechen. Ein
      # geschluckter Fehler brächte genau den stillen Zustand zurueck, den
      # dieser Schritt beendet.
      - name: Start cockpit daemon (shard ${{ matrix.shard }}/4)
        run: task cockpit:daemon

      # [T002517] Diagnose: Auf Shard 1 konnte GNU parallel (von `bats -j`
      # genutzt) keinen einzigen Ausgabepuffer nach /tmp schreiben — "Cannot
      # append to buffer file in /tmp", 0 statt 454 Tests ausgefuehrt, waehrend
      # die Shards 2-4 im selben Lauf sauber durchliefen. Ohne Zahlen ist nicht
      # entscheidbar, ob /tmp wirklich voll ist, wer es fuellt, oder ob es ein
      # Rechteproblem ist. Der Schritt schlaegt bewusst NIE fehl.
      - name: Diagnose /tmp (shard ${{ matrix.shard }}/4)
        if: always()
        run: |
          echo "── df ──"; df -h /tmp / || true
          echo "── inodes ──"; df -i /tmp / || true
          echo "── groesste Eintraege in /tmp ──"
          du -sh /tmp/* 2>/dev/null | sort -rh | head -15 || true
          echo "── Schreibprobe ──"
          if head -c 10M /dev/zero > /tmp/.wtest 2>/dev/null; then
            echo "10M schreibbar"; rm -f /tmp/.wtest
          else
            echo "SCHREIBEN FEHLGESCHLAGEN"
          fi
          echo "── TMPDIR=${TMPDIR:-<nicht gesetzt>} ──"

      # Fail closed: ist der Diff-Bezugspunkt nicht ermittelbar, waere die
      # Auswahl leer und wuerde still nichts ausfuehren — dann lieber alles
      # laufen lassen.
      #
      # [T002780] Drei Pfade statt zwei. Vorher fuhr JEDER Merge auf main die
      # volle Suite ein zweites Mal (~13 Runner-Minuten pro Merge, bei ~20
      # Merges/Tag), obwohl der PR-Lauf dieselben Dateien Minuten vorher schon
      # geprueft hatte. Der Merge-Delta-Pfad prueft stattdessen genau das, was
      # der PR-Lauf NICHT gesehen haben kann: das Ergebnis des Squash-Commits.
      # Das ist keine Formalie — `strict` ist in der Branch Protection false,
      # PRs muessen also nicht aktuell zu main sein, und zwei gleichzeitig
      # gruene PRs koennen sich auf main semantisch widersprechen.
      #
      # Die Vollabdeckung ist damit NICHT gestrichen, sondern verlegt: der
      # nightly `schedule`-Trigger oben faehrt `task test:spec` ueber alles.
      # Ohne ihn waere eine Spec-Datei, die kein Diff je beruehrt, in keinem
      # Lauf mehr enthalten — genau die Verrottung, vor der T002245 warnt.
      - name: Spec BATS suite (shard ${{ matrix.shard }}/4)
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_PUSH: ${{ github.event_name == 'push' }}
          # Vorgaenger-Commit von main bei einem push-Event. Leer/Nullen bei
          # Force-Push und beim allerersten Push — beides faellt auf die volle
          # Suite zurueck.
          BEFORE_SHA: ${{ github.event.before }}
          # Macht das Gate fail-closed: ein nicht erreichbarer Daemon laesst die
          # betroffenen Tests durchfallen, statt sie zu ueberspringen.
          COCKPIT_DAEMON_REQUIRED: '1'
          # [T003025] junit-Report einschalten: Taskfile legt junit-report/ an
          # und schreibt die Reporte dort hinein; der naechste Step laedt sie
          # als Artifakt hoch. Aus den XMLs regeneriert scripts/spec-junit-weights.sh
          # die Laufzeit-Gewichte (tests/spec/.spec-runtime.tsv) fuer spec-shard.sh.
          BATS_JUNIT_DIR: junit-report
        run: |
          if [ "$IS_PR" = "true" ] && git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            task test:spec:changed
            exit 0
          fi

          # Merge-Delta auf main. FIND_CHANGED_TESTS_FILES ist die dafuer
          # vorgesehene Naht in scripts/find-changed-tests.sh: auf main ist
          # HEAD == origin/main, dessen eigener Default-Diff also leer.
          if [ "$IS_PUSH" = "true" ] \
             && [ -n "$BEFORE_SHA" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            DELTA=$(git diff --name-only "$BEFORE_SHA" HEAD || true)
            if [ -n "$DELTA" ]; then
              echo "→ Merge-Delta gegen ${BEFORE_SHA} ($(printf '%s\n' "$DELTA" | grep -c .) Dateien)"
              FIND_CHANGED_TESTS_FILES="$DELTA" task test:spec:changed
              exit 0
            fi
            echo "→ Merge-Delta leer — fahre die volle Suite"
          fi

          echo "→ Full spec suite (schedule / dispatch / force-push / Delta nicht ermittelbar)"
          task test:spec

      # [T003025] Timing-Diagnose: junit-Reporte jedes Shards als Artifakt, damit
      # aus einem Full-Suite-Lauf die Laufzeit-Gewichte regeneriert werden koennen
      # (scripts/spec-junit-weights.sh). Best-effort: scoped Laeufe liefern nur
      # partielle Reporte, und bei ausgelassenen Dateien fehlt das XML — beides
      # ist eine Warnung, kein Fehler.
      - name: Upload spec junit report (timing diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-junit-shard-${{ matrix.shard }}
          path: junit-report/report.xml
          if-no-files-found: warn
          retention-days: 14

  test-factory:
    # Aggregator. Traegt den Required-Check-Namen und ist fail-closed: alles,
    # was nicht exakt "success" ist, laesst ihn scheitern. Das ist wesentlich —
    # in der Branch Protection zaehlt ein UEBERSPRUNGENER Required Check als
    # bestanden. Ein Aggregator ohne always() wuerde bei fehlgeschlagenen
    # needs uebersprungen und damit das Gate lautlos oeffnen.
    name: Factory + OpenSpec + Guards
    if: always() && github.event.action != 'edited'
    needs: [test-factory-openspec, test-factory-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard + gate results
        env:
          OPENSPEC_RESULT: ${{ needs.test-factory-openspec.result }}
          SHARDS_RESULT: ${{ needs.test-factory-shard.result }}
        run: |
          echo "OpenSpec + Guards : $OPENSPEC_RESULT"
          echo "Spec shards (1-4) : $SHARDS_RESULT"
          # SHARDS_RESULT ist das Aggregat ueber ALLE Matrix-Legs — 'success'
          # nur, wenn jeder einzelne Shard erfolgreich war.
          if [ "$OPENSPEC_RESULT" = "success" ] && [ "$SHARDS_RESULT" = "success" ]; then
            echo "Alle Factory-Gates gruen."
            exit 0
          fi
          echo "::error::Factory-Gates nicht gruen (openspec=$OPENSPEC_RESULT shards=$SHARDS_RESULT)"
          exit 1

  # ── End scoped test jobs ──────────────────────────────────────────

  security-scan:
    name: Security Scan
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Check image pinning in k3d manifests
        run: |
          # Several dev images (MCP servers, whisper, locally-built services) intentionally
          # use :latest. This step is advisory only — it reports which images are unpinned.
          pinned=true
          for f in k3d/*.yaml; do
            if grep -q ':latest' "$f"; then
              echo "INFO: $f contains :latest tag(s)"
              pinned=false
            fi
          done
          $pinned && echo "All images are version-pinned" || echo "WARNING: some images use :latest (see above)"

      - name: Check for secrets in code
        run: |
          if grep -rn 'password.*=.*[^$]' k3d/*.yaml \
               | grep -iv 'secretKeyRef\|configMapKeyRef\|valueFrom\|KEYCLOAK_ADMIN_PASSWORD\|_PASSWORD}\|getenv(' \
               | grep -iv '^\s*#'; then
            echo "ERROR: Possible hardcoded secrets found (see above)"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Verify secrets are git-crypt-encrypted
        run: |
          if ! bash scripts/git-crypt-guard.sh check-tracked; then
            echo "ERROR: a tracked secret is stored in plaintext (must be git-crypt-encrypted)"
            exit 1
          fi
          echo "All managed secret files are git-crypt-encrypted"

      # [T002754] Cache the gitleaks binary to avoid re-downloading from GitHub
      # releases on every run. The cache key includes the version so it
      # auto-busts on upgrades. Post-restore the binary is in /usr/local/bin
      # and the following step uses it directly.
      - name: Cache gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/gitleaks
          key: gitleaks-v8.18.2-linux-amd64

      - name: Install gitleaks (if not cached)
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks

      - name: Gitleaks secret scan (fail-closed)
        run: |
          if ! gitleaks detect --config .gitleaks.toml --no-git --redact; then
            echo "ERROR: gitleaks detected potential secrets — see findings above"
            exit 1
          fi
          echo "No secrets detected by gitleaks"

      # [T002754] aquasecurity/setup-trivy caches the binary automatically
      # (actions/cache under the hood, keyed on version). Replaces the manual
      # curl|sh install that re-downloaded every run.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          cache: 'true'

      - name: Trivy container image scan (pinned images)
        continue-on-error: true
        run: |
          result=$(bash scripts/trivy-scan.sh --json 2>/dev/null || echo '{"total_critical":0,"total_high":0}')
          crit=$(echo "$result" | jq '.total_critical')
          high=$(echo "$result" | jq '.total_high')
          echo "### Trivy Container Image Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $crit critical, $high high**" >> "$GITHUB_STEP_SUMMARY"
          echo "trivy-critical=$crit" >> "$GITHUB_OUTPUT"
          echo "trivy-high=$high" >> "$GITHUB_OUTPUT"
          if [[ "$crit" -gt 0 ]]; then
            echo "::warning::Found $crit CRITICAL CVEs across pinned images"
          fi

  brett-typescript:
    name: Brett TypeScript
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: brett/package-lock.json
      - run: npm ci --prefix brett
      - name: Typecheck
        run: npm run typecheck --prefix brett
      - name: Unit tests
        run: npm test --prefix brett
        env:
          MOCK_DB: 'true'
      - run: npm run build --prefix brett

  vitest-website:
    # Always runs on every PR (no job-level path filter) so the branch-protection
    # required-check "Vitest (website)" reports on chore / config-only PRs too.
    # See mishap: Vitest (website) was required by main but no workflow
    # produced it, blocking auto-merge of chore PRs (e.g. #2094 admin-merged).
    # Smart selection happens INSIDE the vitest run via `--changed`
    # (mirrors local `task test:changed`): a chore PR runs zero tests in
    # ~1s, a website-feature PR runs only the affected ones. The
    # coverage gate below treats the no-changes case as a pass.
    name: Vitest (website)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v5.4.0
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        run: cd website && pnpm install --frozen-lockfile

      - name: Fetch origin/main for --changed diffing
        run: git fetch --no-tags --prune --depth=1 origin +main:refs/remotes/origin/main

      - name: Check coverage relevance
        id: check-cov
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
          if echo "$CHANGED" | grep -q "^website/src/lib/"; then
            echo "run-coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-coverage=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ESLint (--max-warnings 0 fail-closed gate)
        run: cd website && pnpm lint

      - name: Run vitest + Astro check + Knip (parallel)
        # Mirrors the local `task test:changed` smart selection via explicit
        # --changed origin/main (requires fetch-origin-main step above).
        # Astro typecheck and Knip dead-code analysis run concurrently with
        # vitest to shave ~2-3 min off wall-clock time.
        # --coverage is conditional: only added when the PR touches
        # website/src/lib/ (where coverage gates apply), so trivial PRs
        # skip instrumentation overhead. The coverage gate step below
        # handles the missing-report case gracefully. [T003164]
        # Default 5s per-test timeout is too tight for DB-heavy tests
        # (e.g. tickets/cockpit-db.test.ts seeds 1005 rows) when vitest
        # runs ~243 files in parallel on shared CI runners. [T001336, T001651]
        run: |
          cd website
          ARGS="run --changed origin/main --testTimeout=30000"
          [[ "${{ steps.check-cov.outputs.run-coverage }}" == "true" ]] && ARGS="$ARGS --coverage"
          pnpm exec vitest $ARGS &
          V=$!
          pnpm run astro:check &
          A=$!
          pnpm exec knip --no-exit-code || true &
          K=$!
          EXIT=0
          wait $V || EXIT=$?
          wait $A || EXIT=$?
          wait $K || true
          exit $EXIT

      - name: Upload Vitest JUnit report
        # Runs even if the tests above failed, so a red PR still gets a
        # downloadable per-test breakdown (not just the raw log).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit-report
          path: website/test-results/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Vitest line coverage gate (>= 60% on src/lib)
        # G-TEST05 — belt-and-braces check against the coverage-summary.json
        # produced by the run above. Does NOT re-run vitest. [T001336]
        # Skipped gracefully when:
        #   a) no coverage report exists (--coverage wasn't passed because
        #      the PR doesn't touch src/lib/), or
        #   b) --changed found zero website/ source changes (pct: "Unknown").
        # In both cases there is no source delta to regress. [T001651, T003164]
        run: |
          cd website
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::notice::No coverage-summary.json (--coverage not needed / no report) — skipping gate"
            exit 0
          fi
          COV=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          if [ "$COV" = "Unknown" ] || [ "$COV" = "null" ] || [ -z "$COV" ]; then
            echo "::notice::Coverage pct: ${COV:-empty} (--changed found no website/ changes) — skipping gate"
            exit 0
          fi
          echo "Total line coverage: ${COV}%"
          awk -v cov="$COV" 'BEGIN { if (cov + 0 < 60) { print "::error::Coverage gate failed: " cov "% < 60%"; exit 1 } else { print "::notice::Coverage gate passed: " cov "% >= 60%" } }'

      - name: Build website
        run: cd website && pnpm build

      - name: Check client-JS bundle budget
        # [T002754] Previously a separate job (bundle-budget) that spun up a
        # fresh runner, checked out the repo, downloaded the dist artifact, and
        # ran this script. Folding it into vitest-website saves ~30s of job
        # startup + artifact upload/download overhead. check-bundle-size.mjs
        # uses only Node built-ins (fs, path, zlib) — no npm deps needed.
        run: node scripts/check-bundle-size.mjs --check --fail --threshold=5

      - name: Upload website dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 1

  lighthouse:
    name: Lighthouse Performance
    # [T002780] Nur auf PRs. Der Lauf ist `continue-on-error` und blockiert
    # nichts; sein einziges Produkt ist ein advisory Commit-Status, den auf
    # main niemand vor einer Entscheidung liest. Er auditiert ausserdem die
    # LIVE-URL web.mentolder.de, nicht den gemergten Stand — nach einem Merge
    # ist der dort noch gar nicht deployt.
    if: github.event.action != 'edited' && github.event_name == 'pull_request'
    needs: [vitest-website]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LHCI posts an advisory commit status; the built-in GITHUB_TOKEN needs
    # statuses:write to do so (no more expiring personal access token to maintain).
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli --loglevel=error

      - name: Run Lighthouse audit
        continue-on-error: true
        env:
          # Built-in Actions token (statuses:write above) — replaces the expired
          # personal access token that caused "GitHub responded with 401".
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lhci autorun || true

      - name: Lighthouse summary
        if: always()
        run: |
          echo "### Lighthouse Performance Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://web.mentolder.de" >> "$GITHUB_STEP_SUMMARY"
          echo "Budget: lighthouserc.json assertions (Performance ≥ 90)" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: advisory only (does not block CI); GitHub status check posted via LHCI_GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"

  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # 5min was too tight for the full-history checkout below on a repo with
    # many short-lived feature/chore branches — observed cancellations
    # ("The operation was canceled") mid-fetch on PR #3029 [T002049].
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      # Checkout IS needed here despite the PR-title check above being pure
      # API — the later "Validate individual commit messages" and
      # "commit-vs-diff consistency" steps diff every commit in the PR range
      # locally and need those commit objects present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: false
          filter: blob:none
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v7.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirror repo conventions — these are the types used in practice
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            build
            ci
            perf
            revert
          # Scopes are NOT enforced here — ticket-number scopes (Tdddddd) are
          # always valid, and named-scope enforcement happens later via
          # scripts/validate-commit-msg.sh range (individual commit messages).
          # Ticket references like [T000436] can extend subject length
          subjectPattern: ^.{1,200}$
          subjectPatternError: |
            The subject must be between 1 and 200 characters.
            If your PR title includes ticket references like [T000436], that counts toward the limit.
      - name: Validate ticket tag [T000XXX] in PR title (advisory)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"
          if echo "$PR_TITLE" | grep -qP '\[T\d+\]'; then
            echo "✅ Ticket tag found"
          else
            echo "⚠️  PR title has no ticket tag — recommended format: feat(scope): add feature [T000123]"
          fi
      - name: Validate individual commit messages [T001356 / G-GIT02]
        # amannn/action-semantic-pull-request (above) only validates the PR
        # *title*. GitHub's default squash-merge message can still surface a
        # non-conventional individual commit subject. This step catches that
        # regression by validating every non-merge commit in the PR range with
        # the same shared script used by the local pre-push hook
        # (.githooks/pre-push), so a bypassed hook is still caught in CI.
        # BASE_SHA/HEAD_SHA are commit SHAs (not free-text), but routed through
        # env vars per repo convention to avoid interpolating event payload
        # fields directly into the shell command.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BRANCH_BASE=$(git merge-base origin/main "$HEAD_SHA")
          bash scripts/validate-commit-msg.sh range "${BRANCH_BASE}..${HEAD_SHA}"

      # commit-vs-diff consistency guard (T001434-mishap). Catches any commit
      # whose subject claims an implementation change but whose diff contains
      # only test/spec/plan files. Mirrors the local .githooks/commit-msg hook
      # so a bypassed hook (SKIP_COMMIT_VS_DIFF=1) is still caught in CI.
      - name: commit-vs-diff consistency (T001434-mishap guard)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH_BASE=$(git merge-base origin/main "$HEAD_SHA")
          fail=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            subject=$(git log -1 --format='%s' "$sha")
            # Get the list of files changed by this commit (relative to its
            # first parent, falling back to the merge-base for merge commits).
            parent=$(git rev-parse "$sha^1" 2>/dev/null || echo "$BRANCH_BASE")
            files=$(git diff --name-only "$parent" "$sha" 2>/dev/null || true)
            # Build a temp commit-msg file and pass the commit SHA so
            # the guard script uses per-commit diff (not cumulative).
            tmp_msg=$(mktemp)
            trap 'rm -f "$tmp_msg"' EXIT
            printf '%s\n' "$subject" > "$tmp_msg"
            if ! bash scripts/check-commit-vs-diff.sh "$tmp_msg" "$sha"; then
              echo "✗ commit $sha fails commit-vs-diff guard: $subject" >&2
              fail=1
            fi
            rm -f "$tmp_msg"
          done < <(git rev-list "${BRANCH_BASE}..${HEAD_SHA}" --no-merges)
          if [[ "$fail" -ne 0 ]]; then
            echo "" >&2
            echo "✗ commit-vs-diff consistency guard failed" >&2
            echo "  One or more commits in this PR have an implementation-type" >&2
            echo "  subject (fix/feat/refactor/perf) but a diff that contains" >&2
            echo "  only test/spec/plan files. See T001434-mishap." >&2
            exit 1
          fi

      # A squash merge folds every branch-commit subject into the BODY of the
      # main commit, and GitHub reads its skip markers from the whole head-commit
      # message. A `[skip ci]` written on a branch therefore silences ALL
      # push-triggered workflows on main after the merge — with no failed run to
      # notice. This belongs in the PR run, not a push run: on main the trigger
      # is already suppressed and the finding would only be retrospective.
      - name: No CI skip markers in branch commits [T002522]
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH_BASE=$(git merge-base origin/main "$HEAD_SHA")
          bash scripts/check-skip-ci-marker.sh "$BRANCH_BASE" "$HEAD_SHA"
