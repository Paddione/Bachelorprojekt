# .github/workflows/codeql.yml — Code-Scanning mit CodeQL [T900375]
#
# Anlass: Der Check "github-advanced-security" schlug auf jedem PR fehl (#5872–#5878),
# die API meldete "no analysis found" — Advanced Security war aktiv, aber kein Workflow
# lieferte eine Analyse. Dieser Workflow liefert sie.
#
# Zuschnitt:
#   - Sprachen mit echtem Nutzen: javascript-typescript (Website inkl. /api/*, Node-Skripte),
#     actions (Workflow-Dateien selbst).
#     Go entfiel mit dem Ticket-MCP (ticket/go war das letzte Go-Modul; ohne
#     Ticket-DB kein Ticket-MCP).
#     Kein Python/Shell — dort deckt CodeQL wenig ab.
#   - PRs nur bei Code-Aenderungen (Pfadfilter); reine Plan-/Doku-PRs laufen nicht an.
#   - Woechentlich komplett auf main, damit neue Regeln auch Bestandscode pruefen.
#   - Bewusst KEIN Pflicht-Check (Branch-Protection unveraendert): erst die
#     Bestandsbefunde sichten und als eigene Tickets triagieren.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 3 * * 1'   # montags 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Vendorte Fremdpakete und generierte Artefakte sind nicht unser Code.
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/*.generated.*'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: '/language:${{ matrix.language }}'
