name: E2E (manuell — gefiltert)

# NUR manueller Start (Zielbild E2E-Entpflichtung, 2026-10-28, Eigner-Abnahme):
# kein pull_request-Trigger mehr — PRs warten nicht auf E2E, Auto-Merge wird
# nicht blockiert. Nightly e2e.yml testet weiterhin die gesamte Suite gegen Fleet.
# Manueller Lauf via Actions-Tab ("Run workflow") mit Tag-Auswahl; Standard @smoke.
# Job-Name "E2E PR" bleibt stabil (Guards/Tooling referenzieren ihn).
#
# Tag-Mapping (manuelle Auswahl → Playwright --grep):
#   content-hub  → @content-hub (+ @smoke)
#   (weitere Tags analog; siehe workflow_dispatch.inputs.tag)
#   smoke        → nur @smoke
#
# Neue Tests MÜSSEN ein @-Tag im test.describe-Header haben:
#   test.describe('...', { tag: ['@feature-name'] }, () => { ... })

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Feature-Tag (Playwright --grep @<tag>|@smoke)"
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - content-hub
          - planungsbuero
          - factory
          - admin
          - booking
          - meeting
          - billing
          - messaging
          - fragebogen
          - crm
          - website

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-pr:
    # Static name — the "E2E PR" context must stay stable (referenced by
    # guards and tooling); a dynamic name (with branch) never matches.
    # [T900810] Advisory, kein Required Check (SSOT gh-branch-protection.sh).
    # Nur manuell dispatchbar (kein PR-Trigger) — workflow_dispatch setzt
    # Schreibrechte voraus, der Fork-Guard bleibt als defense-in-depth.
    name: E2E PR
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_URL: https://web.mentolder.de
      TEST_KC_URL: https://auth.mentolder.de
      PROD_DOMAIN: mentolder.de
      SKIP_DB_PURGE: "1"
      E2E_ADMIN_USER: paddione
      E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MEETING_INTERNAL_TOKEN: ${{ secrets.MEETING_INTERNAL_TOKEN }}
      MM_TEST_USER: ${{ secrets.MM_TEST_USER }}
      MM_TEST_PASS: ${{ secrets.MM_TEST_PASS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch origin/main for diffing (shallow)
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main

      - name: Check if E2E-relevant files changed
        id: filter
        run: |
          # Manueller Lauf: immer ausführen (kein PR-Diff als Filter verfügbar).
          echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          echo "Manual dispatch — running tests"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.filter.outputs.run_e2e == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.run_e2e == 'true'
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.filter.outputs.run_e2e == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright system dependencies
        if: steps.filter.outputs.run_e2e == 'true'
        working-directory: tests/e2e
        run: |
          # [T012414] `--with-deps` ruft intern `sudo apt-get`. Auf den
          # self-hosted Runnern ohne passwortloses sudo bricht der Schritt damit
          # ab; die Systembibliotheken sind dort vorprovisioniert. Nachgezogen
          # werden sie nur, wo sudo ohne Passwort verfuegbar ist.
          # [T900601] Laeuft IMMER (auch bei Browser-Cache-Hit): Runner sind
          # ephemer, der Browser-Cache enthaelt keine apt-Libs.
          if sudo -n true 2>/dev/null; then
            npx playwright install-deps chromium
          fi

      - name: Install Playwright browsers (chromium only)
        if: steps.filter.outputs.run_e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install chromium

      - name: Feature-Tag aus Dispatch-Input
        if: steps.filter.outputs.run_e2e == 'true'
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "Input-Tag: $INPUT_TAG"

          TAG="$INPUT_TAG"
          if [ "$TAG" = "smoke" ]; then
            GREP_PATTERN="@smoke"
            echo "Nur @smoke"
          else
            GREP_PATTERN="@${TAG}|@smoke"
            echo "Feature-Tag: @${TAG} → grep: $GREP_PATTERN"
          fi

          echo "grep_pattern=$GREP_PATTERN" >> "$GITHUB_OUTPUT"
          echo "feature_tag=$TAG"          >> "$GITHUB_OUTPUT"

      - name: Detect changed E2E spec files
        # Mirrors the local `task test:changed` smart selection: if the
        # dispatched ref differs from origin/main and a spec file under
        # tests/e2e/specs/ is among the diff, add it to the run as a
        # positional arg (in addition to the tag-grep filter above).
        # Working dir is the repo root, so strip the `tests/e2e/` prefix
        # to match Playwright's --config testDir (./specs). [T001651]
        if: steps.filter.outputs.run_e2e == 'true'
        id: specs
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          CHANGED_SPECS=$(echo "$CHANGED" \
            | grep -E '^tests/e2e/specs/.*\.spec\.ts$' \
            | sed 's|^tests/e2e/||' \
            | paste -sd' ' - \
            || true)
          if [ -n "$CHANGED_SPECS" ]; then
            echo "Changed spec files (will be added to the run):"
            echo "$CHANGED_SPECS" | tr ' ' '\n' | sed 's/^/  /'
          else
            echo "No changed spec files"
          fi
          echo "changed_specs=$CHANGED_SPECS" >> "$GITHUB_OUTPUT"

      - name: E2E gefiltert (${{ steps.tag.outputs.grep_pattern }}) gegen web.mentolder.de
        if: steps.filter.outputs.run_e2e == 'true'
        id: playwright
        working-directory: tests/e2e
        env:
          CHANGED_SPECS: ${{ steps.specs.outputs.changed_specs }}
        run: |
          if [ -n "${CHANGED_SPECS:-}" ]; then
            echo "→ Running tag-grep + changed specs:"
            # Safe iteration over filenames (one per line) to prevent command injection.
            # The `|| true` after each spec's playwright call tolerates "No tests found"
            # for specs whose tests don't carry the grep pattern (e.g. a feature spec
            # touched in a fix/* PR whose only tests are regression-only).
            while IFS= read -r spec; do
              npx playwright test \
                --config playwright.pr.config.ts \
                --grep "${{ steps.tag.outputs.grep_pattern }}" \
                "./$spec" || true
            done <<< "$CHANGED_SPECS"
          else
            npx playwright test \
              --config playwright.pr.config.ts \
              --grep "${{ steps.tag.outputs.grep_pattern }}"
          fi

      - name: Upload Ergebnisse (Traces + JSON)
        if: always() && steps.filter.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-pr-results-${{ github.run_id }}
          path: tests/results
          retention-days: 7
          if-no-files-found: ignore
