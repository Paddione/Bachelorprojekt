name: E2E (Live Production)

# Runs the Playwright suite against both production clusters in parallel.
# Triggered manually or on a nightly cron — not on every PR, since each run
# hits live web.mentolder.de and web.korczewski.de.
#
# Auth-gated specs need MM_TEST_USER / MM_TEST_PASS repo secrets (Keycloak
# credentials of a workspace user). Without them, login flows fall back to
# defaults and the affected tests will fail or skip.
#
# K8 headed-verify (T002467, optional/nicht CI-Gate): tests/e2e/specs/k8-headed-verify.spec.ts
# ist absichtlich NICHT in tests/e2e/playwright.config.ts registriert (kein testMatch, kein
# --project-Treffer) und läuft daher weder in diesem nächtlichen `npx playwright test`-Lauf noch
# in e2e-pr.yml. Diese Stufe ist ausschließlich für den manuellen/agentischen Aufruf über
# `.claude/skills/dev-flow-e2e/SKILL.md` Schritt 8.5 gedacht — kein Merge-Gate, keine
# Workflow-Logik-Änderung hier.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster to test (default: both)"
        required: false
        default: both
        type: choice
        # korczewski ist entfernt, weil der Brand eingefroren ist und in der
        # Job-Matrix unten nicht mehr vorkommt [T002602]. Bliebe die Option
        # stehen, startete eine Auswahl einen Lauf ohne einen einzigen Job —
        # ein stiller Erfolg, der wie ein bestandener Test aussieht.
        options: [both, mentolder]
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC nightly

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  OPENSPEC_TELEMETRY: '0'
jobs:
  playwright:
    name: ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: mentolder
            website_url: https://web.mentolder.de
            prod_domain: mentolder.de
            contact_email: info@mentolder.de
            contact_phone: "+49 151 508 32 601"
            service_pages: /coaching,/beratung
          # [T002602] korczewski deaktiviert, solange der Brand eingefroren ist.
          # Seit 2026-07-23 sind die Flux-Kustomizations ks-korczewski /
          # ks-website-korczewski / ks-jobs-korczewski auf suspend: true (T002479,
          # Commit 9667b24ef, Grund: Kosten/Wartung) und saemtliche Deployments in
          # workspace-korczewski und website-korczewski stehen live auf 0/0.
          # web.korczewski.de hat damit keinen Backend-Pod; Traefik antwortet mit
          # 503 "no available server", woran schon der global-db-cleanup-Setup
          # scheitert. Folge war ein dauerhaft roter nightly-Lauf (0 von 8
          # abgeschlossenen Laeufen gruen) — ein Rot, das nichts ueber die
          # Testsuite aussagt und echte Regressionen bei mentolder ueberdeckt.
          #
          # Beim Aufheben der Suspension in flux/clusters/fleet/ks-korczewski.yaml
          # diesen Block UND die korczewski-Option unter workflow_dispatch.inputs
          # wieder aktivieren.
          # - cluster: korczewski
          #   website_url: https://web.korczewski.de
          #   prod_domain: korczewski.de
          #   contact_email: info@korczewski.de
          #   contact_phone: ""
          #   service_pages: /ki-beratung,/software-dev,/deployment
    env:
      SELECTED_CLUSTER: ${{ inputs.cluster }}
      EVENT_NAME: ${{ github.event_name }}
      MATRIX_CLUSTER: ${{ matrix.cluster }}
    steps:
      - name: Skip if non-matching manual input
        id: gate
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SELECTED_CLUSTER" != "both" ] && [ "$SELECTED_CLUSTER" != "$MATRIX_CLUSTER" ]; then
            echo "Skipping $MATRIX_CLUSTER (manual input selected '$SELECTED_CLUSTER')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright suite against ${{ matrix.website_url }}
        id: playwright
        if: steps.gate.outputs.skip != 'true'
        working-directory: tests/e2e
        env:
          # Primary URLs
          WEBSITE_URL: ${{ matrix.website_url }}
          PROD_DOMAIN: ${{ matrix.prod_domain }}
          # Per-service URL overrides — without these the specs fall back to
          # *.localhost defaults and ECONNREFUSED on the runner.
          TEST_KC_URL: https://auth.${{ matrix.prod_domain }}
          TEST_NC_URL: https://files.${{ matrix.prod_domain }}
          TEST_SIGNALING_URL: https://signaling.${{ matrix.prod_domain }}
          NC_DOMAIN: files.${{ matrix.prod_domain }}
          SIGNALING_DOMAIN: signaling.${{ matrix.prod_domain }}
          VAULT_URL: https://vault.${{ matrix.prod_domain }}
          MAIL_URL: https://mail.${{ matrix.prod_domain }}
          BOARD_URL: https://board.${{ matrix.prod_domain }}
          BRETT_URL: https://brett.${{ matrix.prod_domain }}
          TRACKING_URL: https://tracking.${{ matrix.prod_domain }}
          DASHBOARD_URL: https://dashboard.${{ matrix.prod_domain }}
          # Per-cluster brand assertions
          CONTACT_EMAIL: ${{ matrix.contact_email }}
          CONTACT_PHONE: ${{ matrix.contact_phone }}
          WEBSITE_SERVICE_PAGES: ${{ matrix.service_pages }}
          # Auth
          MM_TEST_USER: ${{ secrets.MM_TEST_USER }}
          MM_TEST_PASS: ${{ secrets.MM_TEST_PASS }}
          # Admin auth for E2E suite (T000480 — was missing, caused 35+ specs to silently skip)
          E2E_ADMIN_USER: paddione
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          # CRON_SECRET aktiviert den Purge-Bracket (globalSetup/-Teardown) und
          # die Marker-Injection der Specs. Ohne das Repo-Secret akkumulierten
          # unmarkierte E2E-Zeilen in der Prod-Inbox (T001453) — daher kein
          # SKIP_DB_PURGE mehr: fehlt das Secret, soll der Run laut scheitern.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLAYWRIGHT_WORKERS: "4"
        run: npx playwright test

      # G-E2E02 / T002096: defense-in-depth post-run purge (covers timeout kill)
      - name: Post-run test-data purge (defense-in-depth)
        working-directory: tests/e2e
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then echo "::warning::CRON_SECRET not set; skipping."; exit 0; fi
          curl -fsS -X POST "${{ matrix.website_url }}/api/admin/systemtest/purge-all-test-data" \
            -H "X-Cron-Secret: ${CRON_SECRET}" || true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Ingest Playwright JSON into the website's test_runs/test_results +
      # auto-file bug tickets for failures (PR #599 wired the endpoint to
      # accept Bearer token auth + X-Github-Run-Id for ticket linkage).
      # Runs on both pass and fail so flake/trend matrices reflect every
      # nightly. Best-effort: never fail the workflow on ingest hiccups.
      - name: Ingest Playwright results into website
        if: always() && steps.playwright.outcome != 'skipped' && steps.gate.outputs.skip != 'true'
        env:
          INGEST_TOKEN: ${{ secrets.E2E_INGEST_TOKEN }}
          INGEST_URL: ${{ matrix.website_url }}/api/admin/tests/ingest-e2e
          REPORT: tests/results/.tmp-e2e-results.json
          GH_RUN_ID: ${{ github.run_id }}
          MATRIX_CLUSTER: ${{ matrix.cluster }}
          # The commit the suite was run FROM. The endpoint compares it against
          # the commit it was BUILT from and refuses to auto-file tickets when
          # they disagree (T002202) — a drifted run cannot attribute failures
          # to the source tree.
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${INGEST_TOKEN}" ]; then
            echo "::error::E2E_INGEST_TOKEN secret missing — results will NOT be ingested. Set it in GitHub repo secrets to enable auto-ticketing."
            echo "::warning::Skipping ingest (missing token)."
            exit 0
          fi
          if [ ! -s "${REPORT}" ]; then
            echo "::error::Playwright JSON report not found at ${REPORT} — check playwright.config.ts JSON reporter outputFile."
            echo "::warning::Skipping ingest (no report at ${REPORT})."
            ls -la "$(dirname "${REPORT}")" 2>/dev/null || echo "(results dir not found)"
            exit 0
          fi
          echo "POST ${INGEST_URL} (run=${GH_RUN_ID}, cluster=${MATRIX_CLUSTER})"
          # Wrap the report so the endpoint sees runId/cluster too. The
          # endpoint accepts a bare report or a wrapped envelope — we use
          # the envelope to pin runId and cluster explicitly.
          jq --arg cluster "${MATRIX_CLUSTER}" \
             --arg runId "gh-${GH_RUN_ID}-${MATRIX_CLUSTER}" \
             --arg testedSha "${TESTED_SHA}" \
             '. + {cluster: $cluster, runId: $runId, testedSha: $testedSha}' \
             "${REPORT}" > /tmp/ingest-payload.json
          http_code=$(curl -s -o /tmp/ingest-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "X-Github-Run-Id: ${GH_RUN_ID}" \
            --data-binary @/tmp/ingest-payload.json \
            "${INGEST_URL}" || echo "000")
          echo "ingest http_code=${http_code}"
          cat /tmp/ingest-response.json || true
          if [ "${http_code}" != "200" ]; then
            echo "::warning::Ingest returned HTTP ${http_code} (continuing — workflow status unaffected)."
          fi

      - name: Upload results (traces + JSON report)
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.cluster }}
          path: tests/results
          retention-days: 14
          if-no-files-found: ignore

  # ── SSO-E2E: OIDC/OTAC-abhängige Specs gegen Fleet (T003163) ──────────
  # Der Matrix-Job oben läuft auf ubuntu-latest OHNE Cluster-Zugriff; dort
  # degradieren brett-mentolder-setup, sa-08 T16 und fa-60 sauber zu fixme.
  # Dieser Job stellt kubectl + Fleet-Kubeconfig bereit (gleiche Pattern wie
  # build-brett.yml), sodass lib/oidc.ts pro Login ein frisches One-Time-
  # Access-Token über die pocket-id-CLI erzeugt — und brett-OIDC-Login,
  # Nextcloud-SSO und der Realtime-WS-Test erstmals in CI echt laufen.
  # Kein POCKET_ID_OTAC_URL-Env: das Token ist single-use und 1h gültig,
  # ein statisches Secret wäre nach Ablauf tot.
  sso-e2e:
    name: SSO-E2E (OIDC-OTAC gegen Fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Prepare Fleet kubeconfig (kubectl + OTAC-CLI-Zugriff)
        id: kube
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
        run: |
          if [ -z "${KUBECONFIG_DATA:-}" ]; then
            echo "::warning::FLEET_KUBECONFIG fehlt — SSO-E2E-Job übersprungen (Specs degradieren im Matrix-Job zu fixme)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Run SSO-E2E specs (brett OIDC-Login, Nextcloud-SSO, Realtime-WS)
        if: steps.kube.outputs.skip != 'true'
        working-directory: tests/e2e
        env:
          WEBSITE_URL: https://web.mentolder.de
          PROD_DOMAIN: mentolder.de
          TEST_KC_URL: https://auth.mentolder.de
          TEST_NC_URL: https://files.mentolder.de
          NC_DOMAIN: files.mentolder.de
          BRETT_URL: https://brett.mentolder.de
          E2E_ADMIN_USER: paddione
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx playwright test specs/sa-08-sso.spec.ts specs/fa-60-realtime-ws.spec.ts --project services --project brett-mentolder

      - name: Upload results (SSO-E2E)
        if: always() && steps.kube.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sso-e2e
          path: tests/results
          retention-days: 14
          if-no-files-found: ignore
