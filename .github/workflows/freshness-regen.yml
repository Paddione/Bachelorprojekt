name: Freshness Auto-Regenerate

on:
  push:
    branches: [main]

concurrency:
  group: freshness-regen-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  regenerate:
    name: Regenerate stale artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh

      - name: Regenerate all artifacts
        run: task freshness:regenerate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # T006998: Rennverlierer-Cleanup. Mergt ein neuerer Regen-Lauf vor einem
      # aelteren, bleibt dessen PR permanent CONFLICTING — Auto-Merge re-bast
      # nicht, und kein Pfad hat ihn je geschlossen (beobachtet: PR #4616, erst
      # 30 min spaeter von Hand geschlossen). Jeder Lauf schliesst deshalb alle
      # offenen chore/freshness-regen-*-PRs anderer Laeufe inkl. Remote-Branch.
      # changed=false heisst: main ist bereits frisch — ALLE offenen Regen-PRs
      # sind dann redundant und werden ebenfalls geschlossen.
      # Race-Freiheit: der concurrency-Guard serialisiert Laeufe auf main, ein
      # juengerer PR kann zum Zeitpunkt dieses Schritts noch nicht existieren;
      # der eigene Branch wird zusaetzlich defensiv uebersprungen.
      - name: Close superseded regen PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OWN_BRANCH: chore/freshness-regen-${{ github.run_id }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            OWN_BRANCH=""
          fi
          while IFS=' ' read -r num head; do
            if [ -n "$OWN_BRANCH" ] && [ "$head" = "$OWN_BRANCH" ]; then
              echo "Skip eigener Branch: $head"
              continue
            fi
            echo "Schliesse ueberholten Regen-PR #$num ($head)"
            gh pr close "$num" \
              --comment "Superseded: geschlossen durch freshness-regen.yml (run ${RUN_ID}). Ein Konflikt-PR heilt nie von selbst — der neueste Regen-Lauf gewinnt (T006998)." \
              || echo "WARNUNG: gh pr close #$num fehlgeschlagen (bereits gemergt?)"
            git push origin --delete "$head" >/dev/null 2>&1 || true
          done < <(gh pr list --state open --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/freshness-regen-")) | "\(.number) \(.headRefName)"')
          exit 0

      # T002889: Der Bot schreibt über einen PR statt direkt auf main. Grund: main
      # trug enforce_admins=false, und dieser Schritt war der produktive Nutzer
      # genau dieses Spalts. Wird die Protection scharfgestellt, ohne dass der Bot
      # vorher auf den PR-Pfad umgestellt ist, brechen die Freshness-Läufe.
      #
      # Die [skip ci]-Logik aus T002158 entfällt hier vollständig: unter Required
      # Status Checks meldet ein übersprungener Lauf nie ein Ergebnis, der PR bliebe
      # unbegrenzt offen. Ihr ursprünglicher Zweck — build-website.yml nicht bei
      # jedem Artefakt-Lauf auszulösen — entfällt mit dem PR-Pfad ohnehin, weil der
      # Push nicht mehr auf main erfolgt.
      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Je Lauf eindeutig — sonst kollidieren zwei Läufe auf demselben Ref.
          BRANCH: chore/freshness-regen-${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: auto-regenerate freshness artifacts"
          git push -u origin "$BRANCH"

          # Conventional-Commit-Titel: "Conventional Commits" gehört zu den Required
          # Checks — ein abweichender Titel würde nie grün und der PR nie mergen.
          cat >/tmp/pr-body.md <<EOF
          Automatisch erzeugt von \`freshness-regen.yml\` (run ${RUN_ID}).

          Regenerierte Freshness-Artefakte, die auf \`main\` veraltet waren.
          Ersetzt den früheren Direkt-Push auf \`main\` (T002889).
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: auto-regenerate freshness artifacts" \
            --body-file /tmp/pr-body.md

          # Ohne Auto-Merge bliebe der PR liegen und der Bot wäre faktisch tot.
          gh pr merge "$BRANCH" --auto --squash --delete-branch
