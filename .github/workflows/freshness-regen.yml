name: Freshness Auto-Regenerate

on:
  push:
    branches: [main]

concurrency:
  group: freshness-regen-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  regenerate:
    name: Regenerate stale artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh

      - name: Regenerate all artifacts
        run: task freshness:regenerate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # T002158: [skip ci] nur wenn KEIN website/**-Artefakt betroffen ist. Dieser
          # Bot-Commit ist der einzige Ort, an dem website/src/lib/sdlc/goals-data.generated.json
          # außerhalb eines PRs fortgeschrieben wird — also der einzige Pfad, der
          # build-website.yml auslösen würde. Ein unbedingtes [skip ci] fror den
          # ausgelieferten /admin/repohealth-Stand ein.
          # Der ^-Anker verhindert Fehlmatches wie docs/website-notes.md.
          if git diff --cached --name-only | grep -q '^website/'; then
            SKIP=""
          else
            SKIP=" [skip ci]"
          fi
          git commit -m "chore: auto-regenerate freshness artifacts${SKIP}"
          git push
