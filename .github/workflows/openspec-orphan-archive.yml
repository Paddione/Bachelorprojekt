name: OpenSpec Orphan Archive

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated list of OpenSpec change slugs to archive"
        required: true
        type: string
  # T900503 — nightly auto-dispatch: detect orphans, feed them to the executor.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: openspec-orphan-archive
  cancel-in-progress: false

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  detect:
    name: Detect orphaned changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual dispatch carries its own slugs — detection only for scheduled runs.
    # event_name (not inputs.slugs) decides: the inputs context is empty on
    # schedule events and null-comparisons against '' are unreliable.
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      slugs: ${{ steps.run.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Run orphan detection
        id: run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          slugs="$(bash scripts/openspec-orphan-detect.sh --min-age-hours 24 | paste -sd, -)"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  archive:
    name: Orphan archive executor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect
    # Skipped detect (manual slugs) must not skip the executor; a failed
    # detect stays visible as a red run instead of archiving blindly.
    if: always() && needs.detect.result != 'failure' && needs.detect.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || needs.detect.outputs.slugs != '')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create CI dummy secrets
        run: bash scripts/ci-dummy-secrets.sh

      - name: Run orphan archive executor
        id: archive
        env:
          SLUGS: "${{ inputs.slugs || needs.detect.outputs.slugs }}"
        run: |
          mkdir -p "$RUNNER_TEMP/orphan"
          bash scripts/openspec-orphan-archive.sh --slugs "$SLUGS" --out "$RUNNER_TEMP/orphan"

      - name: Check for archived changes
        id: check
        if: steps.archive.outcome == 'success'
        env:
          ARCHIVED_FILE: "$RUNNER_TEMP/orphan/archived.txt"
        run: |
          if [ ! -s "$ARCHIVED_FILE" ]; then
            echo "nothing archived"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "archived" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and create PR (success)
        id: pr
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ARCHIVED_FILE: "$RUNNER_TEMP/orphan/archived.txt"
        run: |
          # Validate OpenSpec changes
          if ! task openspec:validate; then
            slugs="$(tr '\n' ',' < "$ARCHIVED_FILE")"
            gh issue create \
              --label openspec-orphan \
              --title "openspec-orphan: validate failed after auto-archive (run ${{ github.run_id }})" \
              --body "Auto-archive of orphaned OpenSpec changes failed OpenSpec validation.

            Archived slugs: $slugs

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

          # Validate passed — regenerate freshness and create PR
          task freshness:regenerate

          # Build commit title with ticket numbers
          TKT_IDS=""
          while IFS= read -r slug; do
            tkt="$(cat "openspec/changes/$slug/.ticket" 2>/dev/null || true)"
            tkt="$(echo "$tkt" | tr -d '[:space:]' | grep -oE 'T[0-9]{6}' || true)"
            if [[ -n "$tkt" ]]; then
              TKT_IDS="$TKT_IDS $tkt"
            fi
          done < "$ARCHIVED_FILE"
          TKT_IDS="${TKT_IDS# }"

          BRANCH="chore/openspec-auto-archive-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add openspec/ docs/spec-atlas.md components/website/src/data/openspec-status.json
          git commit -m "chore(plans): auto-archive orphaned openspec changes [$TKT_IDS]"

          slugs="$(tr '\n' ',' < "$ARCHIVED_FILE")"
          git push -u origin "$BRANCH"

          cat >/tmp/pr-body.md <<EOF
          Auto-archive of orphaned OpenSpec changes (run ${{ github.run_id }}).

          Archived slugs: $slugs
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(plans): auto-archive orphaned openspec changes [$TKT_IDS]" \
            --body-file /tmp/pr-body.md \
            --base main

          gh pr merge "$BRANCH" --auto --squash --delete-branch

  failure:
    name: Create failure issues
    runs-on: ubuntu-latest
    needs: archive
    if: always()
    permissions:
      issues: write
    steps:
      - name: Create label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh label create openspec-orphan --color B60205 --force

      - name: Comment or create issues for failures
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FAILED_FILE: "$RUNNER_TEMP/orphan/failed.tsv"
        run: |
          if [ ! -f "$FAILED_FILE" ] || [ ! -s "$FAILED_FILE" ]; then
            exit 0
          fi
          while IFS=$'\t' read -r slug ticket reason; do
            existing="$(gh issue list --label openspec-orphan --state open \
              --search "${slug} in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" \
                --body "Archive failed: $reason

              Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
              gh issue create \
                --label openspec-orphan \
                --title "openspec-orphan: $slug [$ticket]" \
                --body "Archive failed: $reason

              Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Eine manuelle Archiv-Entscheidung ist erforderlich: \`openspec.sh archive $slug\` mit einem der Flags \`--create-new\`, \`--allow-shrink\`, \`--no-merge\` oder ein korrigiertes Delta."
            fi
          done < "$FAILED_FILE"
