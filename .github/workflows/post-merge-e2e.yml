# .github/workflows/post-merge-e2e.yml
# E2E-Trigger nach verhaltensrelevanten Merges auf main. [T000730, T900810]
#
# T900810: frueher "Factory Post-Merge E2E" — der Scope war ein T######-Ticket-
# kuerzel in der Merge-Message, was praktisch JEDEN Merge traf (bis zu ~14
# E2E-Laeufe/Tag gegen Prod). Die Factory ist abgebaut (T900399); Scope ist
# jetzt der paths-Filter unten: nur Merges, die Prod-Verhalten aendern koennen
# (Service-Code, Images, Manifeste, E2E-Suite selbst), loesen die Suite aus.
# Reine Doku-/Script-/Plan-Merges bleiben still.
#
# COOLDOWN (T002155): verhindert Sekundentakt-E2E-Läufe gegen Produktion bei
# raschen Merges. Prüft vor Dispatch, ob eine e2e.yml-Run innerhalb der
# letzten 15 min auf main gestartet wurde — überspringt den Dispatch, wenn der
# Cooldown noch aktiv ist. Damit feuert die Suite maximal 4×/h statt bei jedem
# Push (beobachtet: bis zu 15 s zwischen Merges).
name: Post-Merge E2E

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'k3d/**'
      - 'docker/**'
      - 'flux/**'
      - 'prod-fleet/**'
      - 'environments/**'
      - '.github/workflows/post-merge-e2e.yml'

concurrency:
  group: post-merge-e2e
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  trigger-e2e:
    name: Trigger E2E on behavior-relevant merge
    runs-on: ubuntu-latest
    permissions:
      actions: write   # gh workflow run + gh run list brauchen write
      contents: read
    steps:
      # T002155: Cooldown — prüft ob in den letzten 15 Minuten bereits eine
      # e2e.yml-Run auf main gestartet wurde. Verhindert Sekundentakt-Dispatch
      # bei rascher Merge-Folge (bis zu 15 s zwischen Merges beobachtet).
      - name: Cooldown — skip if E2E was triggered recently
        id: cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLDOWN_MINUTES: 15
        run: |
          set -euo pipefail

          LAST_RUN="$(gh run list \
            --workflow e2e.yml \
            --branch main \
            --limit 1 \
            --json createdAt \
            --jq '.[0].createdAt' 2>/dev/null || true)"

          if [[ -z "$LAST_RUN" || "$LAST_RUN" == "null" ]]; then
            echo "No previous E2E run found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gh run list returns ISO 8601 (e.g. 2026-07-25T19:57:17Z).
          # GNU date -d parses it correctly on ubuntu-latest.
          LAST_EPOCH="$(date -d "$LAST_RUN" +%s 2>/dev/null)"
          NOW_EPOCH="$(date +%s)"
          DIFF=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))

          if [[ "$DIFF" -lt "$COOLDOWN_MINUTES" ]]; then
            echo "E2E was triggered ${DIFF}m ago (cooldown: ${COOLDOWN_MINUTES}m) — skipping dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "E2E was triggered ${DIFF}m ago (≥${COOLDOWN_MINUTES}m cooldown) — proceeding with dispatch."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger E2E workflow
        if: steps.cooldown.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering e2e.yml for behavior-relevant merge (cluster=both)"
          gh workflow run e2e.yml \
            --ref main \
            --field cluster=both
          echo "E2E workflow dispatched."
