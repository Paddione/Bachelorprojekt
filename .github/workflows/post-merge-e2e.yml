# .github/workflows/post-merge-e2e.yml
# DEAKTIVIERT (Zielbild E2E-Entpflichtung, 2026-10-28, Eigner-Abnahme):
# kein push-Trigger mehr — kein automatischer E2E-Lauf nach Merges.
# Nur noch manueller Start; nightly e2e.yml deckt Regressionen ab.
# Datei bleibt bis zum Ablauf der 14-Tage-Grace-Period (frühestens 2026-11-11,
# mit Beleg dass niemand sie manuell brauchte) bestehen, erst dann löschen.
#
# COOLDOWN (T002155): bleibt für manuelle Dispatches erhalten — überspringt
# den Dispatch, wenn innerhalb der letzten 15 min bereits ein e2e.yml-Lauf
# auf main gestartet wurde.
#
# Historie: früher feuerte dieser Workflow per push-Trigger auf main mit
# Pfadfilter (T900399; davor per Ticket-Kürzel in der Merge-Message, T900810 —
# bis zu ~14 Läufe/Tag gegen Prod).
name: Post-Merge E2E

on:
  workflow_dispatch:

concurrency:
  group: post-merge-e2e
  cancel-in-progress: true

jobs:
  trigger-e2e:
    name: Trigger E2E (manual)
    runs-on: ubuntu-latest
    permissions:
      actions: write   # gh workflow run + gh run list brauchen write
      contents: read
    steps:
      # [T900810] gh braucht Repo-Kontext (ohne Checkout: "not a git repository").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: false

      # T002155: Cooldown — prüft ob in den letzten 15 Minuten bereits eine
      # e2e.yml-Run auf main gestartet wurde. Verhindert Sekundentakt-Dispatch
      # bei rascher Merge-Folge (bis zu 15 s zwischen Merges beobachtet).
      - name: Cooldown — skip if E2E was triggered recently
        id: cooldown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLDOWN_MINUTES: 15
        run: |
          set -euo pipefail

          LAST_RUN="$(gh run list \
            --workflow e2e.yml \
            --branch main \
            --limit 1 \
            --json createdAt \
            --jq '.[0].createdAt' 2>/dev/null || true)"

          if [[ -z "$LAST_RUN" || "$LAST_RUN" == "null" ]]; then
            echo "No previous E2E run found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gh run list returns ISO 8601 (e.g. 2026-07-25T19:57:17Z).
          # GNU date -d parses it correctly on ubuntu-latest.
          LAST_EPOCH="$(date -d "$LAST_RUN" +%s 2>/dev/null)"
          NOW_EPOCH="$(date +%s)"
          DIFF=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))

          if [[ "$DIFF" -lt "$COOLDOWN_MINUTES" ]]; then
            echo "E2E was triggered ${DIFF}m ago (cooldown: ${COOLDOWN_MINUTES}m) — skipping dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "E2E was triggered ${DIFF}m ago (≥${COOLDOWN_MINUTES}m cooldown) — proceeding with dispatch."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger E2E workflow
        if: steps.cooldown.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering e2e.yml for behavior-relevant merge (cluster=both)"
          gh workflow run e2e.yml \
            --ref main \
            --field cluster=both
          echo "E2E workflow dispatched."
