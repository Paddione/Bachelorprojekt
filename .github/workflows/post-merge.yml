name: post-merge
on:
  push:
    branches: [main]

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ENTFERNT mit E3/T002626 (ADR-006): die Jobs "mark-awaiting" und
  # "reap-branches".
  #
  # mark-awaiting setzte den Status awaiting_deploy — der ist seit T001092
  # ohnehin aus dem Happy-Path genommen (Closure trackt den Merge, nicht
  # Prod-Live). reap-branches las den Ticket-Status, um zu entscheiden, ob ein
  # Branch geraeumt werden darf.
  #
  # Beide brauchten Zugriff auf die Ticket-Datenbank, die seit E3 auf dem
  # Dev-Host liegt. Ersatz: der Branch-Reaper laeuft lokal ueber
  # scripts/branch-reaper.sh (Skill repo-hygiene), die Closure ueber den
  # lokalen GitHub-Poller. [T900399] Auch dieser Ersatz ist mit dem
  # Factory-Abau entfallen — es gibt keinen automatischen Poller mehr; die
  # Ticket-Zuordnung nach dem Merge wird lokal ueber
  # scripts/agent-lock.sh check-merged aufgeloest.
  detect:
    name: Detect manifest changes
    runs-on: ubuntu-latest
    outputs:
      manifests_changed: ${{ steps.detect.outputs.manifests_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          fetch-tags: false
      - id: detect
        run: |
          if bash scripts/changed-manifests.sh HEAD~1 HEAD; then
            echo "manifests_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifests_changed=false" >> "$GITHUB_OUTPUT"
          fi

  render-artifact:
    name: Render fleet artifact (GitOps)
    needs: [detect]
    if: vars.FLUX_ENABLED == 'true' && needs.detect.outputs.manifests_changed == 'true'
    # render-fleet-artifact.yml verlangt packages: write (docker/login-action →
    # ghcr). Ein via `uses:` aufgerufener Workflow darf nie mehr Rechte
    # anfordern als der Aufrufer — sonst lehnt GitHub den GESAMTEN Workflow mit
    # startup_failure ab, bevor auch nur ein Job startet. Diese Validierung
    # laeuft VOR der if:-Auswertung, der Job muss dafuer also nicht einmal
    # ausgefuehrt werden. Genau das passierte 37 Merges lang (T002118).
    # Das Recht bleibt bewusst auf diesen Job begrenzt statt workflowweit.
    # id-token: write (cosign keyless, T007035): render-fleet-artifact.yml
    # signiert das OCI-Artefakt — der Aufrufer muss das Callee-Recht decken.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/render-fleet-artifact.yml
    secrets: inherit

  # [T900810] deploy-legacy entfernt: pre-Flux kubectl-Pfad (workspace:deploy),
  # tot seit FLUX_ENABLED=true Steady State. post-deploy-imperative haengt nur
  # noch am Flux-Render — Erfolg heisst dort Manifest-Merge, Skip alles andere.
  post-deploy-imperative:
    name: Imperative post-steps (TRANSITIONAL)
    runs-on: ubuntu-latest
    needs: [render-artifact]
    if: always() && needs.render-artifact.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-tags: false }
      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # `task website:migrate` ruft intern `pnpm --dir components/website db:migrate` auf.
      # Ohne diese drei Schritte stirbt der Job mit
      # '"pnpm": executable file not found in $PATH' (exit 127) — und riss
      # damit auch "Mark ticket done" mit, das im selben Job liegt. [T002121]
      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v5.4.0
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: components/website/pnpm-lock.yaml
      - name: Install website dependencies
        run: cd components/website && pnpm install --frozen-lockfile
      - name: Set up kubeconfig
        env:
          FLEET_KUBECONFIG: ${{ secrets.FLEET_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$FLEET_KUBECONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      - name: Run transitional imperative post-steps
        # [T900810] Nur mentolder: korczewski ist eingefroren (T002479), die
        # Migration lief trotzdem bei jedem Manifest-Merge auch dorthin.
        run: |
          task website:migrate ENV=mentolder

      # ENTFERNT mit E3/T002626 (ADR-006): "Mark ticket done" und
      # "Ticket closure scan".
      # Beide schrieben mit TICKET_CTX=fleet in die Ticket-Datenbank. Seit E3
      # liegt sie auf dem Dev-Host, den GitHub nicht erreichen kann.
      # Ersatz (damals): der lokale GitHub-Poller holte gemergte PRs aktiv
      # ab und schloss die Tickets lokal (Aufgabe "merges", delegiert an
      # auto-close-merged.sh), als systemd-User-Timer.
      # [T900399] Auch dieser Ersatz ist mit dem Factory-Abau entfallen.
      # ENTFERNT mit E3/T002626 (ADR-006): "Scout drift ratchet".
      # Die Messung schrieb in tickets.tickets. Seit dem Umzug der SDLC-Daten auf
      # den Dev-Host erreicht CI diese Datenbank nicht mehr. Die Drift-Messung
      # entfaellt damit vorerst ersatzlos — sie laesst sich nachtraeglich aus dem
      # Merge-Diff rekonstruieren, aber das ist nicht Teil dieser Etappe.