# .github/workflows/quality-loop.yml
# Nightly quality loop: enqueue ≤MAX_NEW CQ-GATE Factory tickets per
# (Gate × Subsystem) group that has open baseline violations.
# Runs at 02:00 UTC (after dev-db-refresh at 03:30 UTC is not a conflict —
# we hit fleet, not dev). Fires on workflow_dispatch for manual re-runs.
name: quality-loop

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (1 = preview only, no tickets created)"
        required: false
        default: "0"
      max_new:
        description: "MAX_NEW tickets per run (default: 2)"
        required: false
        default: "2"

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  quality-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install root npm deps
        run: npm ci

      - name: Set up kubectl + fleet kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.FLEET_KUBECONFIG }}
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl && chmod +x /usr/local/bin/kubectl
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: "Guard: kubeconfig context must be fleet"
        run: |
          ctx="$(kubectl config current-context)"
          if [[ "$ctx" != "fleet" ]]; then
            echo "ERROR: expected context 'fleet', got '${ctx}'"
            exit 1
          fi

      - uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── BATS unit tests for loop.sh (retry on flaky tempdir/fd races) ──────────
      - name: Quality-loop BATS unit tests
        env:
          BATS_RETRY_DELAY: 10
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "--- BATS attempt ${ATTEMPT}/${MAX_ATTEMPTS} ---"
            if task test:unit:quality-loop 2>&1; then
              echo "✅ BATS unit tests passed (attempt ${ATTEMPT})"
              exit 0
            fi
            if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
              echo "❌ BATS unit tests failed after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            echo "⚠ BATS failed (attempt ${ATTEMPT}), retrying in ${BATS_RETRY_DELAY}s..."
            sleep "${BATS_RETRY_DELAY}"
          done

      - name: Run quality loop
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MAX_NEW: ${{ github.event.inputs.max_new || '2' }}
        run: task quality:loop
