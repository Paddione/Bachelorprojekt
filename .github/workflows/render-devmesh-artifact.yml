name: Render Devmesh Artifact

on:
  push:
    branches: [main]
    paths:
      - 'dev-local/**'
      - 'k3d/**'
      - 'environments/dev.yaml'
      - 'environments/sealed-secrets/dev.yaml'
      - 'devmesh/**'
      - 'scripts/devmesh/**'
      - 'flux/clusters/devmesh/**'
      - '.github/workflows/render-devmesh-artifact.yml'
  workflow_dispatch:

concurrency:
  group: render-devmesh-artifact
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  render-push-devmesh:
    name: Render, push, and sign devmesh OCI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - name: Install tools (kustomize, yq, flux CLI, cosign)
        run: |
          set -euo pipefail
          rm -f /usr/local/bin/kustomize
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.3 /usr/local/bin
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          curl -sSL https://fluxcd.io/install.sh | sudo bash
          COSIGN_VERSION=3.1.3
          COSIGN_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          curl -sSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Provide CI dummy secrets for render
        run: bash scripts/ci-dummy-secrets.sh

      - name: Render devmesh stack
        run: bash scripts/devmesh/render-stack.sh core --out ./out

      - name: Render-Gate (no mentolder.de or fleet-manifests)
        run: |
          set -euo pipefail
          if grep -rnE 'mentolder\.de|fleet-manifests' out/; then
            echo "ERROR: Forbidden mentolder.de or fleet-manifests reference found in out/" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI artifact
        id: push-artifact
        run: |
          set -euo pipefail
          OUT="$(flux push artifact \
            oci://ghcr.io/paddione/devmesh-manifests:latest \
            --path=./out \
            --source="$(git config --get remote.origin.url)" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json)"
          echo "$OUT"
          echo "digest=$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')" >> "$GITHUB_OUTPUT"
          flux tag artifact \
            oci://ghcr.io/paddione/devmesh-manifests:latest \
            --tag "sha-${GITHUB_SHA}"

      - name: Sign OCI artifact (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/paddione/devmesh-manifests@${{ steps.push-artifact.outputs.digest }}"
