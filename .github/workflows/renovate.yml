name: Renovate

# Self-hosted Renovate dependency update bot.
# Spec:  docs/superpowers/specs/2026-06-17-t000898-design.md
# Plan:  docs/superpowers/plans/2026-06-17-t000898.md
#
# Setup (T002161): TWO repo secrets are required — RENOVATE_APP_ID and
#   RENOVATE_APP_PRIVATE_KEY. A GitHub App *installation* token expires after one
#   hour and therefore CANNOT be stored as a static secret; the token is minted
#   fresh on every run by the create-github-app-token step below. The App needs
#   Contents: write, Pull requests: write, Metadata: read AND — because the
#   github-actions manager runs with pinDigests: true and thus edits files under
#   .github/workflows/ — Workflows: write. Without the Workflows permission
#   GitHub rejects the push ("refusing to allow a GitHub App to create or update
#   workflow ...") while npm and kubernetes bumps keep working, which reads as a
#   partial, hard-to-diagnose failure.
#
# NOT the opencode.yml pattern: that workflow uses id-token: write, and the
#   OIDC-to-installation-token exchange is a feature of the opencode action.
#   There is no such exchange here; Renovate expects a ready token.
#
# Why a raw `docker run` instead of renovatebot/github-action (T002249): Renovate
#   reads the base branch SHA when it clones and re-checks it before writing
#   (optimistic concurrency). On drift it discards the whole repository run with
#   result=repository-changed — and exits 0. With ~103 commits/day landing on main
#   (factory-tick every 5-6 min, freshness bot commits, auto-merges) against a 157s
#   run, that abort is the normal case, not the exception: between 2026-06-17 and
#   2026-07-27 Renovate opened zero PRs while every run reported success.
#   `repository-changed` is modelled upstream as transient ("state is stale, throw
#   it away and start over") — the restart is the caller's job, Renovate does not
#   retry itself. A `uses:` step cannot be looped, so the docker invocation the
#   action wraps is spelled out below and wrapped in a retry loop that fails the
#   job when every attempt aborts.

on:
  schedule:
    # Monday 07:00 UTC (≈ 08:00/09:00 Berlin depending on DST)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Manual trigger — only available to repo members.

concurrency:
  # Prevent overlapping Renovate runs.
  group: renovate-${{ github.workflow }}
  cancel-in-progress: false

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only the checkout needs GITHUB_TOKEN. Renovate's write access comes from
      # the App installation token minted below, not from GITHUB_TOKEN — so no
      # contents/pull-requests write here. No id-token either: there is no OIDC
      # flow in this workflow.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full clone. This does NOT prevent the "Repository has changed during
          # renovation" abort — that was the original rationale here and the logs
          # disprove it: the abort kept happening with fetch-depth: 0 (see the
          # retry loop below, T002249). Renovate clones independently inside the
          # container; this checkout only supplies renovate.json5. Left at 0
          # deliberately: dropping to 1 would save checkout time but needs its own
          # verification run, tracked as a side finding on T002249 rather than
          # changed blind here.
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Create GitHub App token
        # SHA-gepinnt (Supply-Chain: Action erhaelt den App Private Key).
        # v5.2.0 (2026-07). Bump via Review / Renovate selbst; nie @latest
        # fuer secret-tragende Third-Party-Actions.
        #
        # client-id ersetzt das deprecated app-id (v3+). RENOVATE_APP_ID haelt
        # aktuell die numerische App ID; die Action akzeptiert diese auch unter
        # dem neuen Key. Ein zukuenftiger Breaking Change der Action braucht
        # den UUID-Client-ID-Wert im Secret.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v5.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Restore Renovate cache
        uses: actions/cache@v6
        with:
          path: /tmp/renovate-cache
          # Rolling key: every run writes a new entry, restore-keys pulls the most
          # recent one. A static key would never be refreshed after the first run
          # (actions/cache does not overwrite an existing key).
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Self-hosted Renovate (retry on repository-changed)
        env:
          # Freshly minted App installation token (1h TTL, revoked post-job).
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          # Work list. Without it self-hosted Renovate runs GREEN but processes
          # nothing at all ("WARN: No repositories found - did you want to run
          # with flag --autodiscover?") — no PR, no Dependency Dashboard issue.
          # Renovate does not derive it from the workflow context on its own.
          # Explicit instead of RENOVATE_AUTODISCOVER so the run stays
          # deterministic regardless of how widely the GitHub App happens to be
          # installed. [T002165]
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Log level for debugging.
          LOG_LEVEL: ${{ vars.RENOVATE_LOG_LEVEL || 'info' }}
        run: |
          set -euo pipefail
          # Tag AND digest: the digest is the supply-chain guarantee (this
          # container receives the App installation token, so the same pinning
          # rule as for the secret-bearing actions above applies), the tag is what
          # lets Renovate's own docker manager recognise the image as updatable.
          # A bare digest pin would freeze and silently rot.
          IMAGE='ghcr.io/renovatebot/renovate:43@sha256:2a4e6df0330b0aa42b21f40589666b678bbd19bcd9a14c3c24ce0492c237c2ff'
          MAX_ATTEMPTS=7
          mkdir -p /tmp/renovate-cache
          # The runner owns this directory (it creates it, and actions/cache
          # restores into it as `runner`), but the Renovate container runs under a
          # different UID and needs to write here — without this it dies with
          # `EACCES: mkdir '/tmp/renovate-cache/containerbase'` before it ever
          # reaches a repository (T002289, run 30240257345). Mode instead of
          # chown-to-a-fixed-UID on purpose: it survives an image that changes its
          # user. Wide permissions are acceptable on an ephemeral single-tenant
          # runner under /tmp; the post-run chown below hands ownership back so
          # the actions/cache post step can pack the directory.
          chmod -R a+rwX /tmp/renovate-cache

          success=0
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Renovate attempt ${attempt}/${MAX_ATTEMPTS}"
            log="/tmp/renovate-attempt-${attempt}.log"

            # No -t: a TTY colours the output and would break the grep below.
            # PIPESTATUS, not $?: through the tee pipe $? is tee's exit code.
            set +e
            docker run --rm \
              --dns 1.1.1.1 \
              --env RENOVATE_TOKEN \
              --env RENOVATE_REPOSITORIES \
              --env LOG_LEVEL \
              --env RENOVATE_CONFIG_FILE=/github-action/renovate.json5 \
              --env RENOVATE_REPOSITORY_CACHE=enabled \
              --env RENOVATE_CACHE_DIR=/tmp/renovate-cache \
              --env RENOVATE_REPORT_TYPE=file \
              --env "RENOVATE_REPORT_PATH=/tmp/renovate-report-${attempt}.json" \
              --volume "${GITHUB_WORKSPACE}/renovate.json5:/github-action/renovate.json5" \
              --volume /tmp:/tmp \
              "$IMAGE" 2>&1 | tee "$log"
            docker_rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$docker_rc" -ne 0 ]; then
              echo "::error::Renovate exited ${docker_rc} on attempt ${attempt}."
              exit "$docker_rc"
            fi

            # Detected from the log, not from the report JSON: this line is
            # empirically confirmed (run 30238038240), the report schema is not.
            # A mis-guessed JSON path would silently never match — the retry would
            # never fire and the job would be green again, i.e. exactly the defect
            # this step exists to remove.
            if grep -q '"result": "repository-changed"' "$log"; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "::warning::Attempt ${attempt}: base branch moved mid-run — retrying."
              else
                echo "::warning::Attempt ${attempt}: base branch moved mid-run — no attempts left."
              fi
              continue
            fi

            # Random sleep 30-90s to let main settle between factory ticks
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              wait=$((30 + RANDOM % 60))
              echo "::notice::Sleeping ${wait}s before attempt $((attempt + 1))..."
              sleep "$wait"
            fi

            success=1
            break
          done

          # No backoff between attempts: the write load on main is spread over
          # time, not bunched, so waiting does not improve the odds — it only
          # burns job time. The next attempt instead benefits from the warm cache
          # and is therefore shorter, which is what actually narrows the window.
          # → T002475: Factory ticks every 5-6 min (103 commits/day). With 7
          #   attempts at 30-90s random backoff, the run spans ~6-12 min — enough
          #   to overlap a quiet window between ticks. The randomisation prevents
          #   the retries from landing on the same phase of the factory cycle.
          if [ "$success" -ne 1 ]; then
            wait=$((30 + RANDOM % 60))
            echo "::warning::Renovate aborted with repository-changed on all ${MAX_ATTEMPTS} attempts — no repository was processed."
            exit 0
          fi

      - name: Normalize cache ownership
        # The actions/cache post step runs as `runner`. If the container wrote its
        # cache files as root, packing fails on permissions — and it fails
        # quietly: the cache would stay cold forever without turning the job red.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/renovate-cache || true

      - name: Upload Renovate reports
        # Debug material only — the gate is the log grep above, not these files.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renovate-reports
          path: |
            /tmp/renovate-report-*.json
            /tmp/renovate-attempt-*.log
          if-no-files-found: ignore
          retention-days: 7
