# Taskfile.finetune.yml
# ─────────────────────────────────────────────────────────────────────────────
# LLM-Finetuning-Pipeline (Unsloth/TRL). Included from Taskfile.yml under the
# "finetune" namespace [T002587].
#
# Reihenfolge: measure -> guard -> train -> export. traces ist ein optionaler
# Korpus-Beschaffungsschritt vor measure. Details: scripts/finetune/README.md.
#
# Eigene Datei statt Anhaengen an eine bestehende Taskfile (siehe Taskfile.llm.yml
# fuer den Grund: Parallelarbeit soll nicht am selben Dateiende kollidieren).
# ─────────────────────────────────────────────────────────────────────────────
version: "3"

tasks:

  measure:
    desc: "Token-Laengenverteilung + VRAM-Machbarkeitsmatrix. CORPUS=<jsonl> MODEL=<label> [TEMPLATE_FILE=<jinja>]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ]'
        msg: "CORPUS=<jsonl> und MODEL=<label> sind erforderlich."
    cmds:
      - |
        python3 scripts/finetune/measure_corpus.py \
          --corpus "{{.CORPUS}}" --model "{{.MODEL}}" \
          {{if .TEMPLATE_FILE}}--template-file "{{.TEMPLATE_FILE}}"{{end}} \
          {{if .OUT}}--out "{{.OUT}}"{{end}}

  guard:
    desc: "Byte-Gleichheit Hub- vs. gepatchtes Chat-Template. HUB_TEMPLATE=<datei> PATCHED_TEMPLATE=<datei> CORPUS=<jsonl>"
    preconditions:
      - sh: '[ -n "{{.HUB_TEMPLATE}}" ] && [ -n "{{.PATCHED_TEMPLATE}}" ] && [ -n "{{.CORPUS}}" ]'
        msg: "HUB_TEMPLATE=, PATCHED_TEMPLATE= und CORPUS= sind erforderlich."
    cmds:
      - |
        python3 scripts/finetune/template_guard.py \
          --hub-template "{{.HUB_TEMPLATE}}" \
          --patched-template "{{.PATCHED_TEMPLATE}}" \
          --corpus "{{.CORPUS}}"

  train:
    desc: "Trainingslauf starten. CORPUS=<jsonl> MODEL=<hf-id> MEASURE_REPORT=<json> [CONFIG=<json>] [DRY_RUN=1] GPU_LOCK_REQUIRED_MIB=<mib>"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ] && [ -n "{{.MEASURE_REPORT}}" ]'
        msg: "CORPUS=, MODEL= und MEASURE_REPORT= sind erforderlich (MEASURE_REPORT aus 'task finetune:measure')."
    cmds:
      - |
        # T002628 GPU-Arbitrierung: Trainings-Vorrang. acquire drainiert die lokalen
        # Backends (Auslaufen abwarten, chat-gpu-Loadouts stoppen) und misst das freie
        # VRAM. Der Lock wird per trap freigegeben — auch wenn train.py abbricht.
        # Nach der Freigabe werden die gestoppten Loadouts wieder gestartet.
        LOCK_SCRIPT="scripts/gpu-lock.sh"
        STOPPED=""
        trap 'T=$?; if [ -f "${GPU_LOCK_FILE:-/tmp/gpu-training-lock.json}" ]; then bash "$LOCK_SCRIPT" release >&2 || true; fi; for slug in $STOPPED; do curl -sf -X POST "http://127.0.0.1:18235/admin/loadouts/${slug}/start" >/dev/null 2>&1 || true; done; exit $T' EXIT

        if [ -n "${GPU_LOCK_REQUIRED_MIB:-}" ]; then
          bash "$LOCK_SCRIPT" acquire
          STOPPED=$(python3 -c 'import json; d=json.load(open("scripts/llm/loadouts.json")); print(" ".join(l["slug"] for l in d.get("loadouts", []) if l.get("exclusiveGroup")=="chat-gpu" and l.get("managed")!="external"))')
        else
          echo "[finetune] GPU_LOCK_REQUIRED_MIB nicht gesetzt — Training ohne GPU-Arbitrierung."
        fi

        python3 scripts/finetune/train.py \
          --corpus "{{.CORPUS}}" --model "{{.MODEL}}" --measure-report "{{.MEASURE_REPORT}}" \
          {{if .CONFIG}}--config "{{.CONFIG}}"{{end}} \
          {{if .DRY_RUN}}--dry-run{{end}}

  traces:
    desc: "Erfolgreiche Factory-Laeufe zu Trainingskorpus rendern. FIXTURE=<json>|ROWS_JSON=<json> OUT=<jsonl>"
    preconditions:
      - sh: '[ -n "{{.OUT}}" ]'
        msg: "OUT=<jsonl> ist erforderlich."
      - sh: '[ -n "{{.FIXTURE}}" ] || [ -n "{{.ROWS_JSON}}" ]'
        msg: "FIXTURE=<json> (Tests) oder ROWS_JSON=<json> (mcp-postgres-Ergebnis) ist erforderlich."
    cmds:
      - |
        python3 scripts/finetune/collect_factory_traces.py \
          {{if .FIXTURE}}--fixture "{{.FIXTURE}}"{{end}} \
          {{if .ROWS_JSON}}--rows-json "{{.ROWS_JSON}}"{{end}} \
          --out "{{.OUT}}"

  export:
    desc: "GGUF-Export mit Template-Korrektur. ADAPTER_DIR=<dir> SLOT_NAME=<name> [HUB_TEMPLATE=<datei>] [DRY_RUN=1]"
    preconditions:
      - sh: '[ -n "{{.SLOT_NAME}}" ]'
        msg: "SLOT_NAME=<name> ist erforderlich."
    cmds:
      - |
        python3 scripts/finetune/export_gguf.py \
          {{if .ADAPTER_DIR}}--adapter-dir "{{.ADAPTER_DIR}}"{{end}} \
          --slot-name "{{.SLOT_NAME}}" \
          {{if .HUB_TEMPLATE}}--hub-template "{{.HUB_TEMPLATE}}"{{end}} \
          {{if .DRY_RUN}}--dry-run{{end}}
