# Taskfile.llm.yml
# ─────────────────────────────────────────────────────────────────────────────
# Local-first LLM pipeline operations.
# Included from Taskfile.yml under the "llm" namespace.
#
# Drei llama.cpp-Server auf dem Windows GPU-Host (via wg-gpu):
#   - Bonsai (Port 8093): Factory-Orchestrator, 4 Slots
#   - Embed (Port 8095): bge-m3, Text-Embeddings
#   - Rerank (Port 8096): bge-reranker-v2-m3, Text-Reranking
#
# `llm:deploy` applies `k3d/llm-gpu.yaml` (gateway Services+Endpoints).
# `llm:status` and `llm:test` query those Services via debug-pod curls.
# ─────────────────────────────────────────────────────────────────────────────
version: "3"

tasks:

  bootstrap-host:
    desc: "Bootstrap the GPU host (ufw, wg-mesh reachability). HOST=<wg-mesh-ip>"
    preconditions:
      - sh: '[ -n "{{.HOST}}" ]'
        msg: "HOST=<wg-mesh-ip> is required."
    cmds:
      - scripts/llm-host-setup.sh {{.HOST}}

  deploy:
    desc: "Apply llm-gateway Services + Endpoints (embed + rerank) to ENV={{.ENV}}"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        : "${LLM_HOST_IP:?LLM_HOST_IP unset — configure in environments/{{.ENV}}.yaml}"
        envsubst '$LLM_HOST_IP' < k3d/llm-gpu.yaml \
          | kubectl --context "$ENV_CONTEXT" -n "${WORKSPACE_NAMESPACE:-workspace}" apply -f -
        echo "✓ llm-gateway-embed + llm-gateway-rerank applied (ENV={{.ENV}})"

  status:
    desc: "Show LLM pipeline status (gateway endpoints, GPU host reachability). ENV=<env>"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        set -e
        source scripts/env-resolve.sh "{{.ENV}}"
        ns="${WORKSPACE_NAMESPACE:-workspace}"
        echo "── llm-gateway endpoints ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" get endpoints llm-gateway-embed llm-gateway-rerank
        echo "── llm-gateway-embed health (llama.cpp bge-m3) ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-embed.${ns}.svc.cluster.local:8095/v1/embeddings" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-m3","input":"test"}' | jq '.data[0].embedding | length' || true
        echo "── llm-gateway-rerank health (llama.cpp bge-reranker) ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-rerank.${ns}.svc.cluster.local:8096/v1/rerank" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-reranker-v2-m3","query":"test","documents":["doc1","doc2"]}' \
            | jq '.results | length' || true

  test:
    desc: "Smoke-test the gateway Services directly (embed + rerank). ENV=<env>"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        set -e
        source scripts/env-resolve.sh "{{.ENV}}"
        ns="${WORKSPACE_NAMESPACE:-workspace}"
        echo "── bge-m3 embed via llm-gateway-embed ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-embed.${ns}.svc.cluster.local:8095/v1/embeddings" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-m3","input":"hallo welt"}' | jq '.data[0].embedding | length'
        echo "── bge-reranker via llm-gateway-rerank ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-rerank.${ns}.svc.cluster.local:8096/v1/rerank" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-reranker-v2-m3","query":"capital of germany","documents":["paris","berlin","hamburg"]}' \
            | jq '.results | sort_by(-.relevance_score) | .[0].index'

  proxy:start:
    desc: "Start the local LLM proxy (scripts/llm-proxy, Port 18235) detached with PID/log file"
    cmds:
      # go-task's embedded shell (mvdan.cc/sh) doesn't populate $! with a real
      # OS PID for backgrounded processes (returns a synthetic job id like
      # "g1") - the idempotency check below silently never worked. Running
      # under a real `bash -c` fixes $! (verified: plain bash gives the actual PID).
      - |
        bash -c '
          set -e
          DIR="$HOME/.local/state/llm-proxy"; mkdir -p "$DIR"
          PIDF="$DIR/proxy.pid"; LOGF="$DIR/proxy.log"
          PORT="${LLM_PROXY_PORT:-18235}"
          if [ -f "$PIDF" ] && kill -0 "$(cat "$PIDF")" 2>/dev/null; then
            echo "llm-proxy already running (pid $(cat "$PIDF"))"; exit 0
          fi
          # T002277: das PID-File kennt nur die nohup-Instanz. Laeuft der Proxy als
          # systemd-Unit (task llm:proxy:install-service), ist der Port belegt, aber
          # kein PID-File da - der Start unten wuerde mit EADDRINUSE sterben und ein
          # PID-File hinterlassen, das auf einen toten Prozess zeigt. Der Port ist
          # die verlaessliche Auskunft, nicht das PID-File.
          # /livez, NICHT /health (T002336): hier geht es um Port-Belegung, nicht
          # um Bedienbarkeit. /health antwortet 503, sobald ein Prio-1-Backend
          # fehlt - mit `curl -fsS` sieht das aus wie "niemand da", und der Start
          # unten liefe in genau das EADDRINUSE, das dieser Block verhindern soll.
          if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1; then
            echo "llm-proxy already answering on :$PORT (systemd unit? -> systemctl --user status llm-proxy)"
            exit 0
          fi
          nohup node scripts/llm-proxy/server.mjs >> "$LOGF" 2>&1 &
          echo $! > "$PIDF"
          echo "✓ llm-proxy started (pid $(cat "$PIDF"), log $LOGF)"
        '

  proxy:stop:
    desc: "Stop the local LLM proxy via PID file"
    cmds:
      - |
        PIDF="$HOME/.local/state/llm-proxy/proxy.pid"
        [ -f "$PIDF" ] && kill "$(cat "$PIDF")" 2>/dev/null && rm -f "$PIDF" && echo "✓ stopped" || echo "not running"

  proxy:status:
    desc: "Show LLM proxy health + discovered backends/models"
    cmds:
      - |
        PORT="${LLM_PROXY_PORT:-18235}"
        # Erreichbarkeit via /livez (T002336) - sonst meldet der Status "offline",
        # waehrend der Proxy laeuft und nur ein Backend fehlt. /health kommt danach
        # als eigene Zeile dazu: sie ist die interessante Auskunft, wenn er lebt.
        if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1; then
          curl -sS "http://127.0.0.1:$PORT/health" | jq '{ready, degraded}'
          curl -fsS "http://127.0.0.1:$PORT/admin/state" | jq .
        else
          echo "llm-proxy offline — Start: task llm:proxy:start"
        fi

  proxy:logs:
    desc: "Tail the local LLM proxy log"
    cmds:
      - tail -n 100 -f "$HOME/.local/state/llm-proxy/proxy.log"

  # ── llm-proxy als systemd USER service (T002277) ────────────────────────
  # Gleiche Form wie agents:factory-mcp:install. Der Windows-Startup-Ordner
  # (scripts/llm/install-startup-autostart.ps1) startet nur die llama.cpp-Server
  # auf der Windows-Seite; der Proxy ist ein WSL-Node-Prozess und gehoert hierher.
  proxy:install-service:
    desc: "Install the LLM proxy as a persistent systemd USER service (autostart + Restart=always)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! systemctl --user show-environment >/dev/null 2>&1; then
          echo "No systemd --user manager on this host (WSL without lingering?)."
          echo "Enable it: 'loginctl enable-linger $USER' then re-run. Falling back: task llm:proxy:start."
          exit 1
        fi
        PORT="${LLM_PROXY_PORT:-18235}"
        # Manuell gestartete nohup-Instanz beenden, damit der Port fuer systemd frei ist.
        PIDF="$HOME/.local/state/llm-proxy/proxy.pid"
        if [[ -f "$PIDF" ]] && kill -0 "$(cat "$PIDF")" 2>/dev/null; then
          kill "$(cat "$PIDF")" && rm -f "$PIDF"
          echo "stopped manually started instance (pid file)"
        fi
        # T002281: das PID-File allein reicht NICHT. Am 2026-07-27 lief die Altinstanz
        # mit PID 280029 weiter, obwohl PID-File und 'kill -0' gueltig waren - der Block
        # oben griff nicht, und die frisch installierte Unit fiel in eine
        # EADDRINUSE-Restart-Schleife. Der Port ist die verlaessliche Auskunft.
        for _ in 1 2 3; do
          # /livez, NICHT /health (T002336): die Schleife fragt "ist der Port noch
          # belegt". Mit /health wuerde ein 503 (totes Prio-1-Backend) als "frei"
          # gelesen, die Schleife braeche sofort ab - und die Altinstanz ueberlebte.
          # Das ist exakt der T002281-Fall, den dieser Block behebt.
          curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1 || break
          OWNER="$(ss -lptnH "sport = :$PORT" 2>/dev/null | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)"
          [[ -z "$OWNER" ]] && { echo "Port $PORT belegt, Besitzer nicht ermittelbar — abbrechen." >&2; exit 1; }
          echo "Port $PORT noch belegt von PID $OWNER — beende ihn."
          kill "$OWNER" 2>/dev/null || true
          sleep 2
        done
        UNIT_DIR="${HOME}/.config/systemd/user"
        mkdir -p "${UNIT_DIR}"
        ln -sf "$(pwd)/scripts/llm-proxy/llm-proxy.service" "${UNIT_DIR}/llm-proxy.service"
        systemctl --user daemon-reload
        systemctl --user enable --now llm-proxy.service
        # T002281: 'enable --now' kehrt erfolgreich zurueck, waehrend die Unit in
        # auto-restart haengt - 'is-active' meldet dann 'activating', was wie ein langsamer
        # Start aussieht. Erfolgsmeldung ohne Pruefung ist dieselbe Klasse, die T002276 bei
        # schtasks gefunden hat. Also den Endzustand abwarten und belegen.
        for _ in $(seq 1 15); do
          STATE="$(systemctl --user show llm-proxy.service -p SubState --value 2>/dev/null || echo unknown)"
          [[ "$STATE" == "running" ]] && break
          sleep 2
        done
        if [[ "$(systemctl --user is-active llm-proxy.service 2>/dev/null)" != "active" ]]; then
          echo "llm-proxy: Unit erreicht 'active' nicht (SubState=$STATE). Journal:" >&2
          journalctl --user -u llm-proxy.service -n 15 --no-pager >&2 || true
          exit 1
        fi
        echo "llm-proxy installed as systemd --user service (active/running, autostart + Restart=always)."

  proxy:uninstall-service:
    desc: "Stop + disable the llm-proxy systemd service and remove the symlinked unit."
    silent: true
    cmds:
      - |
        set -euo pipefail
        systemctl --user disable --now llm-proxy.service 2>/dev/null || true
        rm -f "${HOME}/.config/systemd/user/llm-proxy.service"
        systemctl --user daemon-reload 2>/dev/null || true
        echo "llm-proxy systemd service uninstalled."

  proxy:service-status:
    desc: "Show the llm-proxy systemd service state + recent journal tail."
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! systemctl --user show-environment >/dev/null 2>&1; then
          echo "No systemd --user manager on this host."
          exit 0
        fi
        systemctl --user status llm-proxy.service --no-pager -n 20 || true

  measure-equivalence:
    desc: "Measure embedding equivalence between TEI and new llama.cpp endpoint"
    cmds:
      - node scripts/llm/measure-embedding-equivalence.mjs

  register-scheduled-tasks:
    desc: "Register Windows Scheduled Tasks for llama.cpp servers (run on GPU host)"
    cmds:
      - echo "Run this on the Windows GPU host (e.g. via RDP):"
      - echo "  powershell -ExecutionPolicy Bypass -File ./scripts/llm/register-scheduled-tasks.ps1"

  start-embed:
    desc: "Start the bge-m3 embedding server interactively (Windows GPU host)"
    cmds:
      - echo "Run on Windows GPU host:"
      - echo "  powershell -ExecutionPolicy Bypass -File ./scripts/llm/start-embed-server.ps1"

  start-rerank:
    desc: "Start the bge-reranker-v2-m3 rerank server interactively (Windows GPU host)"
    cmds:
      - echo "Run on Windows GPU host:"
      - echo "  powershell -ExecutionPolicy Bypass -File ./scripts/llm/start-rerank-server.ps1"

  start-bonsai:
    desc: "Start the Ternary-Bonsai-8B server with 4 slots (Windows GPU host)"
    cmds:
      - echo "Run on Windows GPU host:"
      - echo "  powershell -ExecutionPolicy Bypass -File ./scripts/llm/start-bonsai-server.ps1"

  lmstudio-preload:
    desc: "DEPRECATED — replaced by llama.cpp Scheduled Tasks. Use scripts/llm/register-scheduled-tasks.ps1 instead."
    cmds:
      - echo "LM Studio (lmstudio-preload.sh) is deprecated since T002110. Use Windows Scheduled Tasks instead."
      - echo "  See powershell -ExecutionPolicy Bypass -File ./scripts/llm/register-scheduled-tasks.ps1"
