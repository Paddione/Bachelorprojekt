# https://taskfile.dev
version: "3"

includes:
  assets:
    taskfile: ./taskfiles/Taskfile.assets.yml
    dir: .
  # Autoinstall-ISO fuer Cluster-Workstations (Bare-Metal-Nodes).
  # Siehe docs/runbooks/workstation-cluster-iso.md.
  iso:
    taskfile: ./taskfiles/Taskfile.iso.yml
    dir: .
  llm:
    taskfile: ./taskfiles/Taskfile.llm.yml
    dir: .
  sdlc:
    taskfile: ./taskfiles/Taskfile.sdlc.yml
    dir: .
  # DeepSeek Harness (dsh) — build, web UI, doctor.
  dsh:
    taskfile: ./taskfiles/Taskfile.dsh.yml
    dir: .
  finetune:
    taskfile: ./taskfiles/Taskfile.finetune.yml
    dir: .
  # Base-vs-Tuned regression gate for Unsloth finetunes (T002606).
  # See Taskfile.finetune-eval.yml.
  finetune-eval:
    taskfile: ./taskfiles/Taskfile.finetune-eval.yml
    dir: .
  # dev.mentolder.de — persistent staging stack on fleet (namespace workspace-dev).
  # See Taskfile.dev-stack.yml + docs/dev-stack/README.md.
  dev:
    taskfile: ./taskfiles/Taskfile.dev-stack.yml
    dir: .
  # dev.korczewski.de — persistent staging stack on PK-L-1 (local WSL2).
  dev-korczewski:
    taskfile: ./taskfiles/Taskfile.dev-stack.yml
    dir: .
    vars:
      ENV: korczewski
      CTX_DEV: k3d-korczewski-dev
      CTX_PROD: fleet
      NS_DEV: workspace-korczewski-dev
      NS_PROD: workspace-korczewski
      CLUSTER_NAME: korczewski-dev

  # devmesh — lokaler k3s-Dev-Cluster auf Bare-Metal (ADR-008). SP-1 (T900116) bringt
  # die Tailnet-Pruefung, SP-2 (T900117) die Cluster-Tasks.
  # See Taskfile.devmesh.yml + docs/runbooks/devmesh-tailnet.md.
  devmesh:
    taskfile: ./taskfiles/Taskfile.devmesh.yml
    dir: .
  # brainstorm.mentolder.de — reverse-SSH-tunnel broker (sish) for the
  # brainstorming visual companion. See Taskfile.brainstorm.yml.
  brainstorm:
    taskfile: ./taskfiles/Taskfile.brainstorm.yml
    dir: .

  # Active Sessions Hub — register/list local dev sessions for the Mediaviewer.
  # See Taskfile.session.yml + scripts/session-hub.sh.
  session:
    taskfile: ./taskfiles/Taskfile.session.yml
    dir: .

  # OpenClaw — personal AI assistant gateway on the WSL host.
  # See Taskfile.openclaw.yml + dotfiles/openclaw/.env.example.
  openclaw:
    taskfile: ./taskfiles/Taskfile.openclaw.yml
    dir: .
  # Cross-harness agent infrastructure (MCP servers, etc.) shared by every
  # agent harness in this repo — Claude Code, opencode, Hermes. See Taskfile.agents.yml.
  agents:
    taskfile: ./taskfiles/Taskfile.agents.yml
    dir: .
  # RustDesk-Relay on-demand (T015170): bewusst NICHT über Flux/Kustomize-
  # Roots verwaltet — Reconcile würde das imperative Scale-to-0 des
  # Sleeper-Jobs zurücknehmen. Siehe openspec/changes/rustdesk-on-demand.
  rustdesk:
    taskfile: ./taskfiles/Taskfile.rustdesk.yml
    dir: .
  # Brain-Quartz Wiki — initial ingest worklist (T001570).
  # See Taskfile.brain.yaml + scripts/brain-ingest-worklist.sh.
  brain:
    taskfile: ./taskfiles/Taskfile.brain.yaml
    dir: .

  core-data:
    taskfile: ./taskfiles/Taskfile.data.yml
    dir: .
    flatten: true
  core-platform:
    taskfile: ./taskfiles/Taskfile.platform.yml
    dir: .
    flatten: true
  core-process:
    taskfile: ./taskfiles/Taskfile.process.yml
    dir: .
    flatten: true
  core-quality:
    taskfile: ./taskfiles/Taskfile.quality.yml
    dir: .
    flatten: true
  core-test:
    taskfile: ./taskfiles/Taskfile.test.yml
    dir: .
    flatten: true
  core-tooling:
    taskfile: ./taskfiles/Taskfile.tooling.yml
    dir: .
    flatten: true
  core-web:
    taskfile: ./taskfiles/Taskfile.web.yml
    dir: .
    flatten: true
  core-workspace:
    taskfile: ./taskfiles/Taskfile.workspace.yml
    dir: .
    flatten: true
vars:
  CLUSTER_NAME: korczewski
  REGISTRY: localhost:5000
  DEV_DOMAIN: localhost
  # Zentrale Session-Subdomain (T016251) — Prod-Wert kommt aus environments/*.yaml.
  SESSIONS_DOMAIN: sessions.localhost
  # Ziel-IDs, die NUR lokal messbar sind — sie beschreiben Maschinenzustand (Worktrees,
  # Hauptcheckout, agent-locks, LLM-Endpunkte), den ein CI-Runner gar nicht hat. Dort
  # waeren sie strukturell gruen und damit wertlos; `freshness:check` ueberspringt sie
  # deshalb in CI mit sichtbarer Notiz statt sie gruen zu melden. [T002443]
  # Weitere lokal-only-Zielfamilien haengen ihre IDs hier an, statt einen zweiten
  # Warn-Block anzulegen. G-LLM* (T002442) misst den lokalen LLM-Stack-Betrieb.
  HG_LOCAL_ONLY_GOALS: G-WT01,G-WT02,G-WT03,G-WT04,G-WT05,G-WT06,G-LLM01,G-LLM02,G-LLM03,G-LLM04,G-LLM05

tasks:

  health:
    desc: "Cross-cluster health check (status + connectivity + deployment verification)"
    cmds:
      - task: clusters:status
      - 'echo ""'
      - 'echo "─── HTTPS reachability ───"'
      - task: workspace:check-connectivity
        vars: { ENV: "mentolder" }
      - task: workspace:check-connectivity
        vars: { ENV: "korczewski" }
      - 'echo ""'
      - 'echo "─── Pod-to-pod & credential verification ───"'
      - task: workspace:verify:all-prods
      - 'echo ""'
      - 'echo "  Run `task workspace:check-updates ENV=mentolder` to inspect available image updates"'

  shell:
    desc: Open a debug shell in the cluster
    cmds:
      - kubectl run debug --rm -it --image=busybox --restart=Never -- sh

  clean:
    desc: Prune local Docker images and volumes
    prompt: "This will prune all unused Docker images and volumes. Continue?"
    cmds:
      - docker image prune -f
      - docker volume prune -f
      - echo "✓ Cleaned up"

