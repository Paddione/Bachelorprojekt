apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: blackbox-exporter }
  template:
    metadata:
      labels: { app: blackbox-exporter }
    spec:
      securityContext:
        runAsNonRoot: true
        # Das Image deklariert root als USER; ohne runAsUser lehnt das Kubelet
        # den Container ab (siehe k3d/monitoring/blackbox-exporter.yaml, T900034).
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
          args: ["--config.file=/etc/blackbox/config.yml"]
          ports: [{ name: http, containerPort: 9115 }]
          readinessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: config, mountPath: /etc/blackbox }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: blackbox-exporter }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200]
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  selector: { app: blackbox-exporter }
  ports: [{ name: http, port: 9115, targetPort: http }]
