apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Schlankes Monitoring fuer devmesh: ein Prometheus plus Blackbox-Exporter,
# ohne Operator und ohne CRDs. Messbasis fuer G-OBS01, G-CAP01 und G-SLO01
# (scripts/lib/runtime-health-measure.py); der kube-prometheus-stack unter
# k3d/monitoring/ gehoerte zum abgebauten fleet-Cluster.
resources:
  - namespace.yaml
  - prometheus.yaml
  - blackbox-exporter.yaml
