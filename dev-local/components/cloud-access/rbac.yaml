apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-session
  namespace: workspace
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-session-token
  namespace: workspace
  annotations:
    kubernetes.io/service-account.name: cloud-session
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-session-role
  namespace: workspace
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-session-binding
  namespace: workspace
subjects:
  - kind: ServiceAccount
    name: cloud-session
    namespace: workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-session-role
