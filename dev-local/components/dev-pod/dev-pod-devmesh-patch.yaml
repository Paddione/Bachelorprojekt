apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-pod
spec:
  template:
    spec:
      affinity:
        $patch: delete
      tolerations: []
      containers:
        - name: mcp-node
          env:
            - name: WEBSITE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: website-secrets
                  key: WEBSITE_DB_PASSWORD
                  optional: true
            - name: WORKSPACE_PG_URL
              value: "postgresql://website:$(WEBSITE_DB_PASSWORD)@shared-db.workspace.svc.cluster.local:5432/website"
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: GHCR_PAT
                  optional: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dev-pod-mcp-read
subjects:
  - kind: ServiceAccount
    name: dev-pod
    namespace: workspace
