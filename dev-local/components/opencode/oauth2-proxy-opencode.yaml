# oauth2-proxy-opencode — Pocket ID SSO gate for ${OPENCODE_PUBLIC_HOST} (D1/D6).
# Mirrors oauth2-proxy-brain (dev-local/components/brain/brain.yaml): same OIDC
# endpoints against https://auth.${PROD_DOMAIN}, upstream http://opencode:80.
# Secrets POCKET_ID_OPENCODE_SECRET + OAUTH2_PROXY_COOKIE_SECRET live in
# workspace-secrets (environments/sealed-secrets/dev.yaml). No brand-domain
# literals — only ${...} references.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: oauth2-proxy-opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-opencode
  template:
    metadata:
      labels:
        app: oauth2-proxy-opencode
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: write-cookie-secret
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - printf 'cookie_secret = "%s"\n' "$(printf '%s' "$OAUTH2_PROXY_COOKIE_SECRET" | cut -c1-32)" > /run/config/oauth2-extra.cfg
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          volumeMounts:
            - name: oauth2-config
              mountPath: /run/config
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          imagePullPolicy: IfNotPresent
          args:
            - --config=/run/config/oauth2-extra.cfg
            - --provider=oidc
            - --client-id=opencode
            - --client-secret=$(POCKET_ID_OPENCODE_SECRET)
            - --redirect-url=https://${OPENCODE_PUBLIC_HOST}/oauth2/callback
            - --oidc-issuer-url=https://auth.${PROD_DOMAIN}
            - --skip-oidc-discovery=true
            - --login-url=https://auth.${PROD_DOMAIN}/authorize
            - --redeem-url=https://auth.${PROD_DOMAIN}/api/oidc/token
            - --oidc-jwks-url=https://auth.${PROD_DOMAIN}/.well-known/jwks.json
            - --profile-url=https://auth.${PROD_DOMAIN}/api/oidc/userinfo
            - --upstream=http://opencode:80
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_opencode
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --oidc-extra-audience=opencode
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --email-domain=*
            - --allowed-group=workspace-users
          env:
            - name: POCKET_ID_OPENCODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: POCKET_ID_OPENCODE_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: 64Mi
              cpu: "50m"
            limits:
              memory: 128Mi
              cpu: "200m"
          volumeMounts:
            - name: oauth2-config
              mountPath: /run/config
              readOnly: true
      volumes:
        - name: oauth2-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: oauth2-proxy-opencode
spec:
  selector:
    app: oauth2-proxy-opencode
  ports:
    - port: 4180
      targetPort: 4180
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencode-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy-opencode.workspace.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Access-Token
