# opencode workload: PVC (workspace data, local-path, 5Gi) + Deployment + Service.
# Image pinned by digest (D5): smanx/opencode tracks releases and defaults to
# 0.0.0.0:4096. Auth lives in oauth2-proxy-opencode (forwardAuth) — no env
# secrets in this Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: ${WORKSPACE_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          # Offizielles Upstream-Image (anomalyco/opencode, war sst/opencode).
          # smanx/opencode war ein Rebuild derselben Version ohne Mehrwert.
          image: ghcr.io/anomalyco/opencode:2.2.5@sha256:1690aad69864d2f6714772d1e040918feebc6df5286d2bd7e181fbb35d12d4a9
          imagePullPolicy: IfNotPresent
          # [Issue #6949] Offizielles Image (anomalyco) braucht `serve` explizit:
          # `opencode serve --hostname ... --port ...`. smanx prependete `serve`
          # selbst (#6944) — das gilt hier NICHT.
          args:
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          ports:
            - containerPort: 4096
              name: http
          # tcpSocket statt httpGet (#6949): mit OPENCODE_SERVER_PASSWORD
          # beantwortet der Server / mit 401 (Basic-Auth), httpGet-Probes
          # wuerden ewig failen.
          readinessProbe:
            tcpSocket:
              port: 4096
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4096
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: opencode-config # Provider/Modell (vLLM) aus ConfigMap
              mountPath: /tmp/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
          env:
            - name: HOME #6941: non-root (65534) braucht beschreibbares HOME statt /root
              value: /tmp
            - name: OPENCODE_SERVER_PASSWORD # Android/Tailnet-Basic-Auth (User opencode); Browser bleibt Pocket-ID via oauth2-proxy
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: OPENCODE_SERVER_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        # Repo-Sync-Sidecar: haelt die Projekt-Repos in /workspace aktuell
        # (opencode-data PVC, shallow --depth 50: Bachelorprojekt-.git allein
        # ist 1,9G, Vollklone wuerden das 5Gi-Volume sprengen). Zielpfade:
        # /workspace/<owner>/<repo>. Token aus workspace-secrets (GHCR_PAT,
        # optional: public Repos gehen auch anonym); die gespeicherte
        # Remote-URL bleibt tokenfrei, Auth laeuft per http.extraHeader.
        - name: repo-sync
          image: alpine/git@sha256:ae0f6f4bce38d2b8c40becc0d6241a08d9f57186ea03029de2189a2b5e722d94
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              # Git-Config nur per Env: Token nie in .git/config oder argv.
              # Repo-lokale Hooks/fsmonitor ignorieren, opencode kann sie schreiben.
              n=0
              add_config() {
                eval "export GIT_CONFIG_KEY_$n=\$1 GIT_CONFIG_VALUE_$n=\$2"
                n=$((n + 1))
              }
              add_config core.hooksPath /dev/null
              add_config core.fsmonitor false
              for repo in $REPOS; do add_config safe.directory "/workspace/$repo"; done
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
                add_config http.https://github.com/.extraHeader "Authorization: Basic $auth"
              fi
              export GIT_CONFIG_COUNT=$n
              sync_one() {
                repo="$1"
                dir="/workspace/$repo"
                clean="https://github.com/$repo.git"
                if [ ! -d "$dir/.git" ]; then
                  rm -rf "$dir"
                  git clone --depth 50 "$clean" "$dir" \
                    || { echo "clone failed: $repo"; return 0; }
                else
                  # Explizite URL: repo-lokales insteadOf greift nicht auf origin.
                  git -C "$dir" remote set-url origin "$clean"
                  if ! git -C "$dir" fetch --depth 50 "$clean" HEAD; then
                    echo "fetch failed: $repo"
                    return 0
                  fi
                  git -C "$dir" reset --hard FETCH_HEAD \
                    || { echo "reset failed: $repo"; return 0; }
                fi
              }
              sync_all() {
                for repo in $REPOS; do sync_one "$repo"; done
              }
              sync_all
              while true; do
                sleep "${SYNC_INTERVAL_SECONDS:-300}"
                sync_all
              done
          env:
            - name: HOME # wie opencode-Container: beschreibbares HOME fuer UID 65534
              value: /tmp
            - name: REPOS
              value: "Paddione/dotfiles Paddione/Bachelorprojekt Paddione/news-agent Paddione/agentic-resources Paddione/unsloth-boxes"
            - name: SYNC_INTERVAL_SECONDS
              value: "300"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: GHCR_PAT
                  optional: true
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: tmp #6941: beschreibbares HOME fuer UID 65534 (Praezedenz T900810)
          emptyDir: {}
        - name: opencode-config # Provider/Modell-Konfiguration (vLLM, lokal)
          configMap:
            name: opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: opencode
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 80
      targetPort: 4096
