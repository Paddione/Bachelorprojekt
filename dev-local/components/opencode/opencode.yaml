# opencode workload: PVC (workspace data, local-path, 5Gi) + Deployment + Service.
# Image pinned by digest (D5): smanx/opencode tracks releases and defaults to
# 0.0.0.0:4096. Auth lives in oauth2-proxy-opencode (forwardAuth) — no env
# secrets in this Deployment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: ${WORKSPACE_NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          # Offizielles Upstream-Image (anomalyco/opencode, war sst/opencode).
          # smanx/opencode war ein Rebuild derselben Version ohne Mehrwert.
          image: ghcr.io/anomalyco/opencode:2.1.4@sha256:6176a71bf7c1352d9aa9e7f112a4ef38443079a2f435789a33dd5ae809acea1a
          imagePullPolicy: IfNotPresent
          # [Issue #6944] KEIN `serve` als Arg: der Image-Entrypoint hängt
          # `serve` selbst an (`-> opencode serve`); ein weiteres `serve`
          # bricht mit `Unexpected positional argument: "serve"` ab.
          args:
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          ports:
            - containerPort: 4096
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 4096
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4096
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: workspace-data
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: opencode-config # Provider/Modell (vLLM) aus ConfigMap
              mountPath: /tmp/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
          env:
            - name: HOME #6941: non-root (65534) braucht beschreibbares HOME statt /root
              value: /tmp
            - name: OPENCODE_SERVER_PASSWORD # Android/Tailnet-Basic-Auth (User opencode); Browser bleibt Pocket-ID via oauth2-proxy
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: OPENCODE_SERVER_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: tmp #6941: beschreibbares HOME fuer UID 65534 (Praezedenz T900810)
          emptyDir: {}
        - name: opencode-config # Provider/Modell-Konfiguration (vLLM, lokal)
          configMap:
            name: opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: ${WORKSPACE_NAMESPACE}
  labels:
    app: opencode
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 80
      targetPort: 4096
