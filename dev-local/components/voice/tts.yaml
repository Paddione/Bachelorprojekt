---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-tts-code
  namespace: workspace
data:
  tts.py: |
    """TTS service: Piper per-language voices (de/en) behind REST."""
    import os
    import subprocess
    import tempfile
    from fastapi import FastAPI, Form
    from fastapi.responses import Response
    VOICES = {
        "de": "/voices/de_DE-thorsten-medium.onnx",
        "en": "/voices/en_US-lessac-medium.onnx",
    }
    app = FastAPI()
    @app.get("/healthz")
    def healthz():
        return {"ok": True, "voices": sorted(VOICES)}
    @app.post("/tts")
    async def tts(text: str = Form(...), language: str = Form("de")):
        voice = VOICES.get(language, VOICES["de"])
        with tempfile.NamedTemporaryFile(suffix=".wav", delete=False) as tmp:
            out = tmp.name
        p = subprocess.run(["piper", "--model", voice, "--output_file", out],
                           input=text.encode(), capture_output=True)
        p.check_returncode()
        with open(out, "rb") as f:
            wav = f.read()
        os.unlink(out)
        return Response(content=wav, media_type="audio/wav")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-tts
  namespace: workspace
  labels: {app: voice-tts}
spec:
  replicas: 1
  selector:
    matchLabels: {app: voice-tts}
  template:
    metadata:
      labels: {app: voice-tts}
    spec:
      nodeSelector: {kubernetes.io/hostname: gpu-metal}
      initContainers:
        - name: fetch-voices
          image: alpine:3.24
          command: ["sh", "-c",
            "apk add --no-cache curl >/dev/null && cd /voices && get() { for i in $(seq 1 30); do curl -sSL --retry 5 --retry-all-errors --retry-delay 10 -C - -o \"$1\" \"$2\" && return 0; echo \"retry $i: $1\"; sleep 10; done; echo \"FAILED: $1\"; return 1; }; get de_DE-thorsten-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx && get de_DE-thorsten-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx.json && get en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx && get en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json && ls -la /voices"]
          volumeMounts:
            - {name: voices, mountPath: /voices}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: tts
          image: python:3.12-slim
          command: ["sh", "-c",
            "pip install -q --no-cache-dir fastapi uvicorn python-multipart piper-tts && exec uvicorn tts:app --host 0.0.0.0 --port 8000"]
          workingDir: /app
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: voices, mountPath: /voices}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: code
          configMap: {name: voice-tts-code}
        - name: voices
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: voice-tts
  namespace: workspace
spec:
  selector: {app: voice-tts}
  ports: [{port: 8000, targetPort: 8000}]
