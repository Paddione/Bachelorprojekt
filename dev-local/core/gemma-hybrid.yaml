# Only devmesh owns these hostnames. Keep the shared CPU deployment unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-embed
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-cluster2
      containers:
        - name: llama-cpp
          args:
            - "-m"
            - "/models/embeddinggemma-300M-Q8_0.gguf"
            - "--alias"
            - "embeddinggemma-300m"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-ngl"
            - "0"
            - "--device"
            - "none"
            - "--no-op-offload"
            - "--no-kv-offload"
            - "-np"
            - "1"
            - "-c"
            - "2048"
            - "-b"
            - "2048"
            - "-ub"
            - "2048"
            - "-t"
            - "2"
            - "-tb"
            - "2"
            - "--embeddings"
          resources:
            limits:
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-embed-igpu
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: gpu-cluster2
