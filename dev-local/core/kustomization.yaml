apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# devmesh-Profil core (T900118, ADR-008). Gerendert von scripts/devmesh/render-stack.sh mit
# --load-restrictor=LoadRestrictionsNone (Ressourcen liegen in k3d/).
# Bewusst nicht enthalten:
#   k3d/namespace.yaml — k3d/website.yaml bringt einen Namespace mit, den der
#     Namespace-Transformer ebenfalls zu `workspace` macht; beide kollidieren.
#   k3d/secrets.yaml, k3d/website-dev-secrets.yaml — Secrets kommen auf devmesh nur aus
#     environments/sealed-secrets/dev.yaml; ein Klartext-Secret gleichen Namens wuerde
#     das entsiegelte ueberschreiben.
namespace: workspace

resources:
  - ../../k3d/configmap-domains.yaml
  - ../../k3d/shared-db.yaml
  - ../../k3d/website-schema.yaml
  - ../../k3d/website.yaml
  - massage-db-dev.yaml
  - ../../k3d/website-seller-config.yaml
  - ../../k3d/pocket-id.yaml
  - ../../k3d/pocket-id-db-init-sql.yaml
  - ../../k3d/pocket-id-client-seed.yaml
  - ../../k3d/pocket-id-client-seed-rbac.yaml
  - ../../k3d/pocket-id-client-seed-website-rbac.yaml
  - ../../k3d/llm-gpu.yaml
  - ../../k3d/llm-gemma-embed.yaml
  - ../../k3d/llm-gemma-igpu.yaml
  - ../../k3d/mailpit.yaml
  - ../../k3d/sdlc-stack/sdlc-console.yaml
  - ../../k3d/sdlc-stack/sdlc-console-rbac.yaml
  - gpu-endpoint.yaml
  - ingress.yaml
  - shared-db-backup.yaml

# CPU-gebundene LLM- und DB-Dienste (T900191, design.md D4).
components:
  - ../components/llm-services
  - ../components/cloud-access
  - ../components/voice
  - ../components/dev-pod
  - ../components/brain
  - ../components/k1-embed
  - ../components/opencode
  - ../components/sessions
  - ../components/korczewski-prod

configMapGenerator:
  - name: shared-db-backup-script
    files:
      - db-backup.sh=../../scripts/devmesh/db-backup.sh

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: gemma-hybrid.yaml
  - target: {kind: ConfigMap, name: website-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: website-config}
      data:
        BRAND: massage
        BRAND_ID: massage
        BRAND_NAME: "Massagepraxis Vögelsen"
        FROM_NAME: "Massagepraxis Vögelsen"
        # core hat weder Nextcloud noch Vaultwarden noch Brain: leer blendet die
        # Admin-/Portal-Kacheln aus statt auf *.localhost zu verlinken. full setzt sie neu.
        NEXTCLOUD_EXTERNAL_URL: ""
        VAULT_EXTERNAL_URL: ""
        BRAIN_EXTERNAL_URL: ""
  - target: {kind: Deployment, name: website}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: website}
      spec:
        template:
          spec:
            containers:
              - name: website
                env:
                  - name: WEBSITE_DB_PASSWORD
                    valueFrom:
                      secretKeyRef: {name: website-secrets, key: WEBSITE_DB_PASSWORD}
                  - name: SESSIONS_DATABASE_URL
                    value: "postgresql://website:$(WEBSITE_DB_PASSWORD)@massage-db-dev.workspace.svc.cluster.local:5432/website"
                  - name: GITHUB_CONTENT_TOKEN
                    valueFrom:
                      secretKeyRef: {name: website-content-token, key: GITHUB_CONTENT_TOKEN, optional: true}
  - target: {kind: Job, name: pocket-id-client-seed}
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata: {name: pocket-id-client-seed}
      spec:
        template:
          spec:
            containers:
              - name: seed
                env:
                  - name: WEBSITE_EXTRA_CALLBACK
                    value: "https://${WEBSITE_HOST}/api/auth/callback,https://${KORCZEWSKI_PROD_WEB_HOST}/api/auth/callback,https://${KORCZEWSKI_PROD_APEX_HOST}/api/auth/callback"
                  # opencode-devmesh-public (D6/D7): callback URLs for the
                  # `opencode` and `fritz` Pocket ID clients. Consumed by the
                  # seed script's ROWS (k3d/pocket-id-client-seed.yaml) once
                  # the opencode/fritz rows land upstream; explicit envs keep
                  # the public hosts out of the shared seed manifest.
                  - name: OPENCODE_CALLBACK
                    value: "https://${OPENCODE_PUBLIC_HOST}/oauth2/callback"
                  - name: FRITZBOX_CALLBACK
                    value: "https://${FRITZ_BOX_HOST}/oauth2/callback"
  - target: {kind: ConfigMap, name: domain-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: domain-config}
      data:
        PROD_DOMAIN: "${DEVMESH_DOMAIN}"
        POCKET_ID_DOMAIN: "auth.${DEVMESH_DOMAIN}"
        WEB_DOMAIN: "web.${DEVMESH_DOMAIN}"
        MAIL_DOMAIN: "mail.${DEVMESH_DOMAIN}"
        NC_DOMAIN: "files.${DEVMESH_DOMAIN}"
        COLLABORA_DOMAIN: "office.${DEVMESH_DOMAIN}"
        VAULT_DOMAIN: "vault.${DEVMESH_DOMAIN}"
        SIGNALING_DOMAIN: "signaling.${DEVMESH_DOMAIN}"
        TLS_SECRET_NAME: "devmesh-wildcard-tls"
  - target: {kind: ConfigMap, name: sdlc-console-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: sdlc-console-config}
      data:
        CLUSTER_ENV: "devmesh"
  # GPU ueber llm-gateway-host (gpu-endpoint.yaml) statt leerem LLM_PROXY_URL.
  - target: {kind: Deployment, name: sdlc-console}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: sdlc-console}
      spec:
        template:
          spec:
            containers:
              - name: sdlc-console
                env:
                  - {name: LLM_PROXY_URL, value: "http://llm-gateway-host"}
                resources:
                  requests: {cpu: 100m, memory: 192Mi}
  # Zustandsbehaftete Workloads auf den storage=true-Knoten (SP-2 D4).
  - target: {kind: Deployment, name: shared-db}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: shared-db}
      spec:
        template:
          spec:
            nodeSelector: {storage: "true"}
            initContainers:
              - name: generate-tls-cert
                image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
            containers:
              - name: postgres
                image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
  - target: {kind: Deployment, name: pocket-id}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: pocket-id}
      spec:
        template:
          spec:
            nodeSelector: {storage: "true"}
            containers:
              - name: pocket-id
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
  # Start-Requests fuer 3 x 16 GB (R1); Messung in Task L1.
  - target: {kind: Deployment, name: website}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: website}
      spec: {template: {spec: {containers: [{name: website, resources: {requests: {cpu: 50m, memory: 192Mi}}}]}}}
  - target: {kind: Deployment, name: mailpit}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: mailpit}
      spec: {template: {spec: {containers: [{name: mailpit, resources: {requests: {cpu: 10m, memory: 32Mi}}}]}}}
  - target: {kind: Deployment, name: "bge-(embed|rerank)"}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: bge}
      spec: {template: {spec: {containers: [{name: llama-cpp, resources: {requests: {cpu: 250m, memory: 768Mi}}}]}}}
  - target: {kind: PersistentVolumeClaim, name: bge-embed-models}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: bge-embed-models}
      spec:
        storageClassName: longhorn
  - target: {kind: PersistentVolumeClaim, name: bge-rerank-models}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: bge-rerank-models}
      spec:
        storageClassName: longhorn
  - target: {kind: PersistentVolumeClaim, name: massage-db-dev-data}
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: massage-db-dev-data}
      spec:
        storageClassName: longhorn
