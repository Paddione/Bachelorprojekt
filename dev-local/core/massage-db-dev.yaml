# Disposable dev database; no production snapshots or credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: massage-db-dev
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: massage-db-dev}
  template:
    metadata:
      labels: {app: massage-db-dev}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: website}
            - {name: POSTGRES_DB, value: website}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: website-secrets, key: WEBSITE_DB_PASSWORD}
          ports:
            - {name: postgres, containerPort: 5432}
          # Existing PVCs skip docker-entrypoint-initdb.d. Reapply the same
          # idempotent baseline after PostgreSQL starts accepting TCP clients
          # (the entrypoint's temporary init server only listens on a socket).
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -ec
                  - |
                    for attempt in $(seq 1 60); do
                      pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
                      sleep 2
                    done
                    pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                    bash /schema/init-knowledge-schema.sh
                    bash /schema/init-meetings-schema.sh
                    for migration in /migrations/*.sql; do
                      psql -X -1 -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$migration"
                    done
                    touch /tmp/website-schema-ready
          readinessProbe:
            exec:
              command: [bash, -ec, 'test -f /tmp/website-schema-ready && pg_isready -U website -d website']
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /schema, readOnly: true}
            - {name: migrations, mountPath: /migrations, readOnly: true}
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/10-knowledge.sh
              subPath: init-knowledge-schema.sh
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/15-meetings.sh
              subPath: init-meetings-schema.sh
            - name: brand
              mountPath: /docker-entrypoint-initdb.d/20-massage-brand.sql
              subPath: seed.sql
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: massage-db-dev-data}
        - name: migrations
          configMap: {name: website-dev-db-migrations}
        - name: schema
          configMap: {name: website-schema}
        - name: brand
          configMap: {name: massage-brand-seed}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: massage-brand-seed
data:
  seed.sql: |
    CREATE TABLE IF NOT EXISTS brands (id TEXT PRIMARY KEY, name TEXT NOT NULL);
    INSERT INTO brands (id, name) VALUES ('massage', 'Massagepraxis Vögelsen')
    ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: massage-db-dev-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: massage-db-dev
spec:
  selector: {app: massage-db-dev}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
