# AdGuard Home fuer LAN (Fritzbox-Upstream) und Tailnet (globaler Resolver) [T016515].
# Quelle der Wahrheit ist diese Datei: Aenderungen in der Web-UI gehen beim
# naechsten Pod-Start verloren. Design: .agents/plans/lan-dns-adguard/design.md
# Web-UI nur auf localhost: der Pod laeuft mit hostNetwork, das ist der
# localhost des Nodes. Erreichbar per kubectl port-forward, aber auch fuer
# Prozesse und hostNetwork-Pods auf dem Node. Deshalb mit Anmeldung: der
# initContainer setzt den bcrypt-Hash aus dem Secret adguard-admin ein, das
# scripts/devmesh/lan-dns-deploy.sh anlegt (nicht im Repo).
http:
  address: 127.0.0.1:3000
  session_ttl: 720h
users:
  - name: admin
    password: __ADMIN_HASH__
dns:
  # Nur die LAN-IP des Nodes (initContainer ersetzt den Platzhalter).
  # 0.0.0.0 kollidiert mit dem systemd-resolved-Stub auf 127.0.0.53 (T016520).
  bind_hosts:
    - __HOST_IP__
  port: 53
  # Alle LAN-Anfragen kommen von der Fritzbox, alle Tailnet-Anfragen vom
  # Operator-Proxy. Ein Limit pro Client wuerde damit alle drosseln.
  ratelimit: 0
  refuse_any: true
  # Nur IP-Literale: die Fritzbox fragt AdGuard, AdGuard darf nicht ueber die
  # Fritzbox aufloesen (Schleife). Lokale Namen gehen gezielt an die Fritzbox.
  upstream_dns:
    - tls://9.9.9.9
    - tls://149.112.112.112
    - https://1.1.1.1/dns-query
    - "[/fritz.box/home/]10.0.0.1"
  upstream_mode: parallel
  bootstrap_dns:
    - 9.9.9.10
    - 1.1.1.1
  fallback_dns:
    - 9.9.9.9
  use_private_ptr_resolvers: true
  local_ptr_upstreams:
    - 10.0.0.1
  enable_dnssec: true
  edns_client_subnet:
    enabled: false
  cache_size: 4194304
  cache_optimistic: true
filtering:
  protection_enabled: true
  filtering_enabled: true
  # devmesh-Hosts (DEVMESH_DOMAIN aus environments/dev.yaml) auf die LAN-IPs der
  # lan_dns-Knoten; Traefik (ServiceLB) nimmt auf jedem Knoten an. Damit braucht
  # kein Geraet im Heimnetz einen hosts-Eintrag fuer das SDLC-Cockpit.
  # Exakte Namen statt *.devmesh...: AdGuard gibt bei Wildcard-Rewrites nur eine
  # Antwort zurueck (kein Ausweich auf gpu-cluster2), und _acme-challenge-Abfragen
  # von cert-manager (DNS-01) bleiben unberuehrt. Liste = TLS-Hosts in
  # dev-local/core/ingress.yaml.
  rewrites:
    - {domain: web.devmesh.korczewski.de, answer: 10.10.10.2, enabled: true}
    - {domain: web.devmesh.korczewski.de, answer: 10.10.10.3, enabled: true}
    - {domain: auth.devmesh.korczewski.de, answer: 10.10.10.2, enabled: true}
    - {domain: auth.devmesh.korczewski.de, answer: 10.10.10.3, enabled: true}
    - {domain: site.devmesh.korczewski.de, answer: 10.10.10.2, enabled: true}
    - {domain: site.devmesh.korczewski.de, answer: 10.10.10.3, enabled: true}
    - {domain: brett.devmesh.korczewski.de, answer: 10.10.10.2, enabled: true}
    - {domain: brett.devmesh.korczewski.de, answer: 10.10.10.3, enabled: true}
    - {domain: mail.devmesh.korczewski.de, answer: 10.10.10.2, enabled: true}
    - {domain: mail.devmesh.korczewski.de, answer: 10.10.10.3, enabled: true}
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
querylog:
  enabled: true
  interval: 24h
statistics:
  enabled: true
  interval: 24h
schema_version: 34
