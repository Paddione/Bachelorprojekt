# AdGuard Home auf den Nodes mit Label lan-dns=true (Inventarfeld lan_dns) [T016515, T016520].
#
# hostNetwork statt ServiceLB: ein LoadBalancer/NodePort auf Port 53 legt
# hostPort-DNAT an, die auch den systemd-resolved-Stub 127.0.0.53 des Nodes
# kapert. Beim ersten Deploy fiel dadurch die DNS-Aufloesung aller Nodes aus
# (T016520). AdGuard bindet deshalb selbst an die LAN-IP des Nodes.
apiVersion: v1
kind: Namespace
metadata:
  name: lan-dns
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  selector:
    matchLabels:
      app: adguard
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: adguard
    spec:
      hostNetwork: true
      nodeSelector:
        lan-dns: "true"
      # Keine Aufloesung ueber CoreDNS/Node/Fritzbox: die Fritzbox fragt AdGuard,
      # der Pod selbst darf nicht zurueck in diese Kette fragen.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 9.9.9.9
          - 1.1.1.1
      # AdGuard schreibt seine Konfiguration zurueck; die ConfigMap ist read-only.
      # Platzhalter: __HOST_IP__ -> LAN-IP des Nodes, __ADMIN_HASH__ -> bcrypt-Hash
      # aus dem Secret adguard-admin (angelegt von scripts/devmesh/lan-dns-deploy.sh).
      initContainers:
        - name: seed-config
          image: busybox:1.38.0
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ADMIN_HASH
              valueFrom:
                secretKeyRef:
                  name: adguard-admin
                  key: bcrypt
          command:
            - sh
            - -c
            - sed -e "s|__HOST_IP__|${HOST_IP}|g" -e "s|__ADMIN_HASH__|${ADMIN_HASH}|g" /config-ro/AdGuardHome.yaml > /opt/adguardhome/conf/AdGuardHome.yaml
          volumeMounts:
            - name: config-ro
              mountPath: /config-ro
            - name: conf
              mountPath: /opt/adguardhome/conf
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.79
          readinessProbe:
            tcpSocket:
              port: 53
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
      volumes:
        - name: config-ro
          configMap:
            name: adguard-config
        - name: conf
          emptyDir: {}
        - name: work
          emptyDir: {}
---
# Nur fuer den Tailscale-Operator (Tailnet-Geraet lan-dns, L3-Ingress auf die
# ClusterIP). Bewusst ClusterIP: kein LoadBalancer/NodePort auf Port 53 (T016520).
# LAN-Clients (Fritzbox) fragen direkt die LAN-IP der lan-dns-Nodes.
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: lan-dns
    tailscale.com/tags: tag:lan-dns
spec:
  type: ClusterIP
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
