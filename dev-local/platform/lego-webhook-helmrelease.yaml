apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-lego-webhook
  namespace: cert-manager
spec:
  interval: 1h
  serviceAccountName: devmesh-tenant-deploy
  chart:
    spec:
      chart: cert-manager-lego-webhook
      version: 1.6.2
      sourceRef:
        kind: HelmRepository
        name: cert-manager-lego-webhook
        namespace: cert-manager
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager
  valuesFrom:
    - kind: Secret
      name: ipv64-api-key
      valuesKey: IPV64_API_KEY
      targetPath: webhook.envs.IPV64_API_KEY
      optional: false
