apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  serviceAccountName: devmesh-tenant-deploy
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    apiServerProxyConfig:
      mode: "true"
    oauth:
      secretName: operator-oauth
    operatorConfig:
      defaultTags:
        - tag:k8s-operator
      hostname: devmesh-k8s-operator
    proxyConfig:
      defaultTags: tag:k8s
