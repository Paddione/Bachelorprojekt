# devmesh/inventory.yaml — SSOT der devmesh-Peers im Tailnet (T900116, T900117, ADR-008)
#
# k3s_version   k3s-Version fuer alle Server im devmesh-Cluster (gepinnt, T900117)
# k3s_role      server-init | server-join | agent (T900117, gelesen von scripts/devmesh/*.sh)
# labels        Node-Labels für k3s (z. B. storage=true)
# gpu_endpoint  GPU-Inferenz auf dem Windows-Arbeitsplatz (Tailnet-Host gpu-host). Die Live-Policy
#               erlaubt den Pfad per grants (devmesh/tailnet-policy.hujson, T016528).
#   address     Tailnet-Adresse von host (identisch zu hosts.gpu-host in der Policy)
#   port        Ziel des Service-Ports http (sdlc-console, LLM_PROXY_URL); bleibt 1234
#   ports       ein Eintrag je Windows-GPU-Dienst [T900191]; name = IANA-Service-Name
#               (klein, a-z0-9 und -, hoechstens 15 Zeichen). render-stack.sh macht daraus
#               je einen benannten Port in llm-gateway-host, die Policy je ein Ziel.
# role: server  -> tag: "tag:gpu-server" (k3s-Hosts; Live-Tag, T016528)
# role: client  -> tag: null             (Geraet unter dem Benutzerkonto; Tailscale laeuft im Windows-Host,
#                                         WSL sieht das Tailnet ueber networkingMode = mirrored)
# lan_ip        feste Heimnetz-Adresse; null fuer Clients mit DHCP
# tailnet_name  Geraetename im Tailnet (bei Servern per `tailscale up --hostname` gesetzt)
# subnet_routes Netze, die der Host ins Tailnet freigibt (scripts/devmesh/tailnet-subnet-routes.sh).
#               Mehrere Hosts mit derselben Route: Tailscale schaltet bei Ausfall um [T016515].
# lan_dns       true: Host traegt AdGuard (Label lan-dns=true, Bind an lan_ip:53). Die Fritzbox
#               fragt den ersten dieser Hosts (docs/runbooks/devmesh-lan-dns.md) [T016520].
#
# Gelesen von scripts/devmesh/*.sh, taskfiles/Taskfile.devmesh.yml
# und vom Policy-Guard tests/py/spec/native_ported/spec/local-dev-mesh/test_tailnet_policy.py (gpu_endpoint).
k3s_version: v1.36.1+k3s1
gpu_endpoint:
  host: pk-desktop
  address: 100.76.165.106
  port: 1234
  ports:
    - {name: lmstudio, port: 1234}
    - {name: freetoken, port: 1919}
    - {name: gemma12, port: 8089}
    - {name: gemma4, port: 8090}
    - {name: qwen38, port: 8094}
peers:
  - name: gpu-metal
    role: server
    tag: "tag:gpu-server"
    lan_ip: 10.1.0.101
    # mac: DC:FE:07:10:B4:B3 (2026-10-12 per PXE neu installiert, tritt dem laufenden Cluster bei)
    tailnet_name: gpu-metal
    k3s_role: server-join
    labels: []
  - name: gpu-cluster
    role: server
    tag: "tag:gpu-server"
    lan_ip: 10.10.10.2
    tailnet_name: gpu-cluster
    k3s_role: server-init
    subnet_routes: [10.0.0.0/24]
    labels: []
  - name: gpu-cluster2
    role: server
    tag: "tag:gpu-server"
    lan_ip: 10.10.10.3
    tailnet_name: gpu-cluster2
    k3s_role: server-join
    subnet_routes: [10.0.0.0/24]
    lan_dns: true
    labels:
      - storage=true
  - name: gpu-cluster-3
    role: server
    tag: "tag:gpu-server"
    lan_ip: 10.10.10.4
    # mac: FC:34:97:A5:DA:60 (recorded 2026-09-16, for Wake-on-LAN)
    tailnet_name: gpu-cluster-3
    k3s_role: agent
    lan_dns: true
    labels:
      - storage=true
  - name: pk-desktop
    role: client
    tag: null
    lan_ip: 10.10.0.3
    tailnet_name: pk-desktop
  - name: pk-l-1
    role: client
    tag: null
    lan_ip: null
    tailnet_name: pk-l-1
  - name: pk-tablet
    role: client
    tag: null
    lan_ip: null
    tailnet_name: pk-tablet
  # Ubuntu-Teil desselben Tablets (Dual-Boot, docs/runbooks/pk-tablet-inference.md):
  # bge-Rerank/-Embedding, im devmesh als llm-gateway-tablet eingebunden. Der
  # Windows-Teil bleibt pk-tablet.
  - name: pk-tablet-linux
    role: client
    tag: null
    lan_ip: null
    tailnet_name: pk-tablet-linux
