# devmesh/inventory.yaml — SSOT der devmesh-Peers im Tailnet (T900116, T900117, ADR-008)
#
# k3s_version   k3s-Version fuer alle Server im devmesh-Cluster (gepinnt, T900117)
# k3s_role      server-init | server-join | agent (T900117, gelesen von scripts/devmesh/*.sh)
# labels        Node-Labels für k3s (z. B. storage=true)
# gpu_endpoint  GPU-Inferenz auf dem Windows-Arbeitsplatz; einziger erlaubter Pfad von
#               tag:devmesh in einen Client (devmesh/tailnet-policy.hujson, Alias gpu-host).
#   address     Tailnet-Adresse von host (identisch zu hosts.gpu-host in der Policy)
#   port        Ziel des Service-Ports http (sdlc-console, LLM_PROXY_URL); bleibt 1234
#   ports       ein Eintrag je Windows-GPU-Dienst [T900191]; name = IANA-Service-Name
#               (klein, a-z0-9 und -, hoechstens 15 Zeichen). render-stack.sh macht daraus
#               je einen benannten Port in llm-gateway-host, die Policy je ein Ziel.
# role: server  -> tag: "tag:devmesh"   (k3s-Hosts)
# role: client  -> tag: "tag:devclient" (Arbeitsplaetze; Tailscale laeuft im Windows-Host,
#                                         WSL sieht das Tailnet ueber networkingMode = mirrored)
# lan_ip        feste Heimnetz-Adresse; null fuer Clients mit DHCP
# tailnet_name  Geraetename im Tailnet (bei Servern per `tailscale up --hostname` gesetzt)
#
# Gelesen von scripts/devmesh/*.sh, taskfiles/Taskfile.devmesh.yml
# und vom Policy-Guard tests/spec/local-dev-mesh/tailnet-policy.bats (gpu_endpoint).
k3s_version: v1.36.1+k3s1
gpu_endpoint:
  host: pk-desktop
  address: 100.102.71.114
  port: 1234
  ports:
    - {name: lmstudio, port: 1234}
    - {name: freetoken, port: 1919}
    - {name: gemma12, port: 8089}
    - {name: gemma4, port: 8090}
    - {name: qwen38, port: 8094}
peers:
  - name: gpu-metal
    role: server
    tag: "tag:devmesh"
    lan_ip: 10.1.0.101
    tailnet_name: gpu-metal
    k3s_role: server-init
    labels: []
  - name: gpu-cluster
    role: server
    tag: "tag:devmesh"
    lan_ip: 10.10.10.2
    tailnet_name: gpu-cluster
    k3s_role: server-join
    labels: []
  - name: gpu-cluster2
    role: server
    tag: "tag:devmesh"
    lan_ip: 10.10.10.3
    tailnet_name: gpu-cluster2
    k3s_role: server-join
    labels:
      - storage=true
  - name: gpu-cluster-3
    role: server
    tag: "tag:devmesh"
    lan_ip: 10.10.10.4
    tailnet_name: gpu-cluster-3
    k3s_role: agent
    labels:
      - storage=true
  - name: pk-desktop
    role: client
    tag: "tag:devclient"
    lan_ip: 10.10.0.3
    tailnet_name: pk-desktop
  - name: pk-l-1
    role: client
    tag: "tag:devclient"
    lan_ip: null
    tailnet_name: pk-l-1
  - name: pk-tablet
    role: client
    tag: "tag:devclient"
    lan_ip: null
    tailnet_name: pk-tablet
