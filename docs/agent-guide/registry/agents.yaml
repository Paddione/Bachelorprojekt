# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  bachelorprojekt-db:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-infra:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-ops:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-security:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-test:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-website:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  # 2026-08-04: lokale Subagenten heissen nach Modell-FAMILIE (gptoss, devstral,
  # gemma, gemma12) statt nach der historischen Gemma-Nomenklatur (gemma26-1/2,
  # gemma9-1/2). Letztere zeigten alle auf gptoss-context — der Name log ueber
  # das Modell. Jeder Familien-Subagent serviert sein eigenes Loadout ueber den
  # llm-proxy (:18235); alle Chat-Loadouts teilen exclusiveGroup "chat-gpu"
  # (es laeuft immer nur eines). T003204: die Familie qwen ist abgeschaltet —
  # ihr Loadout qwen3-coder-30b wurde aus loadouts.json entfernt (T012414);
  # das Backend llamacpp-qwen bleibt per Migration deaktiviert.
  gptoss:
    mode: subagent
    model: freetoken-local/active
    write_capable: false
    note: "NAME luegt ueber das Modell. Seit T013360 auf qwen38-220k (Qwen 3.8 27B, Port 8094, 114688 ctx, text-only, np=1). Alle lokalen Agenten teilen dieses eine Loadout — kein GPU-Swap noetig. Name bleibt als Dispatch-Schnittstelle."
  devstral:
    mode: subagent
    model: freetoken-local/active
    write_capable: false
    note: "NAME luegt ueber das Modell. Seit T013360 auf qwen38-220k. Alle lokalen Agenten teilen dieses eine Loadout — kein GPU-Swap noetig."
  gemma:
    mode: subagent
    model: freetoken-local/active
    write_capable: false
    note: "NAME luegt ueber das Modell. Seit T013360 auf qwen38-220k. Alle lokalen Agenten teilen dieses eine Loadout."
  gemma12:
    mode: subagent
    model: freetoken-local/active
    write_capable: false
    note: "NAME luegt ueber das Modell. Seit T013360 auf qwen38-220k. Alle lokalen Agenten teilen dieses eine Loadout."
  qwen38:
    mode: subagent
    model: freetoken-local/active
    write_capable: false
    note: "qwen38 family: Qwen 3.8 27B UD-IQ3_XXS, Loadout qwen38-220k auf Port 8094, 114688 ctx, text-only (kein mmproj). EIN Slot (parallel=1) — nur sequenziell dispatchen, nie neben sich selbst oder einem anderen lokalen Agenten [2026-08-22]"
  qwen-cloud:
    mode: subagent
    model: alibaba-intl/qwen3.8-max
    write_capable: true
    note: "Cloud subagent: Qwen 3.8 Max via Alibaba Cloud Intl Token Plan (131k ctx). Erste Cloud-Eskalationsstufe nach lokalen Modellen. Selbe Modell-Familie wie der Orchestrator [T013360]"
  freetoken-primary:
    mode: primary
    model: freetoken-local/active
    write_capable: false
    note: "Dedizierter Tab-selectable Primary auf dem modellagnostischen FreeToken-Alias 'active' (:1919) [T014105]"
  big-pickle:
    mode: primary
    model: opencode-zen/big-pickle
    write_capable: true
    note: "PRIMARY: Big Pickle on OpenCode Zen (free tier) — tab-selectable until the free quota is spent [2026-08-04]. Since 2026-08-22 task-dispatch allowed for the same subagent set as the orchestrator (local families + qwen-cloud + deepseek-*)."
  ox-alpha-free:
    mode: primary
    model: opencode-zen/laguna-s-2.1-free
    write_capable: true
    note: "PRIMARY: Ox Alpha Free next to big-pickle — second free-tier Zen agent on laguna-s-2.1-free (Poolside agentic coding model, 256k ctx per models.dev, live-smoke-tested 2026-08-22; deepseek-v4-flash-free was tested in the same run and is upstream-unavailable). Since 2026-08-23 dispatches ONLY ox-alpha subagents."
  ox-alpha:
    mode: subagent
    model: opencode-zen/laguna-s-2.1-free
    write_capable: true
    note: "Subagent twin of ox-alpha-free on the same laguna-s-2.1-free model [2026-08-23] — sole dispatch target of ox-alpha-free, keeping parallel work in the same free-tier family."
  deepseek-helper:
    mode: subagent
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Escalation: DeepSeek-V4 Flash (1M ctx) via direct DeepSeek API [T002632]"
  deepseek-helper-go:
    mode: subagent
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "ESCALATION twin of deepseek-helper over OpenCode Go instead of the direct API — helper tier multi-backend (direct + Go + Alibaba) since 2026-08-22."
  deepseek-helper-alibaba:
    mode: subagent
    model: alibaba-intl/deepseek-v4-flash-0731
    write_capable: true
    note: "ESCALATION twin of deepseek-helper over the Alibaba Intl Token Plan. Model ID deepseek-v4-flash-0731 (differs from direct/Go). Measured 2026-08-22 after alibaba-intl key rotation (smoke test answered); context limit declared conservatively, unmeasured."
  deepseek-pro:
    mode: all
    model: opencode-go/deepseek-v4-pro
    write_capable: true
    note: "DeepSeek-V4 Pro (1M ctx, max reasoning effort) for deep analysis and hard refactors; tab-selectable + task-dispatchable [T002632]"
  deepseek-pro-direct:
    mode: all
    model: deepseek/deepseek-v4-pro
    write_capable: true
    note: "Same model as deepseek-pro, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  deepseek-pro-alibaba:
    mode: all
    model: alibaba-intl/deepseek-v4-pro
    write_capable: true
    note: "Same model as deepseek-pro, over the Alibaba Intl Token Plan — third route (Go + direct + Alibaba) since 2026-08-22 after key rotation; smoke-tested. Context limit declared conservatively, unmeasured."
  deepseek-flash:
    mode: all
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "DeepSeek-V4 Flash (1M ctx, max reasoning effort). Up to 3 parallel for independent subtasks; tab-selectable + task-dispatchable [T002632]"
  deepseek-flash-direct:
    mode: all
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Same model as deepseek-flash, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  orchestrator:
    mode: primary
    model: opencode-zen/laguna-s-2.1-free
    write_capable: true
    note: "Primary orchestrator on Laguna S 2.1 Free (OpenCode Zen, Poolside agentic coding model, free tier, 256k ctx per models.dev; live-smoke-tested 2026-08-22). Also drives the factory executor (opencode-exec.sh runs --agent orchestrator). Dispatches local family subagents + cloud escalation (qwen-cloud/deepseek-*). Eskalationskette: lokal → qwen-cloud → deepseek-helper → deepseek-pro [T013360]"
  alibaba-primary:
    mode: primary
    model: alibaba-intl/qwen3.8-max
    write_capable: false
    note: "PRIMARY: Qwen3.8 Max on Alibaba Cloud Intl Token Plan (131072 ctx), tab-selectable singleagent via compatible-mode endpoint; replaces deepseek-v4-flash as the default model [T004396]"
