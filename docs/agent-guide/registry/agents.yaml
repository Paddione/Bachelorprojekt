# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  bachelorprojekt-db:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-infra:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-ops:
    claude_code: sonnet
    agy: unsupported
    opencode: null
    tools: [Bash, Read, Glob, Grep]
  bachelorprojekt-security:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-test:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-website:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  gemma26-1:
    mode: subagent
    model: llamacpp-gemma26/gemma26-factory
    write_capable: false
    note: "Slot 1 of 3 (-np 3 -kvu, ~99840 ctx each). Own prefix cache; still serialized by llm-proxy (max_inflight=1) [T002545]"
  gemma26-2:
    mode: subagent
    model: llamacpp-gemma26/gemma26-factory
    write_capable: false
    note: "Slot 2 of 3 — separate name so the two subagents keep distinct prefix caches [T002545]"
  gemma26-primary:
    mode: primary
    model: llamacpp-gemma26/gemma26-factory
    write_capable: false
    note: "Tab-selectable primary agent, slot 3 of 3, ~97840 ctx (measured, not n_ctx_train) [T002545]"
  gemma26-vision:
    mode: primary
    model: llamacpp-gemma26/gemma26-factory
    write_capable: false
    note: "Max context (97840 ctx), no subagent dispatch. Vision-ready (needs mmproj in loadout)."
  deepseek-helper:
    mode: subagent
    model: deepseek/deepseek-chat
    write_capable: true
    note: "Escalation: DeepSeek-V3 (128K ctx) via direct DeepSeek API"
  deepseek-pro:
    mode: subagent
    model: deepseek/deepseek-reasoner
    write_capable: true
    note: "DeepSeek-R1 (128K ctx, max reasoning effort) for deep analysis and hard refactors"
  deepseek-flash:
    mode: subagent
    model: deepseek/deepseek-chat
    write_capable: true
    note: "DeepSeek-V3 (200K ctx, max reasoning effort). Up to 3 parallel for independent subtasks."
  orchestrator:
    mode: primary
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "Primary orchestrator, dispatches the gemma26 subagents sequentially"
