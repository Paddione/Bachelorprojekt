# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  bachelorprojekt-db:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-infra:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-ops:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-security:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-test:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-website:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  # 2026-08-04: lokale Subagenten heissen nach Modell-FAMILIE (gptoss, devstral,
  # gemma, gemma12) statt nach der historischen Gemma-Nomenklatur (gemma26-1/2,
  # gemma9-1/2). Letztere zeigten alle auf gptoss-context — der Name log ueber
  # das Modell. Jeder Familien-Subagent serviert sein eigenes Loadout ueber den
  # llm-proxy (:18235); alle Chat-Loadouts teilen exclusiveGroup "chat-gpu"
  # (es laeuft immer nur eines). T003204: die Familie qwen ist abgeschaltet —
  # ihr Loadout qwen3-coder-30b ist enabled: false in loadouts.json.
  gptoss:
    mode: subagent
    model: llamacpp-local/gemma26-throughput
    write_capable: false
    note: "NAME luegt ueber das Modell: faehrt seit T003204 gemma26-throughput (118016 ctx, Port 8092), weil gptoss-context abgeschaltet wurde. Der Name bleibt, weil er die Dispatch-Schnittstelle des Orchestrators ist — Umbenennen ist ein eigener Vorgang [T003204]"
  devstral:
    mode: subagent
    model: llamacpp-local/gemma26-factory
    write_capable: false
    note: "NAME luegt ueber das Modell: faehrt seit T003204 gemma26-factory (177920 ctx, Port 8091), weil devstral-quality in allen Dimensionen dominiert war. Name bleibt als Dispatch-Schnittstelle [T003204]"
  gemma:
    mode: subagent
    model: llamacpp-local/gemma26-factory
    write_capable: false
    note: "gemma family: Gemma 4 26B A4B IQ4_XS, Loadout gemma26-factory auf Port 8091 (exclusiveGroup chat-gpu) [2026-08-09 T002753]"
  gemma12:
    mode: subagent
    model: llamacpp-local/gemma12-vision
    write_capable: false
    note: "gemma12 family: Gemma 4 12B QAT + mmproj-F16, Loadout gemma12-vision auf Port 8089, 262144 ctx — groesster lokaler Kontext und einziges vision-faehiges Loadout. Seit T003204 als Subagent dispatchbar (vorher nur Tab-waehlbar via gemma12-primary)"
  gemma26-primary:
    mode: primary
    model: llamacpp-local/gemma26-factory
    write_capable: false
    note: "Tab-selectable primary local agent, 161024 ctx measured (np=3 -kvu q4_0 fitt 128) [T002753]"
  gemma26-vision:
    mode: primary
    model: llamacpp-local/gemma26-factory
    write_capable: false
    note: "Max context, no subagent dispatch. Vision IS available — gemma26-factory loads mmproj-F16.gguf since T002753"
  # [T003065] Ein tab-waehlbarer Primaeragent pro lokalem GGUF-Modell. Alle
  # Kontextwerte sind in scripts/llm/loadouts.json als Messwert belegt — keine
  # n_ctx_train-Zahlen. Der Semaphor in scripts/llm-proxy/server.mjs serialisiert
  # den Modellwechsel, deshalb duerfen diese Agenten Subagenten dispatchen.
  gptoss-primary:
    mode: primary
    model: llamacpp-local/gemma26-throughput
    write_capable: false
    note: "Tab-selectable primary, seit T003204 auf gemma26-throughput (Port 8092), 118016 ctx — gptoss-context ist abgeschaltet. Die Kontextzahl ist laufzeitrelevant: opencode timet Auto-Compact bei 95 % der deklarierten Grenze [T003065/T003204]"
  devstral-primary:
    mode: primary
    model: llamacpp-local/gemma26-factory
    write_capable: false
    note: "Tab-selectable primary, seit T003204 auf gemma26-factory (Port 8091), 177920 ctx, code-quality review — devstral-quality ist abgeschaltet [T003065/T003204]"
  gemma12-primary:
    mode: primary
    model: llamacpp-local/gemma12-vision
    write_capable: false
    note: "Tab-selectable primary on gemma12-vision (Port 8089), 262144 ctx measured, vision-capable via mmproj-F16 [T003065]"
  gemma26-throughput-primary:
    mode: primary
    model: llamacpp-local/gemma26-throughput
    write_capable: false
    note: "Tab-selectable primary on gemma26-throughput (Port 8092), 118016 ctx measured, 159-169 tok/s [T003065]"
  big-pickle:
    mode: primary
    model: opencode-zen/big-pickle
    write_capable: true
    note: "PRIMARY: Big Pickle on OpenCode Zen (free tier) — tab-selectable until the free quota is spent [2026-08-04]"
  deepseek-helper:
    mode: subagent
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Escalation: DeepSeek-V4 Flash (1M ctx) via direct DeepSeek API [T002632]"
  deepseek-pro:
    mode: all
    model: opencode-go/deepseek-v4-pro
    write_capable: true
    note: "DeepSeek-V4 Pro (1M ctx, max reasoning effort) for deep analysis and hard refactors; tab-selectable + task-dispatchable [T002632]"
  deepseek-pro-direct:
    mode: all
    model: deepseek/deepseek-v4-pro
    write_capable: true
    note: "Same model as deepseek-pro, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  deepseek-flash:
    mode: all
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "DeepSeek-V4 Flash (1M ctx, max reasoning effort). Up to 3 parallel for independent subtasks; tab-selectable + task-dispatchable [T002632]"
  deepseek-flash-direct:
    mode: all
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Same model as deepseek-flash, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  orchestrator:
    mode: primary
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "Primary orchestrator, dispatches the local family subagents (gptoss/devstral/gemma/gemma12) sequentially"
  alibaba-primary:
    mode: primary
    model: alibaba-intl/qwen3.8-max
    write_capable: false
    note: "PRIMARY: Qwen3.8 Max on Alibaba Cloud Intl Token Plan (131072 ctx), tab-selectable singleagent via compatible-mode endpoint; replaces deepseek-v4-flash as the default model [T004396]"
