# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  bachelorprojekt-db:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-infra:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-ops:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-security:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-test:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-website:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  # 2026-09-16: die fuenf Familien-Handles (gptoss, devstral, gemma, gemma12,
  # qwen38) zeigten alle auf dasselbe FreeToken-Modell — kollabiert zum einen
  # `local`-Handle (ein Resident-Checkpoint, ein Radix-Cache, single-flight;
  # Proxy queuet ≤3 sequenzielle Dispatches auf ≤200k served KV).
  # Entfernt: alibaba-intl-Drittschiene (qwen-cloud, helper-alibaba,
  # pro-alibaba, alibaba-primary) — 2-Rail-Entscheidung (Go + direkt).
  # Details siehe docs/agent-guide/registry/retired.md.
  local:
    mode: subagent
    model: llamacpp-local/Muse-Glimmer-30B
    write_capable: false
    note: "Higher-capability local implementation subagent: Muse Glimmer 30B via llama.cpp :1919 (RTX 5070 Ti, UD-IQ3_XXS + DFlash2, 131072 served KV, ~79-89 tok/s decode, gemessen 2026-09-25) [T900365]. Sequential dispatch with per-packet budget_tokens (S ~32k / M ~80k / L ~90k)."
  qwen35-mtp:
    mode: subagent
    model: llamacpp-qwen35/Qwen3.5-4B-MTP
    write_capable: false
    note: "Text-only Qwen3.5-4B MTP Q4_K_XL via llama.cpp :1920 on RTX 3060 Ti; 131072 served KV with Q4 target/draft KV, single slot. Use for bounded research, summaries, and straightforward implementation packets; verify important conclusions on the primary model."
  reviewer:
    mode: subagent
    model: llamacpp-local/Muse-Glimmer-30B
    write_capable: false
    note: "Factory reviewer role — read/grep/glob/tests only; no edit/write/bash/task dispatch (Orchestrator applies review edits) [T900074]"
  big-pickle:
    mode: primary
    model: opencode-zen/big-pickle
    write_capable: true
    note: "PRIMARY: Big Pickle on OpenCode Zen (free tier) — tab-selectable until the free quota is spent [2026-08-04]. Since 2026-09-16 task-dispatch allowed for the same subagent set as the orchestrator (local + exe-muse + 2-rail deepseek-*)."
  ox-alpha-free:
    mode: primary
    model: opencode-zen/laguna-s-2.1-free
    write_capable: true
    note: "PRIMARY: Ox Alpha Free next to big-pickle — second free-tier Zen agent on laguna-s-2.1-free (Poolside agentic coding model, 256k ctx per models.dev, live-smoke-tested 2026-08-22; deepseek-v4-flash-free was tested in the same run and is upstream-unavailable). Since 2026-08-23 dispatches ONLY ox-alpha subagents."
  ox-alpha:
    mode: subagent
    model: opencode-zen/laguna-s-2.1-free
    write_capable: true
    note: "Subagent twin of ox-alpha-free on the same laguna-s-2.1-free model [2026-08-23] — sole dispatch target of ox-alpha-free, keeping parallel work in the same free-tier family."
  deepseek-helper:
    mode: subagent
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Escalation: DeepSeek-V4 Flash (1M ctx) via direct DeepSeek API [T002632]"
  deepseek-helper-go:
    mode: subagent
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "ESCALATION: DeepSeek V4 Flash via OpenCode Go — FIRST escalation rail after local (helper tier 2-rail: Go + direct since 2026-09-16)."
  deepseek-pro:
    mode: all
    model: opencode-go/deepseek-v4-pro
    write_capable: true
    note: "DeepSeek-V4 Pro (1M ctx, max reasoning effort) for deep analysis and hard refactors; tab-selectable + task-dispatchable [T002632]"
  deepseek-pro-direct:
    mode: all
    model: deepseek/deepseek-v4-pro
    write_capable: true
    note: "Same model as deepseek-pro, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  deepseek-flash:
    mode: all
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "DeepSeek-V4 Flash (1M ctx, max reasoning effort). Up to 3 parallel for independent subtasks; tab-selectable + task-dispatchable [T002632]"
  deepseek-flash-direct:
    mode: all
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Same model as deepseek-flash, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable; tab-selectable + task-dispatchable [T002633]"
  orchestrator:
    mode: primary
    model: llamacpp-local/Muse-Glimmer-30B
    write_capable: true
    note: "Primary orchestrator on Muse Glimmer 30B via llama.cpp :1919 (RTX 5070 Ti, 131072 served KV). Dispatches qwen35-mtp on the RTX 3060 Ti for bounded local subtasks, plus cloud escalation (exe-muse and DeepSeek rails). Also drives the factory executor (opencode-exec.sh runs --agent orchestrator)."
  exe-muse:
    mode: subagent
    model: opencode-go/muse-spark-1.3-contributor
    write_capable: true
    note: "EXECUTOR on Muse Spark 1.3 Contributor via OpenCode Go (subscription rail, 1M ctx, 131k output) [T900210]. First cloud escalation after local stalls (M2); dispatched by orchestrator, big-pickle, glimmer-primary. Free-first chain: orchestrator (Zen-free) → exe-muse (Go) → deepseek rails."
  glimmer-primary:
    mode: primary
    model: llamacpp-local/Muse-Glimmer-30B
    write_capable: true
    note: "PRIMARY: Local Muse Glimmer 30B via llama.cpp (:1919, RTX 5070 Ti, served KV 131072) (llamacpp-local/Muse-Glimmer-30B) [T900365]. Autonomous ticket-hammering agent: prioritizes critical tickets, plans (/dev-flow-plan), explores (/opsx:explore), executes, and archives."
