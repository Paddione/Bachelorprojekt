# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  bachelorprojekt-db:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-infra:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-ops:
    claude_code: sonnet
    agy: unsupported
    opencode: null
    tools: [Bash, Read, Glob, Grep]
  bachelorprojekt-security:
    claude_code: opus
    agy: unsupported
    opencode: null
  bachelorprojekt-test:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bachelorprojekt-website:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  # T002633: die Loadouts gemma26-factory und gemma9-factory haben ihre GGUF-Gewichte
  # verloren; alle sechs lokalen Agenten laufen seither auf llamacpp-local/gptoss-context
  # (gpt-oss-20b Q8_0, 105472 ctx gemessen, via llm-proxy :18235). Die Agentennamen sagen
  # weiterhin "gemma" — sie umzubenennen beruehrt 53 Referenzen und laeuft separat.
  gemma26-1:
    mode: subagent
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Own prefix cache; still serialized by llm-proxy (max_inflight=1) [T002545/T002633]"
  gemma26-2:
    mode: subagent
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Separate name so the two subagents keep distinct prefix caches [T002545/T002633]"
  gemma26-primary:
    mode: primary
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Tab-selectable primary agent, 105472 ctx (measured, not n_ctx_train) [T002545/T002633]"
  gemma26-vision:
    mode: primary
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Max context, no subagent dispatch. Text-only — gpt-oss-20b has no mmproj [T002633]"
  gemma9-1:
    mode: subagent
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Own prefix cache; preferred for small, atomic partial-plan implementations [T002591/T002633]"
  gemma9-2:
    mode: subagent
    model: llamacpp-local/gptoss-context
    write_capable: false
    note: "Separate name so the two subagents keep distinct prefix caches [T002591/T002633]"
  deepseek-helper:
    mode: subagent
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Escalation: DeepSeek-V4 Flash (1M ctx) via direct DeepSeek API [T002632]"
  deepseek-pro:
    mode: subagent
    model: opencode-go/deepseek-v4-pro
    write_capable: true
    note: "DeepSeek-V4 Pro (1M ctx, max reasoning effort) for deep analysis and hard refactors [T002632]"
  deepseek-pro-direct:
    mode: subagent
    model: deepseek/deepseek-v4-pro
    write_capable: true
    note: "Same model as deepseek-pro, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable [T002633]"
  deepseek-flash:
    mode: subagent
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "DeepSeek-V4 Flash (1M ctx, max reasoning effort). Up to 3 parallel for independent subtasks [T002632]"
  deepseek-flash-direct:
    mode: subagent
    model: deepseek/deepseek-v4-flash
    write_capable: true
    note: "Same model as deepseek-flash, but over the direct DeepSeek API instead of opencode-go — fallback when the gateway is unavailable [T002633]"
  orchestrator:
    mode: primary
    model: opencode-go/deepseek-v4-flash
    write_capable: true
    note: "Primary orchestrator, dispatches the gemma26 subagents sequentially"
