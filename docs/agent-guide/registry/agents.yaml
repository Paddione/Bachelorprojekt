# docs/agent-guide/registry/agents.yaml
# SSOT for all agent definitions: roles (Claude Code domain agents) and runtimes
# (opencode subagents/primary agents). Both axes together cover the full agent
# landscape of this project.
#
# Harness values:
#   claude_code   — the model string from each .claude/agents/*.md frontmatter.
#   agy           — model string usable with the `agy` CLI, or null / "unsupported".
#                   null: the agent/harness pair does not exist (opencode).
#                   "unsupported": the file is loaded but agy does not honor the
#                   model: field (measured — see T002304 for methodology notes).
#   opencode      — always null; opencode reads its agents from .opencode/agent-models.jsonc,
#                   not from .claude/agents/.
#   tools         — the tools: list from the agent frontmatter, if present.
roles:
  # T900858: three thin domain primaries over the OMO engine, replacing the
  # six bachelorprojekt-* domain agents.
  bp-build:
    claude_code: opus
    agy: unsupported
    opencode: null
  bp-run:
    claude_code: sonnet
    agy: unsupported
    opencode: null
  bp-ship:
    claude_code: sonnet
    agy: unsupported
    opencode: null

# Runtime definitions from .opencode/agent-models.jsonc. Every entry here MUST
# correspond to an actual agent in the opencode agent config.
#
# write_capable: true if the agent permission block has write: "allow".
runtimes:
  # 2026-09-16: die fuenf Familien-Handles (gptoss, devstral, gemma, gemma12,
  # qwen38) zeigten alle auf dasselbe FreeToken-Modell — kollabiert zum einen
  # `local`-Handle (ein Resident-Checkpoint, ein Radix-Cache, single-flight;
  # Proxy queuet ≤3 sequenzielle Dispatches auf ≤200k served KV).
  # Entfernt: alibaba-intl-Drittschiene (qwen-cloud, helper-alibaba,
  # pro-alibaba, alibaba-primary) — 2-Rail-Entscheidung (Go + direkt).
  # Details siehe docs/agent-guide/registry/retired.md.
  local:
    mode: subagent
    model: llamacpp-local/Qwen3.8-27B
    write_capable: false
    note: "Higher-capability local implementation subagent: Qwen3.8-27B GSQ-RCO IQ3_XXS-mtp via llama.cpp :1919 (RTX 5070 Ti, 153600 served KV, ~98-106 tok/s decode, gemessen 2026-10-03) [T900365]. Sequential dispatch with per-packet budget_tokens (S ~32k / M ~80k / L ~100k)."
  reviewer:
    mode: subagent
    model: llamacpp-local/Qwen3.8-27B
    write_capable: false
    note: "Reviewer role — read/grep/glob/tests only; no edit/write/bash/task dispatch (Orchestrator applies review edits) [T900074]"
  # orchestrator: Slim-first — der interaktive Orchestrator kommt aus dem
  # oh-my-opencode-slim-Plugin (Modell-Pinning: .opencode/oh-my-opencode-slim.jsonc),
  # nicht aus agent-models.jsonc (P4.3-Bidirektionalitaet).
  exe-muse:
    mode: subagent
    model: opencode-go/muse-spark-1.3-contributor
    write_capable: true
    note: "EXECUTOR on Muse Spark 1.3 Contributor via OpenCode Go (subscription rail, 1M ctx, 131k output) [T900210]. Dispatched by the Slim orchestrator (same Go rail, .opencode/oh-my-opencode-slim.jsonc) and the bp-* primaries for oversized/under-specified work; Zen-free remains a manual fallback (T900751: DeepSeek rails removed)."
  bp-build:
    mode: primary
    model: llamacpp-local/Qwen3.8-27B
    write_capable: true
    note: "PRIMARY: build — manifests, Kustomize overlays, Taskfile, environments, sealed secrets. Thin domain entry over the OMO engine (local Qwen3.8-27B :1919) [T900858]."
  bp-run:
    mode: primary
    model: llamacpp-local/Qwen3.8-27B
    write_capable: true
    note: "PRIMARY: run — live cluster ops via task workspace:* and kubectl, postgres reads. Thin domain entry over the OMO engine (local Qwen3.8-27B :1919), read-only filesystem for manifests [T900858]."
  bp-ship:
    mode: primary
    model: opencode-go/muse-spark-1.3-contributor
    write_capable: true
    note: "PRIMARY: ship — BATS/Playwright, Astro/Svelte website, brand pages, test inventory. Thin domain entry over the OMO engine (Muse Spark via Go) [T900858]."
  plan-worker-self:
    mode: primary
    model: llamacpp-local/Qwen3.8-27B
    write_capable: true
    note: "plan-runner self-execution worker on the local Qwen3.8-27B IQ3_XXS-mtp (llama.cpp :1919, RTX 5070 Ti; not the Slim orchestrator model, which plans on Muse Spark via Go). Executes one plan partial in one go when all worker slots are busy and :1919 answers the preflight; started by scripts/llm/plan-runner.mjs [T900504, T016656]."
  plan-worker-muse:
    mode: primary
    model: opencode/muse-spark-1.3-contributor-free
    write_capable: true
    note: "Primary plan partial worker on Muse Spark 1.3 (opencode catalog, free/Go). Cloud track of scripts/llm/plan-runner.mjs via dispatch_cloud (--cloud-slots, default 1) for partials the in-process direct worker cannot handle [T016656]."
