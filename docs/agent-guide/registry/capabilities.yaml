# docs/agent-guide/registry/capabilities.yaml
# SSOT Toolset Capability Registry
#
# Führt Fähigkeiten auf, ordnet ihnen die Instanzen zu, die sie liefern können, und hält fest,
# WANN eine Instanz benutzt werden soll. Zwei Zuständigkeiten, bewusst in einer Datei:
#   - Auswahl:  welche Instanz ein Harness benutzen darf   (state, reason)
#   - Nutzung:  wann sie einzusetzen ist und wann nicht    (use_when, avoid_when, fallback, …)
#
# Abgrenzung: `mcp.yaml` bleibt SSOT für die *Erreichbarkeit* eines Servers (Transport,
# Endpunkt, Credentials). Diese Datei ist SSOT für *Auswahl und Nutzung*.
#
# Schema je Instanz — vollständig in
# .agents/plans/toolset-usage-injection/CONTRACT.md §1:
#
#   <kind>:<id>:            # kind ∈ mcp | plugin | skill | cli | agent
#     state:      canonical | suppressed | unreviewed
#     reason:     PFLICHT wenn state != canonical
#     use_when:   PFLICHT wenn state == canonical. Eine Zeile, ≤ 120 Zeichen.
#     avoid_when: optional. Eine Zeile.
#     fallback:   optional. Konkreter Befehl/Pfad.
#     roles:      PFLICHT wenn state == canonical. Volle Rollennamen oder `all`.
#     tier:       optional. safe | caution | assisted | dangerous
#     deep_ref:   optional. Repo-relativer Pfad auf die Tiefenreferenz.
#
# `node scripts/toolset/check.mjs` erzwingt das fail-closed. Unkuratierte Funde meldet es als
# `unreviewed`, ohne CI rot zu machen — auflösen mit dem Skill `toolset-curate`.
# Den rollengefilterten Prompt-Block rendert `bash scripts/toolset-context.sh <rolle>`.
# harnesses: Aufgabe/Anbieter/Rollen je Harness (T900791), Messprotokoll: docs/agent-guide/registry/harness-config-targets.md
#
# Gültige Rollen:
#   bp-build | bp-run | bp-ship | orchestrator | big-pickle | omp | openclaw-ops | all   (SSOT: scripts/toolset/lib/roles.mjs, T900980)
---
capabilities:

  # ─── Versionsverwaltung & GitHub ────────────────────────────────────────────────────
  github:
    cli:gh-axi:
      state: canonical
      use_when: "GitHub-Read/View-Flows zur Anzeige: PRs, Issues, Runs, Releases, Labels."
      avoid_when: "Antwort wird maschinell geparst (--json/-q/--jq, jq-Pipelines), Polling-Loops oder Mutationen — gh-axi liefert TOON-Text und ignoriert --json still mit Exit 0 (T004612); dort gh direkt."
      fallback: "gh (maschinelles Parsen, Polling, Mutationen, nicht abgedeckte Kommandos)"
      roles: [all]
      tier: caution
      deep_ref: ".claude/skills/references/gh-axi.md"
    plugin:github@claude-plugins-official:
      state: suppressed
      reason: "Doppelt gh-axi und zieht rund 40 Tool-Schemata in den Kontext."

  git-lebenszyklus:
    skill:git-workflow:
      state: canonical
      use_when: "Commit, Push, PR, CI-Fix-Schleife, Auto-Merge, Worktree-Cleanup."
      avoid_when: "Reine Leseoperationen auf der Historie."
      roles: [all]
      tier: caution
      deep_ref: ".claude/skills/git-workflow/SKILL.md"
    plugin:commit-commands@claude-plugins-official:
      state: suppressed
      reason: "git-workflow ist der repo-spezifische Pfad und kennt Scope-Allowlist und Guards."

  # ─── Cluster & Datenbank ────────────────────────────────────────────────────────────
  kubernetes-inspektion:
    mcp:mcp-kubernetes:
      state: canonical
      use_when: "Pods, Logs, Events, Nodes und Ressourcen lesen — Status statt Mutation."
      avoid_when: "Jede Mutation: apply, rollout restart, scale, delete."
      fallback: "kubectl --context fleet get/logs (bei Portforward-Ausfall)"
      roles: [bp-build, bp-run, openclaw-ops, orchestrator]
      tier: safe
      # T900983: Mutationen einzeln hochgestuft (destructiveHint laut Probe + pods_run).
      tool_tiers:
        pods_exec: dangerous
        pods_delete: dangerous
        resources_delete: dangerous
        resources_create_or_update: caution
        resources_scale: caution
        pods_run: caution
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  kubernetes-mutation:
    cli:kubectl:
      state: canonical
      use_when: "Cluster-Mutationen: apply, rollout restart, scale, delete, RBAC, Sealed Secrets."
      avoid_when: "Reine Status-Abfragen — dafür mcp-kubernetes."
      fallback: "task workspace:deploy ENV=<brand> (break-glass; primär ist Flux)"
      roles: [bp-build, bp-run]
      tier: dangerous
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  postgres-lesen:
    mcp:mcp-postgres:
      state: canonical
      use_when: "Read-only SQL gegen die mentolder-DB, Nicht-Ticket-Tabellen."
      avoid_when: "INSERT/UPDATE/DELETE/DDL — jede Query läuft READ ONLY und scheitert."
      fallback: "kubectl exec -i … psql (ohne -i läuft psql mit leerem stdin durch)"
      roles: [bp-run, orchestrator, big-pickle]
      tier: safe
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  postgres-schreiben:
    cli:psql-via-kubectl:
      state: canonical
      use_when: "Schreibende SQL, DDL und Superuser-Operationen als postgres."
      avoid_when: "Prod-Namespaces ohne prod-write-guard.sh — für Subagenten verboten."
      fallback: "scripts/prod-write-guard.sh check <namespace> <sql>"
      roles: [bp-run]
      tier: dangerous
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  datenbank-betrieb:
    skill:database-specialist:
      state: canonical
      use_when: "Migrationen, Index-Optimierung, EXPLAIN ANALYZE, Backup und Restore."
      roles: [bp-run]
      tier: assisted
      deep_ref: ".claude/skills/database-specialist/SKILL.md"

  # ─── Tickets und Pläne ──────────────────────────────────────────────────────────────
  ticket-lebenszyklus:
    mcp:ticket-mcp-node:
      state: canonical
      use_when: "Tickets lesen, anlegen, Status setzen, Phasen-Events schreiben."
      avoid_when: "Plan stagen — das macht devflow-mcp plan_stage (stage_plan ist unterdrückt)."
      fallback: "scripts/ticket.sh (sanktionierter Write-Pfad, worktree-tauglich)"
      roles: [bp-run, bp-ship, orchestrator]
      tier: caution
      # T900983: Lesepfade safe, nicht rücknehmbare Mutationen dangerous; Rest erbt caution.
      tool_tiers:
        "get_*": safe
        "list_*": safe
        "export_*": safe
        archive_plan: dangerous
        flush_mishap_buffer: dangerous
        backfill_ticket_id: dangerous
      # T900985: einziger Weg zum Stagen ist devflow-mcp plan_stage (Worktree + Lint + Push +
      # stage-plan --hold); stage_plan scheiterte im Worktree und übersprang den Lint.
      tools_suppressed: [stage_plan]
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  devflow-kontext:
    mcp:devflow-mcp:
      state: canonical
      use_when: "Vor jedem Auftrag context_for_task (Code, Pläne, Werkzeuge per Rerank); Pläne mit plan_stage stagen."
      avoid_when: "Exakte Textsuche — dafür grep/search_code von codebase-memory."
      fallback: "bash scripts/toolset-context.sh <rolle> + bash scripts/plan-context.sh <rolle>"
      roles: [bp-build, bp-run, bp-ship, orchestrator]
      tier: caution
      # T900985: Lesetools safe, plan_stage pusht (assisted), lock erbt caution.
      tool_tiers:
        context_for_task: safe
        recommend_tools: safe
        search_code: safe
        graph_status: safe
        plan_lint: safe
        collision_check: safe
        ci_status: safe
        task_oracle: safe
        plan_stage: assisted
      deep_ref: ".claude/skills/references/mcp-tool-guide.md"

  ticket-inhalt:
    skill:ticket-ops:
      state: canonical
      use_when: "Kompatibilitäts-Einstieg für unklare Ticket-Inhaltsanfragen; routet zu Triage oder Dispatch."
      avoid_when: "Repo-Zustand — Branches, Worktrees und PRs gehören zu repo-hygiene."
      roles: [orchestrator]
      tier: safe
      deep_ref: ".claude/skills/ticket-ops/SKILL.md"

  ticket-triage:
    skill:ticket-triage:
      state: canonical
      use_when: "Triage, Definition of Readiness, fehlende Angaben, Klärungsrunde und Batch-Kandidaten ohne Dispatch."
      avoid_when: "Wellen planen oder Arbeit dispatchen — dafür ticket-dispatch."
      roles: [orchestrator]
      tier: safe
      deep_ref: ".claude/skills/ticket-triage/SKILL.md"

  ticket-dispatch:
    skill:ticket-dispatch:
      state: canonical
      use_when: "Abhängigkeitswellen, Parallelisierungsplan, Konfliktprüfung und freigegebener Wave-1-Dispatch."
      avoid_when: "Ticket-Fakten erheben oder menschliche Rückfragen klären — dafür ticket-triage."
      roles: [orchestrator]
      tier: assisted
      deep_ref: ".claude/skills/ticket-dispatch/SKILL.md"

  repo-task-ausfuehrung:
    mcp:mcp-task-runner:
      state: canonical
      use_when: "Taskfile-Ziele auflösen und ausführen, Task-Graph inspizieren."
      fallback: "bash scripts/vda.sh oracle '<ziel in klarem Deutsch>'"
      roles: [orchestrator, openclaw-ops]
      tier: caution
      # T900983: Inspektion safe; Ausführen (run_task*, execute_plan, cancel_task) erbt caution.
      tool_tiers:
        get_task_graph: safe
        get_task_result: safe
        plan_tasks: safe

  externes-task-management:
    mcp:task-master-ai:
      state: suppressed
      reason: "Kein erreichbarer Server: task-master-ai existiert weder in docs/agent-guide/registry/mcp.yaml noch in .opencode/opencode.jsonc. PRD-getriebene Task-Zerlegung laeuft ueber ticket-mcp und die dev-flow-Skills."

  mishap-erfassung:
    skill:mishap-tracker:
      state: canonical
      use_when: "Am Ende jedes dev-flow-Skills die gesammelten Frictionen als ein Ticket melden."
      fallback: "bash scripts/hooks/mishap-tracker.sh --friction '<text>'"
      roles: [all]
      tier: safe
      deep_ref: ".claude/skills/mishap-tracker/SKILL.md"

  # ─── Entwicklungs-Workflow ──────────────────────────────────────────────────────────
  entwicklungs-planung:
    skill:dev-flow-plan:
      state: canonical
      use_when: "Startpunkt jeder Änderung: Pfadwahl, Brainstorming, Spec und Plan."
      avoid_when: "Wartung ohne Verhaltensänderung — das ist dev-flow-chore."
      roles: [orchestrator]
      tier: caution
      deep_ref: ".claude/skills/dev-flow-plan/SKILL.md"
    plugin:feature-dev@claude-plugins-official:
      state: suppressed
      reason: "dev-flow-plan ist der repo-eigene Pfad inklusive plan- und Ticket-Anbindung."

  plan-umsetzung:
    skill:dev-flow-execute:
      state: canonical
      use_when: "Einen gestageten Plan implementieren, verifizieren und den PR mergen."
      avoid_when: "Ohne gestageten Plan — dann zuerst dev-flow-plan."
      roles: [orchestrator]
      tier: caution
      deep_ref: ".claude/skills/dev-flow-execute/SKILL.md"

  wartung:
    skill:dev-flow-chore:
      state: canonical
      use_when: "Doku, Dependency-Bumps, Config, Umbenennungen, Cleanup — ohne Verhaltensänderung."
      avoid_when: "Sobald sich das Verhalten der Software ändert — dann dev-flow-plan."
      roles: [orchestrator]
      tier: caution
      deep_ref: ".claude/skills/dev-flow-chore/SKILL.md"

  e2e-tests:
    skill:dev-flow-e2e:
      state: canonical
      use_when: "Playwright-Tests gegen die Live-Marken NACH Merge und Deploy."
      avoid_when: "Unit- und BATS-Tests während der Implementierung."
      roles: [bp-ship]
      tier: caution
      deep_ref: ".claude/skills/dev-flow-e2e/SKILL.md"

  playwright-best-practices:
    skill:playwright-best-practices:
      state: canonical
      use_when: "Best Practices beim Schreiben robuster Playwright-Tests: Locators, Auto-Waiting, Page Objects, Fixtures, Anti-Flakiness."
      avoid_when: "Lifecycle, Deployment-Gates und Test-Inventory-Aktualisierung im Bachelorprojekt — dafür dev-flow-e2e."
      roles: [bp-ship]
      tier: safe
      deep_ref: ".claude/skills/playwright-best-practices/SKILL.md"

  unit-tests:
    skill:vitest:
      state: canonical
      use_when: "Vitest-Tests schreiben, Mocking, Coverage und Test-Filter im website-Paket."
      roles: [bp-ship]
      tier: safe
      deep_ref: ".claude/skills/vitest/SKILL.md"

  pytest-patterns:
    skill:pytest-patterns:
      state: canonical
      use_when: "Pytest-Tests, Fixtures, Parametrisierung und CLI/Subprocess-Testmuster fuer Python und DevOps."
      roles: [bp-ship]
      tier: safe
      deep_ref: ".claude/skills/pytest-patterns/SKILL.md"

  abhaengigkeits-pflege:
    skill:update-dependencies:
      state: suppressed
      reason: "Archivierte Routine mit ueberholten Pfaden; nur explizit als historische Referenz nutzen."

  # ─── Betrieb & Infrastruktur ────────────────────────────────────────────────────────
  vorfall-behandlung:
    skill:incident-response:
      state: canonical
      use_when: "Ein Kerndienst ist ausgefallen oder degradiert — zeitkritische Triage."
      avoid_when: "Nicht-dringende Repo-Pflege."
      roles: [bp-run]
      tier: assisted
      deep_ref: ".claude/skills/incident-response/SKILL.md"

  infrastruktur-runbook:
    skill:infra-ops:
      state: canonical
      use_when: "Nur auf ausdrückliche Anfrage: Cluster-Setup, Deploy, Netz, SSO, Secrets, Migration."
      avoid_when: "Automatisch auslösen — der Skill ist ausdrücklich invoke-only."
      roles: [bp-build]
      tier: dangerous
      deep_ref: ".claude/skills/infra-ops/SKILL.md"

  repo-hygiene:
    skill:repo-hygiene:
      state: canonical
      use_when: "Stale Branches und Worktrees, offene PRs, Issue-Intake."
      avoid_when: "Ticket-Inhalt — Triage und Vollständigkeit gehören zu ticket-ops."
      roles: [orchestrator]
      tier: caution
      deep_ref: ".claude/skills/repo-hygiene/SKILL.md"

  betriebs-routing:
    skill:operations-management:
      state: canonical
      use_when: "Wenn unklar ist, ob incident-response, ticket-ops oder repo-hygiene zuständig ist."
      avoid_when: "Wenn die Zuständigkeit feststeht — dann direkt den passenden Skill."
      roles: [orchestrator]
      tier: safe
      deep_ref: ".claude/skills/operations-management/SKILL.md"

  ops-broker:
    cli:openclaw-ask:
      state: canonical
      use_when: "Vage Ops-Aufgabe synchron an OpenClaw task-runner geben: bash scripts/openclaw-ask.sh '<aufgabe>'."
      avoid_when: "mutierende Aktionen — OpenClaw empfiehlt nur"
      roles: [orchestrator, openclaw-ops]
      tier: safe
      deep_ref: "docs/runbooks/openclaw-ops-bot.md"

  gitops-wissen:
    skill:gitops-knowledge:
      state: canonical
      use_when: "Flux-Konzepte erklären und schema-validiertes YAML für Flux-CRDs erzeugen."
      roles: [bp-build]
      tier: safe
      deep_ref: ".claude/skills/gitops-knowledge/SKILL.md"

  gitops-cluster-debug:
    skill:gitops-cluster-debug:
      state: canonical
      use_when: "Flux auf dem Live-Cluster diagnostizieren: stuck, not-ready, Artefakt-Pull."
      avoid_when: "Repo-Dateien prüfen — dafür gitops-repo-audit."
      roles: [bp-build, bp-run]
      tier: caution
      deep_ref: ".claude/skills/gitops-cluster-debug/SKILL.md"

  gitops-repo-audit:
    skill:gitops-repo-audit:
      state: canonical
      use_when: "GitOps-Repo-Dateien prüfen: Schema, veraltete APIs, RBAC, Secrets."
      avoid_when: "Live-Cluster-Zustand — dafür gitops-cluster-debug."
      roles: [bp-build]
      tier: safe
      deep_ref: ".claude/skills/gitops-repo-audit/SKILL.md"

  system-audit:
    skill:system-audit:
      state: canonical
      use_when: "Audit über alle Systeme anfragen (GitOps-Repo, Live-Cluster, Website, Repo, Toolset, Security, DB, LLM-Pipeline, Authored-Docs) — endet je Befund in Ticket + plan-Proposal."
      avoid_when: "Akute Störung — dafür incident-response; Tiefe eines Einzel-Audits bleibt beim Spezial-Skill."
      roles: [orchestrator]
      tier: safe
      deep_ref: ".claude/skills/system-audit/SKILL.md"

  # ─── Sicherheit ─────────────────────────────────────────────────────────────────────
  security-analyse:
    skill:security-specialist:
      state: canonical
      use_when: "SealedSecrets, Pocket-ID-OIDC-Clients, DSGVO-Prüfung, Secret-Rotation."
      avoid_when: "Allgemeine Code-Sicherheit — dafür secure-coding-guidance."
      roles: [bp-build]
      tier: dangerous
      deep_ref: ".claude/skills/security-specialist/SKILL.md"

  secure-coding-guidance:
    plugin:security-guidance@claude-plugins-official:
      state: canonical
      use_when: "Warnt beim Schreiben von Code vor unsicheren Mustern (Injection, unsicheres Parsen)."
      avoid_when: "Repo-Secrets und OIDC — dafür security-specialist."
      roles: [all]
      tier: safe
    plugin:semgrep@claude-plugins-official:
      state: suppressed
      reason: "Nicht aktiviert; CI deckt den Secret-Scan über gitleaks 8.18.2 ab."

  tresor-zugriff:
    mcp:warden:
      state: canonical
      use_when: "Persönliche Tresor-Credentials lesen; Schreiben nur nach Rückfrage."
      roles: [bp-build, orchestrator]
      tier: caution
      # T900983: Löschen dangerous (destructiveHint laut Probe); Metadaten ohne Geheimnis safe;
      # Lesen von Passwörtern/TOTP/Notizen und alle Schreibpfade erben caution.
      tool_tiers:
        "keychain_delete_*": dangerous
        keychain_send_delete: dangerous
        keychain_send_remove_password: dangerous
        "keychain_list_*": safe
        keychain_status: safe
        keychain_sdk_version: safe
        keychain_search_items: safe

  # ─── Wissen & Recherche ─────────────────────────────────────────────────────────────
  code-graph:
    mcp:codebase-memory-mcp:
      state: canonical
      use_when: "Bekanntes Symbol oder Call-Chain gesucht: K3-Präzisionsschicht zuerst (Details: docs/brain/recall-routing.md)."
      avoid_when: "Semantische Was-Fragen (dafür K1-Embeddings) und Doktrin/Prozess (dafür docs/ direkt)."
      fallback: "Grep/Glob; bei nicht indiziertem Projekt zuerst index_repository"
      roles: [all]
      tier: safe

  code-graph-interpretation:
    skill:code-graph-interpretation:
      state: canonical
      use_when: "K3-Codegraph lesen oder erklären, Call-Chain und Change-Impact aus Graphkanten prüfen, Graphbefund gegen Quellcode verifizieren."
      roles: [all]
      tier: safe

  embedding-rerank:
    mcp:bge-mcp:
      state: canonical
      use_when: "Semantische Was-Fragen über Code, Specs und Docs: K1-Roh-Recall zuerst (docs/brain/recall-routing.md)."
      avoid_when: "Wenn bge-embed im Cluster nicht Ready ist; bei bekanntem Symbol zuerst K3-Graph."
      roles: [orchestrator]
      tier: safe

  dokumentations-lookup:
    mcp:context7:
      state: canonical
      use_when: "Aktuelle Doku zu Bibliotheken, Frameworks, SDKs und CLIs statt aus dem Gedächtnis."
      avoid_when: "Refactoring, Business-Logik, allgemeine Programmierkonzepte."
      roles: [all]
      tier: safe
    plugin:context7@claude-plugins-official:
      state: suppressed
      reason: "Doppelt mcp:context7; der Plugin-Endpoint verlangt Auth, der MCP-Server funktioniert anonym."

  websuche:
    plugin:brightdata-plugin@claude-plugins-official:
      state: suppressed
      reason: "21 Skills im Prompt jeder Runde, laut /skill-doctor (2026-09-11) nie aufgerufen; Websuche läuft über die eingebauten WebSearch/WebFetch-Tools."

  # ─── Frontend ───────────────────────────────────────────────────────────────────────
  website-entwicklung:
    skill:website-specialist:
      state: canonical
      use_when: "Astro- und Svelte-Komponenten, Seiten-Routing, Content und UI im website-Paket."
      roles: [bp-ship]
      tier: caution
      deep_ref: ".claude/skills/website-specialist/SKILL.md"

  ui-design:
    plugin:frontend-design@claude-plugins-official:
      state: suppressed
      reason: "Generisch; das Kore-Designsystem ist in WEBSITE-STANDARDS.md verbindlich."

  interaktives-artefakt:
    skill:lavish:
      state: canonical
      use_when: "Plan, Vergleich, Diagramm oder Report als annotierbares HTML zum Review geben."
      avoid_when: "Ohne vorherige Zustimmung — der Skill hat ein Consent-Gate."
      roles: [orchestrator]
      tier: safe
      deep_ref: ".claude/skills/lavish/SKILL.md"

  web-audit:
    skill:web-audit:
      state: canonical
      use_when: "Brand-Seiten semantisch prüfen: axe, Lighthouse und LLM-Triage manuell gegen die Live-Marken."
      avoid_when: "PR-Entscheidungen — der Skill ist bewusst kein Merge-Gate."
      fallback: "task web:audit ENV=<brand> [WEB_AUDIT_ROUTES=...]"
      roles: [bp-ship]
      tier: assisted
      deep_ref: ".claude/skills/web-audit/SKILL.md"

  # ─── Browser & Debugging ────────────────────────────────────────────────────────────
  browser-automation:
    plugin:chrome-devtools-mcp@claude-plugins-official:
      state: canonical
      use_when: "Seiten debuggen: DOM, Konsole, Netzwerk, Performance, Screenshots."
      avoid_when: "E2E-Testsuiten — die laufen über die Playwright-CLI in dev-flow-e2e."
      roles: [bp-ship]
      tier: caution
    mcp:playwright:
      state: suppressed
      reason: "Nicht project-relevant; E2E läuft über die Playwright-CLI in dev-flow-e2e."
    plugin:playwright@claude-plugins-official:
      state: suppressed
      reason: "Doppelt den chrome-devtools-Pfad und die Playwright-CLI."
    plugin:superpowers-chrome@superpowers-marketplace:
      state: suppressed
      reason: "Read-only-Browser-Agent; chrome-devtools-mcp deckt den Bedarf vollständig ab."

  # ─── Sprachwerkzeuge ────────────────────────────────────────────────────────────────
  lsp-symbol-lookup:
    plugin:typescript-lsp@claude-plugins-official:
      state: canonical
      use_when: "Typen, Signaturen und Referenzen in TypeScript und Svelte präzise auflösen."
      avoid_when: "Python — dafür wäre pyright-lsp nötig, das hier nicht aktiviert ist."
      roles: [bp-ship]
      tier: safe
    plugin:pyright-lsp@claude-plugins-official:
      state: suppressed
      reason: "Kein nennenswerter Python-Anteil im Repo."

  # ─── Review & Codequalität ──────────────────────────────────────────────────────────
  code-review:
    plugin:pr-review-toolkit@claude-plugins-official:
      state: canonical
      use_when: "PR-Review vor dem Merge: Bugs, stille Fehler, Testabdeckung, Typdesign."
      avoid_when: "Reine Vereinfachung ohne Fehlersuche — dafür der /simplify-Pfad."
      roles: [bp-ship, orchestrator]
      tier: safe
    plugin:code-review@claude-plugins-official:
      state: suppressed
      reason: "pr-review-toolkit deckt dieselbe Fähigkeit mit spezialisierten Agenten ab."
    plugin:code-simplifier@claude-plugins-official:
