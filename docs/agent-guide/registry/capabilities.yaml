  # ─── ML & Training ──────────────────────────────────────────────────────────────────
  # T900377: der vendorte Skill unsloth-buddy wurde aus dem Repo entfernt, damit
  # modell-finetuning hat aktuell keine Instanz. Der generische Unsloth/TRL-Zugriff
  # laeuft bis auf Weiteres ueber die Upstream-Referenz; eine erneute Besetzung dieser
  # Faehigkeit ist eine Routing-Entscheidung und wird nicht mitgesettet.
  modell-finetuning: {}

  # Eigene Faehigkeit statt einer zweiten canonical-Instanz unter modell-finetuning: das
  # Registry-Schema erlaubt maximal eine canonical-Instanz je Faehigkeit (siehe
  # scripts/toolset/lib/registry.mjs). modell-finetuning deckt die generische
  # Unsloth/TRL-API-Faehigkeit ab; diese hier ist die Repo-eigene
  # Orchestrierung darueber (Vorbedingungs-Gates, Taskfile.finetune.yml) — dasselbe Muster
  # wie die Trennung von huggingface-hub-operationen von modell-finetuning (T002596).
  finetune-pipeline:
    cli:scripts/finetune:
      state: canonical
      use_when: "Repo-Trainingslauf durchfuehren: Messschritt (measure_corpus.py) vor jeder Modellwahl, Template-Guard vor jedem Training, dann finetune:train/export ueber Taskfile.finetune.yml."
      avoid_when: "Reine Unsloth/TRL-API-Fragen ohne Bezug zu diesem Repo-Subsystem — dafuer die Unsloth/TRL-Upstream-Referenz direkt."
      fallback: "Upstream-Referenzcode manuell adaptieren, wenn Taskfile.finetune.yml nicht verfuegbar ist."
      roles: [bp-run, orchestrator]
      tier: assisted

  # huggingface-skills lag bis T002596 unter `modell-finetuning` und war dort suppressed,
  # weil der damalige Vendor-Trainings-Skill die kanonische Instanz war. Der Schnitt war
  # falsch: das Paket liefert Hub-Operationen (hf-cli, Spaces, Datasets, Papers,
  # SageMaker-Deployment), von denen Finetuning nur ein Teil ist. Als eigene Fähigkeit
  # konkurriert es nicht mehr mit der Trainings-Instanz — beide dürfen nebeneinander
  # kanonisch sein.
  huggingface-hub-operationen:
    plugin:huggingface-skills@claude-plugins-official:
      state: canonical
      use_when: "Hugging-Face-Hub bedienen: hf-CLI, Modelle/Datasets suchen, Spaces, GGUF-Auswahl."
