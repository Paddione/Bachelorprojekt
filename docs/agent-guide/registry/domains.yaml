# docs/agent-guide/registry/domains.yaml
# SSOT Frontend-Domain-Registry — jeder öffentlich erreichbare Host dieses
# Projekts, erhoben aus den Ingress/IngressRoute-Manifesten unter prod-fleet/
# und dev-local/. korczewski-prod/k3d-Renderings sind ueber kanonische
# prodmesh-Eintraege mit manifest_source auf der Render-Basis abgedeckt;
# flux/** ist DECOMMISSIONED (kein Sync) und vom Scan ausgenommen. Prüfen mit:
#
#     task domains:check            # fail-closed: unbekannter Manifest-Host -> Exit != 0
#     task domains:map              # erzeugt docs/agent-guide/maps/domains-map.md
#
# Felder je Eintrag:
#   id              eindeutiger Bezeichner
#   host            Host wie im Manifest (Template-Platzhalter ${...} bleiben wörtlich)
#   mesh            devmesh | prodmesh (`fleet` ist Alias für `prodmesh`)
#   namespace       Kubernetes-Namespace des Ingress
#   paths           Liste der Pfade (z. B. ["/"])
#   service         Backend als name:port
#   auth            oidc | open | basic | token
#   owner_frontend  verantwortliches Frontend-Team
#   sso             optional (nur bei auth: oidc): client_id (Pocket-ID-Client), gate
#                   (native | oauth2-proxy | issuer), groups (erlaubte Gruppen),
#                   gate_manifest (optional: Datei, die den Proxy deklariert).
#                   Soll-Ist-Abgleich + Zertifikat: task domains:graph
#   manifest_repo   optional: Manifest liegt in anderem Repo (z. B. home) -> manifest_source wird hier nicht auf Platte geprueft
#   functions       Liste der Funktions-Strings (Funktions-Matrix)
#   status          live | frozen | retired
#   manifest_source repo-relative YAML-Datei, die den Host deklariert
#   decision        optional: erklärt Split/Redirect bei doppelter Live-Funktion
#
# FUNKTIONS-MATRIX: Beanspruchen zwei status:live-Einträge desselben Mesh
# denselben Funktions-String, muss mindestens einer der beiden ein decision-
# Feld tragen, das den Split/Redirect erklärt — sonst ist der Guard rot.
# Einen Eintrag nie löschen (retired/frozen stehen lassen) — einzige Ausnahme:
# Marken-Abriss (brand-trennung 2026-11-01): mentolder-Einträge sind ersatzlos
# entfallen, weil ihre manifest_source-Dateien aus dem Repo gelöscht wurden.
---
domains:
  - id: website-korczewski
    host: web.${PROD_DOMAIN}
    mesh: prodmesh
    namespace: website-korczewski
    paths: ["/", "/_astro/"]
    service: website:80
    auth: open
    owner_frontend: bp-ship
    functions: [frontend]
    status: frozen
    manifest_source: prod-fleet/website-korczewski/website-ingress-web.yaml
    decision: "D1: frozen bis Deploy-Freigabe (Backend derzeit 404); nach verifiziertem 200 auf live + expect heben."

  - id: website-staging
    host: web.${PROD_DOMAIN}
    mesh: prodmesh
    namespace: website-staging
    paths: ["/", "/_astro/"]
    service: website:80
    auth: open
    owner_frontend: bp-ship
    functions: [frontend]
    status: frozen
    manifest_source: prod-fleet/website-staging/website-ingress-web.yaml
    decision: "D1: Staging-Spiegel; frozen seit brand-trennung (realer Host web.staging.korczewski.de derzeit 000, unter prodmesh-korczewski-Env waere web.korczewski.de 404). Reaktivieren erst mit Staging-Backend + eigenem expect."

  - id: apex-korczewski
    host: ${PROD_DOMAIN}
    mesh: prodmesh
    namespace: website-korczewski
    paths: ["/"]
    service: website:80
    auth: open
    owner_frontend: bp-ship
    functions: [redirect]
    status: frozen
    manifest_source: prod-fleet/website-korczewski/website-apex.yaml
    decision: "D1: Apex leitet auf den kanonischen web-Host weiter — aktiv erst nach DNS-Cutover + Deploy (derzeit korczewski.de 404). Dann live + expect 301."

  - id: devmesh-web
    host: web.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: sdlc-console:8080
    auth: oidc
    sso:
      client_id: website
      gate: native
      groups: [workspace-users]
    owner_frontend: bp-ship
    functions: [frontend, backend]
    status: live
    expect:
      status: [302]
    manifest_source: dev-local/core/ingress.yaml
    decision: "D2: agent-board ist das kanonische devmesh-Ops-Cockpit; web.devmesh/sdlc sind Tickets/Pipeline."

  - id: devmesh-website-alias
    host: ${WEBSITE_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: website:80
    auth: open
    owner_frontend: bp-ship
    functions: [frontend]
    status: live
    expect:
      status: [200]
    manifest_source: dev-local/core/ingress.yaml
    decision: "D2: Kompat-Alias auf denselben Website-Service; kanonisch bleibt web."

  - id: devmesh-auth
    host: auth.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: core
    paths: ["/"]
    service: pocket-id:1411
    auth: oidc
    sso:
      gate: issuer
      groups: []
    owner_frontend: bp-ship
    functions: [middleware]
    status: live
    expect:
      status: [200]
    manifest_source: dev-local/core/ingress.yaml

  - id: devmesh-mail
    host: mail.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: mailpit:8025
    auth: token
    owner_frontend: bp-ship
    functions: [mail]
    status: live
    expect:
      status: [200]
    manifest_source: dev-local/core/ingress.yaml

  - id: devmesh-brain
    host: brain.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: oauth2-proxy-brain:4180
    auth: oidc
    sso:
      client_id: brain
      gate: oauth2-proxy
      groups: [workspace-users]
    owner_frontend: bp-ship
    functions: [websocket]
    status: live
    expect:
      status: [302]
    manifest_source: dev-local/components/brain/ingress.yaml

  - id: devmesh-files
    host: files.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: nextcloud:80
    auth: oidc
    sso:
      client_id: nextcloud
      gate: native
      groups: [workspace-users]
    owner_frontend: bp-ship
    functions: [files]
    status: live
    expect:
      status: [404]
    manifest_source: dev-local/components/nextcloud/ingress.yaml

  - id: devmesh-office
    host: office.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: collabora:9980
    auth: open
    owner_frontend: bp-ship
    functions: [office]
    status: live
    expect:
      status: [404]
    manifest_source: dev-local/components/collabora/ingress.yaml

  - id: devmesh-signaling
    host: signaling.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: spreed-signaling:8080
    auth: token
    owner_frontend: bp-ship
    functions: [signaling]
    status: live
    expect:
      status: [404]
    manifest_source: dev-local/components/talk/ingress.yaml

  - id: devmesh-vault
    host: vault.${DEVMESH_DOMAIN}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: vaultwarden:80
    auth: open
    owner_frontend: bp-ship
    functions: [secrets]
    status: live
    expect:
      status: [404]
    manifest_source: dev-local/components/vaultwarden/ingress.yaml

  - id: devmesh-opencode
    host: ${OPENCODE_PUBLIC_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: opencode:80
    auth: oidc
    sso:
      client_id: opencode
      gate: oauth2-proxy
      groups: [workspace-users]
    owner_frontend: bp-ship
    functions: [ops-access]
    status: live
    expect:
      status: [401]
    manifest_source: dev-local/components/opencode/ingressroute.yaml
    decision: "Ops-Einstieg hinter oauth2-proxy; eigener Host, kein FritzBox-Zugang."

  - id: devmesh-fritzbox
    host: ${FRITZ_BOX_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: oauth2-proxy-fritzbox:4180
    auth: oidc
    sso:
      client_id: fritz
      gate: oauth2-proxy
      groups: [workspace-users]
    owner_frontend: bp-ship
    functions: [ops-access]
    status: live
    expect:
      status: [401]
    manifest_source: dev-local/components/opencode/fritzbox-ingressroute.yaml
    decision: "FritzBox-Lokalzugang; eigener Host, kein Redirect auf den Public-Host."

  - id: korczewski-web-mirror
    host: ${KORCZEWSKI_PROD_WEB_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/", "/_astro/"]
    service: website:80
    auth: oidc
    sso:
      client_id: web-korczewski
      gate: oauth2-proxy
      gate_manifest: k3d/oauth2-proxy-web-korczewski.yaml
      groups: [workspace-owners]
    owner_frontend: bp-ship
    functions: [frontend]
    status: live
    expect:
      status: [401]
    manifest_source: dev-local/components/korczewski-prod/ingressroute.yaml
    decision: "Kompat-Spiegel des korczewski-Prod-Hosts ab devmesh; kanonisch bleibt prodmesh."

  - id: korczewski-apex-mirror
    host: ${KORCZEWSKI_PROD_APEX_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: website:80
    auth: open
    owner_frontend: bp-ship
    functions: [frontend]
    status: live
    expect:
      status: [404]
    manifest_source: dev-local/components/korczewski-prod/ingressroute.yaml
    decision: "Kompat-Spiegel des korczewski-Apex-Hosts ab devmesh; kanonisch bleibt prodmesh."

  - id: korczewski-auth-mirror
    host: ${KORCZEWSKI_PROD_AUTH_HOST}
    mesh: devmesh
    namespace: components
    paths: ["/"]
    service: pocket-id:1411
    auth: oidc
    sso:
      gate: issuer
      groups: []
    owner_frontend: bp-ship
    functions: [sso]
    status: live
    expect:
      status: [200]
    manifest_source: dev-local/components/korczewski-prod/ingressroute.yaml
    decision: "Kompat-Spiegel des korczewski-Pocket-ID-Hosts ab devmesh; kanonisch bleibt prodmesh (auth-korczewski)."

  - id: auth-korczewski
    host: ${POCKET_ID_DOMAIN}
    mesh: prodmesh
    namespace: workspace-korczewski
    paths: ["/"]
    service: pocket-id:1411
    auth: oidc
    sso:
      gate: issuer
      groups: []
    owner_frontend: bp-ship
    functions: [sso]
    status: frozen
    manifest_source: k3d/pocket-id.yaml
    decision: "D1: kanonischer prodmesh-Pocket-ID-Host (korczewski-prod-Render aus dieser Basis, POCKET_ID_DOMAIN=auth.korczewski.de); frozen bis Deploy-Freigabe — live derzeit nur als devmesh-Kompat-Spiegel korczewski-auth-mirror. Nach verifiziertem 200 auf live + expect heben."

  - id: devmesh-agent-board
    host: agent-board.devmesh.korczewski.de
    mesh: devmesh
    namespace: workspace
    paths: ["/"]
    service: agent-board:80
    auth: oidc
    sso:
      client_id: f88484dc-4e8f-40f4-b14f-0dace37ddb5c
      gate: native
      groups: []
    owner_frontend: bp-ship
    functions: [ops-cockpit]
    status: live
    expect:
      status: [302]
      redirect_to_contains: /api/auth/login
    manifest_repo: home
    manifest_source: apps/agent-board/k8s/ingress.yaml
    decision: "D2: kanonisches devmesh-Ops-Cockpit; Manifest im Home-Repo (apps/agent-board)."
