# docs/agent-guide/registry/mcp.yaml
# SSOT MCP Server Registry — single source of truth for MCP server
# definitions across all three agent harnesses (Claude Code, agy, opencode).
#
# Two top-level sections:
#   clients:  MCP client/harness configuration (per-server)
#   cluster:  In-cluster monolith infrastructure (5 containers)
---
# LLAMA.CPP-HARNESS (T002398): der Block harness.llamacpp haengt einen Server als
# stdio-Kindprozess an llama-server (--mcp-servers-config, Ziel scripts/llm/mcp-servers.json).
# NUR fuer transport: stdio — llama.cpp hat mit server_mcp_stdio genau eine
# Transport-Implementierung; ein llamacpp-Block an einem http-Server laesst mcp-sync
# fail-closed abbrechen. Opt-in mit Absicht: jeder Eintrag ist ein zusaetzlicher
# Kindprozess beim Modellstart.
clients:
  mcp-kubernetes:
    transport: http
    endpoint: http://localhost:18080/mcp
    browser_endpoint: http://localhost:18082/mcp
    browser_note: >-
      Fuer Browser-Clients (llama-Web-UI, http://localhost:8098) steht mcp-kubernetes
      hinter dem CORS-Proxy scripts/mcp-cors-proxy unter :18082. Grund: das
      OTS-Image kubernetes_mcp_server kann kein CORS und wirft 403 auf jede
      Anfrage mit Origin-Header (eigener CSRF-Schutz). Der Proxy beantwortet
      OPTIONS selbst, entfernt Origin/Referer beim Weiterreichen an :18080 und
      setzt die CORS-Header am Antwortweg. CLI-Harnesses (kein Origin-Header)
      koennen weiter :18080 direkt benutzen.
    harness:
      claude_code:
        type: http
        url: http://localhost:18080/mcp
      agy:
        serverUrl: http://localhost:18080/mcp
      opencode:
        type: remote
        url: http://localhost:18080/mcp
        enabled: true

  mcp-postgres:
    transport: http
    endpoint: http://localhost:13001/mcp
    brand: mentolder
    database: shared-db.workspace.svc.cluster.local/website
    scope_warning: >-
      Fest an die mentolder-DB gebunden (DATABASE_URL im postgres-Container des
      MCP-Monolithen). external_id ist nur pro Brand eindeutig — eine Abfrage nach
      einer korczewski-ID liefert still die gleichnamige mentolder-Zeile statt einer
      leeren Menge. Ticket-Reads gehören zu ticket-mcp mit explizitem brand-Argument.
    korczewski_path: >-
      Nicht-Ticket-SQL gegen die korczewski-DB läuft über kubectl exec gegen den
      shared-db-Pod in Namespace workspace-korczewski (Context fleet), nicht über
      diesen Server.
    harness:
      claude_code:
        type: http
        url: http://localhost:13001/mcp
      agy:
        serverUrl: http://localhost:13001/mcp
      opencode:
        type: remote
        url: http://localhost:13001/mcp
        enabled: true

  factory-mcp:
    transport: http
    endpoint: http://localhost:13003/mcp
    harness:
      claude_code:
        type: http
        url: http://localhost:13003/mcp
      agy:
        serverUrl: http://localhost:13003/mcp
      opencode:
        type: remote
        url: http://localhost:13003/mcp
        enabled: true

  # T002426 — bge-MCP-Shim: Embedding und Reranking als MCP-Ressource.
  # llama-server kann sich NICHT selbst als MCP-Server exponieren; --mcp-servers-config
  # ist sein MCP-*Client*-Pfad. Deshalb dieser eigene Shim
  # (scripts/bge-mcp/server.mjs). Transport ist HTTP und nicht stdio, weil die
  # llama-Web-UI beim Hinzufuegen ausschliesslich eine URL entgegennimmt — ein
  # stdio-Shim waere dort unerreichbar. Aus demselben Grund steht er NICHT in
  # scripts/llm/mcp-servers.json: die Datei nimmt nur transport: stdio auf.
  bge-mcp:
    transport: http
    endpoint: http://localhost:13005/mcp
    headers:
      Authorization: "Bearer ${BGE_MCP_TOKEN}"
    auth_note: >-
      Bind auf 127.0.0.1 plus Bearer-Token (BGE_MCP_TOKEN). Ohne gesetzten Token
      startet der Shim nicht. Der Header wird seit T002487 aus dem headers-Feld
      oben generiert — als unexpandierte ${VAR}-Referenz, damit kein Klartext in
      eine getrackte Datei geraet. Betriebsvoraussetzung ist deshalb, dass
      BGE_MCP_TOKEN in der Umgebung exportiert ist, aus der der Harness startet;
      Quelle ist ~/.config/bge-mcp/server.env, dieselbe Datei, die die
      systemd-user-Unit per EnvironmentFile= liest. Ist er nicht gesetzt,
      erscheint der Server als inaktiv und ein direkter initialize-Aufruf
      antwortet mit HTTP 401 (www-authenticate: Bearer). Der UI-Dialog der
      llama-Web-UI ("Authorization / Bearer") bleibt davon unberuehrt: llama.cpp
      bezieht den Server nicht aus dieser Registry.
    failover_note: >-
      Der Shim haelt keine eigene Failover-Logik. Welches bge-Paar antwortet,
      entscheidet website/src/lib/bge-router.ts — dieselbe Stelle, die auch die
      HTTP-Endpunkte und die Bestandsclients benutzen.
    harness:
      claude_code:
        type: http
        url: http://localhost:13005/mcp
      agy:
        serverUrl: http://localhost:13005/mcp
      opencode:
        type: remote
        url: http://localhost:13005/mcp
        enabled: true

  # task-master-ai:
  #   claude_code: npx -y task-master-ai (portable)
  #   agy:         /home/patrick/.npm-global/bin/task-master-ai (absoluter Pfad, NICHT portabel)
  #   opencode:    npx -y task-master-ai, aber enabled: false
  # Resolution: npx -y ist die portable Form (P1.2).
  task-master-ai:
    transport: stdio
    command: npx
    args:
      - -y
      - task-master-ai
    env:
      OLLAMA_BASE_URL: http://localhost:11434/api
      TASK_MASTER_TOOLS: all
    harness:
      claude_code:
        command: npx
        args: [-y, task-master-ai]
        env:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all
      agy:
        command: /home/patrick/.npm-global/bin/task-master-ai
        note: "Absoluter Pfad — nicht portabel. npx -y waere portabel, aber agy setzt den globalen Installationspfad."
        env:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all
      opencode:
        type: local
        command: [npx, -y, task-master-ai]
        enabled: false
        environment:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all

  mcp-task-runner:
    transport: stdio
    browser_endpoint: http://127.0.0.1:18235/mcp/mcp-task-runner
    command: mcp-task-runner
    args:
      - --otel-endpoint
      - localhost:4317
      - --taskfile
      - /home/patrick/Bachelorprojekt/Taskfile.yml
    # Absoluter taskfile-Pfad: nicht portabel, wird durch MCPB-Bundle ersetzt (T002301)
    bridge:
      url: http://127.0.0.1:18235/mcp/mcp-task-runner
      bind: 127.0.0.1:18235
      auth: null
    harness:
      claude_code:
        command: mcp-task-runner
        args: [--otel-endpoint, localhost:4317, --taskfile, /home/patrick/Bachelorprojekt/Taskfile.yml]
      agy:
        command: mcp-task-runner
        args: [--otel-endpoint, localhost:4317, --taskfile, /home/patrick/Bachelorprojekt/Taskfile.yml]
      opencode:
        type: local
        command: [mcp-task-runner, --otel-endpoint, localhost:4317, --taskfile, /home/patrick/Bachelorprojekt/Taskfile.yml]
        enabled: true

  # ticket-mcp: ueber den PATH-Namen referenziert (T002301). Installiert von
  # `task ticket-mcp:build` nach /usr/local/bin, analog mcp-task-runner.
  ticket-mcp:
    transport: stdio
    browser_endpoint: http://127.0.0.1:18235/mcp/ticket-mcp
    command: ticket-mcp-go
    bridge:
      url: http://127.0.0.1:18235/mcp/ticket-mcp
      bind: 127.0.0.1:18235
      auth: null
    harness:
      claude_code:
        command: ticket-mcp-go
      agy:
        command: ticket-mcp-go
      opencode:
        type: local
        command: [ticket-mcp-go]
        enabled: true
      llamacpp:
        command: ticket-mcp-go
        env:
          TICKET_MCP_REPO_ROOT: /home/patrick/Bachelorprojekt
        cwd: /home/patrick/Bachelorprojekt
        timeout_ms: 30000

  # codebase-memory-mcp: absoluter Pfad /home/patrick/.local/bin/codebase-memory-mcp
  # Nicht portabel — wird durch MCPB-Bundle ersetzt (T002301)
  codebase-memory-mcp:
    transport: stdio
    browser_endpoint: http://127.0.0.1:18235/mcp/codebase-memory-mcp
    command: /home/patrick/.local/bin/codebase-memory-mcp
    bridge:
      url: http://127.0.0.1:18235/mcp/codebase-memory-mcp
      bind: 127.0.0.1:18235
      auth: null
    harness:
      claude_code:
        command: /home/patrick/.local/bin/codebase-memory-mcp
      agy:
        command: /home/patrick/.local/bin/codebase-memory-mcp
      opencode:
        type: local
        command: [/home/patrick/.local/bin/codebase-memory-mcp]
        enabled: true
      llamacpp:
        command: /home/patrick/.local/bin/codebase-memory-mcp
        cwd: /home/patrick/Bachelorprojekt
        timeout_ms: 30000

  # ── Disabled in opencode, absent in claude_code + agy ──────
  # Diese Server existieren nur in opencode als Disabled-Overrides.
  # Sie haben kein Gegenstück in claude_code oder agy und werden hier
  # nur für die Registry-Vollständigkeit dokumentiert.

  github-mcp:
    transport: stdio
    browser_endpoint: http://127.0.0.1:18235/mcp/github-mcp
    # T002547: offizieller Go-Server github/github-mcp-server statt
    # @modelcontextprotocol/server-github — letzteres ist bei npm als
    # deprecated markiert ("Package no longer supported").
    #
    # Der Wrapper existiert aus zwei Gruenden, die beide nicht kosmetisch sind:
    # er holt den Token zur LAUFZEIT per 'gh auth token' (kein Credential auf
    # Platte), und er adressiert das Binary absolut, weil die llm-proxy-Unit
    # PATH=/usr/local/bin:/usr/bin:/bin setzt und ~/.local/bin darin fehlt.
    command: /home/patrick/Bachelorprojekt/scripts/llm/github-mcp-wrapper.sh
    bridge:
      url: http://127.0.0.1:18235/mcp/github-mcp
      bind: 127.0.0.1:18235
      auth: null
    harness:
      opencode:
        type: local
        command: [npx, -y, "@modelcontextprotocol/server-github"]
        environment:
          GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
        enabled: false
    note: "Nur in opencode (disabled). gh-axi ist der mandatierte GitHub-Pfad."

  playwright:
    transport: stdio
    command: npx
    args:
      - -y
      - "@playwright/mcp@latest"
    bridge:
      url: http://127.0.0.1:18235/mcp/playwright
      bind: 127.0.0.1:18235
      auth: null
    harness:
      claude_code:
        command: npx
        args: [-y, "@playwright/mcp@latest"]
      opencode:
        type: local
        command: [npx, -y, "@playwright/mcp@latest"]
        enabled: false
    note: "In Claude Code aktiv (T002678) — Browser-Automatisierung fuer dev-flow-e2e und web-audit. In opencode weiterhin disabled. Das offizielle Paket ist @playwright/mcp; das unscoped playwright-mcp ist ein anderes Projekt und darf hier nicht eingetragen werden."

  docfork:
    transport: stdio
    command: npx
    args:
      - -y
      - docfork
    bridge:
      url: http://127.0.0.1:18235/mcp/docfork
      bind: 127.0.0.1:18235
      auth: null
    harness:
      opencode:
        type: local
        command: [npx, -y, docfork]
        enabled: false
    note: "Nur in opencode (disabled). Vermeidet Kontext-Bloat."

  sequential-thinking:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
    bridge:
      url: http://127.0.0.1:18235/mcp/sequential-thinking
      bind: 127.0.0.1:18235
      auth: null
    harness:
      opencode:
        type: local
        command: [npx, -y, "@modelcontextprotocol/server-sequential-thinking"]
        enabled: false
    note: "Nur in opencode (disabled)."

  webresearch:
    transport: stdio
    command: npx
    args:
      - -y
      - "@mzxrai/mcp-webresearch@latest"
    bridge:
      url: http://127.0.0.1:18235/mcp/webresearch
      bind: 127.0.0.1:18235
      auth: null
    harness:
      opencode:
        type: local
        command: [npx, -y, "@mzxrai/mcp-webresearch@latest"]
        enabled: false
    note: "Nur in opencode (disabled)."

cluster:
  # In-Cluster-Monolith: k3d/default/claude-code-mcp-monolith-{deploy,svc}.yaml
  # Namespace: default, Context: fleet
  # Port-forward-Bruecke (systemd user unit):
  #   scripts/mcp-gateway/mcp-gateway.service
  #   Taskfile.agents.yml -> mcp-gateway:start
  #   kubectl port-forward svc/claude-code-mcp-monolith 18080:8080 13000:3000 13001:3001 13002:3002
  # Bekannte Defekte:
  #   T002312: Der SSOT-Spec behauptet, dieser Monolith sei dekommissioniert (falsch)
  note: "5/5 Running, 55 Restarts. Service 56d alt, Pod 18d alt."
  containers:
    - name: kubernetes
      image: quay.io/containers/kubernetes_mcp_server@sha256:ef1ede0fd73ce975de1850b7f19090d0850c4ce3e7d21d795f21de3ee8d1452c
      port: 8080
      forwarded_port: 18080
      status: live
    - name: postgres
      image: node:20-alpine (supergateway)
      port: 3001
      forwarded_port: 13001
      status: live
    - name: keycloak
      image: quay.io/sshaaf/keycloak-mcp-server@sha256:12dd5199862055eb38b5f8162cabcc27c1324471b53416389098be263ea14a46
      port: 8081
      status: defekt
      ticket: T002311
    - name: playwright
      image: mcr.microsoft.com/playwright:v1.50.1-jammy
      port: 3000
      forwarded_port: 13000
      status: live
    - name: github
      image: node:20-alpine (supergateway)
      port: 3002
      forwarded_port: 13002
      status: live
