clients:
  mcp-kubernetes:
    transport: http
    endpoint: http://localhost:18080/mcp
    harness:
      claude_code:
        type: http
        url: http://localhost:18080/mcp
      agy:
        serverUrl: http://localhost:18080/mcp
      opencode:
        type: remote
        url: http://localhost:18080/mcp
        enabled: true
      llamacpp:
        command: should-not-be-emitted
  mcp-postgres:
    transport: http
    endpoint: http://localhost:13001/mcp
    brand: mentolder
    database: shared-db.workspace.svc.cluster.local/website
    scope_warning: Fest an die mentolder-DB gebunden (DATABASE_URL im
      postgres-Container des MCP-Monolithen). external_id ist nur pro Brand
      eindeutig — eine Abfrage nach einer korczewski-ID liefert still die
      gleichnamige mentolder-Zeile statt einer leeren Menge. Ticket-Reads
      gehören zu ticket-mcp mit explizitem brand-Argument.
    korczewski_path: Nicht-Ticket-SQL gegen die korczewski-DB läuft über kubectl
      exec gegen den shared-db-Pod in Namespace workspace-korczewski (Context
      fleet), nicht über diesen Server.
    harness:
      claude_code:
        type: http
        url: http://localhost:13001/mcp
      agy:
        serverUrl: http://localhost:13001/mcp
      opencode:
        type: remote
        url: http://localhost:13001/mcp
        enabled: true
  factory-mcp:
    transport: http
    endpoint: http://localhost:13003/mcp
    harness:
      claude_code:
        type: http
        url: http://localhost:13003/mcp
      agy:
        serverUrl: http://localhost:13003/mcp
      opencode:
        type: remote
        url: http://localhost:13003/mcp
        enabled: true
  bge-mcp:
    transport: http
    endpoint: http://localhost:13005/mcp
    auth_note: Bind auf 127.0.0.1 plus Bearer-Token (BGE_MCP_TOKEN). Der Generator
      kennt kein headers-Feld; der Token wird im Harness bzw. im UI-Dialog der
      llama-Web-UI ("Authorization / Bearer") von Hand hinterlegt. Ohne
      gesetzten Token startet der Shim nicht.
    failover_note: Der Shim haelt keine eigene Failover-Logik. Welches bge-Paar
      antwortet, entscheidet website/src/lib/bge-router.ts — dieselbe Stelle,
      die auch die HTTP-Endpunkte und die Bestandsclients benutzen.
    harness:
      claude_code:
        type: http
        url: http://localhost:13005/mcp
      agy:
        serverUrl: http://localhost:13005/mcp
      opencode:
        type: remote
        url: http://localhost:13005/mcp
        enabled: true
  task-master-ai:
    transport: stdio
    command: npx
    args:
      - -y
      - task-master-ai
    env:
      OLLAMA_BASE_URL: http://localhost:11434/api
      TASK_MASTER_TOOLS: all
    harness:
      claude_code:
        command: npx
        args:
          - -y
          - task-master-ai
        env:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all
      agy:
        command: /home/patrick/.npm-global/bin/task-master-ai
        note: Absoluter Pfad — nicht portabel. npx -y waere portabel, aber agy setzt den
          globalen Installationspfad.
        env:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all
      opencode:
        type: local
        command:
          - npx
          - -y
          - task-master-ai
        enabled: false
        environment:
          OLLAMA_BASE_URL: http://localhost:11434/api
          TASK_MASTER_TOOLS: all
  mcp-task-runner:
    transport: stdio
    command: mcp-task-runner
    args:
      - --otel-endpoint
      - localhost:4317
      - --taskfile
      - /home/patrick/Bachelorprojekt/Taskfile.yml
    harness:
      claude_code:
        command: mcp-task-runner
        args:
          - --otel-endpoint
          - localhost:4317
          - --taskfile
          - /home/patrick/Bachelorprojekt/Taskfile.yml
      agy:
        command: mcp-task-runner
        args:
          - --otel-endpoint
          - localhost:4317
          - --taskfile
          - /home/patrick/Bachelorprojekt/Taskfile.yml
      opencode:
        type: local
        command:
          - mcp-task-runner
          - --otel-endpoint
          - localhost:4317
          - --taskfile
          - /home/patrick/Bachelorprojekt/Taskfile.yml
        enabled: true
  ticket-mcp:
    transport: stdio
    command: ticket-mcp-go
    harness:
      claude_code:
        command: ticket-mcp-go
      agy:
        command: ticket-mcp-go
      opencode:
        type: local
        command:
          - ticket-mcp-go
        enabled: true
      llamacpp:
        command: ticket-mcp-go
        env:
          TICKET_MCP_REPO_ROOT: /home/patrick/Bachelorprojekt
        cwd: /home/patrick/Bachelorprojekt
        timeout_ms: 30000
  codebase-memory-mcp:
    transport: stdio
    command: /home/patrick/.local/bin/codebase-memory-mcp
    harness:
      claude_code:
        command: /home/patrick/.local/bin/codebase-memory-mcp
      agy:
        command: /home/patrick/.local/bin/codebase-memory-mcp
      opencode:
        type: local
        command:
          - /home/patrick/.local/bin/codebase-memory-mcp
        enabled: true
      llamacpp:
        command: /home/patrick/.local/bin/codebase-memory-mcp
        cwd: /home/patrick/Bachelorprojekt
        timeout_ms: 30000
  github-mcp:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    harness:
      opencode:
        type: local
        command:
          - npx
          - -y
          - "@modelcontextprotocol/server-github"
        environment:
          GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
        enabled: false
    note: Nur in opencode (disabled). gh-axi ist der mandatierte GitHub-Pfad.
  playwright:
    transport: stdio
    command: npx
    args:
      - "@playwright/mcp@latest"
    harness:
      opencode:
        type: local
        command:
          - npx
          - "@playwright/mcp@latest"
        enabled: false
    note: Nur in opencode (disabled). Nicht project-relevant.
  docfork:
    transport: stdio
    command: npx
    args:
      - -y
      - docfork
    harness:
      opencode:
        type: local
        command:
          - npx
          - -y
          - docfork
        enabled: false
    note: Nur in opencode (disabled). Vermeidet Kontext-Bloat.
  sequential-thinking:
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
    harness:
      opencode:
        type: local
        command:
          - npx
          - -y
          - "@modelcontextprotocol/server-sequential-thinking"
        enabled: false
    note: Nur in opencode (disabled).
  webresearch:
    transport: stdio
    command: npx
    args:
      - -y
      - "@mzxrai/mcp-webresearch@latest"
    harness:
      opencode:
        type: local
        command:
          - npx
          - -y
          - "@mzxrai/mcp-webresearch@latest"
        enabled: false
    note: Nur in opencode (disabled).
