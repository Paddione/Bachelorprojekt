# docs/agent-guide/registry/secrets.yaml
# SSOT der Secrets-Seal-Kette: jeder Key braucht ENV-Zuordnung, Sealed-Quelle und Consumer.
# Schluessel-NAMEN sind keine Secrets (sie stehen auch Klartext in den Sealed-Manifesten);
# WERTE liegen nie im Repo (git-crypt: environments/.secrets/, versiegelt: sealed-secrets/).
# Bestehender Check (Gegenbeleg, eingebunden statt dupliziert):
#   task env:validate (taskfiles/Taskfile.platform.yml:253) prueft Env-Konfig vs. schema.yaml.
# Dieser Guard prueft die Kette schema.yaml <-> sealed-secrets/*.yaml <-> Registry.
# Erzeugung: node scripts/secrets-check.mjs --emit-map schreibt nur die Karte,
# die Registry ist Hand-Kuration (neuer Key = Eintrag hier + task secrets:check gruen).
