name: Render Fleet Artifact
on:
  workflow_call:
    inputs:
      website_image_digest:
        description: 'SHA256-Digest für das Website-Image (leer = online via crane auflösen)'
        required: false
        type: string
        default: ''
      brett_image_digest:
        description: 'SHA256-Digest für das Brett-Image (leer = online via crane auflösen)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: render-fleet-artifact-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Keyless Cosign signing: the GitHub OIDC token proves the workflow identity
  # to Sigstore (Fulcio/Rekor). Without id-token the `cosign sign` step fails.
  id-token: write

jobs:
  render-push-ping:
    name: Render, push OCI artifact, ping receiver
    runs-on: ubuntu-latest
    # UEBERGABE-TODO: FLUX_ENABLED-Repo-Variable setzen oder Bedingung anpassen.
    if: github.event_name == 'workflow_call' || vars.FLUX_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: false

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize + flux CLI + crane
        run: |
          rm -f /usr/local/bin/kustomize
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.3 /usr/local/bin
          curl -sSL https://fluxcd.io/install.sh | sudo bash
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v5
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Provide CI dummy secrets for render
        run: bash scripts/ci-dummy-secrets.sh

      - name: Resolve image digests
        id: resolve-digests
        run: |
          set -euo pipefail
          WEBSITE_DIGEST="${{ inputs.website_image_digest }}"
          if [[ -z "$WEBSITE_DIGEST" ]]; then
            # UEBERGABE-TODO: Image-Namen prüfen — weiter paddione-Images nutzen
            # (Pull-Zugang nötig) oder eigene Images bauen und hier umstellen.
            WEBSITE_DIGEST="$(bash scripts/resolve-image-digest.sh --image ghcr.io/paddione/website:latest)"
          fi

          BRETT_DIGEST="${{ inputs.brett_image_digest }}"
          if [[ -z "$BRETT_DIGEST" ]]; then
            BRETT_DIGEST="$(bash scripts/resolve-image-digest.sh --image ghcr.io/paddione/workspace-brett:latest)"
          fi

          echo "website_digest=${WEBSITE_DIGEST}" >> $GITHUB_OUTPUT
          echo "brett_digest=${BRETT_DIGEST}" >> $GITHUB_OUTPUT

      - name: Render fleet manifests to out/
        env:
          WEBSITE_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.website_digest }}
          BRETT_IMAGE_DIGEST: ${{ steps.resolve-digests.outputs.brett_digest }}
        run: task flux:render

      - name: Push OCI artifact
        id: push-artifact
        run: |
          set -euo pipefail
          # UEBERGABE-TODO: eigenes GHCR-Ziel eintragen.
          OUT="$(flux push artifact \
            oci://__GEKKO_GHCR_OWNER__/__GEKKO_ARTIFACT_NAME__:latest \
            --path=./out \
            --source="$(git config --get remote.origin.url)" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json)"
          echo "$OUT"
          echo "digest=$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')" >> "$GITHUB_OUTPUT"
          flux tag artifact \
            oci://__GEKKO_GHCR_OWNER__/__GEKKO_ARTIFACT_NAME__:latest \
            --tag "sha-${GITHUB_SHA}"

      # Keyless supply-chain signing. The signature attaches to the pushed
      # digest, so both `latest` and `sha-<GITSHA>` resolve to a verified
      # artifact. The cluster verifies via OCIRepository spec.verify
      # (flux/clusters/fleet-gekko/oci-source.yaml) with the same OIDC identity.
      # NOTE: sign by DIGEST — cosign's `oci://` prefix is for local OCI
      # layouts and would resolve host "oci" (observed failure on 2026-08-15).
      - name: Sign OCI artifact (cosign keyless)
        run: |
          set -euo pipefail
          if ! command -v cosign > /dev/null; then
            # Pinned download + SHA256 verification (supply-chain hygiene, T007048).
            COSIGN_VERSION=3.1.3
            COSIGN_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
            curl -sSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
              -o /usr/local/bin/cosign
            echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
            chmod +x /usr/local/bin/cosign
          fi
          cosign sign --yes \
            "__GEKKO_GHCR_OWNER__/__GEKKO_ARTIFACT_NAME__@${{ steps.push-artifact.outputs.digest }}"

      - name: Ping Flux receiver (immediate reconcile)
        if: success()
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
          FLUX_WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${FLUX_WEBHOOK_URL:-}" ]]; then
            echo "FLUX_WEBHOOK_URL not configured — skipping receiver ping (Flux will pick up on its 10m interval)."
            exit 0
          fi
          payload='{}'
          sig="sha256=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$FLUX_WEBHOOK_TOKEN" -hex | awk '{print $2}')"
          curl --fail --show-error --silent \
            -X POST "$FLUX_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Signature: $sig" \
            --data "$payload" \
            || { echo "Receiver ping failed (non-fatal) — Flux reconciles on its interval."; exit 0; }
