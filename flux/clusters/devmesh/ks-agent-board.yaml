---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-board
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/agent-board/k8s
  prune: true
  serviceAccountName: devmesh-tenant-deploy
  sourceRef:
    kind: GitRepository
    name: dotfiles
  dependsOn:
    - name: devmesh-workspace
  timeout: 5m0s
  wait: true
