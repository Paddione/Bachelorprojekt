apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devmesh-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: devmesh-platform
  sourceRef:
    kind: OCIRepository
    name: devmesh-manifests
  path: ./secrets
  prune: true
  wait: true
