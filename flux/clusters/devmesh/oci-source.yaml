apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: devmesh-manifests
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/paddione/devmesh-manifests
  ref:
    # Immutable Semver-Stream wie fleet (v0.0.<RUN_NUMBER> aus render-devmesh-artifact.yml).
    semver: "v0.*"
  secretRef:
    name: ghcr-auth
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: https://token.actions.githubusercontent.com
        subject: ^https://github\.com/Paddione/Bachelorprojekt/\.github/workflows/render-devmesh-artifact\.yml@refs/heads/main$
