apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
    size: medium
  sync:
    kind: GitRepository
    url: https://github.com/Paddione/Bachelorprojekt
    # T016529: kuratierte Prod-only-Auswahl (Q16) aus main. Die Workload-
    # Kustomizations beziehen das gerenderte OCI-Artefakt (fleet-manifests).
    ref: refs/heads/main
    path: flux/clusters/fleet-gekko
    interval: 10m
