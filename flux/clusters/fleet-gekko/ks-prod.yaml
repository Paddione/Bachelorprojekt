# T016529: Prod-only Kustomizations fuer den neuen gekko-fleet (Q16),
# bezogen aus dem gerenderten OCI-Artefakt (task flux:render, CI).
# staging/dev/korczewski bleiben aussen vor (Ziel devmesh).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-mentolder
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./sealed-secrets/mentolder
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./platform
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-mentolder
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./mentolder
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-website-mentolder
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./website-mentolder
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-coturn
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./coturn
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-mentolder-jobs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5m
  timeout: 10m
  dependsOn:
    - name: flux-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./mentolder-jobs
  prune: true
  force: true
  wait: false
