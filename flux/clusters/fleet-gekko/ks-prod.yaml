# T016529: Prod-only Kustomizations fuer den neuen gekko-fleet (Q16).
# staging/dev/korczewski bleiben aussen vor (Ziel devmesh). Nach dem Merge
# dieses Branches Quelle auf das OCI-Artefakt bzw. main umstellen.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-mentolder
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet-gekko-source
  path: ./environments/sealed-secrets
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: GitRepository
    name: fleet-gekko-source
  path: ./prod-fleet/platform
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-mentolder
  namespace: flux-system
spec:
  # T016529: suspendiert bis der Branch gemergt ist und das CI-Render
  # (task flux:render, OCI-Artefakt mit echten Digests + Whitelist-
  # Substitution) die Workloads liefert. Direkt-Sync ab Git wuerde die
  # Laufzeit-Variablen der eingebetteten Skripte mit substituieren.
  suspend: true
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: GitRepository
    name: fleet-gekko-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-substitutes
  path: ./prod-fleet/mentolder
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-website-mentolder
  namespace: flux-system
spec:
  # T016529: suspendiert bis der Branch gemergt ist und das CI-Render
  # (task flux:render, OCI-Artefakt mit echten Digests + Whitelist-
  # Substitution) die Workloads liefert. Direkt-Sync ab Git wuerde die
  # Laufzeit-Variablen der eingebetteten Skripte mit substituieren.
  suspend: true
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
  sourceRef:
    kind: GitRepository
    name: fleet-gekko-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-substitutes
  path: ./prod-fleet/website-mentolder
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-mentolder-jobs
  namespace: flux-system
spec:
  # T016529: suspendiert bis der Branch gemergt ist und das CI-Render
  # (task flux:render, OCI-Artefakt mit echten Digests + Whitelist-
  # Substitution) die Workloads liefert. Direkt-Sync ab Git wuerde die
  # Laufzeit-Variablen der eingebetteten Skripte mit substituieren.
  suspend: true
  interval: 10m
  retryInterval: 5m
  timeout: 10m
  dependsOn:
    - name: flux-mentolder
  sourceRef:
    kind: GitRepository
    name: fleet-gekko-source
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-substitutes
  path: ./prod-fleet/mentolder-jobs
  prune: true
  force: true
  wait: false
