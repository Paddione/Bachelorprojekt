# T016529: Prod-only Kustomizations fuer den neuen gekko-fleet (Q16),
# bezogen aus dem gerenderten OCI-Artefakt (task flux:render, CI).
# staging/dev/korczewski bleiben aussen vor (Ziel devmesh).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-mentolder
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./sealed-secrets/mentolder
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./platform
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-coturn
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./coturn
  prune: true
  wait: true
---
# Collabora fuer mentolder (Nextcloud richdocuments). collabora-secrets kommt
# aus flux-sealed-secrets-mentolder, das Certificate braucht den ClusterIssuer
# aus flux-infra-controllers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-office
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-mentolder
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./office
  prune: true
  wait: true
