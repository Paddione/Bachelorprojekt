apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fleet-manifests
  namespace: flux-system
spec:
  interval: 30m
  url: oci://ghcr.io/paddione/fleet-manifests
  ref:
    # Immutable Semver-Stream: der Render-Workflow taggt jedes Artefakt zusaetzlich
    # als v0.0.<RUN_NUMBER> (monoton); :latest bleibt als beweglicher Zeiger
    # erhalten, wird hier aber nicht mehr gelesen. cosign-Verify gilt weiter.
    semver: "v0.*"
  secretRef:
    name: ghcr-auth
  # Supply-chain verification: every artifact must carry a cosign signature
  # from the render-fleet-artifact workflow (GitHub Actions OIDC identity,
  # keyless signing). An unsigned or foreign-signed artifact is rejected.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/Paddione/Bachelorprojekt/\.github/workflows/render-fleet-artifact\.yml@refs/heads/main$
