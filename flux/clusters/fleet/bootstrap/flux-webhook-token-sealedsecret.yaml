# Bootstrap-SealedSecret für flux-webhook-token (Namespace flux-system).
# Wird von 'task flux:bootstrap' imperativ per kubectl apply eingespielt —
# muss existieren, BEVOR Flux das OCI-Artefakt ziehen kann (ghcr-auth) bzw.
# der Receiver-Webhook greift (flux-webhook-token).
#
# Regenerieren (Plaintext nie materialisieren — direkt pipen):
#   kubectl --context fleet -n flux-system get secret flux-webhook-token -o yaml \
#     | kubeseal --cert environments/certs/fleet-mentolder.pem --format yaml
#
# Der Ciphertext ist per strict scope an flux-system/flux-webhook-token gebunden und
# gilt nur für den aktuellen Sealing-Key des Controllers. Nach einer
# Cert-Rotation neu sealen. [T002251]
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flux-webhook-token
  namespace: flux-system
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: flux-webhook-token
      namespace: flux-system
    type: Opaque
