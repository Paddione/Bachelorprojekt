# Bootstrap-SealedSecret für flux-webhook-token (Namespace flux-system).
# Wird von 'task flux:bootstrap' imperativ per kubectl apply eingespielt —
# muss existieren, BEVOR der Receiver-Webhook greift.
#
# Seit T002254 ist diese Datei ein Erzeugnis des Secret-SSOT: das Mapping steht
# in environments/schema.yaml (FLUX_WEBHOOK_TOKEN → flux-system/flux-webhook-token,
# dest_key token, output_file = dieser Pfad), der Plaintext in
# environments/.secrets/mentolder.yaml. Regenerieren:
#   task env:seal ENV=mentolder
#
# Der unten stehende Ciphertext stammt noch aus dem manuellen Seal von T002251
# und wird beim ersten `env:seal` nach der einmaligen Plaintext-Migration
# ersetzt. Er ist per strict scope an flux-system/flux-webhook-token gebunden
# und gilt nur für den aktuellen Sealing-Key des Controllers. Nach einer
# Cert-Rotation neu sealen. [T002251][T002254]
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: flux-webhook-token
  namespace: flux-system
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: flux-webhook-token
      namespace: flux-system
    type: Opaque
