# Bootstrap-SealedSecret für ghcr-auth (Namespace flux-system).
# Wird von 'task flux:bootstrap' imperativ per kubectl apply eingespielt —
# muss existieren, BEVOR Flux das OCI-Artefakt ziehen kann.
#
# Seit T002254 ist diese Datei ein Erzeugnis des Secret-SSOT: das Mapping steht
# in environments/schema.yaml (GHCR_PAT → flux-system/ghcr-auth, type
# kubernetes.io/dockerconfigjson, output_file = dieser Pfad), der Plaintext in
# environments/.secrets/mentolder.yaml (GHCR_USERNAME + GHCR_PAT). Regenerieren:
#   task env:seal ENV=mentolder
#
# Der unten stehende Ciphertext stammt noch aus dem manuellen Seal von T002251
# und wird beim ersten `env:seal` nach der einmaligen Plaintext-Migration
# ersetzt. Er ist per strict scope an flux-system/ghcr-auth gebunden und gilt
# nur für den aktuellen Sealing-Key des Controllers. Nach einer Cert-Rotation
# neu sealen. [T002251][T002254]
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-auth
  namespace: flux-system
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-auth
      namespace: flux-system
    type: kubernetes.io/dockerconfigjson
