apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
    # Vertical scaling profile: 5-node fleet with ~150 resources across 10
    # Kustomizations — medium raises controller concurrency/limits above the
    # small defaults. [audit 2026-08-15]
    size: medium
  sync:
    kind: GitRepository
    url: https://github.com/Paddione/Bachelorprojekt
    ref: refs/heads/main
    path: flux/clusters/fleet
    interval: 10m
