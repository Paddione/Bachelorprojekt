apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-infra-controllers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: flux-sealed-secrets-mentolder
    - name: flux-sealed-secrets-korczewski
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  serviceAccountName: flux-tenant-deploy
  path: ./platform
  prune: true
  wait: true
