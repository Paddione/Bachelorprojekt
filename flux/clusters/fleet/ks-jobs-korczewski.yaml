apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-korczewski-jobs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5m
  timeout: 10m
  dependsOn:
    - name: flux-korczewski
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./korczewski-jobs
  prune: true
  force: true
  wait: false
