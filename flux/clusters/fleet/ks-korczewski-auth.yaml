# T901440: eigene Pocket ID fuer den korczewski-Slot (Pfad ./korczewski-auth).
# Eingefroren wie die Website: massage wird nur lokal auf devmesh entwickelt
# (Stand 2026-10-15, kein Prod-Go-live). wait:false + expliziter
# Deployment-Healthcheck: niemals alle Jobs als Readiness-Gate, weil der
# API-Key-Bootstrap manuell erfolgt (Runbook 12.3).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-korczewski-auth
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  suspend: true
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-sealed-secrets-korczewski
    # Cross-Brand-Dep auf flux-mentolder gestrichen: korczewski-auth ist
    # eigenstaendig (eigene Pocket ID); Fremd-Brand als Gate wuerde Reaktivierung
    # an mentolder koppeln.
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  serviceAccountName: flux-tenant-deploy
  path: ./korczewski-auth
  prune: true
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: workspace-korczewski
