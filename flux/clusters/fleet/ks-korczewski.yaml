apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-korczewski
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: flux-infra-controllers
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./korczewski
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: shared-db
      namespace: workspace-korczewski
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: workspace-korczewski
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: workspace-korczewski
