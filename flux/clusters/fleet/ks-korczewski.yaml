apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-korczewski
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  # T002479: Bewusst suspendiert (2026-07-23, bestätigt 2026-07-31) — der korczewski-Workspace
  # (Nextcloud, Brett, Collabora, eigene shared-db, Jobs) bleibt eingefroren (Kosten/Wartung);
  # seine Workloads stehen live auf 0/0 Replicas.
  # Ausgenommen: Website (Massagepraxis Vögelsen, BRAND massage) und Pocket ID laufen seit
  # T901440 auf dem korczewski-Slot über flux-website-korczewski und flux-korczewski-auth,
  # für Go-live vorbereitet durch T901440. Diese Kustomization taut dafür NICHT auf.
  # Vor einem Re-Aktivieren die Suspension in einem separaten Change aufheben.
  suspend: true
  dependsOn:
    - name: flux-infra-controllers
    # T900014: Secrets VOR dem Brand-Stack reconcilen (Race-Schutz, siehe ks-mentolder.yaml).
    - name: flux-sealed-secrets-korczewski
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./korczewski
  prune: true
  # T002313: Hier stehen NUR Workloads, die diese Kustomization selbst ausrollt.
  # Begruendung und Vorfall siehe ks-mentolder.yaml — Deployment/traefik existiert
  # im Brand-Namespace nicht; das echte traefik laeuft Helm-verwaltet in
  # kube-system und gehoert nicht in dieses Gate.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: shared-db
      namespace: workspace-korczewski
    - apiVersion: apps/v1
      kind: Deployment
      name: pocket-id
      namespace: workspace-korczewski
