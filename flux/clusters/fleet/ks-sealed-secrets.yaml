apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-mentolder
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  serviceAccountName: flux-tenant-deploy
  path: ./sealed-secrets/mentolder
  # prune:false — SealedSecrets duerfen nie per Garbage-Collection verschwinden
  # (Secret-Verlust waere irreversibel; Rotationen laufen ueber env:seal).
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-korczewski
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  serviceAccountName: flux-tenant-deploy
  path: ./sealed-secrets/korczewski
  # prune:false — siehe mentolder (kein GC von Secrets).
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sealed-secrets-staging
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  serviceAccountName: flux-tenant-deploy
  path: ./sealed-secrets/staging
  # prune:false — siehe mentolder (kein GC von Secrets).
  prune: false
  wait: true
