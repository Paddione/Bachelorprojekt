apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-staging
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5m
  timeout: 10m
  dependsOn:
    - name: flux-infra-controllers
    # T900014: Secrets VOR dem Staging-Stack reconcilen (Race-Schutz, siehe ks-mentolder.yaml).
    - name: flux-sealed-secrets-staging
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./staging
  prune: true
  wait: true
