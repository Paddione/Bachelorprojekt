apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-website-korczewski
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  # T901440 hatte die Website (Massagepraxis Vögelsen, BRAND massage) für einen
  # Go-live vorbereitet. Stand 2026-10-15: massage wird nur lokal auf devmesh
  # entwickelt (massage.devmesh.korczewski.de), kein Prod-Go-live. Eingefroren
  # wie Workspace/Jobs (T002479).
  suspend: true
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-korczewski-auth
    - name: flux-sealed-secrets-korczewski
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./website-korczewski
  prune: true
  wait: true
