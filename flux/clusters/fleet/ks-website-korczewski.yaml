apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-website-korczewski
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  # T901440: Website (Massagepraxis Vögelsen, BRAND massage) auf dem
  # korczewski-Slot gezielt aufgetaut — ausgenommen vom T002479-Freeze
  # (Workspace/Jobs bleiben suspendiert).
  suspend: false
  dependsOn:
    - name: flux-infra-controllers
    - name: flux-korczewski-auth
    - name: flux-sealed-secrets-korczewski
  sourceRef:
    kind: OCIRepository
    name: fleet-manifests
  path: ./website-korczewski
  prune: true
  wait: true
