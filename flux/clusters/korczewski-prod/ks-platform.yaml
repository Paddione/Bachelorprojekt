apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: korczewski-prod-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: korczewski-prod-bootstrap
  sourceRef:
    kind: OCIRepository
    name: korczewski-prod-manifests
  serviceAccountName: korczewski-prod-platform
  path: ./platform
  prune: true
  # wait: true, weil dieser Pfad nur HelmRepositories und HelmReleases traegt
  # und deren Readiness das Gate fuer alles Folgende ist (CRDs von cert-manager
  # und lego-webhook).
  #
  # Richtung der Voraussetzung: die cert-manager-CRDs muessen bereits VOR dem
  # Bootstrap-Pfad existieren (README Punkt 4). Fehlt cert-manager, bleibt
  # korczewski-prod-bootstrap rot und dieser Pfad wartet ueber dependsOn — der
  # Cluster konvergiert dann nicht von selbst. Wiederherstellung ist
  # "Vorbedingung nachziehen, 2m-Retry abwarten", nicht "dependsOn loesen".
  wait: true
