apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: korczewski-prod-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: korczewski-prod-platform
  sourceRef:
    kind: OCIRepository
    name: korczewski-prod-manifests
  serviceAccountName: korczewski-prod-tenant
  path: ./secrets
  prune: true
  # wait: false ist hier die korrekte Wahl, keine Abkuerzung: die CRD
  # sealedsecrets.bitnami.com/v1alpha1 hat weder Status-Subresource noch
  # status-Schema, kstatus kann fuer dieses Objekt also keine Readiness melden.
  # wait: true wuerde den Pfad bis timeout 10m offen halten und ueber dependsOn
  # auch korczewski-prod-apps blockieren, obwohl die Entsiegelung asynchron
  # durch den sealed-secrets-Controller passiert.
  #
  # Das echte Gate liegt eine Stufe tiefer: fehlt der Ziel-Secret, scheitert der
  # Pod-Start im Apps-Pfad sichtbar (CreateContainerConfigError), und README
  # Punkt 5 pinnt den Schluesselbezug. Der Namespace-Paritaetstest (design §10,
  # C3-Regression) haelt fest, dass jeder SealedSecret-Namespace von der
  # Lieferkette selbst angelegt wird.
  wait: false
