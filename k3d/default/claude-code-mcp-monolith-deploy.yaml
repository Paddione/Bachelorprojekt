{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "6"
    },
    "labels": {
      "app": "claude-code-mcp-monolith"
    },
    "name": "claude-code-mcp-monolith",
    "namespace": "default"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app": "claude-code-mcp-monolith"
      }
    },
    "strategy": {
      "rollingUpdate": {
        "maxSurge": "25%",
        "maxUnavailable": "25%"
      },
      "type": "RollingUpdate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "kubectl.kubernetes.io/restartedAt": "2026-07-02T15:38:37+02:00"
        },
        "labels": {
          "app": "claude-code-mcp-monolith"
        }
      },
      "spec": {
        "affinity": {
          "nodeAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": {
              "nodeSelectorTerms": [
                {
                  "matchExpressions": [
                    {
                      "key": "node-location",
                      "operator": "In",
                      "values": [
                        "hetzner"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        },
        "containers": [
          {
            "args": [
              "--port",
              "8080",
              "--stateless",
              "--cluster-provider",
              "in-cluster"
            ],
            "image": "quay.io/containers/kubernetes_mcp_server@sha256:ef1ede0fd73ce975de1850b7f19090d0850c4ce3e7d21d795f21de3ee8d1452c",
            "imagePullPolicy": "IfNotPresent",
            "name": "kubernetes",
            "ports": [
              {
                "containerPort": 8080,
                "name": "kubernetes",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "initialDelaySeconds": 5,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 8080
              },
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          },
          {
            "args": [
              "echo \"Installing MCP postgres bridge...\"\nnpm install -g supergateway@3.4.3 @modelcontextprotocol/server-postgres@0.6.2 2>&1 | tail -3\necho \"Starting supergateway on :3001/mcp...\"\nPROC_ROOT=\"${PROC_ROOT:-/proc}\"\nMCP_PG_CHILD_MAX_AGE_SECONDS=\"${MCP_PG_CHILD_MAX_AGE_SECONDS:-300}\"\nMCP_PG_CHILD_MAX_COUNT=\"${MCP_PG_CHILD_MAX_COUNT:-12}\"\n\n# Gibt \"starttime pid\" je echtem Child aus, aeltester zuerst. Toetet nichts.\n# Drei Guards, siehe design.md:\n#   1. argv[1] endet auf /mcp-server-postgres  -> trennt Child vom Parent\n#      (Parent: argv[1]=/usr/local/bin/supergateway, Name erst in argv[2];\n#       Reaper-Subshell: argv[1]=-c, Name erst in argv[2])\n#   2. ppid == 1                               -> Children haengen direkt an supergateway\n#   3. pid != 1 und pid != SELF_PID            -> harte Absicherung\nlist_reap_candidates() {\n  _root=\"${PROC_ROOT:-/proc}\"\n  # SELF_PID respektiert eine vorgesetzte Variable (Testbarkeit) und ermittelt sich\n  # sonst selbst. Die Redirection wird von DIESER Shell ausgefuehrt, /proc/self loest\n  # daher auf ihre eigene PID auf. `$$` waere falsch: es liefert in POSIX-sh auch in\n  # einer Subshell die PID der Hauptshell (im Container: 1).\n  # Verlaesslich: read -r SELF_PID _ < /proc/self/stat (hier ueber $_root\n  # indirigiert, damit PROC_ROOT im Test ein Fixture unterschieben kann).\n  if [ -z \"${SELF_PID:-}\" ]; then\n    read -r SELF_PID _ < \"$_root/self/stat\" 2>/dev/null || SELF_PID=0\n  fi\n  for _d in \"$_root\"/[0-9]*; do\n    [ -d \"$_d\" ] || continue\n    _pid=${_d##*/}\n    [ \"$_pid\" = 1 ] && continue\n    [ \"$_pid\" = \"$SELF_PID\" ] && continue\n    # KEIN groessenbasierter Guard ([ -s ... ]) auf cmdline: procfs meldet dort\n    # st_size=0 trotz Inhalt, ein solcher Guard ueberspringt live ALLE Prozesse\n    # und liefe im Fixture trotzdem gruen (Edge-Case E5).\n    _a1=$(tr '\\0' '\\n' < \"$_d/cmdline\" 2>/dev/null | sed -n 2p)\n    [ -n \"$_a1\" ] || continue\n    case \"$_a1\" in\n      */mcp-server-postgres) ;;\n      *) continue ;;\n    esac\n    _ppid=$(awk '{print $4}' \"$_d/stat\" 2>/dev/null) || continue\n    [ \"$_ppid\" = 1 ] || continue\n    _start=$(awk '{print $22}' \"$_d/stat\" 2>/dev/null) || continue\n    printf '%s %s\\n' \"$_start\" \"$_pid\"\n  done | sort -n\n}\n\nreap_stale_children() {\n  hz=$(getconf CLK_TCK)\n  while true; do\n    sleep 60\n    up=$(cut -d' ' -f1 \"${PROC_ROOT:-/proc}/uptime\" | cut -d. -f1)\n    kids=$(list_reap_candidates)\n    count=$(printf '%s' \"$kids\" | grep -c . || true)\n    rss_sum=0\n    for p in $(printf '%s\\n' \"$kids\" | awk '{print $2}'); do\n      r=$(awk '/VmRSS/{print $2}' \"${PROC_ROOT:-/proc}/$p/status\" 2>/dev/null)\n      rss_sum=$((rss_sum + ${r:-0}))\n    done\n    # Stufe 1 \u2014 Alter. Schwelle liegt ueber dem statement_timeout (120s).\n    survivors=\"\"\n    for line in $(printf '%s\\n' \"$kids\" | tr ' ' ':'); do\n      start=${line%%:*}; pid=${line##*:}\n      [ -n \"$pid\" ] || continue\n      age=$(( up - start / hz ))\n      if [ \"$age\" -gt \"$MCP_PG_CHILD_MAX_AGE_SECONDS\" ]; then\n        echo \"reap: age pid=$pid age=${age}s\"\n        kill -TERM \"$pid\" 2>/dev/null\n      else\n        survivors=\"$survivors $pid\"\n      fi\n    done\n    # Stufe 2 \u2014 Menge. Faengt einen Request-Burst ab, der die Altersschwelle noch\n    # nicht erreicht hat. list_reap_candidates liefert aelteste zuerst.\n    n=$(printf '%s' \"$survivors\" | wc -w)\n    if [ \"$n\" -gt \"$MCP_PG_CHILD_MAX_COUNT\" ]; then\n      excess=$(( n - MCP_PG_CHILD_MAX_COUNT ))\n      for pid in $survivors; do\n        [ \"$excess\" -gt 0 ] || break\n        echo \"reap: count pid=$pid (over cap $MCP_PG_CHILD_MAX_COUNT)\"\n        kill -TERM \"$pid\" 2>/dev/null\n        excess=$(( excess - 1 ))\n      done\n    fi\n    echo \"mcp-server-postgres children: count=$count rss_kb_sum=$rss_sum cap=$MCP_PG_CHILD_MAX_COUNT\"\n  done\n}\nreap_stale_children &\nexec supergateway \\\n  --stdio \"mcp-server-postgres \\\"$DATABASE_URL\\\"\" \\\n  --outputTransport streamableHttp \\\n  --stateless \\\n  --port 3001 \\\n  --streamableHttpPath /mcp \\\n  --healthEndpoint /health\n"
            ],
            "command": [
              "/bin/sh",
              "-c"
            ],
            "env": [
              {
                "name": "SHARED_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "SHARED_DB_PASSWORD",
                    "name": "claude-code-secrets"
                  }
                }
              },
              {
                "name": "DATABASE_URL",
                "value": "postgresql://postgres:$(SHARED_DB_PASSWORD)@shared-db.workspace.svc.cluster.local:5432/website"
              },
              {
                "name": "PGOPTIONS",
                "value": "-c statement_timeout=120000ms"
              }
            ],
            "image": "node:20-alpine",
            "imagePullPolicy": "Always",
            "name": "postgres",
            "ports": [
              {
                "containerPort": 3001,
                "name": "postgres",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 3001,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 60,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "256Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          },
          {
            "args": [
              "echo \"Installing MCP playwright bridge...\"\nnpm install -g supergateway @playwright/mcp 2>&1 | tail -3\nCHROME=$(find /ms-playwright -name \"chrome\" -path \"*/chrome-linux/chrome\" ! -path \"*/headless*\" | head -1)\necho \"Starting supergateway on :3000/mcp (chrome: $CHROME)...\"\nexec supergateway \\\n  --stdio \"playwright-mcp --browser chrome --executable-path $CHROME --headless --no-sandbox\" \\\n  --outputTransport streamableHttp \\\n  --stateless \\\n  --port 3000 \\\n  --streamableHttpPath /mcp \\\n  --healthEndpoint /health\n"
            ],
            "command": [
              "/bin/sh",
              "-c"
            ],
            "image": "mcr.microsoft.com/playwright:v1.50.1-jammy",
            "imagePullPolicy": "Always",
            "name": "playwright",
            "ports": [
              {
                "containerPort": 3000,
                "name": "browser",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 3000,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 120,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "4Gi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "512Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          },
          {
            "args": [
              "npm install -g supergateway 2>&1 | tail -3\nexec supergateway \\\n  --stdio \"/github-bin/github-mcp-server stdio\" \\\n  --outputTransport streamableHttp \\\n  --stateless \\\n  --port 3002 \\\n  --streamableHttpPath /mcp \\\n  --healthEndpoint /health\n"
            ],
            "command": [
              "/bin/sh",
              "-c"
            ],
            "env": [
              {
                "name": "GITHUB_PERSONAL_ACCESS_TOKEN",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "GITHUB_PAT",
                    "name": "claude-code-secrets"
                  }
                }
              }
            ],
            "image": "node:20-alpine",
            "imagePullPolicy": "Always",
            "name": "github",
            "ports": [
              {
                "containerPort": 3002,
                "name": "github",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 3002,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 1
            },
            "resources": {
              "limits": {
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "128Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/github-bin",
                "name": "github-bin"
              }
            ]
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "initContainers": [
          {
            "args": [
              "wget -qO /tmp/github-mcp-server.tar.gz \\\n  https://github.com/github/github-mcp-server/releases/download/v1.0.3/github-mcp-server_Linux_x86_64.tar.gz && \\\ntar -xzf /tmp/github-mcp-server.tar.gz -C /github-bin github-mcp-server && \\\nchmod +x /github-bin/github-mcp-server && \\\necho \"github-mcp-server ready\"\n"
            ],
            "command": [
              "/bin/sh",
              "-c"
            ],
            "image": "alpine:3.21",
            "imagePullPolicy": "IfNotPresent",
            "name": "github-binary",
            "resources": {
              "limits": {
                "memory": "128Mi"
              },
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              }
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/github-bin",
                "name": "github-bin"
              }
            ]
          }
        ],
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "serviceAccount": "claude-code-agent",
        "serviceAccountName": "claude-code-agent",
        "terminationGracePeriodSeconds": 30,
        "volumes": [
          {
            "emptyDir": {},
            "name": "github-bin"
          }
        ]
      }
    }
  }
}
