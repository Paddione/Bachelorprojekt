# k3d/dev-stack/factory-runner-secrets-patch.yaml
# [T016422 / ADR-007 A.4] Mountet das Operator-SealedSecret 'factory-runner-secrets'
# nach /workspace/.secrets/ in den factory-runner-Pod.
#
# Gefuellt werden die drei Felder im Tick (wakeup.sh) aus diesem Mount:
#   - /workspace/.secrets/bp-secrets.key  → FACTORY_GITCRYPT_KEY (task secrets:unlock)
#   - /workspace/.secrets/autopilot.env   → FACTORY_ENV_FILE (Dispatcher-Konfig)
#   - GITHUB_PAT / DEEPSEEK_API_KEY / ALIBABA_API_KEY / OPENCODE_ZEN_KEY
#
# Der Operator erstellt das Secret VOR dem Erstdeploy per kubeseal (ADR-007-
# Anhang A.4). Bis dahin ist der Tick absichtlich fail-closed: wakeup.sh
# scheitert am fehlenden Key/Env-File — der Pod läuft, aber kein Tick wird
# ungesichert ausgeführt (Konvention in k3d/dev-stack/factory-runner.yaml:168).
#
# JSON6902-Patch — Konvention wie dev-node-binding.yaml. Eingebunden in
# kustomization.yaml als patches-Eintrag (target apps/v1 Deployment factory-runner).
#
# readOnly: der Mount überschreibt nur die Secret-Dateien unter /workspace/.secrets
# (die Repo-Secrets liegen in environments/.secrets/, kein Kollision); der
# git-crypt-Unlock schreibt in environments/.secrets/ und bleibt auf der PVC.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: factory-secrets
    mountPath: /workspace/.secrets
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: factory-secrets
    secret:
      secretName: factory-runner-secrets
