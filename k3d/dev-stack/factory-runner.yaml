# ── factory-runner — fleet-nativer Software-Factory-Dispatcher [T016422] ──────
#
# Ersetzt den WSL-Dispatcher (systemd User-Timer → scripts/factory/wakeup.sh).
# Design D1–D3 aus openspec/changes/wsl-exit-fleet-factory/design.md.
#
# Architektur: EIN long-lived Pod (Deployment, replicas: 1) haelt den Repo-Clone
# auf einer RWX-Longhorn-PVC unter /workspace. Der Tick-CronJob (T900110) ruft
# den Wakeup-Listener des Runners per HTTP auf — keine exec-Rechte mehr,
# keine RBAC-Role mit exec mehr noetig fuer factory-tick.
#
# Image-Strategie (T2.3):
#   Referenz:   ghcr.io/paddione/factory-runner (gebaut aus docker/factory-runner/
#               Dockerfile — node:22-bookworm-slim + git, git-crypt, gh, jq,
#               go-task, @anthropic-ai/claude-code).
#   Pinning:    bis zum ersten CI-Build Tag-Pin :latest (Konvention der
#               self-built Images Website/Brett/Docs). VOR dem Cutover wird der
#               Digest hart gepinnt (`scripts/resolve-image-digest.sh`-Muster,
#               Operator-Schritt im ADR-007-Anhang) — ein Runner mit fremdem
#               Image hätte Repo-Schreibrechte über den Clone.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-runner-workdir
  labels:
    app: factory-runner
spec:
  # RWX (nicht RWO): CronJob-Pod exec't zwar hinein statt zu mounten, aber
  # Debug-/Recovery-Zugriffe (zweiter Pod gegen dieselbe PVC) sollen möglich
  # bleiben, ohne die Single-Writer-Semantik von flock zu verletzen — lesen
  # parallel ist erlaubt, schreiben serialisiert wakeup.sh selbst.
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi # Repo-Clone + .worktrees/ (mehrere parallele Partials)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-tick
  labels:
    app: factory-runner
# Keine RBAC-Rechte; Deployment läuft ohne Token, CronJob ruft Wakeup per HTTP (T900110).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-runner
  labels:
    app: factory-runner
spec:
  # Single-Writer: genau ein Replica, kein Surge (siehe Dateikopf).
  replicas: 1
  strategy:
    type: Recreate # Worktree-Claims überleben keinen Parallel-Betrieb zweier Pods
  selector:
    matchLabels:
      app: factory-runner
  template:
    metadata:
      labels:
        app: factory-runner
        component: runner
    spec:
      serviceAccountName: factory-tick
      automountServiceAccountToken: false # der Runner braucht keine API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000 # Longhorn-PVC für UID 1000 beschreibbar (Vorbild registry-cache)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/paddione/factory-runner:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/factory-runner/wakeup-listener.mjs"]
          ports:
            - containerPort: 8787
              name: wakeup
          readinessProbe:
            httpGet:
              path: /healthz
              port: wakeup
            initialDelaySeconds: 2
            periodSeconds: 5
          workingDir: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: FACTORY_REPO
              value: "/workspace"
            - name: FACTORY_GITCRYPT_KEY
              value: "/workspace/.secrets/bp-secrets.key"
            - name: FACTORY_ENV_FILE
              value: "/workspace/.secrets/autopilot.env"
            - name: FACTORY_CTX
              value: "fleet"
            - name: FACTORY_NS
              value: "workspace-dev"
            - name: LLM_BASE_URL # FreeToken via wg-mesh; P0-Spike 3 verifiziert die Route
              value: "http://192.168.100.10:1919/v1"
            - name: LLM_FALLBACK_PROVIDER # Eskalationskette First-Class (Design D3)
              value: "deepseek"
            # [T900052] In-cluster DB-Zugriff: der Runner hat absichtlich kein
            # cluster-externen Client/SAT (automountServiceAccountToken:false), erreicht die
            # SDLC-DB aber direkt ueber die ClusterIP svc/shared-db-dev:5432
            # (k3d/shared-db-endpoint-policy.yaml). scripts/factory/lib.sh
            # factory_psql nimmt diesen URL-Pfad, wenn FACTORY_PG_URL gesetzt ist;
            # der Desktop-MCP behaelt den cluster-internen Fallback.
            - name: WEBSITE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-dev-secrets
                  key: DEV_WEBSITE_DB_PASSWORD
            - name: FACTORY_PG_URL
              value: "postgresql://website:$(WEBSITE_DB_PASSWORD)@shared-db-dev.workspace-dev.svc.cluster.local:5432/website"
          volumeMounts:
            - name: workdir
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: factory-runner-workdir
        - name: tmp
          emptyDir: {}
---
# Wakeup-Listener Service (T900110): exposed only to the tick CronJob
# via factory-runner-netpol.yaml (cluster-internal ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: factory-runner
  labels:
    app: factory-runner
spec:
  selector:
    app: factory-runner
    component: runner
  ports:
    - port: 8787
      targetPort: wakeup
      name: wakeup
---
# ── SealedSecret-Platzhalter (T2.7) ─────────────────────────────────────────
# Der Operator versiegelt VOR dem Erstdeploy per kubeseal (Prozess: ADR-007-
# Anhang) ein Secret `factory-runner-secrets` in diesem Namespace und mountet
# es als Dateien nach /workspace/.secrets/. KEINE Werte hier im Repo:
#   - bp-secrets.key       (git-crypt-Key → FACTORY_GITCRYPT_KEY)
#   - autopilot.env        (Dispatcher-Konfig → FACTORY_ENV_FILE)
#   - GITHUB_PAT
#   - DEEPSEEK_API_KEY
#   - ALIBABA_API_KEY
#   - OPENCODE_ZEN_KEY
# Bis dahin läuft der Runner, aber jeder Tick scheitert sauber am git-crypt-
# Unlock bzw. am fehlenden Env-File — absichtlich fail-closed.
# ────────────────────────────────────────────────────────────────────────────
---
# Tick-CronJob (T900110): HTTP-Wakeup statt remote-exec — factory-tick verliert
# damit jegliche RBAC-Privilegien fuer exec. Single-Flight bleibt im wakeup-flock; concurrencyPolicy
# Forbid ist nur zweite Belt.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-tick
  labels:
    app: factory-runner
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: factory-runner
            component: tick
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: tick
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  OUT=$(curl -sS -N --max-time 1500 -X POST http://factory-runner:8787/wakeup 2>&1)
                  echo "$OUT"
                  tail -n 1 <<< "$OUT" | grep -q 'WAKEUP_EXIT=0' && exit 0 || { echo "tick-failed"; exit 1; }
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
