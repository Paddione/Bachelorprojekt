apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace-dev
resources:
  # SDLC-Console (Fleet-Heimat, T016429) — RBAC/Manifeste/Platzhalter-Secret
  - sdlc-console-rbac.yaml
  - sdlc-console-secrets.yaml
  - sdlc-console.yaml
  - namespace.yaml
  - shared-db-dev.yaml
  - website-dev.yaml
  - brett-dev.yaml
  - factory-runner.yaml
  - sish.yaml
  - traefik-wildcard-ingress.yaml
  - shared-db-dev-lb.yaml
  - oauth2-proxy-dev.yaml
  - oauth2-proxy-brainstorm.yaml
  - oauth2-proxy-sessions.yaml
  - dev-ingress.yaml
  - internal-mcp-ingress.yaml
  - sdlc-console.yaml
patches:
  - path: dev-node-binding.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: dev-node-binding.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
  - path: dev-node-binding.yaml
    target:
      group: batch
      version: v1
      kind: Job
# images: populated by `task dev:deploy` with concrete tags at apply time.
# factory-runner ist die Ausnahme: statisch auf ghcr.io/paddione/factory-runner
# gepinnt (Tag :latest bis zum ersten CI-Build, Digest hart vor dem Cutover —
# Strategie-Kommentar in factory-runner.yaml, T016422 T2.3).
# Note: cert-manager.yaml + traefik-tls.yaml are applied OUTSIDE this bundle by
# the dev:apply bootstrap (CRDs-first / kube-system namespace). [T000363]
