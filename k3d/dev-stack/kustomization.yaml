apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace-dev
resources:
  - namespace.yaml
  - shared-db-dev.yaml
  - website-dev.yaml
  - brett-dev.yaml
  - sish.yaml
  - traefik-wildcard-ingress.yaml
  - shared-db-dev-lb.yaml
  - oauth2-proxy-dev.yaml
  - oauth2-proxy-brainstorm.yaml
  - oauth2-proxy-sessions.yaml
  - dev-ingress.yaml
patches:
  - path: dev-node-binding.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: dev-node-binding.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
  - path: dev-node-binding.yaml
    target:
      group: batch
      version: v1
      kind: Job
# images: populated by `task dev:deploy` with concrete tags at apply time.
# Note: cert-manager.yaml + traefik-tls.yaml are applied OUTSIDE this bundle by
# the dev:apply bootstrap (CRDs-first / kube-system namespace). [T000363]
