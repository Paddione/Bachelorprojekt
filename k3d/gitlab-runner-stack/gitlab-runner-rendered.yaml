---
# Source: gitlab-runner/templates/service-account.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "gitlab-runner"
  namespace: "gitlab-runner"
  labels:
    app: gitlab-runner
    chart: gitlab-runner-0.91.2
    release: "gitlab-runner"
    heritage: "Helm"
---
# Source: gitlab-runner/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner
  namespace: "gitlab-runner"
  labels:
    app: gitlab-runner
    chart: gitlab-runner-0.91.2
    release: "gitlab-runner"
    heritage: "Helm"
data:
  entrypoint: |
    #!/bin/bash
    set -e

    export CONFIG_PATH_FOR_INIT="/home/gitlab-runner/.gitlab-runner/"
    mkdir -p ${CONFIG_PATH_FOR_INIT}
    cp /configmaps/config.toml ${CONFIG_PATH_FOR_INIT}
    # Set up environment variables for cache
    if [[ -f /secrets/accesskey && -f /secrets/secretkey ]]; then
      export CACHE_S3_ACCESS_KEY=$(cat /secrets/accesskey)
      export CACHE_S3_SECRET_KEY=$(cat /secrets/secretkey)
    fi

    if [[ -f /secrets/gcs-applicaton-credentials-file ]]; then
      export GOOGLE_APPLICATION_CREDENTIALS="/secrets/gcs-applicaton-credentials-file"
    elif [[ -f /secrets/gcs-application-credentials-file ]]; then
      export GOOGLE_APPLICATION_CREDENTIALS="/secrets/gcs-application-credentials-file"
    else
      if [[ -f /secrets/gcs-access-id && -f /secrets/gcs-private-key ]]; then
        export CACHE_GCS_ACCESS_ID=$(cat /secrets/gcs-access-id)
        # echo -e used to make private key multiline (in google json auth key private key is oneline with \n)
        export CACHE_GCS_PRIVATE_KEY=$(echo -e $(cat /secrets/gcs-private-key))
      fi
    fi

    if [[ -f /secrets/azure-account-name && -f /secrets/azure-account-key ]]; then
      export CACHE_AZURE_ACCOUNT_NAME=$(cat /secrets/azure-account-name)
      export CACHE_AZURE_ACCOUNT_KEY=$(cat /secrets/azure-account-key)
    fi

    if [[ -f /secrets/runner-registration-token ]]; then
      export REGISTRATION_TOKEN=$(cat /secrets/runner-registration-token)
    fi

    if [[ -f /secrets/runner-token ]]; then
      export CI_SERVER_TOKEN=$(cat /secrets/runner-token)
    fi
    if ! sh /configmaps/register-the-runner; then
      exit 1
    fi

    # Run pre-entrypoint-script
    if ! bash /configmaps/pre-entrypoint-script; then
      exit 1
    fi

    # Start the runner
    exec /entrypoint run \
      --user=gitlab-runner \
      --working-directory=/home/gitlab-runner
  config.toml: |
    shutdown_timeout = 0
    concurrent = 2
    check_interval = 3
    log_level = "info"

  
  config.template.toml:   |
    [[runners]]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "ubuntu:24.04"
        privileged = false
        service_account = "default"
        automount_service_account_token = false
        # Siehe Runbook "Registry-Anbindung" — dieses Feld existiert im
        # Kubernetes-Executor NICHT als Pull-Through-Ziel; hier absichtlich nur
        # namespace/image/privileged/service_account/priority_class_name gesetzt.
        priority_class_name = "ci-low"
        pull_policy = ["if-not-present"]
        # B1 (Review T012177): Der Kubernetes-Executor kennt NUR
        # [runners.kubernetes.affinity.node_affinity] — der vorherige Pfad
        # [runners.kubernetes.node_affinity] (ohne "affinity") ist ein unbekannter
        # TOML-Key und wird vom Executor STILL VERWORFEN, ohne Fehler. Ergebnis:
        # Job-Pods hatten GAR KEINE Affinitaet und konnten auf den Control-Plane-
        # Knoten (pk-hetzner-4/6/8, 96% CPU-Requests) landen — genau das Risiko,
        # gegen das Design D2 gebaut ist. Verifiziert gegen die offizielle
        # Kubernetes-Executor-Doku (docs.gitlab.com/runner/executors/kubernetes),
        # zusaetzlich abgesichert durch den TOML-Guard in
        # tests/spec/ci-cd/gitlab-runner-fleet-guardrails.bats (S4).
        [runners.kubernetes.affinity]
          [runners.kubernetes.affinity.node_affinity]
            [runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution]
              [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms]]
                [[runners.kubernetes.affinity.node_affinity.required_during_scheduling_ignored_during_execution.node_selector_terms.match_expressions]]
                  key = "kubernetes.io/hostname"
                  operator = "In"
                  values = ["gekko-hetzner-3", "gekko-hetzner-4"]
        # B4 (Review T012177): dieselbe restricted-PSA-Pflicht wie beim
        # Manager-Pod (siehe podSecurityContext oben) gilt fuer JEDEN Pod im
        # Namespace — also auch fuer die vom Manager erzeugten Job-Pods
        # (build+helper-Container). Ohne diese drei Bloecke scheitert jeder
        # CI-Job an der Admission, bevor er ueberhaupt startet. run_as_user wird
        # bewusst NICHT gesetzt: Job-Images sind beliebig (Job-.gitlab-ci.yml
        # entscheidet per eigenem image:), ein fest verdrahteter UID wuerde
        # Images brechen, die eine andere non-root-UID mitbringen. runAsNonRoot
        # verlangt nur, dass die tatsaechliche UID des Images != 0 ist — welche
        # UID das ist, bleibt Sache des Job-Images (Konsequenz der Wahl von
        # "restricted" als Namespace-Policy, dokumentiert in namespace.yaml und
        # Runbook Abschnitt 8; nicht durch dieses Partial aufloesbar).
        [runners.kubernetes.pod_security_context]
          run_as_non_root = true
          [runners.kubernetes.pod_security_context.seccomp_profile]
            type = "RuntimeDefault"
        [runners.kubernetes.build_container_security_context]
          run_as_non_root = true
          allow_privilege_escalation = false
          [runners.kubernetes.build_container_security_context.capabilities]
            drop = ["ALL"]
          [runners.kubernetes.build_container_security_context.seccomp_profile]
            type = "RuntimeDefault"
        [runners.kubernetes.helper_container_security_context]
          run_as_non_root = true
          allow_privilege_escalation = false
          [runners.kubernetes.helper_container_security_context.capabilities]
            drop = ["ALL"]
          [runners.kubernetes.helper_container_security_context.seccomp_profile]
            type = "RuntimeDefault"
  

  register-the-runner: |
    #!/bin/sh
    signal_handler() {
      if [ ! -d "/proc/$register_pid" ]; then
        wait $register_pid
      fi
      exit
    }
    trap 'signal_handler' QUIT INT

    MAX_REGISTER_ATTEMPTS=30

    # Reset/unset the not needed flags when an authentication token
    RUN_UNTAGGED=""
    ACCESS_LEVEL=""

    if [ -n "$CI_SERVER_TOKEN" ] && [ "${CI_SERVER_TOKEN#glrt-}" != "$CI_SERVER_TOKEN" ]; then
      RUN_UNTAGGED=""
      ACCESS_LEVEL=""
      unset REGISTER_LOCKED
      unset RUNNER_TAG_LIST
    fi

    for i in $(seq 1 "${MAX_REGISTER_ATTEMPTS}"); do
      echo "Registration attempt ${i} of ${MAX_REGISTER_ATTEMPTS}"
      /entrypoint register \
        ${RUN_UNTAGGED} \
        ${ACCESS_LEVEL} \
        --template-config /configmaps/config.template.toml \
        --non-interactive &

      register_pid=$!
      wait $register_pid
      retval=$?

      if [ ${retval} = 0 ]; then
        break
      elif [ ${i} = ${MAX_REGISTER_ATTEMPTS} ]; then
        exit 1
      fi

      sleep 5
    done

  check-live: |
    #!/bin/bash
    set -eou pipefail

    # default timeout is 3 seconds, can be overriden
    VERIFY_TIMEOUT=${1:-${VERIFY_TIMEOUT:-3}}

    if ! /usr/bin/pgrep -f ".*register-the-runner"  > /dev/null && ! /usr/bin/pgrep -f "gitlab.*runner"  > /dev/null ; then
      exit 1
    fi

    status=0
    # empty --url= helps `gitlab-runner verify` select all configured runners (otherwise filters for $CI_SERVER_URL)
    verify_output=$(timeout "${VERIFY_TIMEOUT}" gitlab-runner verify --url= 2>&1) || status=$?

    # timeout exit code is 143 with busybox, and 124 with coreutils
    if (( status == 143 )) || (( status == 124 )) ; then
      echo "'gitlab-runner verify' terminated by timeout, not a conclusive failure" >&2
      exit 0
    elif (( status > 0 )) ; then
      exit ${status}
    fi

    grep -qE "is (alive|valid)" <<<"${verify_output}"

  pre-entrypoint-script: |
---
# Source: gitlab-runner/templates/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: "Role"
metadata:
  name: gitlab-runner
  labels:
    app: gitlab-runner
    chart: gitlab-runner-0.91.2
    release: "gitlab-runner"
    heritage: "Helm"
  namespace: "gitlab-runner"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch","create","delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
# Source: gitlab-runner/templates/role-binding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: "RoleBinding"
metadata:
  name: gitlab-runner
  labels:
    app: gitlab-runner
    chart: gitlab-runner-0.91.2
    release: "gitlab-runner"
    heritage: "Helm"
  namespace: "gitlab-runner"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: "Role"
  name: gitlab-runner
subjects:
- kind: ServiceAccount
  name: "gitlab-runner"
  namespace: "gitlab-runner"
---
# Source: gitlab-runner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: "gitlab-runner"
  labels:
    app: gitlab-runner
    chart: gitlab-runner-0.91.2
    release: "gitlab-runner"
    heritage: "Helm"
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gitlab-runner
  template:
    metadata:
      labels:
        app: gitlab-runner
        chart: gitlab-runner-0.91.2
        release: "gitlab-runner"
        heritage: "Helm"
      annotations:
        checksum/configmap: b9d9d4127a6c0095cc7f38f8408ce3840d1f5ac5ef134a56157b56cbf64da19b
        checksum/secrets: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    spec:
      automountServiceAccountToken: false
      securityContext: 
        fsGroup: 65533
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 3600
      priorityClassName: "ci-low"
      serviceAccountName: "gitlab-runner"
      containers:
      - name: gitlab-runner
        image: registry.gitlab.com/gitlab-org/gitlab-runner:alpine-v19.2.2
        imagePullPolicy: "IfNotPresent"
        securityContext: 
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        lifecycle:
          preStop:
            exec:
              command: ["/entrypoint", "unregister", "--all-runners"]
        command: ["/usr/bin/dumb-init", "--", "/bin/bash", "/configmaps/entrypoint"]
        env:        
        - name: CI_SERVER_URL
          value: "https://gitlab.com/"
        - name: RUNNER_EXECUTOR
          value: "kubernetes"
        - name: REGISTER_LOCKED
          value: "true"
        - name: RUNNER_TAG_LIST
          value: "bachelorprojekt-local"
        - name: SESSION_SERVER_ADDRESS
          value:
        livenessProbe:
          exec:
            command: ["/bin/bash", "/configmaps/check-live", "3"]
          initialDelaySeconds: 60
          timeoutSeconds: 4
          periodSeconds: 60
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/usr/bin/pgrep","gitlab.*runner"]
          initialDelaySeconds: 60
          timeoutSeconds: 4
          periodSeconds: 60
          successThreshold: 1
          failureThreshold: 3
        ports:
        - name: "metrics"
          containerPort: 9252
        volumeMounts:
        - name: projected-secrets
          mountPath: /secrets
        - name: etc-gitlab-runner
          mountPath: /home/gitlab-runner/.gitlab-runner
        - name: configmaps
          mountPath: /configmaps
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: runner-secrets
        emptyDir:
          medium: "Memory"
      - name: etc-gitlab-runner
        emptyDir:
          medium: "Memory"
      - name: projected-secrets
        projected:
          sources:
            - secret:
                name: "gitlab-runner-secret"
                items:
                  - key: runner-registration-token
                    path: runner-registration-token
                  - key: runner-token
                    path: runner-token
      - name: configmaps
        configMap:
          name: gitlab-runner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - gekko-hetzner-3
                - gekko-hetzner-4
