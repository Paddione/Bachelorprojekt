apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-cache-data
  namespace: gitlab-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: gitlab-runner
  labels:
    app: registry-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-cache
  template:
    metadata:
      labels:
        app: registry-cache
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-type: worker
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-cache-data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: registry-cache-data
          persistentVolumeClaim:
            claimName: registry-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache
  namespace: gitlab-runner
spec:
  type: ClusterIP
  selector:
    app: registry-cache
  ports:
    - port: 5000
      targetPort: 5000
