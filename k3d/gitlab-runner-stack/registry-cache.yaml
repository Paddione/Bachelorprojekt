apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-cache-data
  namespace: gitlab-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: gitlab-runner
  labels:
    app: registry-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-cache
  template:
    metadata:
      labels:
        app: registry-cache
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-type: worker
      # B4 (Review T012177): Namespace gitlab-runner erzwingt pod-security.
      # kubernetes.io/enforce: restricted (seit k8s 1.25) — ohne EXPLIZITEN
      # securityContext (Pod- UND Container-Ebene) weist die Admission diesen
      # Pod ab (runAsNonRoot, seccompProfile, allowPrivilegeEscalation,
      # capabilities sind alle Pflichtfelder, kein "Default erlaubt"). Das
      # offizielle registry:2-Image setzt kein USER (laeuft sonst als root) —
      # runAsUser/fsGroup werden deshalb HIER (anders als bei den Job-Pods in
      # values/gitlab-runner.yaml, wo das Image beliebig ist) bewusst explizit
      # gesetzt: fsGroup sorgt dafuer, dass die Longhorn-PVC fuer die gewaehlte
      # UID/GID beschreibbar ist. Unverifiziert gegen den laufenden Cluster —
      # Teil der manuellen Abnahme (tasks.md).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: registry-cache-data
              mountPath: /var/lib/registry
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: registry-cache-data
          persistentVolumeClaim:
            claimName: registry-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache
  namespace: gitlab-runner
spec:
  type: ClusterIP
  selector:
    app: registry-cache
  ports:
    - port: 5000
      targetPort: 5000
