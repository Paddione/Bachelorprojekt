# ─────────────────────────────────────────────────────────────────────────────
# llm-gemma-embed-scale: DORMANTER CPU-Skalarpool fuer gemma-embed (llama.cpp)
#
# Zweck: prepared, NOT rolled out (replicas: 0 — kein Pod, keine Kosten).
# Aktivieren, sobald sustained > 2 req/s auf llm-gateway-gemma-embed oder
# sichtbare Slot-Queues: replicas auf 2 setzen, rendern lassen, fertig.
# Beleg Stand 01.11.2026: ~1 Request/11 s ueber 2 Pods — kein Bedarf.
#
# Warum ein EIGENES Deployment statt replicas: 2 am Bestand:
#   - gemma-embed haengt an einer RWO-PVC (Longhorn) mit Recreate-Strategie:
#     eine zweite Replika kaeme nie an das Volume (T002604-Muster).
#   - Diese Datei nutzt emptyDir + Init-Download wie gemma-embed-bulk:
#     kein shared Volume, RollingUpdate- und HPA-fest.
# Warum Spread statt Pin: Service llm-gateway-gemma-embed selektiert nur
#   app: gemma-embed — neue Pods joinen das Round-Robin automatisch.
#   topologySpreadConstraints (maxSkew 1, DoNotSchedule) verteilen auf die
#   gpu-cluster-Nodes; gemma-embed-igpu bleibt unveraendert (kein freies
#   i915: gpu-cluster/gpu-cluster2 voll, gpu-cluster-3 CPU-voll — Stand
#   01.11.2026).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-embed-scale
  labels:
    app: gemma-embed
    pool: scale
spec:
  # DORMANT: 0 = kein Pod, keine Kosten. Aktivierung: auf 2 setzen.
  replicas: 0
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: gemma-embed
      pool: scale
  template:
    metadata:
      labels:
        app: gemma-embed
        pool: scale
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: gemma-embed
      # fsGroup 101: curlimages/curl laeuft als uid=100/gid=101 (curl_user),
      # sonst scheitert der InitContainer auf Longhorn-RWO mit Permission denied.
      # SA-GR-06: runAsNonRoot auf Pod-Ebene, explizite UIDs auf Container-Ebene.
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      initContainers:
        - name: model-download
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ ! -s /models/embeddinggemma-300M-Q8_0.gguf ]; then
                echo "Downloading embeddinggemma-300M-Q8_0.gguf ..."
                curl -fL --retry 3 --connect-timeout 10 \
                  -o /models/embeddinggemma-300M-Q8_0.gguf \
                  https://huggingface.co/unsloth/embeddinggemma-300m-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf
              fi
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              # [T003903] Kein BestEffort-QoS: Model-Download darf unter
              # Node-Druck nicht als erster evictet werden.
              cpu: 100m
              memory: 256Mi
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-b11561@sha256:052888c603894ecfa08deb6714fdc2d7084e491e174d5ab41bfb36b49ee7151c
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          args:
            - "-m"
            - "/models/embeddinggemma-300M-Q8_0.gguf"
            - "--alias"
            - "embeddinggemma-300m"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            # CPU-only wie gemma-embed (kein GPU-Request: spreadfaehig auf
            # alle gpu-cluster-Nodes, nicht nur i915-Traeger).
            - "-ngl"
            - "0"
            - "--device"
            - "none"
            - "--no-op-offload"
            - "--no-kv-offload"
            # Kontext/Slots: 2 x 2048 wie gemma-embed (T002661/T002835).
            - "-c"
            - "4096"
            - "-b"
            - "2048"
            - "-ub"
            - "2048"
            - "-np"
            - "2"
            - "-t"
            - "2"
            - "-tb"
            - "2"
            - "--embeddings"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          emptyDir: {}
