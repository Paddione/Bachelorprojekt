# ═══════════════════════════════════════════════════════════════════
# LLM-Proxy request-log retention (tickets.llm_proxy_request_log)
#
# Die Tabelle speichert request_body/response_body als vollstaendigen
# TEXT (~200 KB/Zeile) — ohne Retention wauchs sie in 6 Wochen auf
# 360 MB (Schema-Audit 2026-10-04). Politik:
#   * Bodies > 7 Tage: NULL setzen (Metadaten — Modell, Tokens,
#     Dauer, Status — bleiben zur Analyse erhalten)
#   * Zeilen > 90 Tage: DELETE
# Runs daily 03:23 (zwischen den knowledge-ingest-Jobs 02:00/02:30/03:00).
#
# Warte-Loop vor dem ersten psql: frische CronJob-Pod-IPs brauchen bis
# zu ~60s, bis kube-router sie in die NetPol-Quell-Sets uebernommen hat
# — ohne Wait schlaegt der erste Verbindungsversuch mit TCP-refused
# fehl und jede Backoff-Wiederholung (neuer Pod, neue IP) rennt in
# dasselbe Race. Der Table-Guard haelt den Job in Umgebungen stabil,
# deren website-DB das Log noch nicht kennt (z.B. korczewski).
# Kein ${VAR}-Substitution — Credentials via secretKeyRef, daher
# schema-audit-neutral.
# ═══════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-proxy-log-retention
  namespace: workspace
  labels:
    app: cronjobs
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: cronjobs
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              # Gleiche Version wie shared-db — Image ist auf allen Nodes
              # bereits present, kein Pull, psql-Client inklusive.
              image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: workspace-secrets
                      key: WEBSITE_DB_PASSWORD
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  # NetPol-Sync abwarten (siehe Kommentar oben), max ~90s.
                  ok=0
                  for attempt in $(seq 1 18); do
                    if pg_isready -h shared-db -p 5432 -t 3 -q; then ok=1; break; fi
                    sleep 5
                  done
                  [ "$ok" = "1" ] || { echo "shared-db not reachable after 18 tries"; exit 1; }
                  # Achtung: der Flux-Renderer halbiert $$ global (T002306) —
                  # daher bewusst KEIN plpgsql-DO-Block, sondern ein Shell-Guard.
                  table_exists=$(psql -h shared-db -U website -d website -Atc "SELECT to_regclass('tickets.llm_proxy_request_log') IS NOT NULL")
                  if [ "$table_exists" = "t" ]; then
                    psql -h shared-db -U website -d website -v ON_ERROR_STOP=1 \
                      -c "UPDATE tickets.llm_proxy_request_log SET request_body = NULL, response_body = NULL WHERE ts < now() - interval '7 days' AND (request_body IS NOT NULL OR response_body IS NOT NULL)" \
                      -c "DELETE FROM tickets.llm_proxy_request_log WHERE ts < now() - interval '90 days'"
                  else
                    echo "tickets.llm_proxy_request_log does not exist in this environment - skipping"
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
