# ─────────────────────────────────────────────────────────────────────────────
# llm-retrieval-gpu: LFM2.5 Embedding als Kubernetes-Deployment
# (CPU, Muster bge-embed) — Nachfolger des Desktop-Dienstes :8095.
#
# llama.cpp-Server auf CPU (kein NodeSelector, keine i915-Ressource):
#   - lfm-embed   (LFM2.5-Embedding-350M-Q8_0, --embeddings): Port 8080
#
# Die iGPU-Variante (Intel iGPU, Vulkan, server-vulkan, -ngl 99) ist
# entfallen: devmesh hat keine intel-igpu-Nodes mehr, das Deployment
# blieb Pending und /v1/lfm/embeddings lag brach. CPU reicht fuer
# 350M-Q8 (Muster bge-embed/gemma-embed: server-b11561, -ngl 0).
#
# LFM2.5-ColBERT + MaxSim-Rerank entfernt (Messung 2026-10-26, Code-Suche:
# MRR@10 0,495 gegen 0,552 ohne Rerank; einziger Verbraucher war
# colbert_rerank.py im Dotfiles-Repo).
#
# Modell-Population: eigener PVC (RWO, local-path wie bge-embed) +
# idempotenter curl-InitContainer. Strategie Recreate (T002604).
# ─────────────────────────────────────────────────────────────────────────────

# ── lfm-embed: LFM2.5-Embedding (llama.cpp, CPU) ──────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lfm-embed-models
  labels:
    app: lfm-embed
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfm-embed
  labels:
    app: lfm-embed
spec:
  replicas: 1
  # Recreate, nicht RollingUpdate: RWO-PVC (siehe llm-gpu.yaml, T002604).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lfm-embed
  template:
    metadata:
      labels:
        app: lfm-embed
    spec:
      # Kein NodeSelector: laeuft auf jedem amd64-Node (CPU-Betrieb).
      # fsGroup 101: curlimages/curl als uid=100/gid=101 (llm-gpu.yaml).
      # SA-GR-06: runAsNonRoot auf Pod-Ebene, UIDs auf Container-Ebene.
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      initContainers:
        - name: model-download
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ ! -s /models/LFM2.5-Embedding-350M-Q8_0.gguf ]; then
                echo "Downloading LFM2.5-Embedding-350M-Q8_0.gguf ..."
                curl -fL --retry 3 --connect-timeout 10 \
                  -o /models/LFM2.5-Embedding-350M-Q8_0.gguf \
                  https://huggingface.co/LiquidAI/LFM2.5-Embedding-350M-GGUF/resolve/main/LFM2.5-Embedding-350M-Q8_0.gguf
              fi
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              # [T003903] Kein BestEffort-QoS (llm-gpu.yaml).
              cpu: 100m
              memory: 256Mi
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server-b11561@sha256:052888c603894ecfa08deb6714fdc2d7084e491e174d5ab41bfb36b49ee7151c
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "-m"
            - "/models/LFM2.5-Embedding-350M-Q8_0.gguf"
            - "--alias"
            - "lfm25-embedding-350m"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-c"
            - "8192"
            - "-b"
            - "2048"
            - "-ub"
            - "2048"
            - "-ngl"
            - "0"
            - "-np"
            - "2"
            # -t an limits.cpu gebunden (T002661, llm-gpu.yaml).
            - "-t"
            - "2"
            - "--embeddings"
          env:
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: cache
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: lfm-embed-models
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-lfm-embed
  labels:
    app: llm-gateway
spec:
  selector:
    app: lfm-embed
  ports:
    - name: http
      port: 8081
      targetPort: 8080
