apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: workspace-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: operator-email
  receivers:
    # G-ALR01 (Eigner-Entscheid 2026-11-06: übrige Health-Goals umsetzen) —
    # T900001-Umkehr: E-Mail-Receiver reaktiviert, damit Alertmanager einen
    # nicht-nullen Receiver mit emailConfigs hat. SMTP-Credentials aus dem
    # SealedSecret alertmanager-smtp (k3d/monitoring/alertmanager-smtp-secret.yaml).
    # Hinweis: wirksam erst mit laufendem Monitoring-Stack (Prometheus fehlt
    # derzeit — OBS01/CAP01/SLO01 bleiben n/a, bis er deployed ist).
    - name: operator-email
      emailConfigs:
        - sendResolved: true
          to: korczewski@mailbox.org
          from: ${SMTP_FROM}
          smarthost: ${SMTP_HOST}:${SMTP_PORT}
          authUsername: ${SMTP_USER}
          authPassword:
            name: alertmanager-smtp
            key: SMTP_PASSWORD
          requireTLS: true
# Pushover-Routing bewusst entfernt [T014542]: PUSHOVER_USER/PUSHOVER_TOKEN waren
# nie gesetzt (environments/*.yaml führen "" seit #1552), das SealedSecret
# entschlüsselt zu leeren Werten — der Prometheus Operator verwirft deshalb die
# komplette AlertmanagerConfig ("mandatory field userKey is empty") und legt damit
# auch das E-Mail-Routing lahm. Wiedereinführung NUR mit nicht-leeren Credentials:
# neues alertmanager-pushover-SealedSecret + pushoverConfigs-Receiver + critical-Route.
# (Toter Secret-Template-Rest entfernt [T016575].)
