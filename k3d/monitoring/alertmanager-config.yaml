apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: workspace-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: "null"
  receivers:
    # T016592: saemtliche ausgehenden Benachrichtigungs-E-Mails sind
    # abgeschaltet. Die frueheren Receiver `email` (${CONTACT_EMAIL}) und
    # `backup-email` (${BACKUP_ALERT_EMAIL}) samt der BackupJobFailed/
    # BackupCronJobStale-Kindroute sind entfallen.
    #
    # Bewusst ein leerer Receiver statt gar keinem: eine AlertmanagerConfig
    # ohne Receiver ist ungueltig und wird vom Prometheus Operator komplett
    # verworfen — derselbe Fehlermodus, den der T014542-Kommentar unten fuer
    # leere Pushover-Credentials festhaelt. Der `null`-Receiver ist die
    # Alertmanager-uebliche Form von "nirgendwohin".
    #
    # FOLGE, bewusst akzeptiert: Es gibt keinerlei Alarmierung mehr. Die
    # Alert-Regeln feuern weiter und sind in der Prometheus-/Alertmanager-UI
    # sichtbar, aber niemand wird benachrichtigt — auch nicht bei
    # fehlgeschlagenen Backups. Ausgebliebene Backups faellt nur noch ein
    # manuelles Audit auf.
    #
    # Wiedereinschalten: Receiver mit emailConfigs (Vorlage in der
    # Git-Historie dieses Commits) zurueckholen und route.receiver umbiegen.
    # ${CONTACT_EMAIL}, ${BACKUP_ALERT_EMAIL} und ${SMTP_*} bleiben in
    # environments/schema.yaml und der envsubst-Liste deklariert.
    - name: "null"
# Pushover-Routing bewusst entfernt [T014542]: PUSHOVER_USER/PUSHOVER_TOKEN waren
# nie gesetzt (environments/*.yaml führen "" seit #1552), das SealedSecret
# entschlüsselt zu leeren Werten — der Prometheus Operator verwirft deshalb die
# komplette AlertmanagerConfig ("mandatory field userKey is empty") und legt damit
# auch das E-Mail-Routing lahm. Wiedereinführung NUR mit nicht-leeren Credentials:
# über k3d/monitoring/alertmanager-secret-template.yaml gesealten
# alertmanager-pushover-SealedSecret + pushoverConfigs-Receiver + critical-Route.
