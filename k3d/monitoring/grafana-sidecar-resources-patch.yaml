apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: grafana-sc-dashboard
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
        - name: grafana-sc-datasources
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
