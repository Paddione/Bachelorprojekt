apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-goals-check
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: health-goals-check
        spec:
          restartPolicy: OnFailure
          containers:
            - name: health-goals-checker
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              command: ["/bin/sh", "-c", "echo 'Running health goals check cron'"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
