# promtail DaemonSet — collects container logs across all fleet nodes (both brands).
# Ships logs to the single Loki instance in the monitoring namespace.

config:
  clients:
    - url: http://loki.monitoring.svc:3100/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      - source_labels:
          - namespace
        regex: ".*-korczewski"
        target_label: brand
        replacement: "korczewski"
      - source_labels:
          - namespace
        regex: "workspace"
        target_label: brand
        replacement: "mentolder"
    pipelineStages:
      - json:
          expressions:
            level: level
      - template:
          source: level
          template: '{{ if eq .Value "50" }}error{{ else if eq .Value "40" }}warn{{ else if eq .Value "30" }}info{{ else }}{{ .Value }}{{ end }}'
      - labels:
          level:
      - match:
          selector: '{level="debug"}'
          action: drop

tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Image-Pin (Watchdog #7050, 2026-11-01): Chart-Default folgen, aber explizit
# gepinnt, damit Render-Drift sichtbar bleibt. Kein Digest-Pin moeglich
# (Chart kennt kein image.sha) — Digest folgt dem Chart-Release.
image:
  tag: "3.6.11"
