apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-ingress-penpot
  labels:
    app: penpot
spec:
  rules:
    - host: design.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penpot-gateway
                port:
                  number: 80
