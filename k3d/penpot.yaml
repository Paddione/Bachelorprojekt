apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-minio-pvc
  labels:
    app: penpot
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot
  labels:
    app: penpot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot
  template:
    metadata:
      labels:
        app: penpot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ['sh', '-c', 'until nc -w1 -z shared-db 5432 2>/dev/null; do echo "waiting for shared-db..."; sleep 3; done']
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
        - name: wait-for-minio
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command: ['sh', '-c', 'until nc -w1 -z penminio 9000 2>/dev/null; do echo "waiting for minio..."; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
      containers:
        # ── Backend (Java/Tomcat) ──────────────────────────────
        - name: penpot-backend
          image: penpotapp/backend:2.17.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DATABASE_URL
              value: "postgresql://penpot:$(PENPOT_DB_PASSWORD)@shared-db:5432/penpot?sslmode=disable"
            - name: PENPOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: PENPOT_DB_PASSWORD
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: PENPOT_SECRET_KEY
            - name: PENPOT_FLAGS
              value: "enable-external-content-service"
            # MinIO
            - name: PENPOT_MINIO_HOST
              value: "penminio"
            - name: PENPOT_MINIO_PORT
              value: "9000"
            - name: PENPOT_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: PENPOT_MINIO_SECRET_KEY
            - name: PENPOT_MINIO_ACCESS_KEY
              value: "penpot"
            - name: PENPOT_STORAGE_SERVICE_IMPL
              value: "minio"
            - name: PENPOT_STORAGE_MINIO_BUCKET
              value: "penpot-assets"
            # Pocket-ID OIDC
            - name: PENPOT_OIDC_ENABLED
              value: "true"
            - name: PENPOT_OIDC_AUTH_SERVER_URL
              value: "http://pocket-id:1411"
            - name: PENPOT_OIDC_CLIENT_ID
              value: "penpot"
            - name: PENPOT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: POCKET_ID_PENPOT_SECRET
            - name: PENPOT_OIDC_SCOPE
              value: "openid email profile"
            - name: PENPOT_PUBLIC_URI
              value: "${PENPOT_PUBLIC_URI}"
            - name: TZ
              value: Europe/Berlin
          ports:
            - containerPort: 6060
          readinessProbe:
            httpGet:
              path: /api/health
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 6060
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: "100m"
            limits:
              memory: 512Mi
              cpu: "500m"
        # ── Frontend (ClojureScript) ───────────────────────────
        - name: penpot-frontend
          image: penpotapp/frontend:2.17.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PENPOT_PUBLIC_URI
              value: "${PENPOT_PUBLIC_URI}"
            - name: TZ
              value: Europe/Berlin
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 128Mi
              cpu: "50m"
            limits:
              memory: 512Mi
              cpu: "250m"
        # ── Gateway (Nginx) ────────────────────────────────────
        - name: penpot-gateway
          image: penpotapp/gateway:2.17.2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: "25m"
            limits:
              memory: 128Mi
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penminio
  labels:
    app: penminio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penminio
  template:
    metadata:
      labels:
        app: penminio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workspace-secrets
                  key: PENPOT_MINIO_SECRET_KEY
            - name: MINIO_ROOT_USER
              value: "penpot"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: "50m"
            limits:
              memory: 512Mi
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: penpot-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-gateway
  labels:
    app: penpot
spec:
  selector:
    app: penpot
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: penminio
  labels:
    app: penminio
spec:
  selector:
    app: penminio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
