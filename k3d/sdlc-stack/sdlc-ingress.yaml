apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdlc-ingress
  labels:
    app: sdlc-console
spec:
  rules:
    - host: sdlc.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sdlc-console
                port:
                  number: 8080
    - host: auth.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  number: 1411
