apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace-dev

resources:
  - ../../k3d/dev-stack
# T900399: die Fleet-native-Factory-SealedSecret (T016422 / ADR-007 A.4)
# entfaellt mit dem factory-runner — sie enthielt ausschliesslich dessen
# Repo-Key, Dispatcher-Konfiguration und Provider-Credentials.

patches:
  - target:
      kind: Namespace
      name: monitoring
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
