apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workspace-dev

resources:
  - ../../k3d/dev-stack
  # T016422 / ADR-007 A.4: Fleet-native Factory bekommt Repo-Key,
  # Dispatcher-Konfiguration und Provider-Credentials ausschließlich als
  # clustergebundenes SealedSecret; kein Klartext landet im OCI-Artefakt.
  - ../../environments/sealed-secrets/workspace-dev-factory-runner.yaml

patches:
  - target:
      kind: Namespace
      name: monitoring
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
