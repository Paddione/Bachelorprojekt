apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# korczewski brand on fleet — reuse the existing prod-korczewski overlay (already
# pins pk nodes), then apply fleet-common to delete the cluster singletons the
# platform layer owns. Namespace stays workspace-korczewski.
resources:
  - ../../prod-korczewski
  - ../../prod/monitoring
components:
  - ../components/fleet-common
  - ../components/llm-models-longhorn

# T002207: remove all one-shot Jobs from the brand overlay — they now
# live in flux-<brand>-jobs Kustomization with force:true and wait:false.
patches:
  # korczewski braucht kein Brett (eigene Brett-Entwicklung liegt bei gekko32/brett,
  # mentolder-Prod nutzt das gekko32-Image) — Workloads aus dem Brand-Overlay entfernen.
  - target: { group: apps, version: v1, kind: Deployment, name: brett }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: brett
  - target: { version: v1, kind: Service, name: brett }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: brett
  - target: { group: apps, version: v1, kind: Deployment, name: oauth2-proxy-brett }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth2-proxy-brett
  - target: { version: v1, kind: Service, name: oauth2-proxy-brett }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: oauth2-proxy-brett
  - target: { group: networking.k8s.io, version: v1, kind: Ingress, name: workspace-ingress-brett }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: workspace-ingress-brett
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: brett-ingress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: brett-ingress
  - target: { group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: brett-egress }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: brett-egress
  - target: { group: batch, version: v1, kind: Job }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: any-job
