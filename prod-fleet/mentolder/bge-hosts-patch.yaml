# prod-fleet/mentolder/bge-hosts-patch.yaml [T016430]
# Prod-Hosts für die internen bge-Routen (Base: k3d/llm-gateway-ingress.yaml,
# Fail-closed via Middleware 'wg-only'). HINWEIS: bge-embed/rerank laufen nur im
# ns workspace (kein korczewski-Deploy, T002551); die Hosts sind Operator-/MCP-
# Endpunkte, keine Kundenfläche.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-gateway-embed
  namespace: workspace
spec:
  routes:
    - kind: Rule
      match: Host(`bge-embed.mentolder.de`)
      middlewares:
        - name: wg-only
      services:
        - name: llm-gateway-embed
          port: 8081
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-gateway-rerank
  namespace: workspace
spec:
  routes:
    - kind: Rule
      match: Host(`bge-rerank.mentolder.de`)
      middlewares:
        - name: wg-only
      services:
        - name: llm-gateway-rerank
          port: 8081
