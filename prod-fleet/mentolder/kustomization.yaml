apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mentolder brand on fleet (gekko) — reuse the existing prod-mentolder overlay, then
# apply fleet-common (delete the cluster singletons now owned by
# prod-fleet/platform). Namespace stays workspace (set by the prod-mentolder/k3d
# base). Zielbild T016529 (D2/D3/Q16): nur Prod auf gekko-hetzner-2/3/4
# (embedded etcd), kein Longhorn (local-path als Default-StorageClass);
# staging-/dev-/korczewski-Pfade laufen nicht ueber diese Kustomization
# (Ziel devmesh). Website affinity comes from WEBSITE_NODE_AFFINITY in
# environments/fleet-mentolder.yaml.
resources:
  - ../../prod-mentolder
  - ../../prod/monitoring
  - sessions-server.yaml
  - oauth2-proxy-sessions.yaml
  - studio-ingress.yaml
  - langfuse-dev-proxy.yaml
  - brain.yaml
components:
  - ../components/fleet-common
  # D3 (T016529): kein Longhorn mehr — die fruehere llm-models-longhorn-
  # Komponente ist entfernt; bge-Modell-PVCs nutzen die Default-StorageClass
  # (local-path) wie die k3d-Basis.

# Exclude the dev.mentolder.de stack from fleet Phase 2a (dev migration is 2c).
# prod-mentolder renders these dev resources; with DEV_* blanked in
# environments/fleet-mentolder.yaml they would either be invalid (the dev
# Ingress/Certificate render with empty hosts -> "*." / null dnsNames, rejected
# by the API — surfaced by the Task 8 server-side dry-run) or dangerous (the
# dev-db-refresh CronJob drops + recreates databases). Delete them here in the
# mentolder wrapper (NOT fleet-common — korczewski has no equivalents, so a shared
# delete would error). The harmless *.localhost dev IngressRoutes are left intact.
patches:
  # BGE-Embed/Rerank IngressRoutes — interne MCP-Endpunkte (T016430).
  # Ohne diesen Patch still ignoriert (YAML-Schlüssel-Ueberschreibung, T900009).
  - path: bge-hosts-patch.yaml
  # Coaching Studio — prod overlay for mentolder brand on the fleet
  # cluster. Pins image-digest, prod-issuer, prod TLS, and node-affinity
  # for fleet pk nodes. (T001002)
  - path: studio-patch.yaml
  # Brett prod patch
  - target:
      kind: Deployment
      name: brett
    path: brett-patch.yaml
  # NOTE: the dev SSO/TLS edge (workspace-ingress-dev, workspace-dev-wildcard-tls
  # Certificate, oauth2-proxy-dev Service/Deployment/Middleware) is no longer
  # rendered by prod-mentolder — it moved into the self-contained k3d dev stack
  # (k3d/dev-stack/). Their $patch:delete blocks were removed here [T000363].
  # Die drei dev-db-refresh-Deletes (CronJob, Script-ConfigMap, NetworkPolicy)
  # sind mit T002699 ebenfalls entfallen: prod-mentolder rendert diese Ressourcen
  # nicht mehr, es gibt also nichts zu loeschen. Ein $patch:delete auf eine
  # Ressource, die gar nicht entsteht, ist folgenlos — behauptet aber die Existenz
  # von etwas, das es nicht gibt.

  # T002207: remove all one-shot Jobs from the brand overlay — they now
  # live in flux-<brand>-jobs Kustomization with force:true and wait:false,
  # preventing a broken Job from gating the entire brand deploy.
  - target: { group: batch, version: v1, kind: Job }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: any-job

  # D3 (T016529): Vaultwarden-PVC von Longhorn (Basis-Patch in prod-mentolder)
  # auf local-path zurueckstellen — im gekko-Cluster gibt es kein Longhorn.
  - target: { kind: PersistentVolumeClaim, name: vaultwarden-data-pvc }
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vaultwarden-data-pvc
      spec:
        storageClassName: local-path

  # whisper needs a GPU node on mentolder (k3s home workers); the gekko fleet
  # nodes have no GPU, so transcription is best-effort here — repoint to the
  # gekko server nodes so the pod at least schedules instead of staying
  # Pending (flag for Phase 2b capacity review).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: whisper
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [gekko-hetzner-2, gekko-hetzner-3, gekko-hetzner-4]
