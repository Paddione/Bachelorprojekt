apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mentolder brand on fleet — reuse the existing prod-mentolder overlay, then
# apply fleet-common (delete the cluster singletons now owned by
# prod-fleet/platform). Namespace stays workspace (set by the prod-mentolder/k3d
# base). Node-affinity repoints for fleet pk nodes are added to fleet-common at
# deploy time (Task 8); website affinity comes from WEBSITE_NODE_AFFINITY in
# environments/fleet-mentolder.yaml.
resources:
  - ../../prod-mentolder
  - ../../prod/monitoring
  - sessions-server.yaml
  - studio-ingress.yaml
components:
  - ../components/fleet-common
  - ../components/llm-models-longhorn

# Exclude the dev.mentolder.de stack from fleet Phase 2a (dev migration is 2c).
# prod-mentolder renders these dev resources; with DEV_* blanked in
# environments/fleet-mentolder.yaml they would either be invalid (the dev
# Ingress/Certificate render with empty hosts -> "*." / null dnsNames, rejected
# by the API — surfaced by the Task 8 server-side dry-run) or dangerous (the
# dev-db-refresh CronJob drops + recreates databases). Delete them here in the
# mentolder wrapper (NOT fleet-common — korczewski has no equivalents, so a shared
# delete would error). The harmless *.localhost dev IngressRoutes are left intact.
patches:
  - path: studio-patch.yaml
  - target:
      kind: Deployment
      name: brett
    path: brett-patch.yaml
  # NOTE: the dev SSO/TLS edge (workspace-ingress-dev, workspace-dev-wildcard-tls
  # Certificate, oauth2-proxy-dev Service/Deployment/Middleware) is no longer
  # rendered by prod-mentolder — it moved into the self-contained k3d dev stack
  # (k3d/dev-stack/). Their $patch:delete blocks were removed here [T000363].
  # Die drei dev-db-refresh-Deletes (CronJob, Script-ConfigMap, NetworkPolicy)
  # sind mit T002699 ebenfalls entfallen: prod-mentolder rendert diese Ressourcen
  # nicht mehr, es gibt also nichts zu loeschen. Ein $patch:delete auf eine
  # Ressource, die gar nicht entsteht, ist folgenlos — behauptet aber die Existenz
  # von etwas, das es nicht gibt.

  # T002207: remove all one-shot Jobs from the brand overlay — they now
  # live in flux-<brand>-jobs Kustomization with force:true and wait:false,
  # preventing a broken Job from gating the entire brand deploy.
  - target: { group: batch, version: v1, kind: Job }
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: any-job

  # whisper needs a GPU node on mentolder (k3s home workers); fleet pk nodes have
  # no GPU, so transcription is best-effort here — repoint so the pod at least
  # schedules instead of staying Pending (flag for Phase 2b capacity review).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: whisper
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [pk-hetzner-4, pk-hetzner-6, pk-hetzner-8]
