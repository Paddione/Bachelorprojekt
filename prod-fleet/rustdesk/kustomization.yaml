apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared RustDesk relay (hbbs/hbbr) for the fleet cluster (F2/F4: GitOps
# statt imperativ). replicas: 1 ist always-on — der On-demand-Sleeper
# (k3d/rustdesk-stack/on-demand.yaml, T015170) ist bewusst NICHT Teil des
# Flux-Pfads: Flux wuerde ein imperatives Scale-to-0 zuruecknehmen. Wer die
# Schlafschaltung zurueck will, nimmt den Stack aus Flux und nutzt wieder
# task rustdesk:{deploy,wake,sleep}. Secrets (rustdesk-secrets) kommen aus
# dem SealedSecrets-Pfad (./sealed-secrets/mentolder), nicht aus dem Repo.
resources:
  - ../../k3d/rustdesk-stack
