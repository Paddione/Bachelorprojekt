apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging website overlay (T015004) — deploys the public site into the isolated
# website-staging namespace so the staging app stack's CronJobs can reach it via
# website.website-staging.svc.cluster.local. Mirrors prod-fleet/website-mentolder;
# the website intentionally lives OUTSIDE the workspace overlay (see
# prod-fleet/components/fleet-common).
namespace: website-staging

resources:
  - ../../k3d/website.yaml
  - ../../k3d/website-seller-config.yaml
  # Shared domain config (tracked here to survive cluster rebuilds — T000146)
  - ../website-common/domain-config.yaml
  # T002052 pattern: website-scoped security-headers (no noindex) — keeps the
  # staging site crawlable for smoke/audit runs
  - website-security-headers.yaml
  - website-ingress-web.yaml

patches:
  - target:
      kind: Deployment
      name: website
    path: website-patch.yaml
