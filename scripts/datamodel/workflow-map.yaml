# workflow-map.yaml — hand-curated mapping: workflow step → shared-db tables (R/W) + gaps.
#
# Consumed by scripts/datamodel/build_datamodel.py via `task datamodel:build`:
#   build_datamodel.py --map <this file> --out /tmp/datamodel-workflow.md
#   Contract: /tmp/datamodel-workflow.md is the deliverable — regenerate after
#   schema or step changes.
#
# Schema:
#   families:      ordered swimlanes for the lifecycle rendering (left → right)
#   domain_order:  stable ordering/labels of the DB domains; unknown live schemas
#                  render loudly as "Unknown — file an issue"
#   steps:         one entry per workflow step. `writes`/`reads` accept the keys
#                  `tables` ("schema.table") and `files` (globs). Table refs are
#                  resolved against live DB introspection — a typo aborts the build.
#   gaps:          per-step gap entries. Gap-type taxonomy:
#                    db-fk          (red)    — two pools should FK to each other but don't
#                    workflow-to-db (orange) — step output stays file-only, never reaches a table
#                    cross-skill    (purple) — data handoff between two steps is broken/missing
#   cross_skill_gaps: gap edges that span two steps (see taxonomy above)
#   heuristics:    optional auto-discovery (unbound_fk_candidates, table_with_no_writer);
#                  results render with a "(heuristic)" tag — suggestions, not verdicts.
families:
  - id: dev-flow
    label: "Dev-Flow Skills"
    color: feature
  - id: agents
    label: "Sub-Agents"
    color: chore
  - id: ci
    label: "CI/CD Pipeline"
    color: gold
  - id: app
    label: "App Workflows"
    color: audit

domain_order:
  - { id: crm-communication,         label: "CRM & Communication" }
  - { id: billing-accounting,         label: "Billing & Accounting" }
  - { id: questionnaire-coaching,     label: "Questionnaire & Coaching" }
  - { id: tickets-issues,             label: "Tickets & Issues" }
  - { id: platform-config,            label: "Platform & Config" }
  - { id: testing-ci,                 label: "Testing & CI" }
  - { id: ai-assistant,               label: "AI Assistant" }
  - { id: bachelorprojekt-superpowers, label: "Bachelorprojekt & Superpowers" }

steps:
  # ── Dev-Flow family ───────────────────────────────────────────────────────
  - id: brainstorming
    family: dev-flow
    label: "brainstorming skill"
    description: "Explores user intent and design alternatives before any implementation."
    writes:
      files: [".superpowers/brainstorm/*/state/events"]
    reads: {}
    gaps:
      - type: workflow-to-db
        explanation: "Session events are written to the local filesystem only — never ingested into any DB table."

  - id: writing-plans
    family: dev-flow
    label: "writing-plans skill"
    description: "Turns a spec into a committed, task-structured implementation plan."
    writes:
      files: ["docs/superpowers/plans/*.md"]
    reads:
      files: ["docs/superpowers/specs/*.md"]
    gaps: []

  - id: using-git-worktrees
    family: dev-flow
    label: "using-git-worktrees"
    description: "Sets up an isolated git worktree so parallel features don't collide."
    writes: {}
    reads: {}
    gaps: []

  - id: dev-flow-plan
    family: dev-flow
    label: "dev-flow-plan skill"
    description: "Orchestrates path-choice, worktree setup, brainstorming, spec and plan, then stages the plan (commit+push, no ticket backend since 2026-10-14)."
    writes:
      files: ["docs/superpowers/plans/*.md", ".agents/plans/*"]
    reads: {}
    gaps: []

  - id: dev-flow-execute
    family: dev-flow
    label: "dev-flow-execute skill"
    description: "Picks up a committed plan, implements it, opens a PR, merges, and marks the plan frontmatter completed."
    writes:
      tables:
        - "bachelorprojekt.features"
    reads:
      files: ["docs/superpowers/plans/*.md"]
    gaps:
      - type: workflow-to-db
        explanation: "Plan completion lives in frontmatter only — in-flight execution state is invisible to the DB (ticket_plans retiriert 2026-10-14)."

  - id: plan-context-sh
    family: dev-flow
    label: "plan-context.sh"
    description: "Reads active plan frontmatter and injects it into sub-agent prompts."
    reads:
      files: ["docs/superpowers/plans/*.md"]
    writes: {}
    gaps: []

  - id: tdd-failing-test
    family: dev-flow
    label: "TDD skill"
    description: "Enforces red → green → refactor discipline before any feature code is written."
    writes:
      tables: ["public.test_runs", "public.test_results"]
    reads: {}
    gaps: []

  # ── Sub-Agents family ─────────────────────────────────────────────────────
  # T900858: die sechs bachelorprojekt-*-Agenten sind in drei bp-* aufgegangen;
  # reads/writes sind die Vereinigung der jeweils zusammengelegten Agenten.
  - id: bp-build
    family: agents
    label: "bp-build"
    description: "Sub-agent for Kubernetes manifests, Kustomize overlays, Taskfile deploys, SealedSecrets and OIDC (ex infra + security)."
    writes:
      files: ["k3d/**/*.yaml", "prod*/**/*.yaml", "environments/sealed-secrets/*.yaml"]
    reads:
      files: ["k3d/**/*.yaml", "Taskfile.yml", "environments/.secrets/*.yaml"]
    gaps: []

  - id: bp-run
    family: agents
    label: "bp-run"
    description: "Sub-agent for live cluster operations and PostgreSQL schema, queries and backup/restore (ex ops + db)."
    writes: {}
    reads:
      tables: ["bachelorprojekt.features"]
    gaps: []

  - id: bp-ship
    family: agents
    label: "bp-ship"
    description: "Sub-agent for the Astro/Svelte website, /api/* endpoints and BATS/Playwright tests (ex website + test)."
    writes:
      tables: ["public.site_settings", "public.assistant_conversations", "public.test_runs", "public.test_results", "public.playwright_reports"]
    reads:
      tables: ["bachelorprojekt.features", "public.web_sessions"]
    gaps: []

  # ── CI/CD Pipeline family ─────────────────────────────────────────────────
  - id: track-pr
    family: ci
    label: "track-pr.yml"
    description: "GitHub Action: writes a tracking JSON for every merged PR."
    writes:
      files: ["tracking/pending/*.json"]
    reads: {}
    gaps: []

  - id: track-plans
    family: ci
    label: "track-plans.yml"
    description: "GitHub Action: updates plan frontmatter status on merge."
    writes:
      files: ["docs/superpowers/plans/*.md"]
    reads:
      files: ["docs/superpowers/plans/*.md"]
    gaps: []

  - id: tracking-import-cron
    family: ci
    label: "tracking-import CronJob"
    description: "In-cluster CronJob: drains tracking/pending/*.json into bachelorprojekt.features every 5 minutes."
    writes:
      tables: ["bachelorprojekt.features"]
    reads:
      files: ["tracking/pending/*.json"]
    gaps: []

  - id: build-website
    family: ci
    label: "build-website.yml"
    description: "GitHub Action: builds and rolls the Astro website on components/website/** push to main."
    writes: {}
    reads:
      files: ["components/website/src/**", "components/website/public/**"]
    gaps: []

  - id: manual-deploy
    family: ci
    label: "Manual deploy"
    description: "Developer triggers workload rollout via task feature:deploy or task workspace:deploy ENV=<env>."
    writes: {}
    reads:
      files: ["k3d/**/*.yaml", "prod-mentolder/**", "prod-korczewski/**"]
    gaps: []

  # ── App Workflows family ──────────────────────────────────────────────────
  - id: keycloak-sso-login
    family: app
    label: "Keycloak SSO login"
    description: "User authenticates via Keycloak OIDC; session token issued to downstream services."
    writes:
      tables: ["public.web_sessions"]
    reads: {}
    gaps:
      - type: db-fk
        target: "tickets-issues"
        explanation: "web_sessions.user_id is a plain UUID referencing the Keycloak realm — no FK to a local users table."

  - id: nextcloud-talk-meeting
    family: app
    label: "Nextcloud Talk meeting"
    description: "Users join a Talk video room; chat and recording metadata are stored by Nextcloud."
    writes: {}
    reads:
      tables: ["public.web_sessions"]
    gaps:
      - type: workflow-to-db
        explanation: "Talk meeting events are stored in Nextcloud's own MariaDB — not in shared-db."

  - id: website-chat-message
    family: app
    label: "Website chat message"
    description: "User sends a real-time message via the Astro website SSE channel."
    writes:
      tables: ["public.messages", "public.chat_messages"]
    reads:
      tables: ["public.web_sessions", "public.chat_rooms"]
    gaps: []

  - id: bug-report-submit
    family: app
    label: "Bug report submit"
    description: "User submits a bug report; stored in bugs.bug_tickets."
    writes:
      tables: ["public.bug_tickets"]
    reads: {}
    gaps:
      - type: cross-skill
        explanation: "Retiriert 2026-10-14: die Triage-Seite (tickets-admin-create, tickets.*) entfiel — Bug-Reports landen in bugs.bug_tickets, die Weiterverarbeitung läuft über GitHub-Issues."

  - id: coaching-ingest
    family: app
    label: "coaching:ingest task"
    description: "Ingests a PDF/EPUB into pgvector and coaching.books."
    writes:
      tables: ["public.questionnaire_templates"]
    reads:
      files: ["*.pdf", "*.epub"]
    gaps:
      - type: workflow-to-db
        explanation: "pgvector embeddings land in a separate vector DB collection — the schema mapping is external to shared-db."

  - id: brett-snapshot-save
    family: app
    label: "Brett snapshot save"
    description: "User saves a systemic constellation board; stored as brett_snapshots."
    writes:
      tables: ["public.brett_snapshots", "public.brett_rooms"]
    reads:
      tables: ["public.brett_rooms", "public.web_sessions"]
    gaps: []

cross_skill_gaps:
  - from: dev-flow-plan
    to: tracking-import-cron
    via: "plan slug/branch → bachelorprojekt.features (no plan column today)"
    explanation: "dev-flow-plan stages plans per commit+push, but tracking-import-cron only ingests PR metadata — it never joins plan slugs into bachelorprojekt.features."

  - from: brainstorming
    to: tracking-import-cron
    via: ".superpowers/brainstorm/*/state/events (filesystem only)"
    explanation: "Brainstorming session events stay in the local filesystem and are never ingested into any DB table, making session data invisible to all analytics queries."

  - from: bug-report-submit
    to: tracking-import-cron
    via: "bugs.bug_tickets vs bachelorprojekt.features — two separate write paths"
    explanation: "Retiriert 2026-10-14 (tickets-admin-create entfiel): ein User-Bug (bugs.bug_tickets) und ein getracktes Feature werden von verschiedenen Flows geschrieben, ohne automatische Promotion."

heuristics:
  unbound_fk_candidates:
    enabled: true
    column_pattern: "_id$"
    exclude_schemas: ["keycloak", "nextcloud", "vaultwarden", "pg_catalog", "information_schema"]
  table_with_no_writer:
    enabled: true
    exclude_schemas: ["keycloak", "nextcloud", "vaultwarden", "pg_catalog", "information_schema"]
