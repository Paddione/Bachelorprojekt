# scripts/tmux/agent-status.conf — Markieren statt Zoomen (tmux 3.4).
# Einbinden:  tmux source-file scripts/tmux/agent-status.conf
# Konvention: pro Pane `tmux set -p @agent waiting|running` (Hooks setzen,
# nur prefix+n zoomt — Hooks fokussieren NIE, siehe F1/F2).
#
# Wartende zaehlen (billig, Fehler -> leer):
set -g status-right 'waiting:#(tmux list-panes -a -F "#{@agent}" 2>/dev/null | grep -c waiting) | %H:%M'
# Wartende Panes am Rahmen erkennbar (3.4-sicher via pane-border-format):
set -g pane-border-status top
set -g pane-border-format '#{?#{==:#{@agent},waiting},#[fg=red] WAITING #[default],}#{pane_index} #{pane_title}'
# prefix+n: aeltestes wartendes Pane anspringen + zoomen + auf running setzen.
# Einzige Stelle mit select-pane/Zoom, nur auf expliziten Tastendruck.
bind-key n run-shell 'target=$(tmux list-panes -a -F "#{pane_id} #{@agent}" 2>/dev/null | awk "$2==\"waiting\" {print $1; exit}"); if [ -n "$target" ]; then tmux select-pane -t "$target"; tmux resize-pane -Z -t "$target"; tmux set -p -t "$target" @agent running; else tmux display-message "kein wartender Agent"; fi'
