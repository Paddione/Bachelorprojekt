# ────────────────────────────────────────────────────────────────────
# Brain Initial Ingest — Quartz Wiki Kompilierung
# ────────────────────────────────────────────────────────────────────

version: "3"

tasks:
  eval:
    desc: "Run deterministic offline Brain retrieval evaluation (report-only)"
    cmds:
      - 'python3 scripts/brain-retrieval-eval.py --wiki-dir "${BRAIN_WIKI_DIR:-$HOME/brain/wiki}" --eval-set tests/fixtures/brain/retrieval-eval.jsonl {{.CLI_ARGS}}'

  lifecycle:audit:
    desc: "Audit Brain provenance, validity and claims without mutation"
    cmds:
      - 'python3 scripts/brain-lifecycle-audit.py --brain-repo "${BRAIN_REPO:-$HOME/brain}" --source-root . {{.CLI_ARGS}}'

  expertise:fetch:
    desc: "Fetch and redact evidence for one explicitly selected GitHub PR"
    cmds:
      - 'python3 scripts/brain-expertise.py fetch {{.CLI_ARGS}}'

  expertise:stage:
    desc: "Render a local review candidate from redacted PR evidence"
    cmds:
      - 'python3 scripts/brain-expertise.py stage {{.CLI_ARGS}}'

  expertise:approve:
    desc: "Approve a reviewed expertise candidate into the allowlisted source tree"
    cmds:
      - 'python3 scripts/brain-expertise.py approve {{.CLI_ARGS}}'

  ingest:
    desc: "Initialisiere die Brain-Quartz-Wiki-Kompilierung (57 Specs + Runbooks)"
    dir: "."
    cmds:
      - bash scripts/brain-ingest-worklist.sh > brain-worklist.txt
      - 'echo "Worklist generiert: $(wc -l < brain-worklist.txt) Einträge"'
      # Quartz generate --sources brain-worklist.txt --output docs/brain/wiki/
      - 'echo "T001570: Brain Initial Ingest abgeschlossen. Siehe brain-worklist.txt"'

  ingest:verify:
    desc: "Verifiziere die Worklist Struktur (TAB-separated, sortiert)"
    cmds:
      - 'test -s brain-worklist.txt || { echo "FAIL: brain-worklist.txt leer oder fehlt"; exit 1; }'
      - head -5 brain-worklist.txt | awk -F'\t' '{print NF}' | uniq -c | awk '$1 != 3 {exit 1}'

  ingest:stats:
    desc: "Zeige Worklist-Statistik nach Gruppen"
    cmds:
      - cut -f2 brain-worklist.txt | sort | uniq -c | sort -rn

  # T014339 P3-Nachzug: der Swap-Wrapper ist obsolet — beide Tasks rufen
  # brain-ingest.sh direkt auf. Backend-URL und Modell bewusst HIER NICHT
  # gesetzt: das Skript ist die alleinige Quelle (FreeToken-native :1919,
  # Qwen3.6-35B-A3B-NVFP4), damit es keinen zweiten Port-Default gibt, den
  # der Guard in tests/spec/local-llm-proxy/brain-ingest-port.bats nicht
  # sehen kann. Vorgesetzte LM_*/MAX_*-Werte gewinnen weiterhin (env-
  # Vererbung), LM_MAX_TOKENS/MAX_SOURCE_CHARS/MAX_PARALLEL verwaltet das
  # Skript selbst (Chunker-Ära: 3072 Output-Tokens, 16k-Chunks, np=4).
  ingest:run:
    desc: "Full brain ingestion pipeline (LLM-assisted, creates PR)"
    cmds:
      - |-
        LM_DISABLE_THINKING="${LM_DISABLE_THINKING:-1}" \
        LM_TIMEOUT="${LM_TIMEOUT:-600}" \
          bash scripts/brain-ingest.sh --brain-repo ~/brain {{.CLI_ARGS}}

  ingest:pilot:
    desc: "Run ingestion on 20 pages (pilot batch)"
    cmds:
      - |-
        LM_DISABLE_THINKING="${LM_DISABLE_THINKING:-1}" \
        LM_TIMEOUT="${LM_TIMEOUT:-600}" \
          bash scripts/brain-ingest.sh --brain-repo ~/brain --pilot 20 {{.CLI_ARGS}}



  brain:chunk:
    desc: "Run the section-aware chunker (T002679)"
    cmds:
      - bash scripts/brain-chunk.sh {{.CLI_ARGS}}

  brain:mcp:
    desc: "Start the brain MCP server on stdio (T002679)"
    cmds:
      - python3 scripts/brain-mcp-server.py

  brain:mcp:tools:
    desc: "Verify brain MCP server responds with tool list"
    cmds:
      - |-
        printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' | python3 scripts/brain-mcp-server.py

  # ── T002679: Chunking und Retrieval ────────────────────────────────────
  chunk:
    desc: "Zerlege eine Quelldatei an Abschnittsgrenzen in Chunks (TSV-Manifest auf stdout)"
    summary: |
      Ruft den Chunker mit seiner vollstaendigen Aufrufkonvention auf, damit er
      ohne Kenntnis derselben benutzbar ist:
        task brain:chunk -- --source openspec/specs/software-factory.md \
          --slug openspec-specs-software-factory --out-dir /tmp/chunks
      Zusaetzliche Flags (--moc, --target-chars) werden durchgereicht.
    cmds:
      - bash scripts/brain-chunk.sh "$@"

  mcp:
    desc: "Starte den Brain-MCP-Server auf stdio (manuelles Anschliessen, Fehlersuche)"
    cmds:
      - BRAIN_WIKI_DIR="${BRAIN_WIKI_DIR:-$HOME/brain/wiki}" python3 scripts/brain-mcp-server.py "$@"

  mcp:tools:
    desc: "Pruefe den Brain-MCP-Server: initialize + tools/list, Antwortzeilen auf stdout"
    cmds:
      - |
        printf '%s\n%s\n' \
          '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"task","version":"1.0"}}}' \
          '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | BRAIN_WIKI_DIR="${BRAIN_WIKI_DIR:-$HOME/brain/wiki}" python3 scripts/brain-mcp-server.py
