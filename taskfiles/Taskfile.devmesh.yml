# taskfiles/Taskfile.devmesh.yml
# ─────────────────────────────────────────────────────────────────────────────
# devmesh — lokaler k3s-Dev-Cluster auf Bare-Metal im Heimnetz (ADR-008).
# SP-1 (T900116): Tailnet-Erreichbarkeit der devmesh-Server.
# SP-2 (T900117): K3s-Installation, Preflight, Kubeconfig-Merge und Status.
# SP-3 (T900118): Dev-Stack auf devmesh, Deploy, Migration, Backup.
#
# Usage:
#   task devmesh:tailnet:check              # Exit 0 alle Server erreichbar, 1 Befund, 2 Vorbedingung
#   task devmesh:tailnet:check -- --list    # Inventar validieren und ausgeben, ohne Tailscale-CLI
#   task devmesh:preflight HOST=<name>            # Host pruefen (Exit 0/1/2)
#   task devmesh:install HOST=<name> [DRY_RUN=1]  # k3s in der Inventar-Rolle installieren
#   task devmesh:kubeconfig [SERVER=<name>]       # Context devmesh mergen
#   task devmesh:status                           # Knoten, etcd, juengster Snapshot
#   task devmesh:flux:install                     # flux-operator per helm + FluxInstance deployen
#   task devmesh:flux:suspend                     # alle Kustomizations auf devmesh pausieren
#   task devmesh:flux:resume                      # alle Kustomizations auf devmesh fortsetzen
#   task devmesh:deploy                           # Stack rendern & deployen (nur wenn Flux suspendiert)
#   task devmesh:migrate                          # Migration aus k3d
#   task devmesh:registry:migrate                 # llm-proxy-Registry seeden (aus deploy gerufen) [T900191]
#   task devmesh:backup:run                       # Shared-DB Backup ausloesen
#   task devmesh:dns:deploy                       # LAN-/Tailnet-DNS (AdGuard) deployen [T016515]
#   task devmesh:dns:check [QUERY=<host>]         # jede Server-IP per dig abfragen [T016515]
#   task devmesh:tailnet:routes [DRY_RUN=1]       # Subnet-Routen aus dem Inventar freigeben [T016515]
#
# Runbook: docs/runbooks/devmesh-tailnet.md, docs/runbooks/devmesh-lan-dns.md
# ─────────────────────────────────────────────────────────────────────────────
version: "3"

tasks:
  acceptance:
    desc: "Abnahme-Gate vor dem k3d-Abbau: Health, migration comparison, fresh dump [T900145]"
    cmds:
      - bash scripts/devmesh/acceptance.sh

  k3d:teardown:
    desc: "Operator-only: decommission the former k3d development cluster [T900145]"
    cmds:
      - bash scripts/devmesh/k3d-teardown.sh

  tailnet:check:
    desc: "devmesh: jeden Inventar-Server per tailscale ping pruefen und direct/relay melden (Exit 1 = Server unerreichbar, 2 = Vorbedingung fehlt)"
    cmds:
      - bash scripts/devmesh/tailnet-check.sh {{.CLI_ARGS}}

  tailnet:routes:
    desc: "devmesh: Subnet-Routen (Inventarfeld subnet_routes) per tailscale set freigeben (DRY_RUN=1 zeigt nur die Befehle) [T016515]"
    env:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - bash scripts/devmesh/tailnet-subnet-routes.sh

  dns:deploy:
    desc: "devmesh: LAN-/Tailnet-DNS (AdGuard, Namespace lan-dns) ausrollen; prueft Node-DNS vor und nach dem Rollout und nimmt bei Fehler zurueck [T016515, T016520]"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
    cmds:
      - bash scripts/devmesh/lan-dns-deploy.sh

  dns:check:
    desc: "devmesh: AdGuard auf jedem Host mit lan_dns per dig abfragen (QUERY=<host>, Default quad9.net; Exit 1 = IP antwortet nicht, 2 = dig fehlt) [T016515]"
    vars:
      QUERY: '{{.QUERY | default "quad9.net"}}'
    cmds:
      - |
        set -euo pipefail
        command -v dig >/dev/null || { echo "Vorbedingung fehlt: dig" >&2; exit 2; }
        rc=0
        for ip in $(yq -r '.peers[] | select(.lan_dns == true) | .lan_ip' devmesh/inventory.yaml); do
          if [ -n "$(dig +time=3 +tries=1 +short @"$ip" {{.QUERY}} 2>/dev/null)" ]; then echo "ok    $ip"; else echo "FEHLT $ip"; rc=1; fi
        done
        exit $rc

  preflight:
    desc: "devmesh: Host vor der k3s-Installation pruefen (HOST=<name aus devmesh/inventory.yaml>; Exit 1 = Befund, 2 = Vorbedingung)"
    requires:
      vars: [HOST]
    cmds:
      - bash scripts/devmesh/preflight.sh {{.HOST}}

  install:
    desc: "devmesh: k3s auf HOST in seiner Inventar-Rolle installieren (DRY_RUN=1 zeigt nur den Befehl)"
    requires:
      vars: [HOST]
    env:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - bash scripts/devmesh/k3s-install.sh {{.HOST}}

  kubeconfig:
    desc: "devmesh: Admin-Kubeconfig als Context devmesh mergen (SERVER=<name>, Default: server-init)"
    cmds:
      - bash scripts/devmesh/kubeconfig.sh {{.SERVER}}

  status:
    desc: "devmesh: Knoten, etcd-Mitglieder und juengsten etcd-Snapshot melden (Exit != 0 ab 12h Snapshot-Alter)"
    cmds:
      - bash scripts/devmesh/status.sh
      - kubectl --context devmesh -n workspace get deploy
      - kubectl --context devmesh -n kube-system get certificate devmesh-wildcard-tls -o jsonpath='{.metadata.name}{" Ready="}{.status.conditions[?(@.type=="Ready")].status}{" notAfter="}{.status.notAfter}{"\n"}'

  flux:install:
    desc: "devmesh: flux-operator per Helm installieren und FluxInstance anwenden"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
    cmds:
      - |
        set -euo pipefail
        helm upgrade --install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
          --namespace flux-system --create-namespace --kube-context devmesh --wait --timeout=180s
        if [ -d flux/clusters/devmesh/bootstrap ] && [ -n "$(find flux/clusters/devmesh/bootstrap -maxdepth 1 -name '*.yaml' 2>/dev/null)" ]; then
          kubectl --context devmesh apply -f flux/clusters/devmesh/bootstrap/
        fi
        kubectl --context devmesh apply -f flux/clusters/devmesh/flux-instance.yaml

  flux:suspend:
    desc: "devmesh: alle Flux-Kustomizations auf devmesh suspendieren"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
    cmds:
      - flux suspend kustomization --all -n flux-system --context devmesh

  flux:resume:
    desc: "devmesh: alle Flux-Kustomizations auf devmesh fortsetzen"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
    cmds:
      - flux resume kustomization --all -n flux-system --context devmesh

  deploy:
    desc: "devmesh-Stack aus der Arbeitskopie deployen (PROFILE=core|full, Default DEVMESH_PROFILE) [T900118]"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
      - sh: test -f environments/sealed-secrets/dev.yaml
        msg: "environments/sealed-secrets/dev.yaml fehlt — task env:seal ENV=dev"
      - sh: '[ "{{.FORCE | default "0"}}" = "1" ] || [ -z "$(kubectl --context devmesh -n flux-system get kustomization -o jsonpath="{.items[?(@.spec.suspend!=true)].metadata.name}" 2>/dev/null)" ]'
        msg: "Flux verwaltet devmesh bereits. Vor manuellem Deploy erst 'task devmesh:flux:suspend' ausfuehren (oder FORCE=1)."
    cmds:
      - |
        set -euo pipefail
        CTX=devmesh
        source scripts/env-resolve.sh dev
        PROFILE="{{.PROFILE}}"; PROFILE="${PROFILE:-$DEVMESH_PROFILE}"
        # 1. Stack rendern, bevor irgendetwas appliziert wird (Render-Fehler = kein Teil-Deploy)
        rendered="$(bash scripts/devmesh/render-stack.sh "$PROFILE")"
        # 2. cert-manager + ipv64-lego-webhook (Muster Taskfile.dev-stack.yml, T000363)
        helm repo add jetstack https://charts.jetstack.io --force-update >/dev/null
        helm repo add cert-manager-lego-webhook https://yxwuxuanl.github.io/cert-manager-lego-webhook/ --force-update >/dev/null
        helm repo update >/dev/null
        helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace \
          --kube-context "$CTX" --set crds.enabled=true --set podDnsPolicy=Default --wait --timeout=180s
        helm upgrade --install cert-manager-lego-webhook cert-manager-lego-webhook/cert-manager-lego-webhook \
          --namespace cert-manager --kube-context "$CTX" --set certManager.namespace=cert-manager \
          --set certManager.serviceAccountName=cert-manager --wait --timeout=120s
        # 3. Sealed-Secrets-Controller, dann SealedSecrets VOR den Manifesten
        kubectl --context "$CTX" apply -f k3d/sealed-secrets-controller.yaml
        kubectl --context "$CTX" -n sealed-secrets rollout status deploy/sealed-secrets-controller --timeout=180s
        kubectl --context "$CTX" create namespace workspace --dry-run=client -o yaml | kubectl --context "$CTX" apply -f -
        # Adopt a legacy placeholder so the controller can populate its keys.
        if kubectl --context "$CTX" -n workspace get secret website-secrets >/dev/null 2>&1; then
          kubectl --context "$CTX" -n workspace annotate secret website-secrets sealedsecrets.bitnami.com/managed=true --overwrite
        fi
        kubectl --context "$CTX" apply -f environments/sealed-secrets/dev.yaml
        for s in "workspace:workspace-secrets" "workspace:website-secrets" "cert-manager:ipv64-api-key"; do
          kubectl --context "$CTX" -n "${s%%:*}" wait --for=create "secret/${s##*:}" --timeout=120s
        done
        kubectl --context "$CTX" -n cert-manager set env deployment/cert-manager-lego-webhook --from=secret/ipv64-api-key
        envsubst '$DEVMESH_DOMAIN' < dev-local/cluster/tls.yaml | kubectl --context "$CTX" apply -f -
        # 4. Stack applizieren und auf jede Deployment-Rollout warten
        kubectl --context "$CTX" wait --for=create crd/ingressroutes.traefik.io --timeout=180s
        # Job pod templates are immutable; rerun the rendered seed Jobs.
        for j in $(printf '%s\n' "$rendered" | yq ea -r '[select(.kind == "Job") | .metadata.name] | .[]'); do
          kubectl --context "$CTX" -n workspace delete job "$j" --ignore-not-found=true
        done
        printf '%s\n' "$rendered" | kubectl --context "$CTX" apply -f -
        for d in $(printf '%s\n' "$rendered" | yq ea -r '[select(.kind == "Deployment") | .metadata.name] | .[]'); do
          kubectl --context "$CTX" -n workspace rollout status "deployment/$d" --timeout=600s
        done
        echo "devmesh:deploy ok (Profil $PROFILE)"
      - task: registry:migrate

  migrate:
    desc: "pocket_id + website aus devmesh nach devmesh kopieren, Zeilenzahlen vergleichen [T900118]"
    cmds:
      - bash scripts/devmesh/migrate-from-k3d.sh {{.CLI_ARGS | default "all"}}

  registry:migrate:
    desc: "devmesh: llm-proxy-Registry seeden und mcp_readonly-Passwort setzen [T900191]"
    preconditions:
      - sh: kubectl config get-contexts -o name | grep -qx devmesh
        msg: "Context devmesh fehlt — erst task devmesh:kubeconfig"
    cmds:
      - |
        set -euo pipefail
        CTX=devmesh; NS=workspace
        MIG=scripts/migrations/2026-09-16-devmesh-llm-proxy-backends.sql
        kubectl --context "$CTX" -n "$NS" rollout status deployment/shared-db --timeout=300s
        pw="$(kubectl --context "$CTX" -n "$NS" get secret workspace-secrets \
          -o jsonpath='{.data.MCP_READONLY_DB_PASSWORD}' | base64 -d)"
        [ -n "$pw" ] || { echo "MCP_READONLY_DB_PASSWORD fehlt in workspace-secrets (task env:seal ENV=dev)" >&2; exit 2; }
        kubectl --context "$CTX" -n "$NS" exec -i deploy/shared-db -c postgres -- \
          psql -U postgres -d website -v ON_ERROR_STOP=1 -q < "$MIG"
        # Passwort nur ueber stdin, nie als Argument (Prozessliste).
        printf "\\set pw '%s'\nALTER ROLE mcp_readonly PASSWORD :'pw';\n" "$pw" \
          | kubectl --context "$CTX" -n "$NS" exec -i deploy/shared-db -c postgres -- \
              psql -U postgres -d website -v ON_ERROR_STOP=1 -q
        # Registry-Check gegen die effektive Registry (F2, #6804): LLM_PROXY_BACKENDS_JSON
        # aus dem live Deployment zaehlen, nicht die retirte Tickets-Tabelle (#6814).
        BACKENDS_JSON="$(kubectl --context "$CTX" -n "$NS" get deploy/llm-services -o json | python3 -c "import json,sys; d=json.load(sys.stdin); vs=[e.get('value') for c in d['spec']['template']['spec'].get('containers',[]) for e in (c.get('env',[]) or []) if e.get('name')=='LLM_PROXY_BACKENDS_JSON' and e.get('value')]; print(vs[0]) if vs else (print('ERROR: LLM_PROXY_BACKENDS_JSON fehlt in deploy/llm-services (alle Container geprueft)', file=sys.stderr) or sys.exit(2))")"
        BACKENDS_JSON="$BACKENDS_JSON" python3 -c "import json,os,re; bs=json.loads(os.environ['BACKENDS_JSON']); a=[b for b in bs if b.get('enabled')]; print('aktiv=%d loopback=%d' % (len(a), len([b for b in a if re.search('127[.]0[.]0[.]1|localhost', b.get('baseUrl') or '')])))"

  backup:run:
    desc: "shared-db-Backup auf devmesh sofort ausloesen (CronJob shared-db-backup) [T900118]"
    cmds:
      - kubectl --context devmesh -n workspace create job "shared-db-backup-manual-$(date +%s)" --from=cronjob/shared-db-backup
