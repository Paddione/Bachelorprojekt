# Taskfile.finetune-embed.yml — EmbeddingGemma multitask finetune (bge-stack replacement).
# Separate file from Taskfile.finetune.yml on purpose: the LLM SFT pipeline
# (messages + chat template + assistant masks) does NOT apply to embedding
# triplets (anchor/positive/negative + baked task prefixes).
version: "3"

tasks:
  build:
    desc: "Multitask-Triplet-Korpus bauen. OUT=<train.jsonl> EVAL_OUT=<eval.jsonl>"
    cmds:
      - python3 scripts/finetune/build_embeddinggemma_corpus.py --out "{{.OUT}}" --eval-out "{{.EVAL_OUT}}"

  measure:
    desc: "Token/VRAM-Vorcheck. CORPUS=<jsonl> OUT=<report.json>"
    cmds:
      - python3 scripts/finetune/measure_embedding.py --corpus "{{.CORPUS}}" --out "{{.OUT}}"

  eval:
    desc: "Triplet eval (base vs tuned). EVAL_CORPUS=<jsonl> MODEL=<hf-id-or-dir> OUT=<report.json> [CHECK_ONLY=1]"
    cmds:
      - python3 scripts/finetune/eval_embedding.py --eval-corpus "{{.EVAL_CORPUS}}" {{if .MODEL}}--model "{{.MODEL}}" --out "{{.OUT}}"{{else}}--check-only{{end}}

  suggest:
    desc: "Retrain-Werte aus Reports. BASE_REPORT=<json> TUNED_REPORT=<json> [EPOCHS=3 LR=2e-5]"
    cmds:
      - python3 scripts/finetune/suggest_embedding_retrain.py --base-report "{{.BASE_REPORT}}" --tuned-report "{{.TUNED_REPORT}}" {{if .EPOCHS}}--epochs "{{.EPOCHS}}"{{end}} {{if .LR}}--lr "{{.LR}}"{{end}}

  train:
    desc: "One-go multitask finetune. CORPUS=<jsonl> MEASURE_REPORT=<json> [EVAL_CORPUS=<jsonl> MATRYOSHKA=1 DRY_RUN=1]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MEASURE_REPORT}}" ]'
        msg: "CORPUS= und MEASURE_REPORT= sind erforderlich."
    cmds:
      - python3 scripts/finetune/train_embedding.py --corpus "{{.CORPUS}}" --measure-report "{{.MEASURE_REPORT}}" {{if .EVAL_CORPUS}}--eval-corpus "{{.EVAL_CORPUS}}"{{end}} {{if .MATRYOSHKA}}--matryoshka{{end}} {{if .DRY_RUN}}--dry-run{{end}}

  hf-jobs:train-embed:
    desc: "Embedding-multitask auf HF Jobs. CORPUS=<jsonl> MEASURE_REPORT=<json> HUB_MODEL_ID=<user/repo> [EVAL_CORPUS=<jsonl> MATRYOSHKA=1 FLAVOR=t4-small DRY_RUN=1]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MEASURE_REPORT}}" ] && [ -n "{{.HUB_MODEL_ID}}" ]'
        msg: "CORPUS=, MEASURE_REPORT= und HUB_MODEL_ID= sind erforderlich."
      - sh: '[ -n "${HF_TOKEN:-}" ]'
        msg: "HF_TOKEN ist nicht gesetzt."
    cmds:
      - |
        STAGE=$(mktemp -d)
        trap 'rm -rf "$STAGE"' EXIT
        cp scripts/finetune/{train_embedding.py,measure_embedding.py} "$STAGE/"
        cp -- "{{.CORPUS}}" "$STAGE/corpus.jsonl"
        cp -- "{{.MEASURE_REPORT}}" "$STAGE/report.json"
        {{if .EVAL_CORPUS}}cp -- "{{.EVAL_CORPUS}}" "$STAGE/eval.jsonl"{{end}}
        FLAVOR="{{.FLAVOR}}"
        [ -n "$FLAVOR" ] || FLAVOR=t4-small
        set -- --corpus /data/corpus.jsonl --model "google/embeddinggemma-300m" \
          --measure-report /data/report.json --hub-model-id "{{.HUB_MODEL_ID}}" \
          --output-dir /tmp/finetune-output
        {{if .MATRYOSHKA}}set -- "$@" --matryoshka{{end}}
        {{if .EVAL_CORPUS}}set -- "$@" --eval-corpus /data/eval.jsonl{{end}}
        JOB_DRY_RUN=""
        {{if .DRY_RUN}}JOB_DRY_RUN="--dry-run"{{end}}
        uvx --from "huggingface_hub" hf jobs uv run \
          --flavor "$FLAVOR" --timeout 2h --detach $JOB_DRY_RUN --secrets HF_TOKEN \
          --with sentence-transformers --with datasets \
          "$STAGE/train_embedding.py" "$@"
