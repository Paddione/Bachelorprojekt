# Taskfile.finetune.yml
# ─────────────────────────────────────────────────────────────────────────────
# LLM-Finetuning-Pipeline (Unsloth/TRL). Included from Taskfile.yml under the
# "finetune" namespace [T002587].
#
# Reihenfolge: measure -> guard -> train -> export. traces ist ein optionaler
# Korpus-Beschaffungsschritt vor measure. Details: scripts/finetune/README.md.
#
# Eigene Datei statt Anhaengen an eine bestehende Taskfile (siehe Taskfile.llm.yml
# fuer den Grund: Parallelarbeit soll nicht am selben Dateiende kollidieren).
# ─────────────────────────────────────────────────────────────────────────────
version: "3"

tasks:

  measure:
    desc: "Token-Laengenverteilung + VRAM-Machbarkeitsmatrix. CORPUS=<jsonl> MODEL=<label> [TEMPLATE_FILE=<jinja>]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ]'
        msg: "CORPUS=<jsonl> und MODEL=<label> sind erforderlich."
    cmds:
      - |
        python3 scripts/finetune/measure_corpus.py \
          --corpus "{{.CORPUS}}" --model "{{.MODEL}}" \
          {{if .TEMPLATE_FILE}}--template-file "{{.TEMPLATE_FILE}}"{{end}} \
          {{if .OUT}}--out "{{.OUT}}"{{end}}

  guard:
    desc: "Byte-Gleichheit Hub- vs. gepatchtes Chat-Template. HUB_TEMPLATE=<datei> PATCHED_TEMPLATE=<datei> CORPUS=<jsonl>"
    preconditions:
      - sh: '[ -n "{{.HUB_TEMPLATE}}" ] && [ -n "{{.PATCHED_TEMPLATE}}" ] && [ -n "{{.CORPUS}}" ]'
        msg: "HUB_TEMPLATE=, PATCHED_TEMPLATE= und CORPUS= sind erforderlich."
    cmds:
      - |
        python3 scripts/finetune/template_guard.py \
          --hub-template "{{.HUB_TEMPLATE}}" \
          --patched-template "{{.PATCHED_TEMPLATE}}" \
          --corpus "{{.CORPUS}}"

  train:
    desc: "Trainingslauf starten. CORPUS=<jsonl> MODEL=<hf-id> MEASURE_REPORT=<json> MAX_SEQ_LENGTH=<n> [PRECISION=auto|4bit|16bit] [GPU_MODE=single|balanced] [EVAL_CORPUS=<jsonl>]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ] && [ -n "{{.MEASURE_REPORT}}" ]'
        msg: "CORPUS=, MODEL= und MEASURE_REPORT= sind erforderlich (MEASURE_REPORT aus 'task finetune:measure')."
    cmds:
      - |
        # T002628 GPU-Arbitrierung: Trainings-Vorrang. acquire drainiert die lokalen
        # Backends (Auslaufen abwarten, chat-gpu-Loadouts stoppen) und misst das freie
        # VRAM. Der Lock wird per trap freigegeben — auch wenn train.py abbricht.
        # Nach der Freigabe werden die gestoppten Loadouts wieder gestartet.
        #
        # LOCKED unterscheidet "wir halten den Lock" von "Lock existiert": nur wer
        # acquire erfolgreich abgeschlossen hat, darf release ausfuehren. Schlaegt
        # acquire fehl (fremder Lock gehalten oder VRAM unzureichend), stoppt das
        # Training — ohne den fremden Lock anzufassen oder fremde Loadouts zu starten.
        LOCK_SCRIPT="scripts/gpu-lock.sh"
        STOPPED=""
        LOCKED=""
        trap 'T=$?; if [ -n "$LOCKED" ]; then bash "$LOCK_SCRIPT" release >&2 || true; fi; for slug in $STOPPED; do curl -sf -X POST "http://127.0.0.1:18235/admin/loadouts/${slug}/start" >/dev/null 2>&1 || true; done; exit $T' EXIT

        if [ -n "${GPU_LOCK_REQUIRED_MIB:-}" ]; then
          bash "$LOCK_SCRIPT" acquire || { echo "[finetune] GPU-Arbitrierung fehlgeschlagen — Training wird NICHT gestartet." >&2; exit 3; }
          LOCKED=1
          STOPPED=$(python3 -c 'import json; d=json.load(open("scripts/llm/loadouts.json")); print(" ".join(l["slug"] for l in d.get("loadouts", []) if l.get("exclusiveGroup")=="chat-gpu" and l.get("managed")!="external"))')
        else
          echo "[finetune] GPU_LOCK_REQUIRED_MIB nicht gesetzt — Training ohne GPU-Arbitrierung."
        fi

        set -- --corpus "{{.CORPUS}}" --model "{{.MODEL}}" --measure-report "{{.MEASURE_REPORT}}"
        {{if .PRECISION}}set -- "$@" --precision "{{.PRECISION}}"{{end}}
        {{if .MAX_SEQ_LENGTH}}set -- "$@" --max-seq-length "{{.MAX_SEQ_LENGTH}}"{{end}}
        {{if .GPU_MODE}}set -- "$@" --gpu-mode "{{.GPU_MODE}}"{{end}}
        {{if .EVAL_CORPUS}}set -- "$@" --eval-corpus "{{.EVAL_CORPUS}}"{{end}}
        {{if .CONFIG}}set -- "$@" --config "{{.CONFIG}}"{{end}}
        {{if .DRY_RUN}}set -- "$@" --dry-run{{end}}
        python3 scripts/finetune/train.py "$@"

  train-vision:
    desc: "Qwen3-VL image/screenshot QLoRA. CORPUS=<jsonl> MODEL=<hf-id-or-snapshot> MAX_SEQ_LENGTH=<n> [EVAL_CORPUS=<jsonl>] [DRY_RUN=1]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ] && [ -n "{{.MAX_SEQ_LENGTH}}" ]'
        msg: "CORPUS=, MODEL= und MAX_SEQ_LENGTH= sind erforderlich."
    cmds:
      - |
        set -- --corpus "{{.CORPUS}}" --model "{{.MODEL}}" --max-seq-length "{{.MAX_SEQ_LENGTH}}"
        {{if .EVAL_CORPUS}}set -- "$@" --eval-corpus "{{.EVAL_CORPUS}}"{{end}}
        {{if .FREEZE_VISION_LAYERS}}set -- "$@" --freeze-vision-layers{{end}}
        {{if .DRY_RUN}}set -- "$@" --dry-run{{end}}
        python3 scripts/finetune/train_vision.py "$@"

  export:
    desc: "GGUF-Export mit Template-Korrektur. ADAPTER_DIR=<dir> SLOT_NAME=<name> [HUB_TEMPLATE=<datei>] [DRY_RUN=1]"
    preconditions:
      - sh: '[ -n "{{.SLOT_NAME}}" ]'
        msg: "SLOT_NAME=<name> ist erforderlich."
    cmds:
      - |
        python3 scripts/finetune/export_gguf.py \
          {{if .ADAPTER_DIR}}--adapter-dir "{{.ADAPTER_DIR}}"{{end}} \
          --slot-name "{{.SLOT_NAME}}" \
          {{if .HUB_TEMPLATE}}--hub-template "{{.HUB_TEMPLATE}}"{{end}} \
          {{if .DRY_RUN}}--dry-run{{end}}

  # ── HF Jobs Cloud (primärer Pfad nach dem WSL-Exit, ADR-007 / T016438) ──
  hf-jobs:train:
    desc: "Trainingslauf auf HF Jobs Cloud. CORPUS=<jsonl> MODEL=<hf-id> MEASURE_REPORT=<json> MAX_SEQ_LENGTH=<n> HUB_MODEL_ID=<hf-id> [FLAVOR=l4x1]"
    preconditions:
      - sh: '[ -n "{{.CORPUS}}" ] && [ -n "{{.MODEL}}" ] && [ -n "{{.MEASURE_REPORT}}" ] && [ -n "{{.HUB_MODEL_ID}}" ]'
        msg: "CORPUS=, MODEL=, MEASURE_REPORT= und HUB_MODEL_ID= sind erforderlich."
      - sh: '[ -n "{{.MAX_SEQ_LENGTH}}" ] || [ -n "{{.CONFIG}}" ]'
        msg: "MAX_SEQ_LENGTH= oder CONFIG= mit max_seq_length ist erforderlich."
      - sh: '[ -n "${HF_TOKEN:-}" ]'
        msg: "HF_TOKEN ist nicht gesetzt — `hf auth login` oder export HF_TOKEN=…"
    cmds:
      - |
        # A local UV script uploads its own directory, not arbitrary sibling files.
        # Stage exactly the input bundle; never sync the repo (which contains secrets).
        STAGE=$(mktemp -d)
        trap 'rm -rf "$STAGE"' EXIT
        cp scripts/finetune/{train.py,measure_corpus.py,template_guard.py,langfuse_tracking.py} "$STAGE/"
        cp -- "{{.CORPUS}}" "$STAGE/corpus.jsonl"
        cp -- "{{.MEASURE_REPORT}}" "$STAGE/report.json"
        {{if .CONFIG}}cp -- "{{.CONFIG}}" "$STAGE/config.json"{{end}}
        {{if .EVAL_CORPUS}}cp -- "{{.EVAL_CORPUS}}" "$STAGE/eval.jsonl"{{end}}
        {{if .HUB_TEMPLATE}}cp -- "{{.HUB_TEMPLATE}}" "$STAGE/hub.jinja"{{end}}
        {{if .PATCHED_TEMPLATE}}cp -- "{{.PATCHED_TEMPLATE}}" "$STAGE/patched.jinja"{{end}}
        FLAVOR="{{.FLAVOR}}"
        [ -n "$FLAVOR" ] || FLAVOR=l4x1
        set -- --corpus /data/corpus.jsonl --model "{{.MODEL}}" \
          --measure-report /data/report.json --hub-model-id "{{.HUB_MODEL_ID}}" \
          --report-to trackio --output-dir /tmp/finetune-output
        {{if .PRECISION}}set -- "$@" --precision "{{.PRECISION}}"{{end}}
        {{if .MAX_SEQ_LENGTH}}set -- "$@" --max-seq-length "{{.MAX_SEQ_LENGTH}}"{{end}}
        {{if .CONFIG}}set -- "$@" --config /data/config.json{{end}}
        {{if .EVAL_CORPUS}}set -- "$@" --eval-corpus /data/eval.jsonl{{end}}
        {{if .HUB_TEMPLATE}}set -- "$@" --hub-template /data/hub.jinja{{end}}
        {{if .PATCHED_TEMPLATE}}set -- "$@" --patched-template /data/patched.jinja{{end}}
        JOB_DRY_RUN=""
        {{if .DRY_RUN}}JOB_DRY_RUN="--dry-run"{{end}}
        TRACKING_ARGS=()
        if [ -n "${LANGFUSE_PUBLIC_KEY:-}${LANGFUSE_SECRET_KEY:-}" ]; then
          [ -n "${LANGFUSE_PUBLIC_KEY:-}" ] && [ -n "${LANGFUSE_SECRET_KEY:-}" ] || {
            echo "Both Langfuse keys are required" >&2; exit 2;
          }
          TRACKING_ARGS+=(--secrets LANGFUSE_PUBLIC_KEY --secrets LANGFUSE_SECRET_KEY --with 'langfuse>=4.7,<5')
          if [ -n "${LANGFUSE_BASE_URL:-}" ]; then
            TRACKING_ARGS+=(--env "LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}")
          fi
        fi
        uvx --from "huggingface_hub" hf jobs uv run \
          --flavor "$FLAVOR" --timeout 2h --detach $JOB_DRY_RUN --secrets HF_TOKEN "${TRACKING_ARGS[@]}" \
          --with unsloth --with trl --with datasets --with trackio --with torchvision \
          "$STAGE/train.py" "$@"

  hf-jobs:export:
    desc: "GGUF-Export als HF Job. ADAPTER_REPO=<hf-id> GGUF_REPO=<hf-id> [FLAVOR=l4x1]"
    preconditions:
      - sh: '[ -n "{{.ADAPTER_REPO}}" ] && [ -n "{{.GGUF_REPO}}" ]'
        msg: "ADAPTER_REPO= und GGUF_REPO= sind erforderlich."
      - sh: '[ -n "${HF_TOKEN:-}" ]'
        msg: "HF_TOKEN ist nicht gesetzt."
    cmds:
      - |
        FLAVOR="{{.FLAVOR}}"
        [ -n "$FLAVOR" ] || FLAVOR=l4x1
        set -- --adapter-repo "{{.ADAPTER_REPO}}" --gguf-repo "{{.GGUF_REPO}}"
        {{if .QUANTIZATION}}set -- "$@" --quantization "{{.QUANTIZATION}}"{{end}}
        JOB_DRY_RUN=""
        {{if .DRY_RUN}}JOB_DRY_RUN="--dry-run"{{end}}
        uvx --from "huggingface_hub" hf jobs uv run \
          --flavor "$FLAVOR" --timeout 2h --detach $JOB_DRY_RUN --secrets HF_TOKEN \
          --with unsloth --with huggingface_hub \
          scripts/finetune/hf_export_gguf.py "$@"
