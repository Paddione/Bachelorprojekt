# Taskfile.llm.yml
# ─────────────────────────────────────────────────────────────────────────────
# Local-first LLM pipeline operations.
# Included from Taskfile.yml under the "llm" namespace.
#
# Drei llama.cpp-Server: zwei bge-Server im Cluster (CPU, k3d/llm-gpu.yaml)
# und ein Chat-Server auf dem Windows GPU-Host (via wg-gpu):
#   - Bonsai (Port 8093): Factory-Orchestrator, 4 Slots (Windows GPU-Host)
#   - bge-embed (ClusterIP :8081): bge-m3, Text-Embeddings [T002551]
#   - bge-rerank (ClusterIP :8081): bge-reranker-v2-m3, Text-Reranking [T002551]
#
# `llm:deploy` applies `k3d/llm-gpu.yaml` (bge Deployments + PVCs + Services).
# `llm:status` and `llm:test` query those Services via debug-pod curls.
# ─────────────────────────────────────────────────────────────────────────────
version: "3"

tasks:

  bootstrap-host:
    desc: "Bootstrap the GPU host (ufw, wg-mesh reachability). HOST=<wg-mesh-ip>"
    preconditions:
      - sh: '[ -n "{{.HOST}}" ]'
        msg: "HOST=<wg-mesh-ip> is required."
    cmds:
      - scripts/llm-host-setup.sh {{.HOST}}

  deploy:
    desc: "Apply bge Deployments + PVCs + Services (k3d/llm-gpu.yaml) to ENV={{.ENV}}"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        kubectl --context "$ENV_CONTEXT" -n "${WORKSPACE_NAMESPACE:-workspace}" apply -f k3d/llm-gpu.yaml
        echo "✓ bge-embed + bge-rerank applied (ENV={{.ENV}})"

  status:
    desc: "Show LLM pipeline status (bge Deployments, gateway services, health). ENV=<env>"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        set -e
        source scripts/env-resolve.sh "{{.ENV}}"
        ns="${WORKSPACE_NAMESPACE:-workspace}"
        echo "── bge Deployments ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" get deploy bge-embed bge-rerank
        echo "── llm-gateway services ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" get svc llm-gateway-embed llm-gateway-rerank
        echo "── bge-embed health (llama.cpp bge-m3) ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-embed.${ns}.svc.cluster.local:8081/v1/embeddings" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-m3","input":"test"}' | jq '.data[0].embedding | length' || true
        echo "── bge-rerank health (llama.cpp bge-reranker) ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-rerank.${ns}.svc.cluster.local:8081/v1/rerank" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-reranker-v2-m3","query":"test","documents":["doc1","doc2"]}' \
            | jq '.results | length' || true

  test:
    desc: "Smoke-test the gateway Services directly (embed + rerank). ENV=<env>"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - |
        set -e
        source scripts/env-resolve.sh "{{.ENV}}"
        ns="${WORKSPACE_NAMESPACE:-workspace}"
        echo "── bge-m3 embed via llm-gateway-embed ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-embed.${ns}.svc.cluster.local:8081/v1/embeddings" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-m3","input":"hallo welt"}' | jq '.data[0].embedding | length'
        echo "── bge-reranker via llm-gateway-rerank ──"
        kubectl --context "$ENV_CONTEXT" -n "$ns" run llm-debug-$$ --rm -it --restart=Never \
          --image=curlimages/curl:8.7.1 --quiet -- \
          curl -fsS -X POST "http://llm-gateway-rerank.${ns}.svc.cluster.local:8081/v1/rerank" \
            -H "Content-Type: application/json" \
            -d '{"model":"bge-reranker-v2-m3","query":"capital of germany","documents":["paris","berlin","hamburg"]}' \
            | jq '.results | sort_by(-.relevance_score) | .[0].index'

  bench-embed:
    desc: "Measure bge-embed throughput (chunks/s) against the cluster. ENV=<env>"
    vars:
      ENV: '{{.ENV | default "mentolder"}}'
    cmds:
      - scripts/llm/bench-bge-embed.sh "{{.ENV}}" {{.CLI_ARGS}}

  proxy:start:
    desc: "Start the local LLM proxy (scripts/llm-proxy, Port 18235) detached with PID/log file"
    cmds:
      # go-task's embedded shell (mvdan.cc/sh) doesn't populate $! with a real
      # OS PID for backgrounded processes (returns a synthetic job id like
      # "g1") - the idempotency check below silently never worked. Running
      # under a real `bash -c` fixes $! (verified: plain bash gives the actual PID).
      - |
        bash -c '
          set -e
          DIR="$HOME/.local/state/llm-proxy"; mkdir -p "$DIR"
          PIDF="$DIR/proxy.pid"; LOGF="$DIR/proxy.log"
          PORT="${LLM_PROXY_PORT:-18235}"
          if [ -f "$PIDF" ] && kill -0 "$(cat "$PIDF")" 2>/dev/null; then
            echo "llm-proxy already running (pid $(cat "$PIDF"))"; exit 0
          fi
          # T002277: das PID-File kennt nur die nohup-Instanz. Haelt der devmesh-Forward
          # (devmesh-forward.service, T900191) den Port, ist er belegt, aber
          # kein PID-File da - der Start unten wuerde mit EADDRINUSE sterben und ein
          # PID-File hinterlassen, das auf einen toten Prozess zeigt. Der Port ist
          # die verlaessliche Auskunft, nicht das PID-File.
          # /livez, NICHT /health (T002336): hier geht es um Port-Belegung, nicht
          # um Bedienbarkeit. /health antwortet 503, sobald ein Prio-1-Backend
          # fehlt - mit `curl -fsS` sieht das aus wie "niemand da", und der Start
          # unten liefe in genau das EADDRINUSE, das dieser Block verhindern soll.
          if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1; then
            echo "llm-proxy already answering on :$PORT (devmesh-forward? -> systemctl --user status devmesh-forward)"
            exit 0
          fi
          nohup node scripts/llm-proxy/server.mjs >> "$LOGF" 2>&1 &
          echo $! > "$PIDF"
          echo "✓ llm-proxy started (pid $(cat "$PIDF"), log $LOGF)"
        '

  proxy:stop:
    desc: "Stop the local LLM proxy via PID file"
    cmds:
      - |
        PIDF="$HOME/.local/state/llm-proxy/proxy.pid"
        [ -f "$PIDF" ] && kill "$(cat "$PIDF")" 2>/dev/null && rm -f "$PIDF" && echo "✓ stopped" || echo "not running"

  proxy:status:
    desc: "Show LLM proxy health + discovered backends/models"
    cmds:
      - |
        PORT="${LLM_PROXY_PORT:-18235}"
        # Erreichbarkeit via /livez (T002336) - sonst meldet der Status "offline",
        # waehrend der Proxy laeuft und nur ein Backend fehlt. /health kommt danach
        # als eigene Zeile dazu: sie ist die interessante Auskunft, wenn er lebt.
        if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1; then
          echo "── Listeners ──"
          echo "Loopback: 127.0.0.1:$PORT"
          BRIDGE_IP=$(docker network inspect "${LLM_PROXY_K3D_NETWORK:-}" -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || true)
          if [ -n "$BRIDGE_IP" ]; then
            echo "Bridge:   $BRIDGE_IP:$PORT (requires bearer token)"
          else
            echo "Bridge:   closed (k3d network not discovered)"
          fi
          echo "── Health & State ──"
          curl -sS "http://127.0.0.1:$PORT/health" | jq '{ready, degraded}'
          curl -fsS "http://127.0.0.1:$PORT/admin/state" | jq .
        else
          echo "llm-proxy offline — Start: task llm:proxy:start"
        fi

  proxy:logs:
    desc: "Tail the local LLM proxy log"
    cmds:
      - tail -n 100 -f "$HOME/.local/state/llm-proxy/proxy.log"

  routing:check:
    desc: "Prueft, ob jede konfigurierte Modell-ID von einem erreichbaren Backend serviert wird [T002359]"
    cmds:
      - bash scripts/llm/routing-check.sh

  loadouts:check:
    desc: "Prueft loadouts.json auf die kanonische writeLoadouts()-Form (fail-closed, CI) [T002553]"
    cmds:
      - node scripts/llm/loadouts-format.mjs --check

  loadouts:format:
    desc: "Normalisiert loadouts.json auf die kanonische Form — Reparatur fuer loadouts:check [T002553]"
    cmds:
      - node scripts/llm/loadouts-format.mjs --write

  tools-sandbox:up:
    desc: "Startet den Container, in dem die eingebauten llama-server-Tools laufen (--tools-runtime)"
    cmds:
      - bash scripts/llm/tools-sandbox.sh up

  tools-sandbox:status:
    desc: "Exit 0, wenn der Tool-Sandbox-Container laeuft — dieselbe Pruefung, die der Proxy vor dem Start macht"
    cmds:
      - bash scripts/llm/tools-sandbox.sh status

  tools-sandbox:down:
    desc: "Entfernt den Tool-Sandbox-Container"
    cmds:
      - bash scripts/llm/tools-sandbox.sh down

  measure-equivalence:
    desc: "Measure embedding equivalence between TEI and new llama.cpp endpoint"
    cmds:
      - node scripts/llm/measure-embedding-equivalence.mjs

  # [T002582] 'start-bonsai' entfernt: der Task verwies auf
  # scripts/llm/start-bonsai-server.ps1, das im Repo nicht existiert. Guard
  # dagegen: tests/spec/local-llm-proxy/gateway-consumer-lint.bats prüft, dass
  # jedes hier genannte .ps1-Skript vorhanden ist.

  lmstudio-preload:
    desc: "DEPRECATED — bge embed/rerank sind seit T002551 CPU-Deployments im Cluster."
    cmds:
      - echo "LM Studio (lmstudio-preload.sh) is deprecated since T002110. Embedding/Reranking kommen seit T002551 aus dem Cluster (k3d/llm-gpu.yaml, via bge-mcp port-forward auf 127.0.0.1:8081/8082)."

  glimmer-worker:install:
    desc: "Glimmer-Worker-MCP (127.0.0.1:13007) installieren und in Muse Code (WSL + Windows) eintragen [T900373]"
    cmds:
      - bash scripts/glimmer-worker-mcp/install.sh
