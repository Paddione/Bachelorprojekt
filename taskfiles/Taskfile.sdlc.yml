version: "3"

vars:
  # [T900145] The SDLC development instance runs on persistent devmesh.
  SDLC_CTX: '{{.SDLC_CTX | default "devmesh"}}'

tasks:
  sdlc:status:
    desc: "SDLC-Stack Health-Übersicht"
    cmds:
      - |
        kubectl --context {{.SDLC_CTX}} get pods -n workspace
        echo "---"
        kubectl --context {{.SDLC_CTX}} get svc -n workspace
        echo "---"
        echo "Console:  $(curl -sS -o /dev/null -w %{http_code} http://sdlc.localhost 2>/dev/null || echo unreachable)"
        echo "Auth:     $(curl -sS -o /dev/null -w %{http_code} http://auth.localhost 2>/dev/null || echo unreachable)"

  sdlc:oidc:sync:
    desc: "OIDC-Client-Secret zwischen Pocket ID und den SDLC-Secrets angleichen"
    # Nach jedem devmesh:deploy noetig: pocket-id-client-seed schreibt ein
    # generiertes Secret nur beim ERSTMALIGEN Anlegen zurueck, der Deploy setzt
    # k3d/secrets.yaml aber jedes Mal auf den festen Dev-Wert. Ohne den Abgleich
    # kennt Pocket ID ein anderes Secret als die Console und der Token-Exchange
    # scheitert mit invalid_client.
    cmds:
      - bash scripts/sdlc-sync-oidc-secret.sh

  sdlc:auth:prod:
    desc: "Console-Login auf die PROD-Pocket-ID umstellen (Prod-Passkeys nutzbar)"
    # Passkeys sind an die RP-ID ihrer Domain gebunden — ein auf
    # auth.mentolder.de registrierter Passkey ist gegen auth.localhost
    # unbrauchbar. Diese Task laesst den Authorize-Schritt auf der Prod-Domain
    # stattfinden und danach nach http://web.localhost zurueckleiten.
    # Legt dafuer in Prod EINEN eigenen Client `website-local` an; der
    # Prod-`website`-Client bleibt unangetastet. Nach jedem devmesh:deploy erneut
    # aufrufen (der Deploy setzt das Client-Secret auf den Dev-Wert zurueck).
    cmds:
      - bash scripts/sdlc-auth-mode.sh prod

  sdlc:auth:local:
    desc: "Console-Login zurueck auf die lokale Pocket ID (auth.localhost)"
    cmds:
      - bash scripts/sdlc-auth-mode.sh local

  sdlc:auth:status:
    desc: "Zeigt, gegen welche Pocket ID sich die Console anmeldet"
    cmds:
      - bash scripts/sdlc-auth-mode.sh status

  # --- E3/T002626: Datenhoheit ------------------------------------------------
  # Der Cutover ist ein Betriebsvorgang, kein Task-Lauf. Diese Tasks sind die
  # Einzelschritte daraus; die Reihenfolge steht in docs/sdlc-stack/e3-cutover.md.

  sdlc:migrate:preflight:
    desc: "E3: Vorbedingungen des tickets-Umzugs pruefen (aendert nichts)"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh preflight

  sdlc:migrate:dump:
    desc: "E3: tickets-Schema aus fleet dumpen (ohne provider_config)"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh dump {{.CLI_ARGS}}

  sdlc:migrate:restore:
    desc: "E3: Dump in die lokale DB einspielen und Zeilenzahlen vergleichen"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh restore {{.CLI_ARGS}}

  sdlc:migrate:seed-provider-config:
    desc: "E3: lokale tickets.provider_config anlegen (bewusst keine fleet-Kopie)"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh seed-provider-config

  sdlc:migrate:freeze:
    desc: "E3: fleet-Kopie schreibgeschuetzt stellen (SELECT bleibt, provider_config bleibt schreibbar)"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh freeze {{.CLI_ARGS}}

  sdlc:migrate:status:
    desc: "E3: Zeilenzahlen fleet vs. lokal nebeneinander"
    cmds:
      - bash scripts/sdlc/migrate-tickets.sh status

  sdlc:backup:
    desc: "E3: lokale SDLC-DB nach fleet sichern (verschluesselt)"
    cmds:
      - bash scripts/sdlc/backup-tickets.sh run {{.CLI_ARGS}}

  sdlc:backup:list:
    desc: "E3: vorhandene SDLC-Sicherungen auf fleet auflisten"
    cmds:
      - bash scripts/sdlc/backup-tickets.sh list

  sdlc:restore-check:
    desc: "E3: Nachweis, dass die juengste Sicherung wiederherstellbar ist"
    # Ein Backup ohne durchgefuehrten Restore ist eine Vermutung, keine Sicherung.
    cmds:
      - bash scripts/sdlc/backup-tickets.sh restore-check

  sdlc:backup:install:
    desc: "E3: systemd-User-Timer fuer die taegliche Sicherung installieren"
    cmds:
      - |
        set -e
        UNIT_DIR="$HOME/.config/systemd/user"
        mkdir -p "$UNIT_DIR"
        ln -sf "$PWD/scripts/sdlc/sdlc-backup.service" "$UNIT_DIR/sdlc-backup.service"
        ln -sf "$PWD/scripts/sdlc/sdlc-backup.timer"   "$UNIT_DIR/sdlc-backup.timer"
        systemctl --user daemon-reload
        systemctl --user enable --now "$PWD/scripts/sdlc/sdlc-backup.timer"
        systemctl --user list-timers sdlc-backup.timer --no-pager

  sdlc:smoke:
    desc: "E2E-Nachweis: Login-Roundtrip + /sdlc/cockpit rendert als Admin"
    # Prueft, dass das Cockpit tatsaechlich GERENDERT wird — nicht nur, dass die
    # Route antwortet. Braucht ein One-Time-Access-Token, weil es im Gegensatz
    # zum Passkey serverseitig erzeugbar ist:
    #   kubectl exec -n workspace <pocket-id-pod> -c pocket-id -- \
    #     /app/pocket-id one-time-access-token paddione
    cmds:
      - node scripts/sdlc-cockpit-smoke.mjs {{.CLI_ARGS}}

  # ── T002655: sdlc:up / sdlc:down / sdlc:dev ─────────────────────────────

  sdlc:up:
    desc: "SDLC-Entwicklungsinstanz starten: Cluster-Check → Rollout-Check → llm-proxy → Loadout → Health-Gate"
    cmds:
      - |
        if ! kubectl --context {{.SDLC_CTX}} get nodes --request-timeout=5s >/dev/null 2>&1; then
          echo "[sdlc:up] Cluster {{.SDLC_CTX}} nicht erreichbar — Zustand: task devmesh:status" >&2
          exit 1
        fi
      - |
        for d in shared-db pocket-id sdlc-console; do
          kubectl --context {{.SDLC_CTX}} -n workspace rollout status "deployment/$d" --timeout=120s
        done
      - |
        PORT="${LLM_PROXY_PORT:-18235}"
        if curl -fsS --max-time 2 "http://127.0.0.1:$PORT/livez" >/dev/null 2>&1; then
          echo "[sdlc:up] llm-proxy laeuft bereits — ueberspringe proxy:start"
        else
          task llm:proxy:start
        fi
      - scripts/sdlc/llm-up.sh
      - scripts/sdlc/health-gate.sh --context {{.SDLC_CTX}} --timeout 120

  sdlc:down:
    desc: "SDLC-Stack herunterfahren: Loadout → llm-proxy (devmesh bleibt laufen)"
    cmds:
      - scripts/sdlc/llm-up.sh down || true
      - task llm:proxy:stop

  sdlc:dev:
    desc: "Astro-Devserver mit BUILD_TARGET=sdlc starten (blockierend)"
    dir: website
    cmds:
      # .env in die Umgebung exportieren (falls vorhanden) — sonst Standard-Build-Target setzen.
      - |
        if [ -f ../.env ]; then set -a; . ../.env; set +a; fi
        export BUILD_TARGET=sdlc
        pnpm dev -- --force

  sdlc:admin-session:
    desc: "Lokale Admin-Session fuer den Astro-Devserver anlegen (Cookie ausgeben, ohne OIDC)"
    # T012980: Der regulaere Weg in /sdlc/* ist die Anmeldung ueber Pocket ID. Lokal muss
    # dafuer kein Pocket ID erreichbar sein — auth.ts oeffnet mit issueSession() denselben
    # Pfad bereits fuer die System-Testnutzer (Magic-Link-Redeem). Das Skript schreibt eine
    # Zeile in web_sessions und gibt das Cookie aus.
    #
    # Es ist ein Auth-Bypass und verweigert daher alles, was nicht localhost ist: zeigt
    # SESSIONS_DATABASE_URL auf einen anderen Host, bricht es mit Exit 2 ab, BEVOR es
    # schreibt. Eine Session in einer Cluster-DB waere ein echter Zugang zu einer echten
    # Umgebung, kein Entwicklungsbehelf.
    #
    # Vorbedingung: der Devserver lief mindestens einmal (task sdlc:dev), damit
    # ensureSessionsTable() die Tabelle web_sessions angelegt hat. Fehlt sie, bricht das
    # Skript ebenfalls ab — eine Session in eine gerade erfundene Tabelle zu schreiben
    # verschleierte, dass der Server nie lief.
    #
    # Die .env wird ausdruecklich aus components/website geladen, nicht aus dem Repo-Root:
    # SESSIONS_DATABASE_URL steht nur dort. Ohne  exportiert das Sourcen die
    # Variablen nicht in die Kindumgebung, und node saehe sie nicht.
    cmds:
      - |
        set -e
        if [ ! -f components/website/.env ]; then
          echo "components/website/.env fehlt — SESSIONS_DATABASE_URL kann nicht geladen werden." >&2
          exit 2
        fi
        set -a; . ./components/website/.env; set +a
        node scripts/dev-admin-session.mjs

  sdlc:refresh:
    desc: "SDLC-Console nach einem main-Merge auf die aktuelle :latest nachziehen (T003740)"
    # T003740: imagePullPolicy Always in k3d/sdlc-stack/sdlc-console.yaml sorgt dafuer,
    # dass der Kubelet beim Neustart die frische :latest zieht. Mit IfNotPresent bliebe
    # der alte Layer lokal liegen und ein rollout restart waere wirkungslos. Dieser
    # Task ist der dokumentierte Handgriff nach einem main-Merge.
    cmds:
      - |
        set -e
        CTX="{{.SDLC_CTX}}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        IMAGE="ghcr.io/paddione/website-sdlc:latest"
        REG_DIGEST="$(docker manifest inspect "${IMAGE}" | grep -m1 digest | awk -F'"' '{print $4}')"
        POD="$(kubectl --context "$CTX" -n "$NS" get pod -l app=sdlc-console -o jsonpath='{.items[0].metadata.name}')"
        RUN_IMAGE_ID="$(kubectl --context "$CTX" -n "$NS" get pod "$POD" -o jsonpath='{.status.containerStatuses[0].imageID}')"
        RUN_DIGEST="$(printf '%s' "$RUN_IMAGE_ID" | sed 's|^[^@]*@||')"
        echo "Registry :latest Digest: ${REG_DIGEST}"
        echo "Laufende imageID:        ${RUN_IMAGE_ID}"
        if [ "${RUN_DIGEST}" = "${REG_DIGEST}" ]; then
          echo "sdlc-console laeuft bereits auf der aktuellen :latest — kein Neustart noetig."
        else
          echo "Abweichung erkannt — rollout restart zieht die frische :latest ..."
          kubectl --context "$CTX" -n "$NS" rollout restart deploy/sdlc-console
          kubectl --context "$CTX" -n "$NS" rollout status deploy/sdlc-console --timeout=300s
        fi
        BUILD_TARGET="$(kubectl --context "$CTX" -n "$NS" exec deploy/sdlc-console -- sh -c 'echo BUILD_TARGET=$BUILD_TARGET')"
        echo "${BUILD_TARGET}"
        case "${BUILD_TARGET}" in
          *BUILD_TARGET=sdlc*) echo "OK: BUILD_TARGET=sdlc im Container gesetzt." ;;
          *) echo "FEHLER: BUILD_TARGET nicht gesetzt — Image aelter als T003036." >&2; exit 1 ;;
        esac
