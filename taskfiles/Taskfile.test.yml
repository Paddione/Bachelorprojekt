        # Install/update the Node.js runner wrapper script. [T006664]
        bash scripts/mcp-task-runner/install.sh

  test:spec:
    desc: "Run the offline-safe spec suite (pytest, tests/py/spec). Builds mcp-task-runner first. Live-DB cases skip without a reachable cluster, so this is CI-safe. SPEC_SHARD/SPEC_SHARDS runs only this shard's modules (tests/py/conftest.py). [T901392]"
    cmds:
      - task: test:spec:build-mcp-runner
      - |
        GUARD_SNAP="$(mktemp)"
        bash scripts/spec-tracked-file-guard.sh snapshot "$GUARD_SNAP"
        set +e
        bash scripts/pytest-run.sh tests/py/spec {{.CLI_ARGS}}
        TEST_STATUS=$?
        bash scripts/spec-tracked-file-guard.sh verify "$GUARD_SNAP"
        GUARD_STATUS=$?
        set -e
        rm -f "$GUARD_SNAP"
        if [ "$TEST_STATUS" -ne 0 ]; then exit "$TEST_STATUS"; fi
        if [ "$GUARD_STATUS" -ne 0 ]; then
          echo "⚠ spec-tracked-file-guard: getrackte Datei(en) waehrend des Spec-Laufs beruehrt — Befund, kein CI-Blocker [T002779]" >&2
        fi
        exit 0

  test:spec:changed:
    desc: "Alias for test:spec — the pytest spec suite runs in full in a few minutes, so there is no diff-scoped selection anymore. [T901392]"
    cmds:
