version: "3"

tasks:

  # ─────────────────────────────────────────────
  # Testing (no cluster required)
  # ─────────────────────────────────────────────
  test:py:
    desc: Run Pytest test suite (via uv or global pytest)
    cmds:
      - |
        if command -v uv >/dev/null 2>&1; then
          uv run --with pytest --with pyyaml --with pytest-xdist --with jinja2 pytest -n auto tests/py {{.CLI_ARGS}}
        else
          python3 -m pytest -n auto tests/py {{.CLI_ARGS}} 2>/dev/null || python3 -m pytest tests/py {{.CLI_ARGS}}
        fi

  test:py:smoke:
    desc: Run Pytest smoke tests (harness verification)
    cmds:
      - |
        if command -v uv >/dev/null 2>&1; then
          uv run --with pytest --with pyyaml --with jinja2 pytest tests/py/smoke {{.CLI_ARGS}}
        else
          python3 -m pytest tests/py/smoke {{.CLI_ARGS}}
        fi

  test:unit:
    desc: Run the offline unit pytest modules (tests/py/unit + ported tests/unit specs) in parallel
    cmds:
      - bash scripts/pytest-run.sh tests/py/unit tests/py/spec/native_ported/unit tests/py/spec/native_ported/spec/test_mcp_tooling.py
      - bash tests/figure-pack-assets.test.sh

