version: "3"

tasks:

  workspace:dsgvo-check:
    desc: Run DSGVO compliance verification (NFA-01 data sovereignty proof)
    cmds:
      - bash tests/runner.sh local NFA-01

  # ─────────────────────────────────────────────
  # Quick Start
  # ─────────────────────────────────────────────
  workspace:setup:
    desc: "Full deploy on existing cluster: preflight -> deploy -> office -> post-config (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - bash scripts/pre-deploy-check.sh "{{.ENV}}"
      - task: workspace:deploy
        vars: { ENV: "{{.ENV}}" }
      - task: workspace:office:deploy
        vars: { ENV: "{{.ENV}}" }
      - echo ""
      - 'echo "✓ Workspace fully deployed and configured ({{.ENV}})"'
      - 'echo "  Optional → task workspace:admin-users-setup ENV={{.ENV}}   (provision SSO admin users in Keycloak)"'

  # ─────────────────────────────────────────────
  # Workspace MVP (Bachelorprojekt)
  # ─────────────────────────────────────────────

  workspace:deploy:all-prods:
    desc: "Run workspace:deploy on mentolder + korczewski"
    cmds:
      - task: workspace:deploy
        vars: { ENV: "mentolder" }
      - task: workspace:deploy
        vars: { ENV: "korczewski" }

  workspace:status:all-prods:
    desc: "Show detailed workspace:status (pods + svc + ingress + PVC) on mentolder + korczewski"
    cmds:
      - 'echo "═══ MENTOLDER ═══"'
      - task: workspace:status
        vars: { ENV: "mentolder" }
      - 'echo ""'
      - 'echo "═══ KORCZEWSKI ═══"'
      - task: workspace:status
        vars: { ENV: "korczewski" }

  workspace:office:sync-secret:
    desc: "Copy COLLABORA_ADMIN_PASSWORD from workspace-secrets into workspace-office/collabora-secrets (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        if ! kubectl $CTX get namespace workspace-office > /dev/null 2>&1; then
          echo "workspace-office namespace does not exist on context '${ENV_CONTEXT:-<active>}'. Run 'task workspace:office:deploy ENV={{.ENV}}' first."
          exit 1
        fi
        if ! kubectl $CTX get secret workspace-secrets -n "$NS" > /dev/null 2>&1; then
          echo "${NS}/workspace-secrets missing — can't sync COLLABORA_ADMIN_PASSWORD."
          exit 1
        fi
        PW=$(kubectl $CTX get secret workspace-secrets -n "$NS" \
               -o jsonpath='{.data.COLLABORA_ADMIN_PASSWORD}' | base64 -d)
        if [ -z "$PW" ]; then
          echo "FEHLER: COLLABORA_ADMIN_PASSWORD nicht im workspace-secrets gesetzt."
          exit 1
        fi
        kubectl $CTX create secret generic collabora-secrets \
          -n workspace-office \
          --from-literal=COLLABORA_ADMIN_PASSWORD="$PW" \
          --dry-run=client -o yaml | kubectl $CTX apply -f -
        kubectl $CTX rollout restart deploy/collabora -n workspace-office
        kubectl $CTX rollout status deploy/collabora -n workspace-office --timeout=180s
        echo "✓ collabora-secrets synced from ${NS}/workspace-secrets; Collabora rolled (ENV={{.ENV}})"

  workspace:office:pull-secret:
    desc: "Create/update ghcr-pull-secret in workspace-office (for the custom collabora-code image, ENV=dev|mentolder|...)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        context_flag=""
        [ "{{.ENV}}" != "dev" ] && context_flag="--context ${ENV_CONTEXT}"
        # Bootstrap the namespace if it doesn't exist yet — the secret
        # has to be in place before the office-stack apply, otherwise
        # the collabora Deployment hits ImagePullBackOff on first roll.
        if ! kubectl $context_flag get namespace workspace-office >/dev/null 2>&1; then
          kubectl $context_flag create namespace workspace-office
          kubectl $context_flag label namespace workspace-office \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/warn=privileged --overwrite
        fi
        source scripts/lib/secrets-env.sh   # T900789: mentolder -> fleet-mentolder
        SECRETS_FILE="environments/.secrets/$(secrets_env_for "{{.ENV}}").yaml"
        if [[ "{{.ENV}}" == "dev" ]]; then
          TOKEN=$(gh auth token)
        elif [[ -f "$SECRETS_FILE" ]]; then
          TOKEN=$(grep -E '^GHCR_PAT:' "$SECRETS_FILE" | sed 's/^GHCR_PAT:[[:space:]]*//' | tr -d '"')
        fi
        if [[ -z "$TOKEN" ]]; then
          echo "ERROR: GHCR_PAT not found in $SECRETS_FILE" >&2; exit 1
        fi
        kubectl $context_flag create secret docker-registry ghcr-pull-secret \
          --namespace=workspace-office \
          --docker-server=ghcr.io \
          --docker-username=Paddione \
          --docker-password="$TOKEN" \
          --dry-run=client -o yaml | kubectl $context_flag apply -f -
        echo "✓ ghcr-pull-secret in workspace-office ({{.ENV}})"

  workspace:office:deploy:
    desc: "Deploy the office-stack (Collabora in a privileged workspace-office ns, ENV=dev|mentolder|...)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    preconditions:
      - sh: kubectl cluster-info > /dev/null 2>&1
        msg: "No cluster running."
    cmds:
      - |
        if [ "{{.ENV}}" != "dev" ]; then
          echo "❌ workspace:office:deploy is for DEV (k3d) only."
          echo ""
          echo "   The shared fleet office-stack serves BOTH brands from a single"
          echo "   Collabora instance. A single-brand deploy overwrites the Ingress"
          echo "   and drops the other brand's host (T000478)."
          echo ""
          echo "   For production prodmesh deploys, use:"
          echo "     task prodmesh:shared-services"
          echo ""
          echo "   This deploys Collabora for both brands in one shot."
          exit 1
        fi
      - task: workspace:office:pull-secret
        vars: { ENV: "{{.ENV}}" }
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        # Derive Collabora envsubst vars from PROD_DOMAIN. Dev (*.localhost)
        # runs Collabora behind plain HTTP; prod terminates TLS at Traefik
        # and attaches the wildcard secret + HSTS/redirect middlewares.
        export COLLABORA_HOST="office.${PROD_DOMAIN}"
        export COLLABORA_ALIASGROUP1="https://files.${PROD_DOMAIN}"
        # Empty server_name lets coolwsd derive the WOPI discovery urlsrc host
        # dynamically from the request Host header. On the shared fleet
        # office-stack both brands hit the same Collabora Deployment, so a
        # hardcoded office.${PROD_DOMAIN} would make office.korczewski.de's
        # discovery advertise office.mentolder.de (T000478).
        export COLLABORA_SERVER_NAME=""
        case "${PROD_DOMAIN}" in
          localhost)
            export COLLABORA_SSL_TERMINATION="false"
            export COLLABORA_TLS_SECRET="collabora-tls-dev"
            export COLLABORA_INGRESS_MIDDLEWARES=""
            export COLLABORA_ALIASGROUP1="http://nextcloud.workspace.svc.cluster.local:80"
            ;;
          *)
            export COLLABORA_SSL_TERMINATION="true"
            export COLLABORA_TLS_SECRET="${TLS_SECRET_NAME:-workspace-wildcard-tls}"
            export COLLABORA_INGRESS_MIDDLEWARES="${WORKSPACE_NAMESPACE:-workspace}-redirect-https@kubernetescrd,${WORKSPACE_NAMESPACE:-workspace}-hsts-headers@kubernetescrd"
            ;;
        esac
        context_flag=""
        [ "{{.ENV}}" != "dev" ] && context_flag="--context ${ENV_CONTEXT}"
        kustomize build k3d/office-stack \
          | sed -E 's/: \$\{([a-zA-Z0-9_]+)\}[[:space:]]*$/: "${\1}"/g' \
          | envsubst '$PROD_DOMAIN $COLLABORA_HOST $COLLABORA_ALIASGROUP1 $COLLABORA_ALIASGROUP2 $COLLABORA_SERVER_NAME $COLLABORA_SSL_TERMINATION $COLLABORA_TLS_SECRET $COLLABORA_INGRESS_MIDDLEWARES' \
          | kubectl $context_flag apply -f -
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        context_flag=""
        [ "{{.ENV}}" != "dev" ] && context_flag="--context ${ENV_CONTEXT}"
        kubectl $context_flag rollout status deploy/collabora -n workspace-office --timeout=300s
      - task: workspace:office:sync-secret
        vars: { ENV: "{{.ENV}}" }
      - 'echo ""'

  workspace:status:
    desc: Show Workspace MVP deployment status
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        echo "=== Pods ==="
        kubectl $CTX get pods -n "$NS" -o wide
        echo ""
        echo "=== Services ==="
        kubectl $CTX get svc -n "$NS"
        echo ""
        echo "=== Ingress ==="
        kubectl $CTX get ingress -n "$NS"
        echo ""
        echo "=== PVCs ==="
        kubectl $CTX get pvc -n "$NS"

  workspace:logs:
    desc: "Tail logs for a workspace service (usage: task workspace:logs -- <service>)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX logs -n "$NS" deploy/{{.CLI_ARGS}} -f --tail=50

  workspace:psql:
    desc: 'Open psql shell to shared-db (usage: task workspace:psql -- <dbname>, default: postgres)'
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX exec -it -n "$NS" deploy/shared-db -- psql -U postgres -d {{.CLI_ARGS | default "postgres"}}

  workspace:port-forward:
    desc: 'Forward shared-db to localhost:5432'
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - 'echo "Connect: psql -h localhost -p 5432 -U postgres"'
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX port-forward -n "$NS" svc/shared-db 5432:5432

  workspace:backup:
    desc: "Trigger an immediate database backup (usage: task workspace:backup [-- --context <ctx>])"
    cmds:
      - bash scripts/backup-restore.sh trigger {{.CLI_ARGS}}

  workspace:backup:list:
    desc: "List available database backup timestamps (usage: task workspace:backup:list [-- --context <ctx>])"
    cmds:
      - bash scripts/backup-restore.sh list {{.CLI_ARGS}}

  workspace:backup:pvcs:
    desc: "Trigger an immediate PVC backup (nextcloud-files, vaultwarden-data, docuseal-data) [ENV=dev|mentolder|korczewski]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_arg=""
        [ "{{.ENV}}" != "dev" ] && ctx_arg="--context $ENV_CONTEXT"
        bash scripts/backup-restore.sh pvc-trigger $ctx_arg {{.CLI_ARGS}}

  workspace:backup:pvcs:list:
    desc: "List available PVC backup timestamps [ENV=dev|mentolder|korczewski]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_arg=""
        [ "{{.ENV}}" != "dev" ] && ctx_arg="--context $ENV_CONTEXT"
        bash scripts/backup-restore.sh pvc-list $ctx_arg

  workspace:backup:filen-pull:
    desc: "Download a backup timestamp from Filen cloud into backup-pvc (usage: task workspace:backup:filen-pull -- <timestamp> [--remote-path <p>]) [ENV=dev|mentolder|korczewski]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_arg=""
        [ "{{.ENV}}" != "dev" ] && ctx_arg="--context $ENV_CONTEXT"
        ns_arg="--namespace ${WORKSPACE_NAMESPACE:-workspace}"
        bash scripts/backup-restore.sh filen-pull {{.CLI_ARGS}} $ctx_arg $ns_arg

  workspace:pvc:restore:
    desc: "List available PVC backups then restore a service (usage: task workspace:pvc:restore -- <service> <timestamp> [ENV=...])"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_arg=""
        [ "{{.ENV}}" != "dev" ] && ctx_arg="--context $ENV_CONTEXT"
        echo "Available PVC backups:"
        bash scripts/backup-restore.sh pvc-list $ctx_arg
        echo ""
        bash scripts/backup-restore.sh pvc-restore {{.CLI_ARGS}} $ctx_arg

  workspace:db:start:
    desc: "Ensure shared-db is running; scale up if at 0 replicas, otherwise restart (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx=""
        [ "{{.ENV}}" != "dev" ] && ctx="--context $ENV_CONTEXT"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        replicas=$(kubectl $ctx get deploy/shared-db -n "$NS" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
        if [ "$replicas" = "0" ]; then
          echo "shared-db scaled to 0 — scaling up..."
          kubectl $ctx scale deployment/shared-db -n "$NS" --replicas=1
        else
          echo "shared-db at $replicas replica(s) — restarting pod..."
          kubectl $ctx rollout restart deployment/shared-db -n "$NS"
        fi
        kubectl $ctx rollout status deployment/shared-db -n "$NS" --timeout=120s
        echo "✓ shared-db ready (ENV={{.ENV}}, ns=$NS)"
      - task: workspace:sync-db-passwords
        vars: { ENV: "{{.ENV}}" }

  workspace:db:drop:
    desc: "Drop a database from shared-db (usage: task workspace:db:drop -- <dbname> [ENV=...])"
    prompt: "This permanently drops the database. Proceed?"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx=""
        [ "{{.ENV}}" != "dev" ] && ctx="--context $ENV_CONTEXT"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        dbname="{{.CLI_ARGS}}"
        if [ -z "$dbname" ]; then
          echo "ERROR: specify a database name: task workspace:db:drop -- <dbname>"
          exit 1
        fi
        kubectl $ctx exec -n "$NS" deploy/shared-db -- \
          psql -U postgres -c "DROP DATABASE IF EXISTS \"${dbname}\";"
        echo "✓ Database '${dbname}' dropped (ENV={{.ENV}}, ns=$NS)"

  workspace:db:restore:
    desc: "List available backups then restore a database (usage: task workspace:db:restore -- <db> <timestamp> [ENV=...])"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_arg=""
        [ "{{.ENV}}" != "dev" ] && ctx_arg="--context $ENV_CONTEXT"
        echo "Available backups:"
        bash scripts/backup-restore.sh list $ctx_arg
        echo ""
        bash scripts/backup-restore.sh restore {{.CLI_ARGS}} $ctx_arg
      - task: workspace:sync-db-passwords
        vars: { ENV: "{{.ENV}}" }

  workspace:teardown:
    desc: Remove all Workspace MVP resources (ENV=dev|mentolder|korczewski)
    vars:
      ENV: '{{.ENV | default "dev"}}'
    prompt: "This will delete the workspace namespace and all data for ENV={{.ENV}}. Continue?"
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX delete namespace "$NS" --ignore-not-found --timeout=120s
        echo "✓ Namespace '$NS' deleted (ENV={{.ENV}})"

  workspace:restart:
    desc: "Restart a workspace service (usage: task workspace:restart -- <service>)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX rollout restart deployment/{{.CLI_ARGS}} -n "$NS"
        kubectl $CTX rollout status deployment/{{.CLI_ARGS}} -n "$NS" --timeout=120s
        if [ "{{.CLI_ARGS}}" = "shared-db" ]; then
          task workspace:sync-db-passwords ENV="{{.ENV}}"
        fi

  workspace:admin-users-setup:
    desc: Provision SSO admin users in Keycloak workspace realm
    vars:
      ENV: '{{.ENV | default "dev"}}'
    preconditions:
      - sh: kubectl cluster-info > /dev/null 2>&1
        msg: "No cluster running. Point kubectl at a reachable context first (ENV=dev → devmesh, see environments/dev.yaml: context: devmesh)."
    cmds:
      - |
        export ENV="{{.ENV}}"
        bash scripts/admin-users-setup.sh
      - 'echo ""'
      - 'echo "  Done. Re-run any specific setup task as needed."'

  workspace:admin-users-setup:all-prods:
    desc: "Provision SSO admin users in Keycloak on mentolder + korczewski"
    cmds:
      - task: workspace:admin-users-setup
        vars: { ENV: "mentolder" }
      - task: workspace:admin-users-setup
        vars: { ENV: "korczewski" }

  workspace:verify:
    desc: "Post-deploy sanity check — cross-namespace netpol probes + credential state (ENV=mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        export ENV="{{.ENV}}"
        bash scripts/verify-deployment.sh

  workspace:verify:all-prods:
    desc: "Run workspace:verify on mentolder (korczewski frozen per T002479, excluded)"
    cmds:
      - task: workspace:verify
        vars: { ENV: "mentolder" }

  workspace:validate:
    desc: Validate k3d manifests with kustomize dry-run
    cmds:
      - kubectl kustomize k3d/ --load-restrictor=LoadRestrictionsNone | kubectl apply --dry-run=client -f -
      - echo "✓ Manifests are valid"

  workspace:preflight:
    desc: "Pre-deploy checklist — secrets, SealedSecrets, overlay, cluster health (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - bash scripts/pre-deploy-check.sh "{{.ENV}}"

  workspace:deploy:
    desc: "Deploy workspace to any environment (ENV=dev|mentolder|korczewski|...)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - task: env:validate
        vars: { ENV: "{{.ENV}}" }
      - |
        # ⚠️ DEPRECATED: Direct push-based workspace:deploy is deprecated under FluxCD GitOps.
        # Pull-based reconciliation via Flux is the primary deployment path on fleet.
        # Direct workspace:deploy is retained for Break-Glass use. Before using Break-Glass
        # imperative deploys, suspend Flux reconciliation via: `flux suspend kustomization <name>`.
        source scripts/env-resolve.sh "{{.ENV}}"

        if [ "{{.ENV}}" != "dev" ]; then
          active_ctx=$(kubectl config current-context 2>/dev/null || echo "")
          if [ "$active_ctx" != "$ENV_CONTEXT" ]; then
            echo "Switching kubectl context: $active_ctx → $ENV_CONTEXT"
            kubectl config use-context "$ENV_CONTEXT"
          fi
        fi

        if [ "{{.ENV}}" = "dev" ]; then
          # Deploy shared-db prerequisites + shared-db first so dependent services don't crash-loop
          kubectl apply -f k3d/namespace.yaml
          if ! kubectl get namespace "${WEBSITE_NAMESPACE:-website}" >/dev/null 2>&1; then
            kubectl create namespace "${WEBSITE_NAMESPACE:-website}"
          fi
          kubectl apply -f k3d/secrets.yaml -n workspace
          kubectl apply -f k3d/configmap-domains.yaml -n workspace
          kubectl apply -f k3d/website-schema.yaml -n workspace
          # $$ -> $ Collapse wie im kustomize-Hauptpfad: shared-db.yaml traegt $$-escapte
          # Shell-Vars; roh applied setzt der postStart-Hook sonst alle DB-Passwoerter
          # auf '<PID>{VAR}' (Incident T001673).
          sed -E 's/\$\$([a-zA-Z0-9_({!?])/$\1/g' k3d/shared-db.yaml \
            | kubectl apply -n workspace -f -
          echo "Waiting for shared-db to be ready before deploying dependent services..."
          kubectl rollout status deployment/shared-db -n workspace --timeout=120s
          # Run website DB migrations before the website Deployment is rolled
          # out below (T001652 — website had no automated migration runner).
          task website:migrate ENV="{{.ENV}}"
          task db:migrate ENV="{{.ENV}}"
          # Full apply (idempotent — updates configs, adds remaining services)
          # SYSTEMTEST_LOOP_ENABLED defaults to "false" so the placeholder is
          # never emitted literally in dev (where the env file may omit it).
          # POCKET_ID_SMTP_TLS: von SMTP_SECURE + SMTP_PORT hergeleitet (Pocket-ID kennt kein
          # SMTP_SECURE-Bool, sondern SMTP_TLS=none|starttls|tls). secure=true -> implizites TLS
          # (z.B. Port 465); Port 587 ist bei allen aktuell konfigurierten Envs (mentolder,
          # korczewski, staging) STARTTLS gegen mailbox.org; alles andere (z.B. Mailpit dev auf
          # Port 1025) bleibt unverschluesselt.
          if [ "${SMTP_SECURE:-false}" = "true" ]; then
            export POCKET_ID_SMTP_TLS="tls"
          elif [ "${SMTP_PORT:-}" = "587" ]; then
            export POCKET_ID_SMTP_TLS="starttls"
          else
            export POCKET_ID_SMTP_TLS="none"
          fi
          # T901777: Cluster-CIDRs fuer die NetworkPolicies (k3d/network-policies.yaml,
          # k3d/website.yaml). Defaults = k3s-Defaults (Fleet-Cluster, lokales k3d);
          # devmesh ueberschreibt in environments/dev.yaml (10.52/10.53). POD_VTEP_IP
          # ist die flannel-VTEP-Adresse des CP-Nodes (Basisadresse von POD_CIDR).
          export POD_CIDR="${POD_CIDR:-10.42.0.0/16}"
          export SERVICE_CIDR="${SERVICE_CIDR:-10.43.0.0/16}"
          export POD_VTEP_IP="${POD_VTEP_IP:-${POD_CIDR%%/*}}"
          SYSTEMTEST_LOOP_ENABLED="${SYSTEMTEST_LOOP_ENABLED:-false}" \
          LLM_ENABLED="${LLM_ENABLED:-false}" \
          LLM_RERANK_ENABLED="${LLM_RERANK_ENABLED:-false}" \
          LLM_HOST_IP="${LLM_HOST_IP:-172.17.0.1}" \
          LLM_ROUTER_URL="${LLM_ROUTER_URL:-http://llm-gateway-lmstudio.workspace.svc.cluster.local:1234}" \
          LLM_EMBED_URL="${LLM_EMBED_URL:-http://llm-gateway-embed.workspace.svc.cluster.local:8081}" \
          LLM_RERANKER_URL="${LLM_RERANKER_URL:-http://llm-gateway-rerank.workspace.svc.cluster.local:8081}" \
          POCKET_ID_FRONTEND_URL="${POCKET_ID_FRONTEND_URL:-http://id.localhost}" \
          POCKET_ID_URL="${POCKET_ID_URL:-http://pocket-id.${WORKSPACE_NAMESPACE:-workspace}.svc.cluster.local:1411}" \
          POCKET_ID_DOMAIN="${POCKET_ID_DOMAIN:-id.localhost}" \
          SESSIONS_DOMAIN="${SESSIONS_DOMAIN:-sessions.localhost}" \
            kustomize build k3d/ --load-restrictor=LoadRestrictionsNone \
              | sed -E 's/: \$\{([a-zA-Z0-9_]+)\}[[:space:]]*$/: "${\1}"/g' \
              | TURN_OVERLAY_IP="${TURN_OVERLAY_IP:-172.17.0.1}" \
                TERMINAL_OVERLAY_IP="${TERMINAL_OVERLAY_IP:-172.17.0.1}" \
                envsubst "\$PROD_DOMAIN \$BRAND_NAME \$CONTACT_EMAIL \$BACKUP_ALERT_EMAIL \$BRAND_ID \$SYSTEMTEST_LOOP_ENABLED \$ARENA_WS_URL \$LLM_ENABLED \$LLM_RERANK_ENABLED \$LLM_HOST_IP \$LLM_ROUTER_URL \$LLM_EMBED_URL \$LLM_RERANKER_URL \$STUDIO_IMAGE \$WEBSITE_NAMESPACE \$SMTP_FROM \$SMTP_HOST \$SMTP_PORT \$SMTP_USER \$POCKET_ID_SMTP_TLS \$POCKET_ID_FRONTEND_URL \$POCKET_ID_URL \$POCKET_ID_DOMAIN \$SESSIONS_DOMAIN \$TURN_OVERLAY_IP \$TERMINAL_OVERLAY_IP \$POD_CIDR \$SERVICE_CIDR \$POD_VTEP_IP" \
              | sed -E 's/\$\$([a-zA-Z0-9_({!?])/$\1/g' \
              | kubectl apply --server-side --force-conflicts -f -
          # Tests retention CronJob — applied separately so its Role+RoleBinding
          # can land in WEBSITE_NAMESPACE (kustomize's top-level namespace
          # transformer would otherwise force them into workspace).
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/tests-retention-cronjob.yaml | kubectl apply -f -
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/cicd-deploy-sa.yaml | kubectl apply -f -
          # Cross-namespace RBAC for pocket-id-client-seed to also patch website-secrets (T001435)
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/pocket-id-client-seed-website-rbac.yaml | kubectl apply -f -
          # System-test failure-loop cleanup CronJobs — applied separately so
          # they land in WEBSITE_NAMESPACE alongside the website pod (kustomize's
          # top-level `namespace: workspace` would otherwise force them into the
          # wrong ns). Default WEBSITE_NAMESPACE=website if not set in env file.
          # NOTE: cronjob-systemtest-cleanup.yaml is intentionally empty — the three
          # systemtest CronJobs were removed in T002644 (their /sdlc/ routes no longer
          # exist in prod after the SDLC-split T002624).
        else
          # Prod: build from overlay, apply to target cluster
          _ws_ns="${WORKSPACE_NAMESPACE:-workspace}"
          _website_ns="${WEBSITE_NAMESPACE:-website}"

          # Apply SealedSecret first so the Secret is ready when pods start
          source scripts/lib/secrets-env.sh   # T900789: mentolder -> fleet-mentolder
          sealed="environments/sealed-secrets/$(secrets_env_for "{{.ENV}}").yaml"
          if [ -f "$sealed" ]; then
            # Pre-create ALL namespaces referenced by SealedSecrets so apply doesn't fail.
            # Includes workspace-office so its SealedSecrets land cleanly.
            for _ns in "$_ws_ns" cert-manager "$_website_ns" workspace-office monitoring; do
              kubectl --context "$ENV_CONTEXT" create namespace "$_ns" \
                --dry-run=client -o yaml | kubectl --context "$ENV_CONTEXT" apply -f -
            done
            # Defense-in-depth (T001404): drop any SealedSecret document whose
            # namespace is in SHARED_NAMESPACES and whose owner-brand
            # annotation does not include the current ENV. Prevents
            # follow-up damage if a SealedSecret file is manually edited or
            # contains legacy-only blocks. Falls back to applying the
            # original file if yq is unavailable.
            if command -v yq >/dev/null 2>&1; then
              _shared_ns_csv=$(IFS=,; echo "${SHARED_NAMESPACES[*]:-rustdesk}")
              _filtered=$(yq eval-all '
                select(
                  .kind != "SealedSecret" or
                  (.metadata.namespace as $ns | "'"$_shared_ns_csv"'" | split(",") as $shared |
                   ($shared | index($ns)) == null) or
                  (.metadata.annotations["secrets.bachelorprojekt/owner-brand"] as $ob |
                   $ob == null or ($ob | split("[ ,]" | .[]? // "") | index("'"{{.ENV}}"'")) != null)
                )
              ' "$sealed" 2>/dev/null || cat "$sealed")
              if [[ -n "$_filtered" ]]; then
                _sealed_filtered="$(mktemp)"
                echo "$_filtered" > "$_sealed_filtered"
                trap "rm -f '$_sealed_filtered'" EXIT
                sealed="$_sealed_filtered"
              fi
            fi
            kubectl --context "$ENV_CONTEXT" apply -f "$sealed"
            if ! bash scripts/wait-for-sealed-secret.sh \
                 --context "$ENV_CONTEXT" --namespace "${_ws_ns}" \
                 --secret workspace-secrets --timeout 90; then
              echo "Aborting deploy: workspace-secrets is not present — refusing to continue without credentials." >&2
              exit 1
            fi
            # Provision ghcr-pull-secret in the workspace namespace so image pulls succeed.
            _ghcr_pat=$(kubectl --context "$ENV_CONTEXT" get secret workspace-secrets \
              -n "${_ws_ns}" -o jsonpath='{.data.GHCR_PAT}' 2>/dev/null | base64 -d 2>/dev/null || echo "")
            if [[ -n "$_ghcr_pat" ]]; then
              kubectl --context "$ENV_CONTEXT" create secret docker-registry ghcr-pull-secret \
                --namespace="${_ws_ns}" \
                --docker-server=ghcr.io \
                --docker-username=Paddione \
                --docker-password="$_ghcr_pat" \
                --dry-run=client -o yaml | kubectl --context "$ENV_CONTEXT" apply -f -
              echo "✓ ghcr-pull-secret provisioned in ${_ws_ns}"
            fi
          fi

          # Deploy shared-db first (base manifest); full overlay apply below patches it via --server-side --force-conflicts.
          # Apply namespace.yaml labels via a patch so pod-security enforcement is correct on any cluster.
          kubectl --context "$ENV_CONTEXT" create namespace "${_ws_ns}" --dry-run=client -o yaml \
            | kubectl --context "$ENV_CONTEXT" apply -f -
          kubectl --context "$ENV_CONTEXT" label namespace "${_ws_ns}" \
            "app.kubernetes.io/part-of=workspace-mvp" \
            "pod-security.kubernetes.io/enforce=privileged" \
            "pod-security.kubernetes.io/warn=restricted" \
            --overwrite
          # Apply website-schema ConfigMap first as shared-db expects it for schema init
          kubectl --context "$ENV_CONTEXT" -n "${_ws_ns}" apply -f k3d/website-schema.yaml
          # -n "${_ws_ns}" places the namespace-less shared-db Deployment in the
          # target ns. The base manifest intentionally omits namespace on the
          # Deployment so the prod/ strategic-merge patch matches it as [noNs];
          # PVC/ConfigMap/Services keep their explicit (sed-rewritten) namespace.
          # $$ -> $ Collapse wie im kustomize-Hauptpfad (Zeile mit ENVSUBST_VARS unten):
          # ohne ihn landet '$${VAR}' literal im postStart-Hook und die Shell expandiert
          # $$ zur PID — alle DB-User-Passwoerter werden zu '<PID>{VAR}' (Incident T001673).
          sed "s/namespace: workspace$/namespace: ${_ws_ns}/g" k3d/shared-db.yaml \
            | sed -E 's/\$\$([a-zA-Z0-9_({!?])/$\1/g' \
            | kubectl --context "$ENV_CONTEXT" -n "${_ws_ns}" apply -f -
          echo "Waiting for shared-db to be ready before deploying dependent services..."
          kubectl --context "$ENV_CONTEXT" rollout status deployment/shared-db -n "${_ws_ns}" --timeout=120s
          # Run website DB migrations before the website Deployment is rolled
          # out below (T001652 — website had no automated migration runner).
          task website:migrate ENV="{{.ENV}}"
          task db:migrate ENV="{{.ENV}}"

          overlay="${ENV_OVERLAY:-prod}"
          # Derive MAIL_FROM_ADDRESS / MAIL_DOMAIN from the authoritative SMTP_FROM
          # so senders match the SMTP-authenticated mailbox (mailbox.org rejects
          # senders the authenticated account does not own with 553).
          export MAIL_FROM_LOCAL="${SMTP_FROM%@*}"
          export MAIL_FROM_DOMAIN="${SMTP_FROM#*@}"
          ENVSUBST_VARS="\$PROD_DOMAIN \$BRAND_NAME \$CONTACT_EMAIL \$BACKUP_ALERT_EMAIL \$INFRA_NAMESPACE \$TLS_SECRET_NAME"
          ENVSUBST_VARS="$ENVSUBST_VARS \$SMTP_FROM \$SMTP_HOST \$SMTP_PORT \$SMTP_USER \$MAIL_FROM_LOCAL \$MAIL_FROM_DOMAIN \$POCKET_ID_SMTP_TLS"
          ENVSUBST_VARS="$ENVSUBST_VARS \$WEBSITE_IMAGE \$WEBSITE_IMAGE_TAG \$WEBSITE_IMAGE_DIGEST \$BRETT_IMAGE \$BRETT_IMAGE_DIGEST \$TURN_PUBLIC_IP \$TURN_NODE \$TURN_OVERLAY_IP \$TERMINAL_OVERLAY_IP \$BRAND_ID"
          ENVSUBST_VARS="$ENVSUBST_VARS \$KC_USER1_USERNAME \$KC_USER1_EMAIL \$KC_USER2_USERNAME \$KC_USER2_EMAIL"
          ENVSUBST_VARS="$ENVSUBST_VARS \$BRETT_DOMAIN \$PENPOT_DOMAIN \$PENPOT_PUBLIC_URI"
          ENVSUBST_VARS="$ENVSUBST_VARS \$BRAIN_EXTERNAL_URL"
          ENVSUBST_VARS="$ENVSUBST_VARS \$RECOVER_DOMAIN \$OTEL_DOMAIN"
          ENVSUBST_VARS="$ENVSUBST_VARS \$STUDIO_DOMAIN \$STUDIO_IMAGE \$STUDIO_IMAGE_DIGEST \$STUDIO_DB_URL \$WHISPER_URL"
          ENVSUBST_VARS="$ENVSUBST_VARS \$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE"
          ENVSUBST_VARS="$ENVSUBST_VARS \$SYSTEMTEST_LOOP_ENABLED \$SESSIONS_DOMAIN"
          ENVSUBST_VARS="$ENVSUBST_VARS \$LLM_HOST_IP \$LLM_ENABLED \$LLM_RERANK_ENABLED \$LLM_ROUTER_URL \$LLM_EMBED_URL \$LLM_RERANKER_URL"
          ENVSUBST_VARS="$ENVSUBST_VARS \$COMFY_HOST_IP \$COMFY_PORT"
          ENVSUBST_VARS="$ENVSUBST_VARS \$RIGGER_HOST_IP \$RIGGER_PORT"
          # T901777: Cluster-CIDRs fuer die NetworkPolicies (Werte: Env-Files, siehe Dev-Zweig).
          ENVSUBST_VARS="$ENVSUBST_VARS \$POD_CIDR \$SERVICE_CIDR \$POD_VTEP_IP"

          ENVSUBST_VARS="$ENVSUBST_VARS \$NTFY_BASE_URL \$AGENT_PUSH_API \$AGENT_PUSH_LINK_BASE"
          ENVSUBST_VARS="$ENVSUBST_VARS \$DEV_DOMAIN \$DEV_NODE \$DEV_WEBSITE_HOST \$DEV_BRETT_HOST"
          # Pocket ID (T001068 Welle 0): POCKET_ID_DOMAIN lives in
          # k3d/configmap-domains.yaml (POCKET_ID_DOMAIN: id.localhost in dev,
          # overlay replaces it with id.${PROD_DOMAIN} for prod) — that path is
          # already covered by the strategic-merge patch in prod/configmap-domains.yaml.
          # POCKET_ID_FRONTEND_URL + POCKET_ID_URL are envsubst targets in
          # k3d/pocket-id.yaml (APP_URL, literal envsubst'd) and the prod patch
          # (id.${PROD_DOMAIN}, https://id.${PROD_DOMAIN}). POCKET_ID_DOMAIN is
          # also referenced from the k3d/pocket-id.yaml IngressRoute
          # (Host(`${POCKET_ID_DOMAIN}`)) — kustomize passes the envsubst list
          # through to it as well.
          # POCKET_ID_SMTP_TLS (T001396): abgeleitet aus SMTP_SECURE + SMTP_PORT, siehe
          # Herleitungs-Snippet oben — kein eigenes Schema-Pflichtfeld, da Pocket-ID (anders als
          # die Website) ein Drei-Werte-Enum statt eines Bools erwartet.
          ENVSUBST_VARS="$ENVSUBST_VARS \$POCKET_ID_FRONTEND_URL \$POCKET_ID_URL \$POCKET_ID_DOMAIN"
          # Pocket ID (T001068 Welle 0): defaults so the prod envsubst list
          # never emits literal ${POCKET_ID_*} tokens when an env file hasn't
          # adopted them yet.
          # POCKET_ID_SMTP_TLS: von SMTP_SECURE + SMTP_PORT hergeleitet (Pocket-ID kennt kein
          # SMTP_SECURE-Bool, sondern SMTP_TLS=none|starttls|tls). secure=true -> implizites TLS
          # (z.B. Port 465); Port 587 ist bei allen aktuell konfigurierten Envs (mentolder,
          # korczewski, staging) STARTTLS gegen mailbox.org; alles andere (z.B. Mailpit dev auf
          # Port 1025) bleibt unverschluesselt.
          if [ "${SMTP_SECURE:-false}" = "true" ]; then
            export POCKET_ID_SMTP_TLS="tls"
          elif [ "${SMTP_PORT:-}" = "587" ]; then
            export POCKET_ID_SMTP_TLS="starttls"
          else
            export POCKET_ID_SMTP_TLS="none"
          fi
          export POCKET_ID_FRONTEND_URL="${POCKET_ID_FRONTEND_URL:-https://id.${PROD_DOMAIN}}"
          export POCKET_ID_URL="${POCKET_ID_URL:-http://pocket-id.${WORKSPACE_NAMESPACE:-workspace}.svc.cluster.local:1411}"
          export POCKET_ID_DOMAIN="${POCKET_ID_DOMAIN:-id.${PROD_DOMAIN}}"
          # RustDesk web-client bridge (T001381): default overlay IP so a brand/dev
          # env that hasn't adopted TURN_OVERLAY_IP still renders a valid Endpoints
          # address instead of the literal ${TURN_OVERLAY_IP} token.
          export TURN_OVERLAY_IP="${TURN_OVERLAY_IP:-127.0.0.1}"
          # Terminal-sidekick (T001565): default overlay IP — see workspace:deploy.
          export TERMINAL_OVERLAY_IP="${TERMINAL_OVERLAY_IP:-127.0.0.1}"
          # Ensure DEV_* defaults exist for non-mentolder envs (korczewski/dev).
          export DEV_DOMAIN="${DEV_DOMAIN:-}"
          export DEV_NODE="${DEV_NODE:-}"
          export DEV_WEBSITE_HOST="${DEV_WEBSITE_HOST:-}"
          export DEV_BRETT_HOST="${DEV_BRETT_HOST:-}"
          # Default to "false" so prod env files that haven't yet adopted
          # the flag don't leak the literal "${SYSTEMTEST_LOOP_ENABLED}"
          # into the rendered website-config ConfigMap.
          export SYSTEMTEST_LOOP_ENABLED="${SYSTEMTEST_LOOP_ENABLED:-false}"
          export SESSIONS_DOMAIN="${SESSIONS_DOMAIN:-sessions.localhost}"
          export LLM_HOST_IP="${LLM_HOST_IP:-}"
          export LLM_ENABLED="${LLM_ENABLED:-false}"
          export LLM_RERANK_ENABLED="${LLM_RERANK_ENABLED:-false}"
          export LLM_ROUTER_URL="${LLM_ROUTER_URL:-http://llm-gateway-lmstudio.workspace.svc.cluster.local:1234}"
          export LLM_EMBED_URL="${LLM_EMBED_URL:-http://llm-gateway-embed.workspace.svc.cluster.local:8081}"
          export LLM_RERANKER_URL="${LLM_RERANKER_URL:-http://llm-gateway-rerank.workspace.svc.cluster.local:8081}"
          export COMFY_HOST_IP="${COMFY_HOST_IP:-}"
          export COMFY_PORT="${COMFY_PORT:-}"
          export RIGGER_HOST_IP="${RIGGER_HOST_IP:-${COMFY_HOST_IP:-}}"
          export RIGGER_PORT="${RIGGER_PORT:-8190}"
          # T901777: Cluster-CIDRs fuer die NetworkPolicies — Defaults = k3s-Defaults
          # (alle Fleet-Cluster); devmesh ueberschreibt in environments/dev.yaml.
          export POD_CIDR="${POD_CIDR:-10.42.0.0/16}"
          export SERVICE_CIDR="${SERVICE_CIDR:-10.43.0.0/16}"
          export POD_VTEP_IP="${POD_VTEP_IP:-${POD_CIDR%%/*}}"
          # Delete immutable Jobs before re-apply so field changes don't cause
          # "field is immutable" errors (Jobs cannot be patched in-place).
          kubectl --context "$ENV_CONTEXT" -n "$_ws_ns" delete job pocket-id-client-seed --ignore-not-found=true
          # T900029: Render-Guard (fail-closed) — leere Wildcard-Reste ("*.")
          # und unsubstituierte ${VAR} in dnsNames/Host-Zeilen brechen den
          # Deploy ab, BEVOR kubectl etwas appliziert. Temp-Datei statt Pipe,
          # damit bei Guard-Fehler kein Teil-Manifest appliziert wird; das
          # explizite "|| exit 1" gilt unabhaengig von den Shell-Flags des Tasks.
          _guard_tmp="$(mktemp)"
          kustomize build "$overlay/" --load-restrictor=LoadRestrictionsNone \
            | sed -E 's/: \$\{([a-zA-Z0-9_]+)\}[[:space:]]*$/: "${\1}"/g' \
            | envsubst "$ENVSUBST_VARS" \
            | sed -E 's/\$\$([a-zA-Z0-9_({!?])/$\1/g' \
            > "$_guard_tmp"
          bash scripts/render-guard.sh "$_guard_tmp" || exit 1
          cat "$_guard_tmp" \
            | kubectl --context "$ENV_CONTEXT" apply --server-side --force-conflicts -f -
          rm -f "$_guard_tmp"
          # Tests retention CronJob — applied separately so its Role+RoleBinding
          # can land in WEBSITE_NAMESPACE (kustomize's top-level namespace
          # transformer would otherwise force them into the workspace ns,
          # where the website pod does NOT live).
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/tests-retention-cronjob.yaml \
            | kubectl --context "$ENV_CONTEXT" apply -f -
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/cicd-deploy-sa.yaml \
            | kubectl --context "$ENV_CONTEXT" apply -f -
          # Cross-namespace RBAC for pocket-id-client-seed to also patch website-secrets (T001435)
          envsubst "\$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE" < k3d/pocket-id-client-seed-website-rbac.yaml \
            | kubectl --context "$ENV_CONTEXT" apply -f -
          # NOTE: systemtest cleanup CronJobs removed in T002644 — their /sdlc/ routes
          # no longer exist in prod after SDLC-split (T002624).
        fi
      - task: workspace:sync-db-passwords
        vars: { ENV: "{{.ENV}}" }
      - |
        if [ "{{.ENV}}" != "dev" ]; then
          bash scripts/post-deploy-watch.sh "{{.ENV}}" || true
        fi
      - 'echo "✓ Workspace deployed to {{.ENV}}"'
      - 'echo ""'
      - 'echo "  Next → task workspace:office:deploy ENV={{.ENV}}"'

  workspace:partial-deploy:
    desc: "Nur geänderte Services deployen (ENV=mentolder PARTIAL_SERVICES=website,docs)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        if [ -z "{{.PARTIAL_SERVICES}}" ]; then
          echo "PARTIAL_SERVICES must be set (comma-separated app slugs), e.g. PARTIAL_SERVICES=website,docs — aborting" >&2
          exit 1
        fi
        source scripts/env-resolve.sh "{{.ENV}}"

        if [ "{{.ENV}}" != "dev" ]; then
          active_ctx=$(kubectl config current-context 2>/dev/null || echo "")
          if [ "$active_ctx" != "$ENV_CONTEXT" ]; then
            echo "Switching kubectl context: $active_ctx → $ENV_CONTEXT"
            kubectl config use-context "$ENV_CONTEXT"
          fi
        fi

        _ws_ns="${WORKSPACE_NAMESPACE:-workspace}"
        overlay="${ENV_OVERLAY:-prod}"

        # Mirror workspace:deploy's prod envsubst contract EXACTLY so rendered
        # manifests are byte-identical (only the label selector differs).
        # POCKET_ID_SMTP_TLS: von SMTP_SECURE + SMTP_PORT hergeleitet (Pocket-ID kennt kein
        # SMTP_SECURE-Bool, sondern SMTP_TLS=none|starttls|tls). secure=true -> implizites TLS
        # (z.B. Port 465); Port 587 ist bei allen aktuell konfigurierten Envs (mentolder,
        # korczewski, staging) STARTTLS gegen mailbox.org; alles andere (z.B. Mailpit dev auf
        # Port 1025) bleibt unverschluesselt.
        if [ "${SMTP_SECURE:-false}" = "true" ]; then
          export POCKET_ID_SMTP_TLS="tls"
        elif [ "${SMTP_PORT:-}" = "587" ]; then
          export POCKET_ID_SMTP_TLS="starttls"
        else
          export POCKET_ID_SMTP_TLS="none"
        fi
        export MAIL_FROM_LOCAL="${SMTP_FROM%@*}"
        export MAIL_FROM_DOMAIN="${SMTP_FROM#*@}"
        ENVSUBST_VARS="\$PROD_DOMAIN \$BRAND_NAME \$CONTACT_EMAIL \$BACKUP_ALERT_EMAIL \$INFRA_NAMESPACE \$TLS_SECRET_NAME"
        ENVSUBST_VARS="$ENVSUBST_VARS \$SMTP_FROM \$SMTP_HOST \$SMTP_PORT \$SMTP_USER \$MAIL_FROM_LOCAL \$MAIL_FROM_DOMAIN \$POCKET_ID_SMTP_TLS"
        ENVSUBST_VARS="$ENVSUBST_VARS \$WEBSITE_IMAGE \$WEBSITE_IMAGE_TAG \$WEBSITE_IMAGE_DIGEST \$BRETT_IMAGE \$BRETT_IMAGE_DIGEST \$TURN_PUBLIC_IP \$TURN_NODE \$TURN_OVERLAY_IP \$TERMINAL_OVERLAY_IP \$BRAND_ID"
        ENVSUBST_VARS="$ENVSUBST_VARS \$KC_USER1_USERNAME \$KC_USER1_EMAIL \$KC_USER2_USERNAME \$KC_USER2_EMAIL"
        ENVSUBST_VARS="$ENVSUBST_VARS \$BRETT_DOMAIN \$PENPOT_DOMAIN \$PENPOT_PUBLIC_URI"
        ENVSUBST_VARS="$ENVSUBST_VARS \$BRAIN_EXTERNAL_URL"
        ENVSUBST_VARS="$ENVSUBST_VARS \$RECOVER_DOMAIN \$OTEL_DOMAIN"
        ENVSUBST_VARS="$ENVSUBST_VARS \$STUDIO_DOMAIN \$STUDIO_IMAGE \$STUDIO_IMAGE_DIGEST \$STUDIO_DB_URL \$WHISPER_URL"
        ENVSUBST_VARS="$ENVSUBST_VARS \$WORKSPACE_NAMESPACE \$WEBSITE_NAMESPACE"
        ENVSUBST_VARS="$ENVSUBST_VARS \$SYSTEMTEST_LOOP_ENABLED \$SESSIONS_DOMAIN"
        ENVSUBST_VARS="$ENVSUBST_VARS \$LLM_HOST_IP \$LLM_ENABLED \$LLM_RERANK_ENABLED \$LLM_ROUTER_URL \$LLM_EMBED_URL \$LLM_RERANKER_URL"
        ENVSUBST_VARS="$ENVSUBST_VARS \$COMFY_HOST_IP \$COMFY_PORT"
        ENVSUBST_VARS="$ENVSUBST_VARS \$RIGGER_HOST_IP \$RIGGER_PORT"
        # T901777: Cluster-CIDRs (mirror workspace:deploy prod contract exactly).
        ENVSUBST_VARS="$ENVSUBST_VARS \$POD_CIDR \$SERVICE_CIDR \$POD_VTEP_IP"
        ENVSUBST_VARS="$ENVSUBST_VARS \$ARENA_WS_URL \$ARENA_IMAGE"
        ENVSUBST_VARS="$ENVSUBST_VARS \$NTFY_BASE_URL \$AGENT_PUSH_API \$AGENT_PUSH_LINK_BASE"
        ENVSUBST_VARS="$ENVSUBST_VARS \$DEV_DOMAIN \$DEV_NODE \$DEV_WEBSITE_HOST \$DEV_BRETT_HOST"
        # Pocket ID (T001994): was missing vs workspace:deploy — a partial deploy of
        # pocket-id would have shipped literal ${POCKET_ID_*}/${OTEL_DOMAIN} tokens.
        ENVSUBST_VARS="$ENVSUBST_VARS \$POCKET_ID_FRONTEND_URL \$POCKET_ID_URL \$POCKET_ID_DOMAIN"
        export POCKET_ID_FRONTEND_URL="${POCKET_ID_FRONTEND_URL:-https://id.${PROD_DOMAIN}}"
        export POCKET_ID_URL="${POCKET_ID_URL:-http://pocket-id.${WORKSPACE_NAMESPACE:-workspace}.svc.cluster.local:1411}"
        export POCKET_ID_DOMAIN="${POCKET_ID_DOMAIN:-id.${PROD_DOMAIN}}"
        export DEV_DOMAIN="${DEV_DOMAIN:-}"
        export DEV_NODE="${DEV_NODE:-}"
        export DEV_WEBSITE_HOST="${DEV_WEBSITE_HOST:-}"
        export DEV_BRETT_HOST="${DEV_BRETT_HOST:-}"
        export SYSTEMTEST_LOOP_ENABLED="${SYSTEMTEST_LOOP_ENABLED:-false}"
        export SESSIONS_DOMAIN="${SESSIONS_DOMAIN:-sessions.localhost}"
        export LLM_HOST_IP="${LLM_HOST_IP:-}"
        export LLM_ENABLED="${LLM_ENABLED:-false}"
        export LLM_RERANK_ENABLED="${LLM_RERANK_ENABLED:-false}"
        export LLM_ROUTER_URL="${LLM_ROUTER_URL:-http://llm-gateway-lmstudio.workspace.svc.cluster.local:1234}"
        export LLM_EMBED_URL="${LLM_EMBED_URL:-http://llm-gateway-embed.workspace.svc.cluster.local:8081}"
        export LLM_RERANKER_URL="${LLM_RERANKER_URL:-http://llm-gateway-rerank.workspace.svc.cluster.local:8081}"
        export COMFY_HOST_IP="${COMFY_HOST_IP:-}"
        export COMFY_PORT="${COMFY_PORT:-}"
        export RIGGER_HOST_IP="${RIGGER_HOST_IP:-${COMFY_HOST_IP:-}}"
        export RIGGER_PORT="${RIGGER_PORT:-8190}"
        # T901777: Cluster-CIDRs (mirror workspace:deploy prod contract exactly).
        export POD_CIDR="${POD_CIDR:-10.42.0.0/16}"
        export SERVICE_CIDR="${SERVICE_CIDR:-10.43.0.0/16}"
        export POD_VTEP_IP="${POD_VTEP_IP:-${POD_CIDR%%/*}}"
        # RustDesk web-client bridge (T001381): default overlay IP (see workspace:deploy).
        export TURN_OVERLAY_IP="${TURN_OVERLAY_IP:-127.0.0.1}"
        # Terminal-sidekick (T001565): default overlay IP — see workspace:deploy.
        export TERMINAL_OVERLAY_IP="${TERMINAL_OVERLAY_IP:-127.0.0.1}"

        echo "Partial-deploy ENV={{.ENV}} ns=${_ws_ns} services=[{{.PARTIAL_SERVICES}}]"
        kustomize build "$overlay/" --load-restrictor=LoadRestrictionsNone \
          | sed -E 's/: \$\{([a-zA-Z0-9_]+)\}[[:space:]]*$/: "${\1}"/g' \
          | envsubst "$ENVSUBST_VARS" \
          | sed -E 's/\$\$([a-zA-Z0-9_({!?])/$\1/g' \
          | kubectl --context "$ENV_CONTEXT" apply --server-side --force-conflicts \
            -l "app in ({{.PARTIAL_SERVICES}})" -f -
        echo "Partial-deploy applied. Rollout status per service:"
        for svc in $(printf '%s' "{{.PARTIAL_SERVICES}}" | tr ',' ' '); do
          kubectl --context "$ENV_CONTEXT" -n "${_ws_ns}" rollout status \
            "deployment/$svc" --timeout=180s 2>/dev/null || \
            echo "  (no deployment/$svc — service may be CronJob/Job-only, skipping rollout wait)"
        done

  workspace:fix-tickets-grants:
    desc: "Idempotent: GRANT website role on bachelorprojekt+superpowers schemas (ENV=dev|mentolder|korczewski). Run once after fresh bootstrap or any time pg_dump fails with permission denied. (tickets-Schema retiriert 2026-10-14.)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        ctx_flag=""
        [ "{{.ENV}}" != "dev" ] && ctx_flag="--context $ENV_CONTEXT"
        NS="${WORKSPACE_NAMESPACE:-workspace}"

        echo "Fetching postgres superuser password from ${NS}/shared-db..."
        PG_PW=$(kubectl $ctx_flag -n "$NS" get secret workspace-secrets -o jsonpath='{.data.SHARED_DB_PASSWORD}' 2>/dev/null | base64 -d || true)
        if [ -z "$PG_PW" ]; then
          kubectl $ctx_flag -n "$NS" wait --for=condition=Ready pod -l app=shared-db --timeout=120s || true
          POD=$(kubectl $ctx_flag -n "$NS" get pod -l app=shared-db --field-selector status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null | head -n1 || true)
          if [ -n "$POD" ]; then
            PG_PW=$(kubectl $ctx_flag -n "$NS" exec "$POD" -c postgres -- printenv POSTGRES_PASSWORD | tr -d '\r\n')
          fi
        fi
        if [ -z "$PG_PW" ]; then
          echo "ERROR: could not read POSTGRES_PASSWORD from shared-db"; exit 1
        fi

        echo "Port-forwarding shared-db (5432) and applying GRANTs..."
        kubectl $ctx_flag -n "$NS" port-forward svc/shared-db 5432:5432 \
          >/tmp/fix-grants-pf.log 2>&1 &
        PF=$!
        trap 'kill $PF 2>/dev/null' EXIT
        sleep 3

        PGURL="postgres://postgres:${PG_PW}@localhost:5432/website" \
          node scripts/fix-tickets-grants.mjs --apply

  workspace:sync-db-passwords:
    desc: "Sync alle DB-Passwörter aus workspace-secrets → PostgreSQL ALTER USER (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        context_flag=""
        [ "{{.ENV}}" != "dev" ] && context_flag="--context $ENV_CONTEXT"
        NS="${WORKSPACE_NAMESPACE:-workspace}"

        echo "Waiting for shared-db to be ready before syncing DB passwords..."
        kubectl $context_flag rollout status deployment/shared-db -n "$NS" --timeout=120s

        echo "Syncing DB passwords from ${NS}/workspace-secrets → shared-db ({{.ENV}})..."

        for user in pocket_id nextcloud vaultwarden website docuseal; do
          key="${user^^}_DB_PASSWORD"
          pw=$(kubectl $context_flag get secret workspace-secrets -n "$NS" \
            -o jsonpath="{.data.${key}}" 2>/dev/null | base64 -d)
          if [ -z "$pw" ]; then
            echo "  SKIP ${user}: ${key} not found in workspace-secrets"
            continue
          fi

          kubectl $context_flag exec -n "$NS" deployment/shared-db -- \
            psql -U postgres -c "ALTER USER ${user} WITH PASSWORD '$(printf "%s" "$pw" | sed "s/'/''/g")';" 2>&1 \
            | sed "s/^/  ${user}: /"
        done
        echo "✓ DB passwords synced (ENV={{.ENV}}, ns=$NS)"

  # Keycloak tasks (keycloak:sync, keycloak:ensure-mappers, keycloak:sync-admin-password)
  # removed — Keycloak decommissioned (pocket-id-migration Welle 3, 2026-06-22).

  workspace:vaultwarden:seed:
    desc: "Seed Vaultwarden with production secret templates (ENV=dev|mentolder|korczewski). Run once after first login — see vaultwarden-seed-credentials.yaml."
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        if ! kubectl $CTX cluster-info > /dev/null 2>&1; then
          echo "No cluster reachable for ENV={{.ENV}}." >&2; exit 1
        fi
        if ! kubectl $CTX get secret vaultwarden-seed-credentials -n "$NS" > /dev/null 2>&1; then
          echo "vaultwarden-seed-credentials secret missing in $NS. Fill in and apply k3d/vaultwarden-seed-credentials.yaml first." >&2
          exit 1
        fi
        kubectl $CTX delete job vaultwarden-seed -n "$NS" --ignore-not-found
        # The manifest pins `namespace: workspace`; rewrite it for non-default envs.
        sed "s/^  namespace: workspace$/  namespace: ${NS}/" k3d/vaultwarden-seed-job.yaml \
          | kubectl $CTX apply -f -
        echo "Waiting for seed job to complete..."
        kubectl $CTX wait --for=condition=complete job/vaultwarden-seed -n "$NS" --timeout=120s
        kubectl $CTX logs -n "$NS" job/vaultwarden-seed

  workspace:vaultwarden:seed-logs:
    desc: "Show logs from the last Vaultwarden seed job run (ENV=dev|mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX="${ENV_CONTEXT:+--context $ENV_CONTEXT}"
        NS="${WORKSPACE_NAMESPACE:-workspace}"
        kubectl $CTX logs -n "$NS" job/vaultwarden-seed

  workspace:shortcuts:seed:
    desc: "Seed default admin shortcuts into website DB (usage: task workspace:shortcuts:seed ENV=mentolder|korczewski)"
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        CTX_FLAG=""
        [ "{{.ENV}}" != "dev" ] && CTX_FLAG="--context $ENV_CONTEXT"
        export WORKSPACE_NAMESPACE
        bash scripts/seed-admin-shortcuts.sh $CTX_FLAG

  # ─────────────────────────────────────────────
  # Utility Scripts
  # ─────────────────────────────────────────────
  workspace:check-connectivity:
    desc: Test HTTPS reachability of all workspace services
    ignore_error: true
    cmds:
      - bash scripts/check-connectivity.sh {{.ENV | default "dev"}}

  workspace:check-updates:
    desc: Compare running container images against registry for available updates
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - |
        source scripts/env-resolve.sh "{{.ENV}}"
        export KUBE_CONTEXT="${ENV_CONTEXT:-}"
        export WORKSPACE_NAMESPACE WEBSITE_NAMESPACE
        bash scripts/check-updates.sh

  workspace:import-users:
    desc: Import users from CSV or LDIF into Keycloak
    cmds:
      - bash scripts/import-users.sh {{.CLI_ARGS}}

  workspace:migrate:
    desc: Interactive data migration assistant (import/export)
    cmds:
      - bash scripts/migrate.sh

